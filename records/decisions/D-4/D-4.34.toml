body = '''
**memchr returns a pointer; one-vector short path; rescan-free sweeps** (STR-K3, 2026-10-09; owner RESULT CHECKS, HOT KERNELS and NULL-folding option B rulings; amends D-4.17 and D-4.26 for `memchr`). `liella_machine_memchr` returns a POINTER or NULL, so the export tail-calls it through `strz::find_n` (as `rawmemchr` through `strz::find`): Rust validates once at the entry - one test for `n == 0` and `n > isize::MAX`, one for NULL, both leaving through the cold tail call `find_n_edge` (n == 0 -> NULL without a read; NULL with n > 0 or n > isize::MAX -> abort with EFAULT, unchanged), then the `cpu::is_ready` test - and the kernel may assume `s != NULL`, `n >= 1` (its own `n == 0` test is gone). `c` goes to the kernel unconverted (it broadcasts the low byte). **Where the safety lives (RESULT CHECKS):** shipped builds return the kernel's pointer unread; the selftest build checks it (`strz::settle_find_n`: outside `[s, s + n)` aborts as a scanner fault, a byte that is not `c` is rescanned in order, D-4.21), and the sweeps in `crates/boundary/tests/machine_scanners.rs` hold first-ness: both paths, n 0..=300 and 383..640, alignment 0..63, every position, byte values 0/0x80/0xFF and all 256, page ends - and both memchr sweeps now assert `selftest::rescans()` unchanged, because the rescan otherwise heals an EARLY answer (proved: an early-by-one planted in the SSE2 head failed only at the new assertions). Kernel short path: n <= 32 (AVX2) or 16 (SSE2) with that vector inside `s`'s page (page offset <= 4064 / 4080) is one unaligned compare, `bsf`, `index < n`. Planted bugs, each red (Zen 1 ~/scratch/strk3/plant-*.log): both short-path bounds, both short-path page limits (SIGSEGV), short-path early index, AVX2 found bound, SSE2 hit bound, clamp without `+ s`. Instructions/op (Zen 1 cbench_memref, liella_instr_user, incl. ~8 of loop; an earlier Zen 1 run of the parent code (liella-historic:handoff/str-k3.md) -> after, glibc): memchr_16 69.1 -> 36.1 (28.1), memchr_64 69.1 -> 46.1 (46.1), memchr_4k 484.1 -> 461.1 (478.1), memchr_64k 6724.2 -> 6701.1 (6718.1). Left: `cpu::is_ready` (3) and the kernel's scan-level test (3) are the MEM-IFUNC lever. `memrchr` (safe Rust `bytes::rfind`) and `strchr` (`strz` + `bytes::find_z`) do not share this entry; not changed.
'''
