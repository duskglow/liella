body = '''
**A re-executed test case that reads what a handler of a process-directed signal set runs its body in a single-threaded `fork` child** (SIGNAL-TEST-THREAD-AUDIT, 2026-11-07; decided locally, tests only, no product code; extends D-X.40 to every such case). A copy re-executed by `alone`/`alone_ok` still has libtest's main thread with every signal unblocked, and the kernel may deliver a signal sent to the whole process (`kill(getpid())`, `kill(0)`, `killpg`, `sigqueue`, a child's SIGCHLD) to that thread, whose handler can still be running after the call returned: the read then depends on scheduling (D-X.40 measured 5 failures in 2000 runs under load). The body runs through `single_threaded` (`crates/core/tests/support/single_thread.rs`: the library's `fork`, parent waits, exit status = the body's result) and checks `sole_thread()` (one entry in `/proc/self/task`) at the read, or before it starts a thread of its own when it joins one (a joined thread may still be listed for a moment). With no other thread having the signal unblocked, POSIX `kill`/`sigqueue` deliver it to the caller before the call returns; a signal sent by a thread the body joins is handled by that thread or the caller before the caller's next user instruction. No sleep, poll or retry. Rejected: a bounded wait on the hit count (passes when the handler ran on the wrong thread, and is a wall-clock limit). Cases: `sym_kill`, `sym_sigqueue` (s20_signals_symbols), `s20_4_c_1`, `s20_4_c_2`, `s20_4_c_4` (s20_signals_clauses), `s18_4_g_2` (s18_processes_clauses); `system_signal_state_during_and_after` stays under D-X.40. Audit table: handoff/SIGNAL-TEST-THREAD-AUDIT.md.
'''
