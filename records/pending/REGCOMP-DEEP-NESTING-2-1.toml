body = '''
**regcomp has no nesting-depth limit; the native stack does not grow with nesting** (REGCOMP-DEEP-NESTING, coordinator ruling #5468: a limit that refuses valid input is a bug, keep the safety and widen acceptance). The parser refused 256 or more nested groups with `REG_ESPACE` (`MAX_DEPTH`); that limit is removed, and every pass that recursed on nesting depth now keeps its work on a heap stack, so depth costs memory only. The passes (`crates/core/src/pattern/regex/`): (1) the parser (`Parser::tree`: open groups on a stack of levels, branches and items of all open levels on one work stack), formerly mutual recursion through alternation, branch and group; (2) `hide_subpatterns` (pre-order walk with an explicit stack, renumbering in one forward pass); (3) the tree itself is an arena (`Parsed::nodes`, every node after its children, children as indices), so dropping it cannot recurse, and each node's `nullable` and group range are computed when it is added (formerly recursive `nullable` and `group_range` walks, also quadratic in repetition nesting); (4) the compiler is a hybrid (ruling #5529, REGCOMP-DEEP-NESTING-4): `Builder::node`/`rep_rec` recurse on the native stack as before for the first 64 nested calls (`RECURSE_DEPTH`; a level holds at most one `node` and one `rep_rec` frame, 160 + 192 bytes in the release build, so at most about 22 KiB), and the subtree at that depth goes to `Builder::compile` (an explicit frame stack and a repetition state machine), which emits the same instructions in the same order. Ordinary patterns never reach the switch and run the recursion only, which is what keeps their regcomp cost at or below the pre-story compiler's (percall, instructions per call, Zen 1 host: literal_nosub 17559 to 17475, ipv4 132910 to 131161, sed_groups 77906 to 75673, email_alt 106428 to 101981, kv_bre 74139 to 70854). Unit tests in program.rs pin the switch (63 nested groups compile without a hand-off, 64 hand off exactly once) and require the two forms to build identical programs for 22 patterns covering every construct. The matcher works on the flat program and did not recurse. `Stack<T, N>` keeps N entries inline and spills to a fallible heap vector (`REG_ESPACE` when that fails), so ordinary patterns allocate nothing extra. The size caps stay (D-14.8's 2^21 matcher states; ruling #5482): nested repetitions `((a)*)*...` grow the states with the square of the depth and are refused from depth 915. Tests: groups (ERE and BRE) and nested alternations at 255, 256, 1,000, 10,000 and 100,000 levels compile and match with the reference's offsets (subexpressions checked up to 1,000), and the 100,000-level patterns compile and match on a thread with a 64 KiB stack. The regex_oracle test copy keeps its own limit (test-only, never in the products).
'''
