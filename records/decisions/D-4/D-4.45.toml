body = '''
**Short heads before any setup for strlen, strnlen, rawmemchr, strchr, strchrnul** (SMALL-STR, 2026-10-10; owner HOT KERNELS, RESULT CHECKS, ALIGNED BLOCKS rulings). `csys/src/machine/scan.S`: a new hidden word `liella_machine_short_lim` (0 on the SSE2 level, 4033 on AVX2; set with the level by `liella_machine_set_scan_level`) makes ONE compare `page offset < lim` both the page test and the level test. When it holds, the kernel first checks [s, s + 32) and [s + 32, s + 64) as two unaligned AVX2 blocks, one branch each, with nothing else before them (no SSE2 prologue, no level load, no aligned-group setup); a miss in both continues in the existing aligned AVX2 body with rax = s & -64 (strlen, strnlen with r11 = s + max saturated, rawmemchr) or in the SSE2 scan from s + 64 (strchr/strchrnul). strnlen clamps with cmova; strchr loads each block once and compares that register with c and zero, keeping c only up to the first NUL ((nul - 1) ^ nul), so the answer comes from bytes the call read (D-4.21) without re-reading the byte. Otherwise (SSE2 level, or offset > 4032) the previous code runs unchanged. `strz::{len, len_n, find, find_n}` no longer test `cpu::is_ready()` (STR-K2 trampolines removed): the kernels start at the SSE2 baseline and startup decides the level once (as strchr already did). Local decisions: lim word instead of a level branch (saves two instructions per call); 64-byte head (two blocks) so 32-63 byte strings stay in the head. Evidence: SMALL-STR handoff (Zen 1 counters before/after, machine_scanners sweeps on both levels). SMALL-STR-2 (same row): strncmp, memrchr and memchr take the same word. strncmp: one test of (a \| b) & 4095 < lim (the OR is at least either offset; a rejected pair is re-tested exactly off the hot path), two unaligned 32-byte blocks of both strings (min(x, x == y) == 0 marks the first difference or NUL), a hit below n decides at the byte step that re-reads both bytes (D-4.21 kept), n > 64 resumes the SSE2 steps at 64. memrchr: (-(s + n)) & 4095 < lim exactly when [s + n - 64, s + n) lies in the page of s + n - 1; two unaligned blocks from the end, the highest match below s gives NULL. memchr: the word replaces the level load and the 4064 test before the one-vector n <= 32 path. Local decisions: OR page test for two pointers; bzhi for memchr's bound not taken (BMI2 is not part of the level decision). Tests: the strncmp sweeps now run on both levels; planted-bug run in the SMALL-STR-2 handoff. Amended (REGEX-WL, 2026-10-11): memrchr's head tests the end-page mask word `liella_machine_rshort_mask` (0xfc0 on the AVX2 level, 0 on SSE2, set with the level) against s + n - 1 in one `test` instead of negating s + n and comparing with the short limit: the head runs when (s + n - 1) & 4095 >= 64, so [s + n - 64, s + n) lies in that byte's page (ends at offsets 1..64 of a page take the entry path; page-aligned ends keep the head). 17 -> 14 kernel instructions on a head hit; memrchr_line per call 34.4 -> see the REGEX-WL report. Plant: mask 0xf81 makes memrchr_kernel_never_reads_outside_the_region fault (red).
'''
