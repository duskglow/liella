tests = ["crates/boundary/tests/s01_startup_symbols.rs::s1_2_c_5_nonshared_archive_two_way", "crates/boundary/tests/s01_startup_symbols.rs::s1_1_c_0_dynamic_start_conformance"]
body = '''
**Liella ships its own link-time archive `libc_nonshared.a` and an installed `libc.so` linker script (owner ruling #4807).** A program or shared object links against an installed Liella with no host C library file. `cargo xtask so` builds both into the product directory. The script is `GROUP ( libc.so.6 libc_nonshared.a AS_NEEDED ( ld-linux-x86-64.so.2 ) )`, with bare names found on the library search path where the products are installed, never an absolute host path. The members are `atexit`, `at_quick_exit`, `__pthread_atfork` with `pthread_atfork` as a weak alias, and `__stack_chk_fail_local`. They come from `csys/nonshared/` and the list is settled by black-box probes in spec/behaviour/dynlink.md ("The link-time archive"). Each member is a one-statement function linked into the CALLER's module, hidden, with no state of its own. It passes the value of that module's `__dso_handle` to the libc.so.6 function that owns the list: `__cxa_atexit@GLIBC_2.2.5`, `__cxa_at_quick_exit@GLIBC_2.10` or `__register_atfork@GLIBC_2.3.2`. `__stack_chk_fail_local` calls `__stack_chk_fail@GLIBC_2.4`. Because of that tag, `__cxa_finalize` at unload runs or drops the module's registrations. The build checks that each member defines exactly its names and that all of them are hidden.

**Two-way compatibility (the reason for the archive form).** Code built against Liella needs only `GLIBC_*` versions, so it also runs on the reference. The test links with `-L <products> -lc`, reads the link maps (Liella's archive is loaded; no host `libc.so.6`, `libc.so`, `libc_nonshared.a` or `libc.a`) and checks `readelf -V`. It then runs the program and a `dlopen`ed shared object on the reference. The dynamic conformance subset links with Liella's archive in place of the host's.

**Shipped and supported now; deprecation intended later (owner intent, 2026-11-11).** The archive is supported today as the way unversioned `atexit`, `at_quick_exit` and `pthread_atfork` references bind. The owner intends to deprecate it eventually, so that distributions adopting Liella can migrate away from it over time. No deprecation action (no warning, no notice, no behaviour change) is taken until a viable replacement exists. DL-NONSHARED-OPTOUT explores one: a version-node opt-in with loader-side module attribution (handoff/DL-NONSHARED-OPTOUT.md).

**Open (not this record):** Liella's `__cxa_finalize(dso)` runs the module's exit handlers and forgets its quick-exit handlers, but it does not yet drop the module's atfork handlers, which the reference's does (probe in spec/behaviour/dynlink.md). Liella's loader has no `dlclose` yet (phase 14), so this is not reachable today. The atfork list needs a module slot first.
'''
