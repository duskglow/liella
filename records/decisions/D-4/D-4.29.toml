body = '''
**strcmp kernel returns the order** (STRCOLL-1, builds on D-4.20(a), D-4.21, owner rulings 2026-10-08 RESULT CHECKS and HOT KERNELS). `liella_machine_strcmp(a, b)` now returns -1/0/1 instead of an index: it re-reads the two bytes at the first index where the strings differ or `a` ends and orders them; if a writer made them equal and not NUL since the vector read, it scans on after them (D-4.21's rescan, in the kernel, counted in the hidden `liella_machine_strcmp_rescans` that `selftest::rescans()` adds), so every answer comes from bytes the call read. `strcmp` and the code-point-order `strcoll`/`strcoll_l`/`__strcoll_l` call it through `strz::order` (NULL aborts, S6; no `cpu::ready()`: the runtime sets the scan level at startup and the SSE2 steps are correct before it), a tail call with no Rust check: the safety lives in the kernel's own re-read plus the sweeps and planted-bug tests (RESULT CHECKS). Loop (SSE2 at scan level 0; AVX2 at level 1, 32-byte VEX blocks, vzeroupper before returning): at max page offset <= 4032 four 16-byte blocks (AVX2: two 32-byte), each tested, then (4032 - offset) / 64 groups of 64 bytes run without re-taking the offsets, one test per group (four blocks' min-masks folded by pminub); a hit re-tests the group's blocks. Page rule unchanged. Local decisions: result -1/0/1 kept (not the byte difference: no observable change); the old index-checking Rust helpers stay for the selftest only. Tests: `machine_scanners.rs` strcmp sweeps on both scan levels (new: 9x9 alignments x lengths 0..299 x every difference position), page-end and page-crossing on both levels, race tests unchanged.
'''
