body = '''
**Dense segment metadata** (HEAP-META-DENSE, 2026-10-10). A segment's metadata is laid out as line 0 (home shard word), one 64-byte head line per slab (owner, use count, remote counter, links, descriptor; 63 lines, one page), then the 63 local bitmaps (2 KiB each, contiguous), then the 63 remote bitmaps at a constant offset from the local one; slab data from 256 KiB as before. Was: one 4144-byte record per slab, so each new size class touched a record page of its own (printf: ~17 faults in `refill`). `adopt` writes only the word holding the class's last block (tail bits set); an unowned slab's local bitmap is all zero, kept by `release_slab` clearing that word (no live block and nothing pending then, so no other bit is set); words past a class's last block are never read (`collect` scans only the class's words). Fast paths unchanged in shape: the cache's record address is the local bitmap's, the remote word is at a constant offset. Each head owns its cache line (no false sharing between slabs' heads; the descriptor that `free` reads shares the line with the owner word). Remote bitmaps read only after a remote free (HEAP-META-2): line 0 word 1 of a segment (SEG_REMOTE) is set by the first remote free into the segment, before its remote bit; while it reads zero the double-free/liveness checks (free fast and slow paths, resize, is_live, statistics) skip the remote word. Without it every same-thread free read a remote bitmap page for the first time (tar -c: +5 faults vs the old records, now -; the remote pages were the cause). The flag is never cleared (conservative: once set the checks are as before). Fast path: one flag load replaces the remote load while it is zero. Test: crates/core/tests/heap_meta_products.rs (14 new classes, malloc + free: metadata faults <= 9). **Amendment (HEAP-REMOTE-LOST, 2026-10-11): a late remote free is never lost.** The slab head's remote word holds the remote frees in flight (bits 0..63, a pin: non-zero, the owner cannot release the slab) and QUEUED (bit 63). A remote free pins, sets its remote bit, then unpins and sets QUEUED in one compare-exchange, and pushes the slab only if QUEUED was clear; `collect` reads the slab's link, clears QUEUED, then scans. Invariant: every remote bit is either seen by the scan that follows the QUEUED clear (its free set QUEUED before that clear, so the bit was set before it too: release/acquire on the remote word) or its free finds QUEUED clear and queues the slab again, so the next collection sees it. Was: a counter reset to 0 by `collect` before its scan; a free that had raised it before the reset (no push) and set its bit after the scan passed its word was never collected (leak; RED test). The slab stays pinned while queued, as before. Same-thread paths unchanged; a remote free costs one compare-exchange more. Test: crates/rt/tests/heap_and_sync.rs `a_remote_free_landing_after_the_owners_scan_is_collected_later` (interleaving forced through `Pages::race_point`, a no-op in the boundary).
'''
