body = '''
**REJECTED (measured slower, reverted in COLDSTART-STRCOLL-FIRST-2, 2026-11-06): D-4.30/D-4.37 stay in force (the first general-path compare fills all entries).** Outcome: on the N100 (Alder Lake-N), 11 interleaved rounds, the branch against its base: `first_strcoll` 13,190 ns against 11,571 (1.13x, every round slower, 1.097-1.186), `second_strcoll` 297 against 268 (1.10x), `strcoll_en_us_*` 1.00x; static probe on a Zen 1 host (setlocale en_US.UTF-8, then strcoll "zeta.h"/"alpha.h", perf stat -r 200): first call 11,749 to 1,601 user instructions but 3 to 4 page faults and about +13k kernel instructions; second call 86 to 194 user instructions (compare_stream instead of the rank path). The first call's time is not in the fill (cause of the extra fault not profiled). Rejected design, for the record: **strcoll: the first general-path compare fills only its own bytes** (COLDSTART-STRCOLL-FIRST, 2026-11-06; would have amended D-4.30/D-4.37 STRCOLL-START). The first `first_level` call of a catalog writes the `lane`/`unit` entries of the ASCII bytes of its two byte texts plus the terminator (a `known` bitmask of 128 bits in the `AsciiSlot`, set with Release after the entries), so its cost follows its input; wide texts read no entry and fill nothing. A later general-path call that still finds the slot not `ready` fills every entry as before; `ascii_fast`, the ranks and `ready` are set once all 128 bytes are known. Until then `decide_first` decides nothing (rank 0) and `compare_stream` answers from the known bytes (unknown ones read SLOW: the general path), so every reader still sees, per byte, the final value or the general path. Measured gain: probe counts and N100 timing NOT VERIFIED at the time of writing (see handoff/COLDSTART-STRCOLL-FIRST.md). Tests: collate_lazy (first_comparison_fills_only_its_bytes_and_orders_as_a_full_fill).
'''
