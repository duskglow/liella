id = "D-14.7"
section = "s14"
spec = "§14.7, §14.8, §14.10"
ann = "HIST, ARB"
status = "active"
body = '''
**fnmatch, glob, wordexp (phase 12); decisions.** *fnmatch:* a polynomial matcher over sets of reachable positions (no backtracking); a `[` that does not begin a valid bracket expression matches itself (XCU 2.13.1); a reversed range, or one whose end is a class or an equivalence class, matches nothing; `FNM_CASEFOLD` folds literals and range ends, not classes; `*` never matches a leading period, not even as the empty string; `!(…)` may match `/` and leading periods; extended groups nested deeper than 64, or a NULL argument, give -1; `?` matches one character, never a byte of one (glibc retries byte by byte, so `??` matches é: a recorded difference). *glob:* unknown flag bits -1 `EINVAL`, NULL `EFAULT`; a literal name exists if `lstat` finds it (the current contract), a trailing `/` means directories only; `GLOB_PERIOD` applies to the last component; every opendir/readdir error except `ENOTDIR` goes to `errfunc`; `gl_flags` is written only on success and `GLOB_MAGCHAR`/`GLOB_NOMAGIC` use `glob_pattern_p`'s test on the whole pattern (glob(3)); sorted by `strcoll`, bytes breaking ties; braces expanded first (`{}` one empty alternative, unbalanced braces no match); tilde: non-empty `$HOME`, else the real UID's passwd entry, an unknown user is matched as written; a failed call without `GLOB_APPEND` leaves `gl_pathc` 0 and `gl_pathv` NULL (or only the null slots with `DOOFFS`), a failed `APPEND` keeps the earlier results; exported at GLIBC_2.27, `glob@GLIBC_2.2.5` waits for phase 15. *wordexp:* the whole text is parsed before anything is expanded (a syntax error comes before an expansion error, and `WRDE_NOCMD` refuses before expanding); results of expansions are field-split and pathname-expanded as §14.10 and POSIX say (glibc does not glob them: a recorded difference); `$?`, `$-`, `$!` stay literal, positional parameters are the program's argv, `$$` the PID (as glibc; POSIX leaves them unspecified); `${X:?w}` writes its message and fails with `WRDE_BADVAL` (glibc returns 0 with no words); `${#}`, `${#X:-}` and bash forms are `WRDE_SYNTAX`; `WRDE_UNDEF` applies to every form; arithmetic beyond the rulings: a left shift that loses bits is `WRDE_SYNTAX`, an empty-valued variable `WRDE_SYNTAX`, a signed value allowed, `$[…]` accepted; tilde after the first `=` of an assignment-like word, `:` ending the prefix, an empty `HOME` giving "" (XCU 2.6.1); IFS white space dropped at both ends of each expansion; command substitution runs `/bin/sh -c` (stderr to `/dev/null` unless `WRDE_SHOWERR`, the exit status ignored, a spawn failure `WRDE_NOSPACE`); NULL arguments `WRDE_SYNTAX` with `EFAULT`; unknown flag bits ignored. **Owner rulings (2026-10-03):** `${X:=w}` assigns in an overlay local to the one call (later references in the call see it; `environ` is never written); invalid multibyte text in fnmatch is matched byte by byte, and §14.7 was reworded to say so. **Interim test convention:** the glob section's directory-order (`GLOB_NOSORT`) lines of the reference's live run are compared with the record as sets, because the order of a fresh ext4 scratch directory differs between runs; the set-comparison convention as such is the owner's, deferred to the phase-13 pause. **Fixed in the phase-12 review:** `wordexp` without `WRDE_DOOFFS` now sets `we_offs` to 0 on success (as the reference, probed); leaving the caller's value made `wordfree` free the wrong slots.
'''
