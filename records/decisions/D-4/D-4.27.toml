body = '''
**AVX2 `casecmp` kernel for `strcasecmp`/`strncasecmp` and the `_l` forms** (CASECMP-K1, 2026-10-08; owner ruling: the PJ-23 `casecmp_ascii` routine, flag-gated; CPU-VARIANT KERNELS, HOT KERNELS). `liella_machine_casecmp_avx2(a, b, n)` (scan.S, AVX2 only, no SSE2 variant: the scalar variant is the SWAR/measured path of before) returns the first index below `n` where the strings differ after folding `A`-`Z` (t = x + 0x3f is below -102 signed exactly for 0x41..0x5a; 0x20 is or-ed in) or where `a` ends; `n` if none (strcasecmp passes `usize::MAX`). One pass, no measuring: the first step takes 32 bytes of each string (short strings), then 64 per step; loads unaligned, taken only inside the page of an unended byte below `n` (offset <= 4032 reads 64, <= 4064 reads 32, else one byte, as `strcmp`'s page rule). `strz::casecmp` (Rust) owns policy: n == 0, a NULL, no AVX2 (`cpu::casecmp_avx2`, the scan-level decision) or a locale whose 0..127 case maps are not ASCII's (`ctype::ascii_case`, D-5.6) go to the measured path (`casecmp_measured`: `strz_n` twice + `ctype::compare_folded`, byte for byte the code of before). After the kernel Rust reads `a[i]`, `b[i]` (D-4.21 style): `i == n` equal; both below 0x80 and different after the fold: order them; both NUL: equal; anything else (a byte of 128 or more, whose fold the locale decides; text a writer changed during the call) takes the measured path. A kernel answer too SMALL therefore cannot give a wrong result (planted: still right, the path counter catches it); one too LARGE or a wrong fold is caught by the differential tests (planted fold range: 2 suites red). Local decisions: bytes of 128+ are never folded in the kernel (pass only when equal); `selftest::set_scan_avx2(false)` also forces the scalar path (`cpu::force_casecmp_scalar`); selftest path counters `selftest::casecmp_paths()`. Evidence: `tests/casecmp_avx2.rs` (6 tests, both paths, vs the old path and an independent loop: 32x8 alignment pairs x 80 lengths x 16 byte pairs x bounds; 20k seeded random mixed texts; page-end sweeps with an unmapped next page; 300-byte strings across a page boundary), instruction counts and timings in liella-historic:handoff/casecmp-k1.md. AMENDED (CASECMP, 2026-10-10): `liella_machine_casecmp_sse2` (scan.S) gives the same result and page rule with 16-byte blocks (16 B first step, then 64 B steps; <= 4032 reads 64, <= 4080 reads 16, else one byte); `cpu::casecmp_kernel()` picks AVX2 else SSE2 from the startup flags, so the measured path now runs only for n == 0, NULL, `!ascii_case(loc)`, bytes >= 0x80 at the index or a contradicted answer. Local decisions: no separate short-string head (the 16 B first step is the head); the fold is t = x + 0x25 > 0x65 (signed), one constant fewer than the AVX2 form; tests force each kernel through `selftest::set_casecmp_kernel` (0 measured, 1 SSE2, 2 AVX2). Safety chain: the Rust re-read and the i > n fault check stay; planted bugs (page threshold, missing bound cut, fold range) turn tests/casecmp_avx2.rs red.
'''
