body = '''
**`realloc` resizes with one lookup** (REALLOC-ONE-LOOKUP, TIMING-COV-REALLOC-GROW-NONAVX2, ruling #3389). `Heap::fit(pages, addr, size)` finds the block once, through the slab hint, and returns `Same(usable)` (the block already serves the request), `Held(Held{class, index})` (it must move; the block is already located) or `Other` (not a small block). It replaces `fits_in_place` and covers `0 < size <= MAX_SMALL` (was `<= 1 KiB`). `Heap::resize_held` moves a `Held` block without a second lookup: it takes a block from the target class with `alloc_hint`, copies, clears the old bit and calls `freed_into`; any miss falls back to `resize_slow`. `Heap::resize` is `fit`, then `resize_held` or `resize_slow`. The target size comes from `move_target`, the general path's forecast rule, which `resize_slow` now uses too, so a move copies once. Size 0 inside `resize` (reachable only through `malloc_debug`) takes `resize_slow`; the result is unchanged (class 0 stays in place, any other class gets a class 0 block). Exports: `realloc` and `__libc_realloc` return `p` with no stack frame on `Same`; `Held` goes to `realloc_held` (`#[inline(never)]`); `Other` goes to `realloc_general`. **Rules kept unchanged:** up to 1 KiB the stay-in-place rule is `HALF_BELOW` (PERF-REALLOC-USABLE-3); above 1 KiB `keeps_in_place` applies, the general path's own rule, so requests above `FORECAST_CAP` no longer take the locate, general alloc, general free route. Observable results (returned pointer, contents, `errno`) are unchanged. Was: the entry's in-place test found the block and failed, then `realloc_general` found it again in `Heap::resize` (32 B grow: 201 instructions, 59 + 130 + 12 copy; 2048 B: 467, of which 265 in `resize_slow`). Measured (`wl_percall` `realloc_grow_x2`, Broadwell-EP host, instructions per call): AVX2 dispatch glibc 199.5, before 252.9, after 209.8 (1.05 of glibc); non-AVX2 (`hwcaps=-AVX2`) before 288.8, after 245.7 (1.23); the gap left is the non-AVX2 copy of 1 to 2 KiB blocks, not changed here. Gate on 96b75b97: 8810 passed, 0 failed, conformance 11/11; four plants caught (copy one short, grow past usable, keep-big always true, alloc into the old class), free-before-copy equivalent. Not measured: wall time (timing-host jobs not run). Report: `handoff/TIMING-COV-REALLOC-GROW-NONAVX2-report.md`.
'''
