body = '''
**Small copies and fills in a register kernel at the entry** (MEM-K1, owner hot-kernel ruling 2026-10-08, plan S2 *hot-kernel*). `memcpy`, `memmove`, `__memcpy_chk`, `__memmove_chk`, `memset`, `__memset_chk` and the internal copy and fill entries (D-X.15) go through `crates/boundary/src/hot.rs`. Order at the entry: (1) the size test first, `n - 1 < 128` (one compare: `n == 0` wraps and takes the checked path, which returns at once); (2) for those sizes the NULL tests, two fused test-and-branch uops, never taken in a correct program (S6 outcome unchanged: the `EFAULT` abort, out of line); (3) the kernel: 16-byte blocks from both ends (1, 2 or 4 per end for 16–32, 33–64, 65–128 bytes) or two 8/4/2-byte words or one byte, every source byte loaded into registers before the first store, so overlap is moved correctly with no overlap test (D-4.2 holds) and no call. Larger sizes tail-call the unchanged checked path (`move_units`, `fill`, D-4.14). SSE2 only (the x86-64 baseline): one kernel for every CPU, no feature test. Blocks are separate locals, never an array: an unoptimised build moves a 64-byte array with a call to `memcpy`, which is the kernel itself under the interposed exports (SIGSEGV seen in `aio_engine`, D-4.13). `move_large` returns `black_box(d)`: with the result visibly `d` the entry kept `d` in a saved register on every path (push/mov/pop on small copies) instead of tail-calling. Evidence: tests/small_copy.rs (sizes 0–256 x 32x32 alignments, overlap shifts, fills, guard pages; three planted bugs each fail it); Haswell-EP bench_mem memcpy_64 2.46 ns (ref 2.74; before 4.6–5.9), memset_64 1.61; Ivy Bridge (no AVX2) cbench_memref memcpy_64 0.86x glibc, memset_64 0.74x. Open: on AVX2 hosts glibc stores 32 bytes at a time (cbench_memref memcpy_64 1.38x on Haswell-EP): see the MEM-K1 report for the IFUNC proposal (RULING NEEDED). **Amendment MEM-K4 (owner NULL-folding ruling 2026-10-08; scope narrowed by MEM-K4c, below): NULL folding.** WHAT IS FOLDED: `memcpy`/`memmove`/`mempcpy`/`memset` and their `_chk` forms take n = 1..=64 to assembly classes with NO NULL test, so a NULL faults on page zero (SIGSEGV). That is glibc's observable outcome: glibc has no NULL check of its own and, with page zero mapped, reads or writes it silently (owner-run black-box probe, 2026-10-08). WHAT IS CHECKED: n = 0 takes the folded entry's zero-length return (touches nothing, NULL legal); n = 65..=128 runs the Rust kernel classes after the two explicit NULL tests (S6 `EFAULT` abort), folding on or off; n > 128 the checked path (NULL the S6 abort); with folding off every n >= 1 has the explicit tests. Entry: one compare `n <= FOLD` against a word in `crates/boundary/src/dispatch.rs` (64 folded, 0 not), then 33-64 tested first (a 64-byte copy is the size test, one class test, a tail jump, 8 moves); the rest tail-calls the out-of-line `move_rest`/`fill_rest`. THE STARTUP GUARD (where the safety lives): `FOLD` starts 0, so the static startup before self-relocation and any program that never runs startup are checked; startup step 4 (`runtime`, after `cpu::init_with`) sets it to 64 only when `/proc/sys/vm/mmap_min_addr` reads as >= 65536 (`dispatch::page_zero_unmappable`: open/read/close, 3 system calls once per process; unreadable, malformed or below 64 KiB = no folding). A folded class touches at most `[p, p + 64)`, inside the unmappable first 64 KiB for p = NULL. CAP_SYS_RAWIO: the kernel lets such a process map page zero even above that setting; the ruling keys the guard on the sysctl, so a process that does so gets glibc's behaviour (silent page-zero access), never worse. Debug builds: the Rust kernel loads use `read_unaligned`, not `_mm_loadu_*`. Fill broadcast: one multiply + `movd` + `pshufd`. Amendment MEM-K4b (owner ruling 2026-10-08, "assembly where Rust cannot express it"): the folded classes run in `csys/src/machine/fold.S` (`liella_machine_{move,fill}_fold33` for 33-64 and `_fold1` for 0-32, SSE2, loads before stores, hidden symbols), because a NULL access in Rust is UB (fat LTO could delete it or a NULL check derived from it); Rust keeps the size test, the split at 32 (each half a tail jump), the guard, the 65-128 classes, the checked path and the internal entries (D-X.15; their Rust 1-64 classes stay: never NULL there). Amendment MEM-K4c (owner ruling 2026-10-08, option B): NULL folding covers ONLY the 1-64 classes in assembly; the 65-128 classes (Rust, the AVX2 copy class there otherwise unchanged, D-4.25) always run the explicit NULL tests and the S6 abort. Reason: no Rust code may perform a deliberate NULL access (UB), and the assembly stays minimal (no 65-128 assembly classes). Proof: `crates/boundary/tests/small_copy.rs` runs every sweep checked (SSE2) and folded (SSE2, AVX2); `null_faults_in_the_folded_sizes_and_aborts_in_every_other` (forked children, folding on and off, SSE2 and AVX2: SIGSEGV for NULL with n 1-64 folded, SIGABRT for 65-128 and above folded and for every n checked; memcpy both arguments, memmove both, memset, `__memcpy_chk`, `__memset_chk`; planted bug: the 65-128 NULL test made conditional on folding -> red); `the_startup_guard_folds_only_from_64_kib` (the sysctl parser). Instruction counts (Zen 1, cbench_memref --counters): liella-historic:handoff/mem-k4.md. **Amendment COPY-FILL (2026-10-10): direct entries, no Rust hop.** The exported `memcpy`, `memmove` and `memset` ARE the assembly in `csys/src/machine/fold.S` (second labels on `liella_machine_memmove`/`_memset` under `LIELLA_EXPORT`; versions memcpy@@GLIBC_2.14, memmove/memset@@GLIBC_2.2.5 unchanged, checked with nm): the Rust trampoline (7 instructions before the kernel) is gone. Entry: `cmp n, liella_machine_fold_limit` (64 folded, 0 not; the word now lives in fold.S .bss, alone in a 64-byte line, and Rust reads and writes it as `ffi` `safe static AtomicUsize` with Relaxed loads/stores: either value is correct on its own, 0 = the explicit checks, so no ordering with other data is needed; the asm reads it with one aligned 8-byte load, atomic on x86-64); 1..=64 folded classes as before; above the word: memset 65-128 in assembly AFTER an explicit NULL test (`testq %rdi` -> the Rust rest path, whose S6 abort is unchanged: option B, MEM-K4c, holds - no 65-128 class folds); everything else tail-jumps to `liella_hot_move_rest`/`liella_hot_fill_rest` (export! `local` arm, posix/s04_strings.rs: hidden, never in the dynamic table), which keep the NULL checks, the lazy fold decision and the 65-128 copy class (still Rust, D-4.25; follow-up: the 65-128 copy class in assembly). The Rust `memcpy`/`memmove`/`memset` are export! `asm` test twins (never exported) so tests/small_copy.rs sweeps the assembly. xtask copies.rs skips a member that defines a replaced name without using it (the fold.S object); test `only_a_definer_that_never_uses_the_name_is_skipped` shows every member rejected or redirected before still is. Instructions (memset(16) 17 -> 14, memset(64) 14, memcpy(16) 12, memcpy(64) 14, memset 65-128 21). Haswell-EP cbench_memref (tree 5413d4c): memset_16 0.631, memcpy_16 0.690, memset_64 0.859, memcpy_64 0.906, memset_128 1.004, memcpy_128 1.272 (Rust class, open), _mix rows 0.947/0.970. Planted bugs, each red (small_copy): a wrong block in the 65-128 fill, a wrong tail offset in the 33-64 copy, the 16/33 boundary moved, the 65-128 upper bound 129. Handoff: liella-historic:handoff/copy-fill.md. WL-HOT-SEQ2: `mempcpy` and `__mempcpy` are direct assembly entries too (`liella_machine_mempcpy`: d + n in %rax, then memcpy's folded classes; larger sizes call the copy entry and add n), NULL behaviour as memcpy; `__mempcpy_chk` reaches it through `hot::move_bytes_past`. **Amendment PORTABLE-SCAN (A-8, coordinator rulings 2026-11-04):** on targets without the scan.S kernels (every target but x86_64; on x86_64 only under the test-only feature `portable-scan`), the cfg `liella_portable_scan` puts the word-at-a-time Rust scanners of `crates/boundary/src/strz.rs` module `portable` in their place (`strlen`, `strnlen`, `rawmemchr`, `memchr`, `memrchr`, `strchr`, `strchrnul`, `strcmp`, `strncmp` and their entries; results equal the tuned kernels'). NULL FOLDING IS OFF THERE: a NULL read is undefined behaviour in Rust, so the portable `memchr` entry takes the S6 abort (SIGABRT) for NULL with n > 0 whatever the folding decision, the memchr gate (`liella_machine_chr_limit`) stays 0 under that cfg, and the portable memchr does not take the folding decision (it has none). Tests: `null_faults_in_the_folded_memchr_sizes_and_aborts_in_every_other` and `memchr_answers_alike_with_null_folding_on_and_off_and_takes_the_folding_decision` (machine_scanners) expect exactly that under the cfg (`selftest::portable_scan`). The portable reads are aligned words that may hold bytes outside the object but never leave the page of an object byte; that read stays `UNSAFE(slice)` (as the gettext word read), proven by `every_scanner_reads_only_the_pages_of_an_object_at_either_page_edge` (every replaced scanner at both page edges, every word offset). x86_64 builds are unchanged.
'''
