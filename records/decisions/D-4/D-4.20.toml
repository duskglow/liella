body = '''
**Fused and short-string scanners** (PJ-8, owner approvals 2026-10-06/07, OPT-FOLLOW 4, opt-revisit P1). (a) `liella_machine_strcmp(a, b)` returns the first index where the strings differ or `a` ends, in one pass (no strlen of either); `strz::compare` checks in constant time that the bytes there differ or are both NUL, and orders them as unsigned. `strcmp`, and `strcoll`/`strcoll_l`/`__strcoll_l` in a code-point-order locale (C, POSIX, C.UTF-8) use it. SSE2 on both scan levels (no AVX state). Page rule: unaligned loads, each taken only when it stays inside the page holding its first byte (a byte of a string not yet ended): page offset <= 4032 reads 64 bytes, <= 4080 reads 16, otherwise one byte. `strcasecmp` is left on its path: a case-only difference would need a restart or a fallback per difference (not a clean fit; no bench row). (b) `liella_machine_env_find(env, name, len)`: one call scans the `environ` array (first-byte compare, then a byte loop over name + `=`, never past an entry's NUL; a NULL array, entries without `=`, an empty name and names holding `=` keep the semantics of `environ::getenv_bounded`); `process::getenv` re-reads the reported entry as far as name + `=` and checks it. (c) strlen/strnlen start with one unaligned SSE2 load of the first 16 bytes when [s, s + 16) lies inside s's page (offset <= 4080; strnlen: max >= 1 makes that page mapped): a NUL there returns without AVX state or vzeroupper. Local decision: an SSE2 load rather than a byte loop (16 bytes per instruction, same page-safety argument). Tests: `machine_scanners.rs` (every alignment pair to length 80, page ends, page crossings), `getenv_reads_whatever_array_the_program_installed`; fuzz target `scanners`.
'''
