body = '''
**What the DL-16P probes settle for DL-16 (`dlopen`/`dlsym`, plan/ph14/dl-16-dlopen.md §1-4).** Each item follows the reference as probed (`spec/behaviour/dynlink.md`, section "dlopen and dlsym probes P-1..P-13"; probes `tools/probe/dl/dlopen/`). (1) **Mode bits (P-1):** a mode with any bit outside `RTLD_LAZY\|RTLD_NOW\|RTLD_NOLOAD\|RTLD_DEEPBIND\|RTLD_GLOBAL\|RTLD_NODELETE` fails before the search with the dlerror text `invalid mode parameter` (also without a binding mode); `RTLD_NOW\|RTLD_LAZY` binds lazily (eagerly until DL-20, the phase's interim gap). (2) **Identity (P-2):** a bare name (no `/`) is first compared with the `DT_SONAME` of every loaded object (for `dlopen` and `DT_NEEDED` alike), never with file names; a found file is then compared by `(st_dev, st_ino)`; `l_name` keeps the name of the first open. (3) **`RTLD_GLOBAL` (P-3):** a first open or a promotion (`NOLOAD\|GLOBAL`, or a plain re-open with `GLOBAL`) appends the opened object's whole local scope (itself, then its dependencies breadth-first, those not yet global) to the global scope. (4) **Lookup scopes (P-5):** `RTLD_NEXT` searches the objects after the caller in the scope the caller was loaded with (the global scope for start-time objects, the root's local scope for a `dlopen`'d object); `RTLD_DEFAULT` from a `dlopen`'d object searches the global scope, then the caller's local scope; failure texts name the calling object. (5) **dlerror (P-6):** every `dl*` entry point that succeeds clears the calling thread's pending text, so `dlerror()` describes the thread's most recent `dl*` call. (6) **Recursive `dlopen` (P-7):** an inner `dlopen` reaching an `Initialising` object returns its handle without running its constructors again. (7) **Handles (P-12):** a handle is the object's link map; `l_name` is the name as opened, `""` for the program. (8) **The program and system objects (P-13):** `dlopen` of the program by path is refused with the executable texts (`NOLOAD`: NULL without a text); `libc.so.6` by any name or path, and `ld.so` by its name or its `PT_INTERP` path, return the start-time object. Items (4) and (5) widen the plan text (ruling #5127, coordinator 2026-11-12: follow the reference). Not decided here (open maintainer rulings #5125 and #5126): whether P-10 (Liella runs no IFUNC resolver in a failing `dlopen`) and P-13 (`ld.so` by its real path returns the start-time object in Liella) become differences rows.
'''
