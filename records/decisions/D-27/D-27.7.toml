id = "D-27.7"
section = "s26-29"
spec = "§27"
ann = "SEC"
status = "active"
body = '''
**The loader's ELF reader (`liella_ld::elf`, IP-24 part 1, DL-ELF-READ-1): error rules.** Input is a byte slice; no I/O, no allocation, no panic, no read outside the slice; every offset, count and size is checked with checked arithmetic (threat-model rule 4). `Elf::parse::<A: Arch>` checks, in this order, and returns the first failure as a typed `ElfError`: length >= 64 (`TooShort`); magic; `EI_CLASS` = `A::EI_CLASS` = ELFCLASS64 (`WrongClass`, s27_1_f_0); `EI_DATA` = `A::EI_DATA` (`WrongData`; fields are decoded in that byte order); `EI_VERSION` = 1; `EI_OSABI` System V or GNU; `e_type` `ET_EXEC` or `ET_DYN`; `e_machine` = `A::E_MACHINE` (identity only through `liella_ld::arch`, design §0a); `e_version` = 1; `e_ehsize` = 64; `e_phnum` != `PN_XNUM` (section headers are never read); `e_phentsize` = 56 unless `e_phnum` = 0; the program header table inside the slice and not overlapping the ELF header; then per program header in index order: `p_offset + p_filesz` and `p_vaddr + p_memsz` do not overflow, `p_align` 0 or a power of two, `PT_LOAD` `p_filesz <= p_memsz`, the file ranges of `PT_DYNAMIC`/`PT_INTERP`/`PT_NOTE` overlap neither the ELF header nor the table, at most one `PT_DYNAMIC` and one `PT_INTERP`. Segment contents are checked when read (the slice may be a file prefix): a range outside the slice is `OutOfRange`; `PT_INTERP` is a non-empty path with exactly one NUL, at the end; `PT_DYNAMIC` is a multiple of 16 bytes and holds a `DT_NULL` (entries after the first `DT_NULL` are never read); `DT_STRTAB` and `DT_STRSZ` at most once each, both or neither, and both when a string-valued tag (`DT_NEEDED`, `DT_SONAME`, `DT_RPATH`, `DT_RUNPATH`) is present; the string table lies wholly in the file-backed part of one `PT_LOAD` (`AddressNotMapped`); a string offset is below `DT_STRSZ` and its NUL inside the table. Notes are padded to 8 when `p_align` is 8 and to 4 when it is 0-4 (any other value is `BadNoteAlign`); a note header, name or descriptor past the segment end is `NoteTruncated`, a non-empty name without a final NUL `BadNoteName`; `NT_GNU_PROPERTY_TYPE_0` properties are 8-aligned and a property past its descriptor is `PropertyTruncated`. Iterators yield `Result` and stop after the first error. Semantic segment checks (order, congruence, overlap of `PT_LOAD`s) belong to the mapper (§3); dlerror texts wait for the M14-0/DL-0b probes. Tests: `crates/ld/tests/elf_reader.rs` (malformed corpus), `elf_readelf_parity.rs` (readelf -h/-l/-d/-n).
'''
