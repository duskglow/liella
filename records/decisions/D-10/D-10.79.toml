body = '''
**`sinf`, `cosf`, `tanf` (and their `f32` names) take their `double` operand from one in-place `cvtss2sd`** (LIBM-SINF-IVB-RATCHET-2, coordinator ruling #4434; amends D-10.67). The boundary wrappers `hot::f32_trig::{sinf,cosf,tanf}_nearest` pass `hot::fpregs::widen` (inline `cvtss2sd xmm0, xmm0` with `in("xmm0")`/`lateout("xmm0")`, destination = source, `%xmm0` being where the psABI passes the `float` argument; `inout` refuses operands of two sizes; category *machine-register*, its third template by coordinator ruling #4445, `nomem`, not `pure` so it stays behind the range test) into `fast32::{sin,cos,tan}_nearest_widen`, which run `trig_core_with`: the same core as `trig_core`, whose operand D-10.72 builds from x's bits in six integer instructions. The conversion runs only on a normal `float` with biased exponent 101..=145 (the range test refuses NaN, ∞, subnormals and zeros on the bits first), where it is exact and raises nothing, so results and flags are unchanged. Why: the Ivy Bridge `sinf` loop is throughput-bound (IPC ~2, reservation station full 46% of cycles, LIBM-SINF-IVB-RATCHET), so the bit-built operand's +6 instructions per call cost `sinf` 3.5% there; a `cvtss2sd` whose destination is its source merges only the operand's own register (no false dependency, D-10.67), in one instruction. LLVM ties the destination of a plain `f64::from(x)` only when x is dead afterwards, and x stays live for the refusal paths, so the tie needs the asm. The partial-write check (D-10.68) accepts the in-place form and still reports a conversion into another unowned register (tests `in_place_conversion_passes_and_another_destination_does_not`); `cargo xtask static` permits the template `cvtss2sd xmm0, xmm0` in `hot/fpregs.rs` only, `nomem` on exactly `in("xmm0")` and `lateout("xmm0")`, and no other machine-register invocation names a register (`machine_register_tests`). `sincosf`, `cexpf` and the Bessel cores keep the bit-built operand. Measured (LIBM-SINF-IVB-RATCHET-3): sinf and cosf 85.1 instructions per call (91.2 with the bit-built operand); interleaved Liella/glibc time ratios, median of 6 rounds, this change against the same tree with the bit-built entries: Ivy Bridge sinf 1.70 (1.83), cosf 1.69 (1.81), tanf 0.79 (0.82), asinhf 1.33 (1.41), acoshf 1.43 (1.43); N100 sinf 1.86 (2.33), cosf 1.74 (2.18), tanf 0.56 (0.68), asinhf and acoshf unchanged; expf control unchanged on both.
'''
