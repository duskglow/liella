body = '''
**A failed `setlocale` sets `errno`: `ENOENT` when a name's locale data is not available, `EINVAL` for a category number that names no category; a successful call leaves `errno` alone** (coordinator ruling #5469, 2026-11-13; clause `s7_2_f_0`; probe rows in `spec/behaviour/setlocale-errno.md`). bash prints `strerror(errno)` in its warning when `setlocale` fails (AQOURS-SMOKE F3). `ENOENT` is what Liella's `newlocale` reports for the same names (D-7.18; POSIX `newlocale`: `ENOENT` when the locale data is not available), and Liella sets it on every failure for a name, including a name already refused before and a name refused before any lookup (one with `/`, or longer than the name limit, or a malformed composite name). The reference was seen leaving `errno` unchanged when the same unknown name fails again, giving `EINVAL` for some refused names, and setting `ENOENT` on one successful call; Liella copies none of these (a successful call may leave `errno` as it was, POSIX `setlocale`). The setting is out of line (`setlocale_failed` in `crates/boundary/src/locale.rs`), so a successful call runs the same code as before.
'''
