body = '''
**`cargo xtask plants` names the test that caught each plant and keeps the record beside the plants** (XTASK-PLANTS-CATCHER, 2026-11-07; decided locally, tooling only, no product code). Which test catches which planted defect is the evidence that a test is useful, and the per-plant logs that held it were mostly cleared. For every plant whose command failed (CAUGHT, WARN-RC-ONLY, WARN-NO-MSG) the run prints `plants: <id>: caught by <test binary> <test name>`: the first failing test in that plant's log (cargo test `Running ... (<path>/<target>-<hash>)` + `test <name> ... FAILED`, `Doc-tests <crate>`, or a nextest failing status line), else in order a panic in a thread named after a test, a panic outside a named test with its binary, the binary cargo asks to rerun, a build that does not compile, or "no test the log names"; a timeout prints `caught by timeout (<n>s)`. The run writes `<dir>/results.txt`, the plants file as read plus one `# cargo xtask plants results (<summary>):` comment block with a `# <id>: <VERDICT>[, caught by ...]` line per plant; a rerun on that file replaces the block. Writing a new file under `--dir` rather than editing the input keeps the tool's rule that it writes nothing outside `--dir`; the agent commits it as `handoff/<STORY>-plants.txt`. Tests: `catcher_*`, `results_replace_an_earlier_block`, `a_caught_plant_exits_zero_and_is_restored` (xtask); plants `handoff/XTASK-PLANTS-CATCHER-plants.txt`.
'''
