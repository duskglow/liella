id = "D-7.7"
section = "s07"
spec = "§7.1–7.3"
ann = "—"
status = "active"
body = '''
**Locale loading** (phase 7; D-7.2, Appendix D.1). Names resolve as Appendix D.1 records (aliases from `/usr/share/locale/locale.alias`, candidates from most to least specific, the codeset check, names with `/` rejected). **Alias order** (owner ruling 2026-10-11, "follow glibc on that one"; SETLOCALE-3): the requested name is searched first (the built-ins, then the search order below); `locale.alias` is read, and the alias's value searched the same way, only for a category the name itself does not find. Probed (strace of the reference's `printf`, Zen 1 2026-10-10): `en_US.UTF-8` / `en_US.utf8` open only the archive, `french` opens `locale.alias`; spec D.1 amended to match (it had the alias first). An alias whose value is the name itself is not searched again. Search order: the built-ins; then each `LOCPATH` directory (ignored in secure mode); when `LOCPATH` is unset, the archive (by normalized name), then `/usr/lib/locale` directories. Category files are mapped read-only once, checked (the header, and every item offset in bounds and ascending; a failure rejects the category, as if absent; offsets inside the tables are checked at each read, D-4.18), and cached process-wide as immutable data shared by reference; they are never unmapped (as in glibc), so the memory is bounded by the distinct locales a process loads. Reload on request: `liella_locale_invalidate` (D-X.13). **Bounded** (2026-10-04): at most 1,024 distinct files and 2,048 mappings in all (a file replaced and mapped again after an invalidation counts again); a load that would need a mapping past either limit, or whose path cannot be interned (the 1,024-name table, which also holds locale names), fails as for a missing file (the locale is not found), and a mapping that cannot be recorded is unmapped at once, so nothing is mapped again on every call (until then a full table mapped the file again at each load, without bound). Probed: 1,100 distinct `LOCPATH` locales load 511 (the name table binds first), and repeating the failing loads adds no mapping. Loading is serialized by one lock; every lookup after loading is lock-free. A non-built-in `LC_CTYPE` codeset's charmap (D-6.8) is loaded with its category, under the same lock, and kept with the locale; a codeset without an installed charmap rejects the category. Every name a locale holds is followed by a NUL in memory (names are interned; the built-in `"C"` is a NUL-backed literal), so `setlocale` and `__names` return them to C as they are. A name equal to `.` or `..`, and any candidate that is empty, `.` or `..`, is never used as a path component (owner ruling 2026-10-04, extending D-7.12's rule to `setlocale`; probed: the reference rejects `/` and `..` but accepts `.`, loading `LOCPATH` itself as locale ".").
'''
