body = '''
**The layout contract check (D-X.48) disassembles only the sections it checks, and a pass is served from a verdict cache keyed by everything the check reads, except under the CI train** (LAYOUT-CHECK-VERDICT-CACHE, 2026-11-12, #5085; tooling only, no product, ABI or behaviour change). Profile on a Zen 1 build host (EPYC 7551, 4-core slot, fast products of origin/next 9b2a0c029): the check took 241 s of a 442-448 s no-change `cargo xtask so`. JCC-HOT-ASM was 226 s, all of it `objdump -d -w` over the whole 14 MB `libc.a` (849k lines), of which the check reads only the 47 sections the padded files declare. `objdump -d -w -j <those 47>` takes 0.08 s. CLASSED-XREF takes 10 s, STARTUP-DATA-WINDOWS 2.5 s and the rest under 1 s each. (1) `jcc::check_file` with a section set reads `objdump -h -w` first and disassembles only the sections (any member) whose base name is in the set; `check_text` filters by the same set as before. (2) `layout::check_products` goes through `xtask/src/layout_verdict.rs`. A pass is stored as `target/layout-verdicts/<key>`: magic, key, line count, the ok lines, and a sha256 of that text. The key is the sha256 of these lines: the running xtask binary's bytes; the paths of the root and the products directory (as given and canonical) and the profile; the name and sha256 of every entry of the products directory; `layout/contracts.tsv`, every file a rule value names, and `csys/src/machine/` of `JCC_PAD_FILES`; `page_faults.c` after `cc -E` with the probe's flags (its system headers count); `cc`, `readelf`, `objdump` and `nm` on PATH, the compiler's `cc1`, `as`, `ld`, `collect2` and `libgcc.a`, every shared library `ldd` lists for them (all by content), and the four tools' `--version`; and `PATH`, `CC`, `HOME`, `CARGO_HOME`, the loader and compiler search variables, `TMPDIR` and every `LIELLA_*` variable. A hit prints the key and the stored lines. Any failure while computing the key leads to a full check. An entry that does not read back exactly (magic, key, count or sum) is a miss and is rewritten by the full check. A failure is never stored. (3) With `LIELLA_TRAIN` set and not `0` (the CI train), or with `LIELLA_LAYOUT_CACHE=0`, the cache is neither read nor written and every contract is checked. Inputs the key does not hold: none known. The tools' data files outside their shared libraries (gcc specs, ld's built-in scripts) are covered only through the binaries and versions. Measurements: `handoff/LAYOUT-CHECK-VERDICT-CACHE.md`.
'''
