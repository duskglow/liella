date = "2026-11-10"
body = '''
**`clog`, `csqrt`, `clogf`, `csqrtf` get a quick tier in front of the 384-bit route** (LIBM-CPLX-LOG-SQRT, under D-10.53; every decline reaches the route unchanged, so special values and the Annex G cases stay as they were). `double`, window `2^-400 <= \|x\|, \|y\| < 2^400` (no scaling step; outside it the route). `csqrt` in Kahan's form (Kahan, "Branch Cuts for Complex Elementary Functions, or Much Ado About Nothing's Sign Bit", 1987): `t = sqrt((\|x\| + \|z\|)/2)` from a double-double `\|z\|` (Dekker 1971 products, the correctly rounded `sqrt` plus one Newton correction), the other part `\|y\|/(2t)`; no subtraction, so both parts are within `2^-101.9` relative (test bound `2^-100`); the signs follow the cut (`x < 0` swaps the parts, the imaginary part takes `y`'s sign). A part whose double-double is exact (`\|P.lo\| <= eps`) declines, so exact roots and their flags come from the route; a midpoint is impossible for a square root's part. `clog`: imaginary part from `atan2`'s quick phase (`atan2_abs`, split out of `atan2_nearest` before its rounding test, `2^-65.5` relative, ratio window `min/max >= 2^-60`); real part `log(a²+b²)/2` from the `log` quick kernel when `RN(a²+b²)` lies outside `[0.75, 1.25)`, else `log1p(w)/2` with `w = (a−1)(a+1) + b²` built from exact products, bound `2^-63·\|z\| + 2^-102·(\|(a−1)(a+1)\| + b²)`, so deep cancellation near `\|z\| = 1` shows in the bound and declines. One rounding test per part (de Dinechin, Lauter & Muller, RAIRO-ITA 41, 2007), all four modes. `float`: the same formulas in plain `double` (`csqrtf` within 16 ulp of `double`, `clogf` 32 ulp per part) with `float`'s rounding test on the `double` result. The boundary's in-place nearest entries use `sqrtsd`; the envelope's modes use the software root, identical by construction. Tests: `complex_fast_ls_tests.rs` (each tier against the route in four modes, regimes near `\|z\| = 1` and the axes, exact roots, branch-cut sides, a 10^7 sweep).
'''
