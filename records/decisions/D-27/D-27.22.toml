tests = ["crates/ld/tests/reloc.rs::reloc_libc_early_init_before_preinit", "crates/ld/tests/reloc.rs::reloc_libc_build_tag_mismatch_refused", "crates/rt/src/start.rs::private_tag_layout"]
body = '''
**`LIELLA_PRIVATE` start interface: a build tag checked at load, and `__liella_libc_early_init` before any constructor (phase 14 DL-13, plan/ph14/design.md §14, L14-10, R14-12).** `libc.so.6` exports two symbols at its own version node `LIELLA_PRIVATE` (never in a public header): `__liella_build_tag`, 64 bytes (`LIELLA-BUILD-TAG:` then the build's identity, zero-filled), and `__liella_libc_early_init(const StartInfo *)` (`liella_rt::start::private`, shared by both products so the C library's code does not depend on the loader crate; the lookup and check are `liella_ld::start::private::find`: argc, argv, envp, auxv, stack end, `repr(C)`). The identity is FNV-1a 64 over the product sources (`crates/`, `csys/`, `include/`, `Cargo.lock`; paths sorted, so no file-system order enters it), computed by `cargo xtask so` and passed as `LIELLA_BUILD_TAG` to both product builds; a source hash rather than the commit because the build roles are synced copies without git, and it also separates two dirty trees at one commit. After the version check and before any relocation, `ld.so` looks up `__liella_libc_early_init@LIELLA_PRIVATE` in each loaded object but itself; the first object defining it must define `__liella_build_tag@LIELLA_PRIVATE` as a 64-byte object inside the file part of a `PT_LOAD`, equal to `ld.so`'s own tag, else the start stops with `<object>: LIELLA_PRIVATE build tag differs from the dynamic loader's ...` and status 127 (no code of the library has run). After relocation, RELRO and the static TLS images, `ld.so` calls the entry with the initial stack before the program's `.preinit_array`; it publishes the auxiliary vector, `environ`, the program names and `__libc_stack_end` and runs the tunables and the CPU-path selection (start steps 3 and 4, step 3 through the inlined helper `__libc_start_main` uses; its tunables parse prints no diagnostics, as `ld.so` read the string; `__libc_start_main`'s own step 4 is unchanged, so the static path keeps its code and hot-text keys). The NULL-folding guard needs no early step: it is decided at the first small copy or fill. Until DL-14, `__libc_start_main` repeats steps 3 and 4 with the same values. The export moves (`__libc_stack_end`, the `__rseq_*` objects to `ld.so`) and rseq publishing by `ld.so` are not part of this record (DL-13's second half). Tests: a `.preinit_array` function sees `getenv` work and `memcpy(NULL, NULL, 0)`/`memset(NULL, 0, 0)` return, kernel-started and as `ld.so PROGRAM`; a copy of `libc.so.6` with one tag byte changed is refused with the diagnostic.
'''
