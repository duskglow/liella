id = "D-X.9"
section = "x"
status = "active"
body = '''
**`Sys` exposes only operations that are sound for every argument safe Rust can pass.** Memory-map changes take ownership-typed values (`Region`: only memory the caller mapped can be unmapped, protected or resized). Signal handlers must be `extern "C" fn` values. Kernel-registered pointers (robust list, rseq, clear-child-tid) must be `&'static` atomics. `fork`-style creation, raw thread creation and `arch_prctl(ARCH_SET_FS)` are not in `Sys`. **Operations on arbitrary addresses that C callers request** (`munmap`, `mprotect`, `mremap`, `madvise`, `MAP_FIXED`, `brk`, `shmat` at an address, `fork`/`clone`, ...) go through `liella_boundary::raw`. That module is crate-private, its soundness rests on the C caller's contract exactly as for category *slice*, and no safe library code can reach it. Fixed, sound sequences that tests need (for example "fork; the child exits at once; the parent waits") are exposed as `liella_boundary::selftest` helpers. **Refined in phase 1:** (a) `Region` records its kind, protection and key; only private anonymous, read-write, key-0 regions become `&mut [u8]` (`region_bytes`), and only anonymous or System V shared ones become `&[AtomicU32]` (`region_words`); file mappings are never viewed, since the file can change or shrink underneath. (b) The multiplexed calls (`fcntl`, `ioctl`, `prctl`, `madvise`, `ptrace`, `quotactl`, `semctl`, `arch_prctl`, `setsockopt` levels) take typed command sets whose argument types match the command. Commands that make the kernel write through or jump to a caller-chosen integer stay in `raw`: `MADV_FREE`, `MADV_DONTFORK`, `PTRACE_POKE*`, register setters, `SOL_XDP`/`SOL_RDS` options, and the `rseq_cs` pointer, which is private and always 0. (c) Calls whose "input" pointers the kernel writes back take `&mut`: `pselect6`/`ppoll`/`recvmmsg` timeouts and the `capset` header (the syscall table's argument kinds were corrected to match). (d) `vmsplice` takes exclusive buffers in both directions, because on a pipe's read end the kernel writes them. (e) `set_robust_list` is `raw`: the list holds addresses the kernel writes at thread exit. (f) Sealed constructors (`Region::__from_kernel`, `__kernel_update`, `SockAddrBuf::__set_len`) may be called only from `crates/boundary/src/sys.rs`; `cargo xtask unsafe-audit` enforces this.
'''
