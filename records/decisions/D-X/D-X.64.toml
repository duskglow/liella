body = '''
**Written start-up state in one size-aligned `.data1` cluster** (LAYOUT-DATA-CLUSTERS, LAYOUT-DATA-CLUSTERS-2, 2026-11-11; layout only, no symbol, ABI or behaviour change; brief B of `handoff/layout-stability-rethink.md` sections 3-4; keeps D-X.22, D-X.50, D-X.53, D-X.62, D-X.63; bounds unchanged). (1) `cargo xtask so` (`xtask/src/coldbss.rs` `move_startup_state`) renames to `.data1`: the fixed list `STATE_KEY_SUFFIXES` (now with `heap::HEAP`, 5376 bytes, whose head and tail every process writes), every writable-kind key of `crates/libc-so/startup-data.keys` whose `.data.<s>`/`.bss.<s>` section is at most 4 KiB, and C's `.bss.environ` by section name (`STATE_C_SECTIONS`). It runs BEFORE `move_cold_bss` (D-X.22), so a keyed object of 1-4 KiB (`process::EXIT_HANDLERS`, 1048 bytes) joins instead of becoming `.lbss`. fold.S defines its start-up words (the fold-limit line, `cmp_sse`/`cmp_sse_null`, `fill_erms_from`/`set_mid`) in `.data1` directly. Zero-initialised members become file bytes (HEAP 5376, EXIT_HANDLERS 1048, environ 8, fold.S 64). (2) entry.S's empty `.data1` (first in every link) is aligned to the smallest power of two not below the cluster's archive bytes (4-64 KiB, `startup_ro::cluster_aligns`), so the cluster takes ceil(size / 4 KiB) pages wherever `.data` ends. (3) `global_locale::SLOTS` (112 KiB; locale paths write its first slot) stays in `.lbss`: it is then the only start-up writer there, one page whatever rustc's order. (4) A relro head cluster (`.data.rel.ro.local*`) was measured worse (its own 64 KiB window, Dr 1 -> 2, ruling #4577); a tail placement beside `.got` cannot be named in GNU ld's default script, so start-up relro is left in place. Tests: hot_text_products `init_written_startup_objects_are_in_the_data1_cluster`, `init_data_clusters_hold_at_every_text_phase` (text pads and `.lbss` pads); xtask unit tests in coldbss and startup_ro.
'''
