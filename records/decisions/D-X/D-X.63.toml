body = '''
**No library text ahead of the hot group; each 0-fault cluster aligned to its size** (LAYOUT-TEXT-PIN, 2026-11-10; layout only, no symbol, ABI or behaviour change; brief A of `handoff/layout-stability-rethink.md` sections 2-4; keeps D-X.56 and owner ruling HOTTEXT-PINNING: no function is pinned, sections are only renamed and aligned). (1) TEXT-PREFIX: `cargo xtask so` (`xtask/src/hottext.rs`) gives every unlisted function section of `libc.a` a name GNU ld 2.42's default script places after the hot group: `.text.unlikely.<f>` (rustc's `#[cold]`), `.text.startup.<f>`, `.text.exit.<f>` and `.text.hot.<f>` become `.text.<f>`, and a plain name that itself matches a pre-group pattern (`.text.exit` of the library's `exit`, `.text.*_unlikely`) becomes `.text.liella_cold.<f>.liella_cold` (the suffix also breaks `.text.*_unlikely`). Section names are read from the objects' own section headers, not `readelf -SW`, which cuts names at 256 bytes (#4354). Before, 154 cold sections (47 KiB fast, 70 KiB release) and `exit` lay between `.text` and the group, so any cold function added anywhere moved every window boundary inside the group (mktime after localtime_r 0-1, start-up text windows 4-5 over 19 pads). The probe link's 34-byte `.text.startup` is crt1's `_start`, not the library's, and stays. (2) CLUSTER-WINDOW: `crates/libc-so/hot-text.clusters` (hand-kept; the list is generated) names each 0-fault cluster by its first and last hot-text key (time: `zone::local_in` to `days_from_civil64`; strings: `strlen` to `printf::vfprintf`; rebind: `bindtextdomain` to `Mo::form`; float: `simple_float` to `decimal_styles`). `so` lays the cluster's grouped sections out in name order, as `SORT(.text.sorted.*)` does, and sets the first one's `sh_addralign` (`objcopy --set-section-alignment`) to the smallest power of two not below that size (at most 64 KiB), so the cluster cannot straddle a 64 KiB fault-around window wherever the group lands; each cluster starts with a function the earlier calls of its probe mode already ran. A head left from an earlier run on the same archive goes back to 64. Cost: under one cluster size of padding per cluster. A regen build (`--hottext-regen`) reports a cluster key missing from the list instead of failing (D-X.56). Contracts: `hot_text_products` checks TEXT-PREFIX and CLUSTER-WINDOW on the probe's link map and links the probe with crt1 padded (`ld -r`) by 0x800/0x2000/0x8000/0xF000 bytes ahead of and after the group, requiring mktime, strings and rebind 0 and every cluster in one window at each pad.
'''
