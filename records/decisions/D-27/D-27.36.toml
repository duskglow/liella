story = "DL-TLS-THREADS"
date = "2026-11-13"
body = '''
**Threads with TLS in dynamically linked programs; TLS descriptors (DL-15 `DL-TLS-THREADS`, design §7, R14-8).** Under Liella's `ld.so`, `pthread_create` and `thrd_create` create threads: D-22.10's dynamic `EAGAIN` now applies only under another loader (or when the loader gives no TLS interface). **Interface:** the loader passes its per-thread TLS interface in `StartInfo` (the record `__liella_libc_early_init` receives, D-27.22) instead of the `LIELLA_PRIVATE` exports design §7/§14 named: `tls_size` (bytes a thread's static area needs below TP), `tls_align`, `tls_init(tp)` and `tls_release(tp)` as function addresses. Gain: `libc.so.6` gets no version need on `ld.so`'s private node, so it still loads under another loader (which never calls the early hook, so threads stay refused there), and no symbol lookup is involved; a mismatched pair is already refused by the build tag (D-27.22). The C library keeps it only when the size is non-zero, the alignment a power of two no larger than a page, and both hooks are set. **Layout:** a new thread's static area repeats the initial thread's (D-27.20): every initially loaded module's block at the same TP offset, the 64 KiB surplus, then the dtv in the lowest words of the area (`tls_size` = the initial area's bytes below TP + the dtv's words). The C library reserves it below TP in the thread's mapping (as the executable's block in a static program) and calls `tls_init` after writing the thread block, before the clone: each block gets its image and zeros to `p_memsz`, the dtv is built, and the block's dtv word points at it. A reused mapping's area below TP is no longer cleared by the C library (`tls_init` rewrites every block and the dtv; the surplus is left as it is). `tls_release` runs after the thread's destructors; the static area goes with the mapping, so it has nothing to release yet (the place for DL-19's dynamic blocks). **TLSDESC:** `R_X86_64_TLSDESC` is applied (no longer refused) as `[liella_machine_ld_tlsdesc_static, TP offset]` (`Arch::tls_descriptor`, the `TpOff` arithmetic; A. Oliva, "Thread-Local Storage Descriptors for IA32 and AMD64/EM64T", 2005), every initially loaded module being static; an image without a descriptor function still refuses it. `csys/src/machine/tlsdesc.S` holds the two fixed-name primitives with the register convention in its header: `_static` (`movq 8(%rax),%rax; ret`) and `_dynamic`, a branch-free trampoline for DL-19: its argument points at a record whose first word is a resolver `fn(record) -> address`; it saves rcx, rdx, rsi, rdi, r8-r11 and the FXSAVE state in a 64-byte aligned frame (any entry alignment), calls the resolver, subtracts `%fs:0` and restores. FXSAVE (not XSAVE) because the resolver is baseline SSE2 code, which leaves the upper ymm/zmm halves, zmm16-31 and the mask registers untouched; a resolver that uses AVX needs an XSAVE variant. Flags are not preserved (the convention's). Tests: `crates/boundary/tests/dl_tls_threads.rs` (`tlsdesc_functions_keep_every_register_but_rax`: both primitives forced by the caller, all registers, MXCSR and x87 control word, stack aligned and off by 8, a resolver that clobbers everything; `threads_get_static_tls_of_every_initial_module`: GD, LD, IE and TLSDESC in a library, LE in the program, threads from the program and the library, three rounds over reused mappings, per-thread `errno`, on the reference and on Liella through `PT_INTERP` and `ld.so PROGRAM`); `crates/ld/tests/tls.rs` (`tls_relocation_arithmetic_from_the_table`: the descriptor words). Plants: handoff/DL-TLS-THREADS-plants.txt.
'''
