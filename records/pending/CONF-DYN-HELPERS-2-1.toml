body = '''
**The dynamic-link mode of the conformance harness (DL-16H `CONF-DYN-HELPERS`).** A `conformance/c` program that names helpers (`LINK-HELPERS`: linked, `DLOPEN-HELPERS`: opened at run time; sources in `conformance/c/helpers/`, per-helper flags in `HELPER-FLAGS: <helper> <flags>`, `LINK-EXPORT-DYNAMIC` for `-rdynamic`) is built twice and run twice by `conformance/run.sh`: the reference's build (host compiler, host C library and loader) and Liella's (`-nodefaultlibs` against `target/liella/libc.so.6`, interpreter `target/liella/ld-linux-x86-64.so.2`). Both runs are judged by the same `EXPECT-*` directives, so a program states the probed behaviour once and the reference proves the program right before Liella is judged by it. **Helpers:** each helper's `.so` is removed before its build and checked to exist after it, in both sets; a helper that is missing, does not build or was not built fails the program, whichever run would have noticed. Programs get `CONF_HELPERS` and `LD_LIBRARY_PATH` set to their own helper directory. **Interim (until ld.so searches the run path):** Liella's builds link a copy of `libc.so.6` without `DT_SONAME` through a `libc.so` script (with the host's `libc_nonshared.a`), so the program reaches Liella's libc by path, as the `conformance_dynamic` product test does; when the library search lands, Liella's builds link `libc.so.6` by soname and the copy goes. **`PENDING-LIELLA: <story>`:** for behaviour Liella's loader does not have yet. The reference must pass; Liella's run failing prints `conformance: PENDING <program> on Liella until <story>` and counts as passed (the summary says how many were pending); Liella's run passing is a FAIL (drop the directive and the clause test's pending assertion); any build failure is a FAIL. A pending program links with `--unresolved-symbols=ignore-all`, so a missing export fails its run, not its link. Pending is not a skip: the clause tests assert the PENDING line by name (`s27_1_f_0`: `s27_dlopen_failures` until DL-16a; `s27_1_c_3`: `s27_dlsym_handles` until DL-16b), and the day the loader work lands the run fails until the mark is removed. **Selection:** a file under `conformance/c/helpers/` selects every conformance program in `cargo xtask affected` (helpers and version maps are shared). Tests: `s27_1_f_0`, `s27_1_c_3` (crates/core/tests/s27_dynlink_clauses.rs); plants in handoff/CONF-DYN-HELPERS-plants.txt (a helper left unbuilt in either set, the pending verdict).
'''
