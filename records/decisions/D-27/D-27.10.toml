body = '''
**The self-relocator** (DL-BOOT-RELOC, phase 14 DL-4, ruling R14-1 option (a), design §1): logic in `liella_ld::boot` (pure, host-tested), memory views in `boundary/src/bootstrap.rs` (category *slice*). First user: the static-PIE start of `libc.a` (closes phase-4 deviation 2); `ld.so` reuses it (DL-5). Rules: (1) the image is found through its own ELF header, `__ehdr_start` declared hidden and NOT weak in a C file of its own (`csys/src/adapter/image_anchor.c`, helper `liella_link_image_header`), so the compiler takes its address with one RIP-relative instruction; every reference made before pass 1 ends must be PC-relative like this (a weak reference compiles to a GOT load, and the GOT is unrelocated: DL-BOOT-RELOC's first `_DYNAMIC` anchor crashed every static PIE). `cargo xtask so` checks that the anchor's archive member references `__ehdr_start` and has no GOT-typed relocation. A static PIE links the start object `liella-rcrt1.o` (`entry.S` assembled with `-DLIELLA_STATIC_PIE`; its `_start` calls `liella_start_main_static_pie`, PC-relative, checked by `cargo xtask so`), which runs `runtime::start::<true>`; `liella-crt1.o` runs `start::<false>`, which compiles no relocation step and no type test (DL-BOOT-RELOC-3: no static non-PIE start pays for static PIE). The relocating start still relocates only when the header's `e_type` is `ET_DYN`; bias = the header's run-time address minus the `p_vaddr` of the `PT_LOAD` at file offset 0, and `PT_DYNAMIC` is found at bias + its `p_vaddr` (a static PIE from GNU ld has no `PT_PHDR`, so the header bias reads 0; the TLS image and RELRO range are moved by the real bias). (2) It needs one `PT_DYNAMIC` and exactly one writable `PT_LOAD`; every target lies in that segment (8 bytes inside it), every table (`DT_RELA`, `DT_JMPREL`, `DT_RELR`) holds whole entries and lies outside it; `DT_TEXTREL`, `DT_RELAENT` not 24, `DT_RELRENT` not 8, `DT_PLTREL` not `DT_RELA`, a missing `DT_NULL`, a RELR bitmap before an address or an address overflow are refused. (3) Pass 1, before any relocated data is read: `DT_RELA` then `DT_JMPREL` entries of kind `RelocKind::Relative` (through `Arch::classify`, never a raw type number) get bias + addend, then each RELR address gets += bias; `Irelative` and `None` wait; any other kind is refused. A refusal in pass 1 writes one fixed line to fd 2 and exits 127 (nothing that reads relocated data may run). (4) Pass 2, where the non-PIE start applies `.rela.iplt` (after the CPU paths, before the constructors and before RELRO is protected): each `Irelative` entry of both tables calls its resolver at bias + addend and stores the result; the segment view is made after the resolver returns. No panics anywhere in the relocator (a `Location` is relocated data). (5) `xtask so` makes `DW.ref.rust_eh_personality` weak hidden in the product crate's own `libc.a` objects (it was LOCAL in a COMDAT group, so a PIE link refused the other members' references). Tests: `liella_ld::boot` unit tests; `conformance/c/s01_static_pie.c` (RELR) and `s01_static_pie_rela.c` (RELA), each with an IFUNC called and taken by address, a pointer in the TLS image, a constructor and 100 starts (50 randomised, 50 `ADDR_NO_RANDOMIZE`); plants `handoff/DL-BOOT-RELOC-plants.txt`.
'''
