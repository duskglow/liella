date = "2026-11-13"
body = '''
**The written start-up data takes the same pages whatever precedes it** (STARTUP-DATA-PAGE-ALIGN; amends D-X.62 and D-X.67). The STARTUP-DATA-WINDOWS contract counts, as written start-up pages, the relro (`.data.rel.ro*`, `.got`) bytes the start-up functions address, the `.data1` cluster (D-X.64) and the head of `heap::RESERVE_MEM`; the relro bytes sat in rustc's emission order (a libm-only branch, LIBM-F32-BESSEL-LARGE-6, moved them by 0x4d0 bytes, 11 -> 13 pages) and `RESERVE_MEM` started 0xc18 into a page (two pages). (1) `cargo xtask so` (`xtask/src/startup_ro.rs` `relro_plan`, in `place`) renames every `.data.rel.ro*` section the start-up functions' relocations reach (the reach of the read-only cluster, D-X.62) and the relro sections of the `rw` keys of `startup-data.keys` to `.data.rel.ro.local.liella_startup`; the one first in its member's section table becomes `.data.rel.ro.local.liella_startup_head`, aligned to 4096. GNU ld's default script takes `*(.data.rel.ro.local*)` before `*(.data.rel.ro .data.rel.ro.*)`, so the group sits at the head of the relro output section after only the program's own `.data.rel.ro.local*` inputs and starts on a page boundary; inside it, section-table order (no object of a page or more is among them). (2) `heap::RESERVE_MEM` is `#[repr(C, align(4096))]`: its head takes one page; so is the locale table `global_locale::SLOTS` (112 KiB, its first records written at start-up; its head straddled two pages in release products; STARTUP-DATA-PAGE-ALIGN-3). (3) The start file's relro alignment (D-X.67, `LIELLA_RELRO_ALIGN`, `csys/src/machine/entry.S`) is an empty `.data.rel.ro.local` section, the first input of `*(.data.rel.ro.local*)` (the start file comes first in a link), so relro still starts on that boundary with the cluster right after it; as `.data.rel.ro` it came behind the cluster and padded the rest of relro to the next 64 KiB boundary (56 KiB of fill, relro over two fault-around windows: the first `%.2f` 3 -> 4 faults and the coreutils-shaped probe 50 -> 51, fast products, STARTUP-DATA-PAGE-ALIGN-2). Cost: up to 4095 bytes of relro padding (file and memory), up to 4095 bytes of `.lbss` address space per aligned object (no file bytes). Checked by `init_startup_data_pages_hold_at_every_data_phase` (hot_text_products: relro pads 0x4d0-0x14d0 and `.lbss` pads; relro holds under a page of fill) and `startup_relro_sections_form_one_group_headed_by_the_first` (xtask unit test).
'''
