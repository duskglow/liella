id = "D-1.13"
section = "s01"
spec = "§1.1"
ann = "HIST, KERN"
status = "active"
body = '''
**RELRO in a static program** (STATIC-RELRO, 2026-10-22): before the first constructor (`.preinit_array`), `__libc_start_main` makes the executable's `PT_GNU_RELRO` pages read-only with one `mprotect(PROT_READ)` over `[page_down(vaddr), page_down(vaddr + memsz))`: a partial last page stays writable (the linker ends the segment on a page boundary, so in practice the whole segment). Black-box probe of the reference library (static, non-PIE, strace + /proc/self/maps, 2026-10-22): `mprotect(0x4a5000, 20480, PROT_READ)` for vaddr 0x4a5f30 memsz 0x40d0, after its own start-up and before the constructors' output. The only start-up relocations to finish first are the program's own `R_X86_64_IRELATIVE` entries (STATIC-IRELATIVE; static PIE is refused): they are applied before the protection, since their target words lie in `.got`, inside RELRO (RELRO-IRELATIVE-ORDER, test `conformance/c/s01_irelative_relro.c`: the ifunc's `.got` slot holds the resolver's choice and is read-only when the constructors run; a write to it faults in a child). An `mprotect` failure is not fatal (the segment stays writable). Decision in `liella_rt::start::relro` (range rule) and `start::program` (STATIC-RELRO-2: the one pass over the program headers that `initial_thread` already makes also records `PT_GNU_RELRO`, so start-up reads neither the headers nor the auxiliary vector again; the page size is x86_64's fixed 4096, the value the kernel passes as `AT_PAGESZ`), call (inlined) in `liella_boundary::runtime`; cost on an empty static program: see handoff/static-relro-2.md (startup_instr_c, Zen 1 host); test `conformance/c/s01_relro.c` (maps r-- from the constructors on; a write to a `.data.rel.ro` object faults in a child). A dynamically linked program's RELRO belongs to its loader: the host's `ld.so` now, Liella's at phase 14.
'''
