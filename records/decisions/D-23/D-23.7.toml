body = '''
Written under the clean-room rules of §1.4 in a fresh session, from the spec, POSIX (`strftime`, `strptime`, `getdate`, `LC_TIME`), ISO C, `spec/behaviour/timefmt.md` and black-box probes. **Internal:** `liella::time::format::strftime<U>`, one engine for bytes and `wchar_t`, writes whole fields while each fits with a terminator and returns `Written::Fits(n)` or `Written::Truncated{needed}` (a full buffer is distinct from an empty result); `liella::time::lctime` reads names, formats, POSIX eras and alt_digits from the locale (negative era years count from 1 BC; era years grow from the start date towards the end date under `+`; wide output decodes the strings from `_NL_TIME_CODESET`). Directives: flags `_ - 0 ^ #` (the last pad flag wins), a width counted in units including the sign (zeros after the sign, spaces before it); `%C` at least two digits; `%z` one field (`±hhmm`), empty when `tm_isdst<0`; `%Z` with a NULL or empty `tm_zone` names the current zone; `%s` is the mktime of the fields; E applies to `cCxXyYz`, O to `deHImMSuUVwWy`, `Cjgkl`, `bBh` and `z`; anything else is copied with its width; case changes are per character. `liella::time::parse::strptime` sets only the fields the input determines (weekday and day of the year from year+month+day, year+`%j`, year+`%U`/`%W`+weekday, or ISO year+week+weekday); E/O fall back to the unmodified conversion when the locale has no alternative (POSIX); `%C %y %Y %s` accept signs; a width is the maximum number of digits; `%c %x %X %r` use the locale's format only, `%r` defaulting to `%I:%M:%S %p`. **Boundary** (`timefmt`): a full buffer or an empty result returns 0; NULL arguments give 0 or NULL with `EFAULT`; a mismatch is NULL without `errno`; the zone is reached through an implicit tzset only when a directive needs it; `wcsftime` checks its buffer's alignment. **`getdate` is legacy** (`liella_legacy::getdate`): errors 1–8 as POSIX lists them, including 2 for a file that cannot be opened (glibc: 3); the first template that matches the whole input (spaces around it allowed, ordinary characters case-insensitive) decides; POSIX completion rules, normalised by mktime; a time without a date is tomorrow only when its hour (0 when not given) is before the current hour, so the current hour with the minutes already past is today: POSIX's greater/less does not settle the equal hour and this is the reference's answer (probed at a set clock, coordinator #1983, TIME-SPEC-GAPS-SETTLE-3); the result in a per-thread slot (`SLOT_GETDATE`, D-H3); `getdate_err` a C object in the products, a private static in test builds. Deliberate differences: the `timefmt_products.rs` KNOWN list. Open (spec silent): getdate with `%Z`, partial times in getdate, a signed `%y`.
'''
