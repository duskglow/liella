id = "D-X.12"
section = "x"
status = "active"
body = '''
**Without `/proc` (OD-5)** (owner ruling 2026-10-04: Linux 5.10 or later with `/proc` mounted is the supported environment; a function must still never crash or give a wrong answer where `/proc` is absent, as in minimal containers and chroots, but fail with an error or use a documented fallback). Every `/proc` and `/sys` path the library opens, with its behaviour when they are absent; tested by `crates/core/tests/noproc_products.rs` (the probe `noproc_diff.c` built against glibc and statically against Liella, run as is and in a private user and mount namespace with an empty tmpfs over `/proc` and `/sys`; recorded in `spec/behaviour/noproc.md`). `get_nprocs`, `sysconf(_SC_NPROCESSORS_ONLN)` (`/sys/devices/system/cpu/online`, then `/proc/stat`): the affinity mask's count, at least 1 (as glibc). `get_nprocs_conf`, `_SC_NPROCESSORS_CONF` (`/sys/devices/system/cpu`, then `/proc/stat`): `get_nprocs` (as glibc). `sysconf(_SC_NGROUPS_MAX)` (`/proc/sys/kernel/ngroups_max`): 65536, the kernel's fixed `NGROUPS_MAX` (as glibc). `pathconf`/`fpathconf(_PC_LINK_MAX)` on the ext2/3/4 family (`/proc/self/mountinfo` tells ext4): 32000, the family's smallest limit, so a program trusting it never exceeds the real one (glibc answers the same and leaves `ENOENT` in `errno`). `pthread_getattr_np` of the initial thread (`/proc/self/maps`): `ENOENT`, as glibc (it was `ENOMEM`, which claimed an allocation failure). `pthread_setname_np`/`pthread_getname_np` of another thread (`/proc/self/task/<tid>/comm`; the calling thread's own name uses `prctl`): `ENOENT`, as glibc. `pidfd_getpid` (`/proc/self/fdinfo/<fd>`): `ENOSYS` for an open descriptor (it cannot be asked before Linux 6.13's `PIDFD_GET_INFO`), `EBADF` for one that is not open (glibc: `EBADF` for both, a wrong answer for a valid pidfd; recorded difference). `ttyname`, `ttyname_r` (`/proc/self/fd/<fd>`), and the terminal of `getlogin`, `getlogin_r`, `ttyslot` and `login` (`liella_legacy::accounting::tty_line`): the name the device number gives under the kernel's device list (Unix98 pty slaves `/dev/pts/N`, `/dev/ttyN`, `/dev/ttySN`, `/dev/tty`, `/dev/console`, `/dev/ptmx`), accepted only when that node is the very terminal (same device, inode and device number), else `ENODEV` (`term::name_by_device`; it was `ENODEV` for every terminal, and `getlogin` then reported `ENXIO`, no terminal; now as glibc on these devices). `getlogin` (`/proc/self/loginuid`): the login record of the session's terminal, as when the audit UID is unset (as glibc). `group_member` and the access checks' group test with more than 64 supplementary groups (`/proc/self/status`): the open's `ENOENT` (never a wrong yes or no); up to 64 groups use `getgroups`. `lchmod`/`fchmodat(AT_SYMLINK_NOFOLLOW)` on Linux 5.10 to 6.5 only (`/proc/self/fd`, D-13.9): `EOPNOTSUPP`, as the reference (it was `ENOENT` until 2026-10-05, found on 5.10); Linux 6.6 and later use `fchmodat2`. `closefrom` (`/proc/self/fd` only where `close_range` fails, which Linux 5.10 never does). `getauxval` and the vDSO clocks: the auxiliary vector from the process's start (`/proc/self/auxv` only in a process the library did not start, such as the hosted test harness). The name-service cache's region (`/proc/sys/kernel/random/boot_id`): a zero boot ID, so a region is not recognised across a reboot by that ID alone; lookups are unchanged (D-16.10). Not covered: `getloadavg` is covered (§24.6: it reads `/proc/loadavg` and returns -1 without `/proc`, pinned by the NO-PROC-LANE test), and paths a caller names itself (`setmntent("/proc/mounts")`, `/etc/mtab` as a link into `/proc`). **Kernels tested:** Zen 1 and Haswell-EP run 6.8.0-146; the WSL2 development kernel is 5.15.167; nothing has run on 5.10, the minimum.
'''
