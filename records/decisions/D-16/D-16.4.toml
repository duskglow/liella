id = "D-16.4"
section = "s16"
spec = "§16.2"
ann = "—"
status = "active"
body = '''
IDNA is built in: UTS #46 from Unicode 15.1 (`spec/unicode/15.1.0/IdnaMappingTable.txt`, `ArabicShaping.txt`, generated by `xtask unicode` into `names::dns::idna_tables`). No `dlopen` of libidn2. Nontransitional processing; CheckHyphens on; CheckBidi with full RFC 5893; CheckJoiners per RFC 5892 A.1/A.2; UseSTD3ASCIIRules off; NV8/XV8 code points rejected (as the reference); an encoded label over 63 bytes is an error; all-ASCII names pass unchanged; ToUnicode decodes `xn--` labels only when the result is non-ASCII; text goes through the locale's charset (ASCII fallback): AI_IDN gives `EAI_IDN_ENCODE` when it cannot be represented, NI_IDN keeps the ASCII form. **Deliberate difference:** Bidi rule 4 is enforced (glibc accepts mixed Arabic-Indic digit sets; KNOWN/DROPPED in `dns_products`).
'''
