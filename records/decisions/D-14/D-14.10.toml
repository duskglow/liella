body = '''
**regexec required-bytes prefilter** (RX-T1, P6 design step T1, 2026-10-07). At regcomp the block's lead field now holds `regex::required_string`: the plain string (as before), else the longer of the leading bytes and the longest chain of `Byte` instructions that starts at a dominator of `Match` in the instruction graph (Cooper-Harvey-Kennedy over the union of every successor, so a superset of the matcher's moves: sound; at most 32 B; ties to the rarer first byte by a static text rank; not analysed above 2^18 instructions or 64 passes: no string). `regexec` answers NOMATCH when the bytes are absent from `subject[so..eo]` (a match lies there and holds them; `Byte` is a raw comparison in every locale and with ICASE). No block-format change (the field's meaning widens from "begins with" to "contains"; only `regexec` reads it). A pattern with back-references keeps the leading bytes only (as today): a NOMATCH from inner bytes would replace the budgeted engine's `REG_ESPACE` (test `sym_re_max_failures` caught it on the first run), an observable change not taken. Test knob `Options::accel` (`#[doc(hidden)]`, default all on; `Accel::OFF`): the oracle diff runs every case with it on and off against the oracle, the fuzz target `regex` checks prefilter against the engine alone. Bench rows `re_mt4_shared` / `re_mt4_distinct` (4 threads x 1024 searches, one shared or one regex_t each; owner ruling 2026-10-07 for the DFA series).
'''
