body = '''
**Secure memory** (owner requirement 2026-10-03; `LIELLA_NATIVE_1`, open until the first release). **`liella_secure_zero(ptr, len)`** is the one zeroing implementation (`conv::secure_zero`); `explicit_bzero` and `__explicit_bzero_chk` call it (the `_chk` keeps its size check) and the heap's wipe uses it. *Guarantee:* the `len` bytes are stored as zero before the call returns, even if never read again and even when inlined or link-time optimised; not covered: copies elsewhere (registers, spills, other buffers, swap) and ordering for other threads. *Mechanism:* Rust stores, then the address is passed to OD-C1's assembly barrier (`csys/src/machine/barrier.S`), which no optimiser can see into. *Errors:* NULL with length 0 does nothing; NULL with a non-zero length, or a length above `PTRDIFF_MAX`, is `-EFAULT` (`explicit_bzero` keeps its behaviour). *Proof:* `cargo xtask native` disassembles a fat-LTO build: dead-buffer zeroing by `fill(0)` and by a wipe without the barrier is removed, while `liella_secure_zero`'s 4096-byte zeroing stays, followed by the barrier call (a planted fault makes the step fail). **`liella_heap_alloc_secure(size, align)`:** alignment, size 0 and NULL conventions as `liella_heap_alloc`; the block reads as zero. It is a large block in a mapping of its own, marked secure in the large table (length-word bit 62: a side table). Every release (`liella_heap_free`, `free`, `cfree`, `__libc_free`, `realloc`/`reallocarray`/`liella_heap_realloc` moving it or with size 0, a free from any thread, a fork child freeing its copy) zeroes the whole mapping while the releasing call owns it, then unmaps it; it is never cached, reused or moved by `mremap`, so thread-exit caches, `malloc_trim` and a fork child's parking never hold one. `realloc` keeps the block secure, in place or moved (the old block zeroed). Secure mappings get `MADV_DONTDUMP` (best effort); no `mlock` (can fail under `RLIMIT_MEMLOCK`), no `MADV_WIPEONFORK` (would change what a fork child sees). Blocks still live at exit, exec or a crash are not zeroed (the kernel reclaims the pages). *Cost:* at least a page and three system calls per secure block; nothing for small blocks; one predictable bit test per ordinary large free (heap budgets met). **liella-native:** `secure::secure_zero(&mut [u8])` and `secure::SecureVec` (a growable byte buffer in secure blocks; `truncate`/`clear` zero the removed bytes at once; `Debug` shows only the length).
'''
