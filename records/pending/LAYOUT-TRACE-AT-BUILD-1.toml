story = "LAYOUT-TRACE-AT-BUILD"
date = "2026-11-13"
body = '''
**`cargo xtask so` traces its own build and groups from that trace, opt-in under `LIELLA_LAYOUT_TRACE=1`** (LAYOUT-TRACE-AT-BUILD, LT-1 of `plan/layout-rethink.md`, rulings #5190-#5194; amends nothing until LT-4 makes it the default). With the switch, `so` keeps `hot-text.pre-group.a`, finishes an ungrouped product from it into `target/product/<profile>/trace` (libc.a, liella-crt1.o), and runs `tools/hottext/regen.sh --replace --all-modes` on it: the probes and every `page_faults` mode the bounds of `hot_text_products.rs` count (true, locale, tool, then fork, strings, float, mktime, rebind appended after tool so the earlier first-touch order is unchanged; localtime and localtime_mktime through `probe_text.sh`). The four generated lists are written fresh into `target/product/<profile>/` and the archive is grouped from them; no list of an earlier build is read, so no function name crosses a build. The products carry `target/liella/.hot-lists` (the lists directory and each list's hash, so the layout verdict cache sees a list change); `layout-check` and `hot_text_products` read the lists it names; static checks, regen and repair keep the committed lists. A build without the switch removes the marker and is unchanged. Without a usable gdb (`gdb -batch` with Python) the build fails and names the opt-out; `LIELLA_LAYOUT_TRACE=ungrouped` builds an ungrouped product (ruling #5190) whose failed layout contracts are printed as a warning. The trace never feeds `LIELLA_BUILD_TAG` (crates/, csys/, include/ only): no second compile. `hot-text.absent` does not apply to a traced list; a `hot-text.clusters` key the trace lacks fails with a message naming it (LT-2 removes the class). \| Haswell-EP build host (the plan's host class), fast profile, relay harness, five runs each identical, next against trace: true 11/11, locale 51/49, tool 54/53, fork 5/5, localtime 19/17, localtime_mktime 19/17, float 4/3, 0-fault mktime/strings/rebind 0/0, puts 17/16, cat 23/23; hot group 0x93e4a/0x9380a bytes (545/484 sections). A re-trace gave byte-identical lists and a byte-identical libc.a. Trace-mode `so` with a warm cargo cache: 262 s against 233 s. The fast `tool` +1 of the plan's Haswell-EP measurement (52 -> 53) does not reproduce on today's next on the same host class: next reads 54 and the trace 53; release profile: see the story's report.
'''
