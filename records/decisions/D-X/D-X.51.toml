body = '''
**REJECTED (measured, reverted in HOTTEXT-ISOLATE-64K-2, 2026-11-10): no 64 KiB anchor before the hot group** (HOTTEXT-ISOLATE-64K, HOTTEXT-ISOLATE-64K-2; layout only; extends D-X.20; plan `handoff/layout-contracts-plan.md` 2c C2). The design tried: `cargo xtask so` added an empty input section `.text.sorted.h0` (sh_addralign 65536, SHF_GNU_RETAIN, both written in the section header by xtask, since objcopy 2.42 sets neither on a section it adds) to the `libc.a` member holding the first hot-text key, so GNU ld's `SORT(.text.sorted.*)` opened a static program's hot group at a 64 KiB fault-around window boundary; a probe link (GNU ld 2.42) showed an unretained empty section is dropped by `--gc-sections` and the retained one keeps nothing else alive. Measured on the next head against the change (Skylake-SP host, `hot_text_products` minor faults, fast / release): start-up only 18 -> 19 / 17 -> 18, setlocale + printf 56 -> 58 / 57 -> 61, coreutils-shaped tool 59 -> 61 / 60 -> 63, fork child 6 -> 6 / 6 -> 6, and `init_first_mktime_after_localtime_r_takes_no_fault` failed (fast) with a fault where none is allowed. The group did open on a boundary (start 0x40dbc0 -> 0x420000, fast) and its windows fell from 10 to 9, but the text before the group (the start-up object's `_start`, `.init` and cold text that start-up touches) shared the group's first window before and sits in a window of its own after, and the 64 KiB alignment of the text segment shifts the read-only data and data windows too. Size: static probe file +73 KiB (fast) / +116 KiB (release); `libc.so.6` +20 KiB / +82 KiB and one more executable LOAD segment (the aligned input section splits it). A later design that keeps the group's first window shared with the start-up code (for example the start-up object's own text sorted into the group) is the open route; see the saturation record of this story.
'''
