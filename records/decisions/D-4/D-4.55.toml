body = '''
**NULL folding in the 129-256 copy class** (NULLFOLD-COPY-MID, 2026-11-06; owner ruling #3304 (2026-11-06): "go ahead with your recommendation. On cold path I'd say the safety is worth it, but memcpy is about as hot path as it comes."; amends the option B scope of D-4.22 for copies, as D-4.52 did for compares: `memcpy`, `memmove`, `__memcpy_chk`, `__memmove_chk` and `mempcpy`/`__mempcpy` above 64, which call the same entry; the internal copy's `liella_machine_move_mid` never had NULL tests, D-X.15). With folding on, sizes 129 to 256 have no explicit NULL test in `machine/fold.S`: one class word (`liella_machine_move_long`, 256 while folding is on with the AVX2 build, 2^63 \| 256 with folding on and the SSE2 build, else 0; raised by `dispatch::store_cmp_gates` with the compare class words only while folding is on and dropped by `dispatch::drop_move_word` before the fold limit goes to 0 (NULLFOLD-COPY-MID-4: the startup `select`, before the lazy folding decision, no longer touches it; separate stores there had cost 16 user instructions per process, 2158 vs 2142 on the Zen 1 host), dropped before folding or the AVX2 flag goes off and raised after both are set; NULLFOLD-COPY-MID-3: the entry loads it once, its sign picks the body and the SSE2 path clears the mark before the size compare, so neither path also reads the AVX2 flag byte; a second load cost Ivy Bridge about 0.5 cycle on its port-bound SSE2 body) replaces the class's range test, both NULL tests and the build test (one compare where there were three test-and-branch pairs; TIMING-N100-COPY-MID: the NULL tests were the one-cycle gap on the N100 class). ORDERING REQUIREMENT (copies write, compares do not): the first access of the path is the load of `s`'s head block at offset 0, and every load of the class comes before its first store, so a NULL `s` faults on page zero before anything is written to a valid `d` (a partial write into a `MAP_SHARED` mapping would outlive the crash); a NULL `d` faults on its first store, at `d + 0`. Both touch only `[0, 256)`, inside the `[0, 64 KiB)` proof obligation of `dispatch`. Folding off (guard below 64 KiB, unreadable, or not yet decided): 129-256 tail-jump to `liella_hot_move_rest` (explicit S6 checks, EFAULT abort, as before; the copy then runs in `move_large`'s kernels), and the first copy of 1-256 bytes (was 1-64) takes the lazy folding decision. 65-128, memset and every other class unchanged. Assembly only (a NULL read is UB in Rust). Evidence: tests/small_copy.rs (every size 129-256, NULL `s`, `d` and both, memcpy/memmove/`__memcpy_chk`/`__memmove_chk`, SSE2 and AVX2 builds, folding on: SIGSEGV, off: abort; a `MAP_SHARED` memfd destination unchanged after each crash; existing copy tests for every size and alignment unchanged); plants handoff/NULLFOLD-COPY-MID-plants.txt.
'''
