body = '''
**Allocation hint and free groups; per-cache remote flag** (HEAP-HINT / HEAP-HINT-2, 2026-10-11). (1) A free into the current slab points the class's hint (`K_HINT`) at the bitmap word it freed into (LIFO: the next malloc takes that block, likely still in cache) and sets that word's group bit in `K_FREE` (one bit per four bitmap words, 64 bits cover a 256-word bitmap; `K_END` = the class's word count). A malloc whose hint word is full goes to `malloc_general` (which the frameless fast path already tail-calls; HEAP-HINT-3), whose `Heap::alloc_group` - as the slow path does for every other allocation - takes the lowest free block of the lowest set group, clearing groups found full (each set bit costs at most one scan of its words: no pathological input), and refills only when the mask is empty. Measured negatives (wl_count vs 39610e2): the group search inlined in the fast path made `malloc` save a register on every call (tar -c +0.40%, make-n +0.29%) though gawk-regex fell 2.6%; out of line it cost a call frame too (tar -c +0.73%, gawk-regex +0.5%). The 603a787 lowest-word second chance cost gawk-regex +0.35%. In the slow path itself (df6ab69) each such malloc paid the slow path's whole entry: gawk-regex +2.2%. A new current slab and collected remote frees set every group and restart the hint at word 0, so the lowest free block wins (compact slabs). Was: the hint moved only on search, then (603a787) a lowest-word second chance; gawk's regex sets free into three words and malloc them again, which left the fast path twice per input line in both (gdb: 4000 `alloc_slow` hits per 2000 lines, all malloc(8) from qset_construct). `K_FREE`, `K_HINT` and the local bitmap are written only by the owner thread (remote frees reach the local bitmap only through `collect`), so they need no ordering. (2) `C_REMOTE` (cache word 2): non-zero once a slab the cache owns may have a remote bit; the free fast paths (`free_hint`, `free_seg`, the fused `resize`) test it before reading the segment flag and the remote word. Never cleared. Happens-before argument: `free_remote` increments the slab's `R_REMOTE` (AcqRel; while non-zero the owner cannot release the slab, `after_free`), then reads `R_OWNER` (Acquire) and stores 1 into that cache's `C_REMOTE` (Release), then sets the remote bit; so if a remote free of block b happens-before the owner's later free of b (any program synchronisation; without one the double free is a race no allocator can order), the flag store and the bit happen-before the owner's relaxed loads, and write-read coherence makes both visible: the owner's fast path sees the flag, then the bit, and reports the double free. A slab adopted from a segment whose SEG_REMOTE flag is set (stale bits of an earlier owner) sets the adopter's flag (`adopt`). Conservative only: a set flag costs the old checks, never a wrong answer. Tests: crates/rt/tests/heap_and_sync.rs `malloc_reuses_blocks_freed_into_several_words`, `the_free_fast_path_finds_each_blocks_own_slab` ("remotely, then by the owner").
'''
