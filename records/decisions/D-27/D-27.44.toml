body = '''
**Lock-free loader readers, two loader locks and `fork` (phase 14 DL-16c; plan/ph14/dl-16-dlopen.md §4; implements D-27.1 and D-27.30 for `dl_iterate_phdr`/`_dl_find_object`; probes `tools/probe/dl/readers` R-1..R-4, P-7, P-8, P-9).** (1) **Reader table:** in a program Liella's `ld.so` started, libc's `dl_iterate_phdr` and `_dl_find_object` forward (`StartInfo::dl_iterate`, `dl_find_object`) to `ld.so`, which keeps one append-only static table of (bias, name, program headers) in chain order, apart from the `Loader` the writer mutates: readers never form a reference to writer state. A `dlopen` stages its objects' entries while invisible and publishes them with one Release store of the published length at the set's publication point (after pass 2, before the constructors, with the chain's `l_next` store), so a reader never sees an object whose relocation or IFUNC resolution is unfinished. The start-time entries are filled at the first reader or `dlopen` (nothing at start; racing fillers store identical words). Every read goes through `read_section`, empty until DL-17's reader epochs. (2) **Walk:** the program, the vDSO second, the start-time dependencies, `ld.so`, then the `dlopen`'d objects in load order; live (each step reloads the length and counters), so a callback that calls `dlopen` sees the new object later in the same walk, as probed (R-2). The callback runs with no loader lock held (ruling #2607): a `dlopen` in another thread proceeds meanwhile. `dlpi_adds` counts every object mapped (start objects, vDSO, each mapped `dlopen` object, also in a failed attempt), `dlpi_subs` every object unmapped (probed `== phdr`). (3) **`_dl_find_object`:** the whole `PT_LOAD` span of the containing object (probed R-1 for the program, libc and a `dlopen`'d object), its `PT_GNU_EH_FRAME`, its link map (the handle; 0 before the first `dlopen` makes the loader's nodes, and for the vDSO: gap). (4) **Locks:** the writer lock (re-entrant) is held for a whole `dlopen`, constructors included (P-8: a second thread's `dlopen` waits); inside it a re-entrant state lock is held only while the loader's state changes (no foreign code but IFUNC resolvers). `fork`'s prepare step takes the state lock before every library lock and releases it in parent and child; the child also frees the writer lock when a thread that does not exist there held it. So `fork` never waits for a constructor (P-9: `fork` returns while another thread's constructor runs) and the child can `dlopen`; it keeps every published object, those whose constructors the vanished thread was running included (P-9: listed, `RTLD_NOLOAD` finds them). (5) **Lock order:** loader writer lock -> state lock -> DL-15's thread-list lock -> loader arena lock -> the library's internal locks; a constructor holds the writer lock only and may call `malloc`, stdio, `pthread_create`/`pthread_join` and the loader itself.
'''
