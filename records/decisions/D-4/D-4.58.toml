id = "D-4.58"
section = "s04"
spec = "§4.3, §5.3"
ann = "PERF"
status = "active"
body = '''
**No 32-byte alignment of the strcmp / casecmp hot blocks (tried, reverted)** (TIMING-COV-STRCMP-NAMES-AVX2, -2). REVERTED: the timing hosts showed no gain on either target row (N100 A/B 1.000 and 0.999, Ivy Bridge flat), the Haswell-EP front-end counters were flat, and the N100 cold row `cbench_opt/second_strcmp` measured about 8 ns slower (62 -> 70-71 ns, two A/B runs: SLOWER at 1.6% spread, then NOISY); the Skylake-SP counter check did not run. The text below describes the change as tried; the kernels keep their earlier layout (`.p2align 4`). On Skylake-family cores a jump (or a fused cmp/test and jump) that crosses or ends on a 32-byte boundary keeps its 32-byte window out of the decoded-uop cache. Two hot blocks had one: the strcmp AVX2 first block (`.Lstrcmp_v_first`, fused page test cmp/ja, every short AVX2 call) and the casecmp_ord_avx2 second 32-byte block (`.Lcord_head_next`, fused test/jnz, every strncasecmp of n <= 64 that passes 32 bytes). Both blocks start on a 32-byte boundary (`.p2align 5`), placed after an unconditional jmp so the padding never runs: no instruction added. Measured on the Skylake-SP role host: dsb2mite switch penalty cycles and instructions per call in the hand-back. Other boundary jumps in these kernels (SSE2 head, loops, cold exits) are unchanged; a build-wide assembler option (`-mbranches-within-32B-boundaries`) was not taken: it changes the layout of every kernel and adds nops on fall-through paths.
'''
