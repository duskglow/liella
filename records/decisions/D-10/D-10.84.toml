body = '''
**`erf`/`erfc` (`double`) quick phase** (LIBM-F64-SPECIAL-QUICK, under D-10.51 and D-10.13): the C entries' in-place path (`hot::erf_nearest`, `hot::erfc_nearest`) runs a quick phase inside `fast_special::erf_nearest` / `erfc_nearest`'s own `\|x\| >= 2^-5` table branch (one range check shared with the table path, so the series path and `erfc` above 1 see no added compare; LIBM-F64-SPECIAL-QUICK-2), then the unchanged table path, then the accurate path. Quick domain: `erf` on `2^-5 <= \|x\| < 6`, `erfc` on `(−6, 1)` with `\|x\| >= 2^-5`. Method: the existing `ERF_T` Taylor rows (no new table) evaluated to degree 12 instead of 14 with one exact product in place of four double-double steps; the polynomial split by Estrin's scheme (Knuth, TAOCP vol. 2, 4.6.4) into three independent Horner chains joined by `t⁴`, so the critical path is about half the degree-12 Horner chain; `P0 + P1·t` exact by one product and Fast2Sum (Dekker 1971), the low parts summed before `t²·r`. Bound: `RHO_ERF_Q = 2^-62` relative (largest slot 2^-62.017) (erf, erfc below 0) and `RHO_ERFC_Q_LOW = 2^-61` (2^-61.55) (erfc on `(0, 1)`, `1 − erf`'s absolute error over `erfc`'s least value per slot), proved per slot by the generator's `quick_bound` (truncation by Cramér's inequality, Abramowitz and Stegun 22.14.17; every operation counted as a rounding, valid for both builds) and asserted by `special_tables::quick_tests`. Rounding: the one-sided constant test `fast64::near` (de Dinechin, Lauter & Muller, RAIRO-ITA 41, 2007) with the least multipliers for those bounds (checked exactly in `fast_special` tests; the test also runs ten of the phase's hard cases, operands whose quick `(zh, zl)` lies on or within 2^-12 ulp of a midpoint with the exact value on its other side, found by a 2^28-operand search: about 1 in 69000 operands). Profile before (Zen 1 build host, instructions per call, Liella / glibc): FMA erf table 162 / 159, SSE2 235 / 174 (the SSE2 build ran four Dekker products and a degree-14 chain). Not in this decision: `erfc` above 1 (`e^(−x²)·Y`), `erf`'s series below `2^-5`, lgamma/tgamma and the Bessel functions (LIBM-F64-SPECIAL-QUICK-2).
'''
