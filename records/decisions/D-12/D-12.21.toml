id = "D-12.21"
section = "s12"
spec = "§12.6"
ann = "PERF"
status = "active"
body = '''
**Each stream caches the plans of the last two formats printed to it (PRINTF-STAR).** `vfprintf` (the `fprintf`/`printf` family on byte streams) looks the format up in the stream record's two-entry cache under the stream's lock before parsing: formats of 1..=40 bytes are keyed on their length and then their BYTES (an inline word compare, tail first), never on the address alone (callers rewrite format buffers in place); a hit hands the stored simple plan to the renderer (no `simple_into`), or routes a known non-simple format straight to the general path; a miss parses and replaces the older entry. `%s` alone keeps its own path; registered conversions bypass the cache as before. WHERE IT LIVES (PRINTF-STAR-2): not in the record - the record holds an address and a call count (`PlanSlot`); the cache (~220 bytes, internal heap) is made on the stream's 8th formatted call (earlier calls parse as before; an allocation failure retries 8 calls later) and stays with the stream's slot for the process's life, across `fclose`/`freopen` (keyed on bytes, so not state): nothing is ever freed, so no stale address can exist. Why: inline, the slot grew from ~660 to 880 bytes and left the 768-byte heap class it shares with start-up allocations; every process then paid ~2.7k instr:u and 2 page faults (printf-loop +1.0%, 20k starts; an A/B with the cache present but never filled measured the same, so the fill was ~0). A const assert in `stdio.rs` keeps the slot <= 768 bytes. The threshold 8 is a local choice (a one-shot printer such as coreutils `printf` makes 2-3 formatted calls). Cost: 16 bytes per stream record, ~220 bytes per busy stream, nothing per thread. String sinks (`snprintf` family) have no stream record and are unchanged. Effect (Zen 1 instr/call, wl_percall): tar's `"%s %s/%s %*s %-*s"` 2265 -> 1621 (glibc 1513), `"%s %d %x\n"` 1412 -> 1201 (1200), `"%-8s %5d %*d\n"` 1790 -> 1353 (1506). Safety: the unit tests compare every cache answer with a fresh parse of the same bytes (hits, misses, same-length formats, a buffer rewritten in place, the length limit) and the byte compare at every position of every length; planted bugs (length-only key, General answered as Simple, middle words skipped, 4-byte head skipped) fail them.
'''
