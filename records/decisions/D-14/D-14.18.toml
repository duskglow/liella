body = '''
**search, random and config cores** (COLD-REWRITE-W-far-02, 2026-10-14; record `liella-historic:handoff/decisions/COLD-REWRITE-W-far-02.md`; D-14.1-D-14.3, D-9.3, OD-13, D-1.8). *qsort:* stable top-down merge sort of the elements' positions (QSORT-C-COMPARATOR, 2026-10-22): the comparator gets the elements where they lie (C17 7.22.5: pointers to elements of the array), the array is written only after the last comparison (a throw leaves it untouched), runs of 8 by binary insertion, one comparison skips merging ordered runs, only the left half copied out, positions held as byte offsets (no multiply per comparison) and strictly descending runs and ranges detected and reversed, so descending input costs n-1 comparisons (QSORT-MERGE-INDEX), 1.5n words of positions (up to 1 KiB on the stack), then one cycle-walking pass moves each element once, in pieces of up to 64 bytes; arrays of up to 8 elements (4 above 64-byte elements) by insertion in place; without memory, merge in place by rotations, O(n log^2 n), never fails (D-14.1). *bsearch/lfind:* halving loop with a shrinking count. *tsearch family:* AVL with the height in the node (shorter paths than red-black; lookups pay a callback per comparison), a path stack (depth bound 96), one retrace stopping at the first unchanged height; a two-child delete relinks the nearest key from the taller side (keys never move). *hsearch:* linear probing, slot by multiply-shift (any capacity; the first segment stays prime, s14_5_i_0), no tombstones; hash folds 8 bytes per step with the length in the seed; growth by a segment chain (stable `ENTRY*`, D-14.3), new segment 2x+1 when the newest is 3/4 full, lookups newest first, ENOMEM only when no slot is left. *random:* kernel fill loops on short reads and EINTR, zero bytes is EIO; `uniform` is multiply-shift with a rare redraw; Rng48 bit-exact in wrapping 64-bit arithmetic; the additive-feedback and `rand_r` sequences are Liella's own and documented (OD-13), unchanged and pinned; damaged `setstate` headers fold into range. *config:* one tunables iterator and one number parser (later valid setting wins, invalid ignored; the `_Usable` suffix matched case-insensitively); a line reader that cuts `#` and trims blanks.
'''
