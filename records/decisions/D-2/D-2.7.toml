body = '''
Written under the clean-room rules of §1.4 in a fresh session, from the spec, the psABI and DWARF (normative references), `spec/behaviour/backtrace.md` and black-box probes. **Internal:** `backtrace` unwinds with Liella's own DWARF call-frame unwinder (IP-27; no `dlopen` of `libgcc_s`), so it and `backtrace_symbols_fd` are async-signal-safe from the first call (observable, stricter): no allocation, no lock, no initialisation. Registers are captured by the `getcontext` primitive in a never-inlined boundary function; that frame, and the export's own frame when it has one (identified by its FDE start), are left out. Objects searched: the executable (`AT_PHDR`) and the library's own image (`__ehdr_start`). Call-frame information is found through `PT_GNU_EH_FRAME` (binary search), or, in a static executable (linked without `.eh_frame_hdr`), by scanning `.eh_frame` between the start object's label `liella_eh_frame_start` and a terminator in `.eh_frame.liella_end` (`adapter/runtime.c`). The signal restorer carries call-frame information with `S` (CFA = `%rsp` = the kernel's `ucontext_t`, registers from `uc_mcontext`); `_start` marks the outermost frame. **Boundary:** `backtrace_symbols` returns one caller-owned block holding the pointer array, then the texts; texts are `argv0(+0xOFF) [0xADDR]` for an address in the executable (OFF = address − load bias, also for non-PIE and static programs, where glibc prints `()` or nothing), otherwise `[0xADDR]`; no symbol names (the static product has no dynamic symbols). `_fd`: the same without the space, newline-terminated, one `writev` per frame, stopping at the first failed write with `errno` set. A negative count is 0 for all three (glibc's `backtrace_symbols` crashes). Limits: objects other than the executable and the library image are not discovered until `dl_iterate_phdr` exists (phase 14); a seccomp policy denying `process_vm_readv` gives 0 frames. Spec note: §2.7's edge case about `dlopen` of the unwinder and its Kernel line describe the reference; Liella uses `getpid`, `rt_sigprocmask`, `process_vm_readv` and `writev`.
'''
