body = '''
One renderer, `boundary::report::report`, behind the `err`/`warn`/`error` C adapters (`liella_report7`) and the `v` exports (rewritten under §1.4, item 6, in a fresh session from the spec, `spec/behaviour/diagnostics.md` and black-box probes). `warn`/`err` print `short: msg: text` (`short: text` for a NULL format); `warnx`/`errx` print `short: msg`; `err`/`errx` then `exit(status)`. `error` prints `full: msg[: text(errnum)]` (a NULL format counts as empty); `error_at_line` prints `full:file:line: msg[...]` with the line unsigned (glibc prints it signed), and as `error` for a NULL file. `short`/`full` are `program_invocation_short_name`/`program_invocation_name` (NULL prints `(null)`). The message is formatted first (so `%m` sees the caller's `errno`), then `stdout` is flushed (the `error` forms only), then one write through `stderr` (wide streams through their codec; an unoriented stream becomes byte-oriented). `error_message_count`, `error_one_per_line` and `error_print_progname` are exported data read on each call (F6): the hook, when set, replaces the name prefix (the BSD family ignores it); the count counts each message printed; while `error_one_per_line` is set, `error_at_line` skips a message whose file name (compared as text; at most 4096 bytes remembered) and line equal those of the previous `error_at_line` call made while it was set, and a NULL file clears the remembered location. A non-zero status exits even when the message was suppressed (glibc returns, undefined behaviour for callers of the header's `noreturn` form). `errno` is left as the caller had it, except that a failed write stores its error. Spec gaps found (§2.3 is silent): which name each family uses, the NULL-format layout, when the previous location is recorded, and a suppressed message with a non-zero status.
'''
