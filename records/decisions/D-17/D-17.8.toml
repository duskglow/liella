id = "D-17.8"
section = "s17"
spec = "§17.5, §17.5a"
ann = "HIST, ARB"
status = "active"
body = '''
`getlogin`: the audit login UID through the user database, otherwise the utmp `LOGIN`/`USER` record for the session's terminal, which is the first of fds 0, 1 and 2 that is a terminal (glibc uses stdin only, which its man page calls a bug); `ENXIO` with no terminal, per the spec (glibc: `ENOTTY`); `ENOENT` with no record. `ttyslot`: `/etc/ttys` entries counted from 1, matched on the path below `/dev` (glibc compares the last component only); 0 when not found (the spec does not define the terminal table; approved by the owner 2026-10-03). `getpass`: `/dev/tty`, else stdin with the prompt on stderr; echo off (TCSAFLUSH) and restored; a newline after the line when echo was off; a **bound, never a truncation** (owner 2026-10-04, replacing the "no length limit" of 2026-10-03): at most 1 MiB of input before the newline by default (chosen by the coordinator: absurdly large for a pass phrase, but finite, so a runaway input cannot exhaust memory), changed per process by the native `liella_getpass_set_limit(bytes)` (LIELLA_NATIVE_1; the previous bound is returned; 0 restores the default; above `PTRDIFF_MAX` `EINVAL`; inherited by `fork` children, reset by exec). A longer line is read to its newline (or the end) and discarded, and `getpass` returns NULL with `EOVERFLOW` (POSIX's error for a `getline`/`getdelim` line beyond its bound; getpass(3) lists only `ENXIO`; a truncated pass phrase would be a wrong answer). Every buffer of the library's that held the line (the line buffer, before each growth and when dropped; the terminal read chunk; the previous result block when replaced; the result block before each new line) is zeroed with D-X.11's `secure_zero`; a stream's own buffer (standard input's, when there is no terminal) belongs to the stream and is not touched. The spec's HIST note "the length is limited" was corrected under the three-way rule (glibc probe: a 3 MiB line returned whole; getpass(3) NOTES: "There is no limit on the length of the password"). `setlogin`: `ENOSYS`. Shells: a line must start with `/` after white space and ends at white space or `#`; a missing `/etc/shells` lists `/bin/sh` and `/bin/csh`, an empty one nothing (observed).
'''
