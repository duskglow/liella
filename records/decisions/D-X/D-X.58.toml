body = '''
**Liella's thread-block words at 0x9c-0x17f are read and written only in blocks the runtime made; the test is the process-level fact `owned()`, never a word in the block.** A block another C library's loader made (a test process's threads, a program under another `ld.so`, D-22.10) uses those offsets for its own data, so a word there is never a pointer or a decision for Liella. `owned()` is a hidden byte (`liella_machine_owned`, machine/points.S) that `init_initial` sets when the runtime starts the process: Liella then creates every thread, so every block that runs library code is its own. Rust and the asm cancellation-point entries (read, write, pread, pwrite, close) test the same byte (a `cmpb` and a branch, about 2 instructions per gated path; in the TID fast paths it replaces the 0x9c test). `FLAG_OWN` is still written in Liella's blocks and read nowhere. Elsewhere `thread::words()` gives the calling thread a block-shaped area of its own: an entry in a registry of 64-entry chunks (anonymous mappings, never unmapped) keyed by thread pointer with linear probing and holding the kernel TID. Another TID at the same pointer is a new thread on a reused block (empty words), except for a thread whose TID is the process ID: a process's first thread meets an entry keyed by its pointer only as `fork`'s copy, so a forked child keeps its parent thread's words whichever library's `fork` ran. A thread `create` made keeps its words in its own block (`claim_own` to `release_own`). With no chunk mappable (ENOMEM) every foreign thread shares one static spare of atomics (memory-safe; its state is then process-wide, and its resolver state is never freed). Options considered: (1) the process fact, chosen: safe by construction, about +2 instructions; (2) a value only Liella writes at 0x9c (tp XOR a secret): +3 instructions, and a program can plant it; (3) a registry lookup on every access: a lock or walk per call (it is the foreign-only slow path); (4) ELF TLS for the foreign words: exact per-thread semantics but adds PT_TLS to libc (ruling #4212: only if the foreign path's cost ever matters, decided with phase-14 TLS). Out of scope: the words at 0x80-0x9b (TB-FOREIGN-WORDS-LOW, ruling #4213) and the period cache at 0x140 (the WCTYPE-TRIE-FILE chain, #4214). Tests: crates/boundary/tests/tb_foreign_words.rs (decoys in 0x9c-0x17f with bit 0 of 0x9c set: answers correct, nothing written), s07 `foreign_thread_words_kept_in_forked_child`, conformance/c/tb_period_cache.c (the period words in a process the runtime started, across a thread and a fork).
'''
