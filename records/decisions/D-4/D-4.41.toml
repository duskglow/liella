body = '''
**Equality kernel for `__memcmpeq`** (MEMCMP-EQ; carved onto main by MEMCMP-SPLIT, 2026-10-10) \| `__memcmpeq` calls `hot::equal_bytes`: 0 equal, 1 unequal (§4.3 equality only; glibc's non-zero values carry no order either, probe 8bcfded6924a), no first-difference search. Classes as D-4.23 up to 128 B (overlapping loads from both ends, every load issued before the one test, XOR-OR words below 16 B; AVX2 33-64 B two and 65-128 B four 32-B blocks); above 128 B the tail chunk first (early reject, owner preference EQUALITY EARLY REJECT), then chunks from the start, one test per 64 B (SSE2) / 128 B (AVX2); NULL with n > 0 keeps the explicit S6 abort (no folding, ruling option B). Local decisions: the unequal value is 1; n == 0 returns 0 without touching the pointers (as before). `memcmp` and `bcmp` stay on the ordered kernel unchanged (D-4.23; coordinator decision: the ordered rework of opt/memcmp-eq lost rows on Ivy Bridge's SSE2 path and moves to MEM-ENTRY; `bcmp` onto the equality kernel remains RULING NEEDED, glibc's bcmp returns the order). \| MEMCMP-EQ-3 / MEMCMP-SPLIT: budgets.tsv gains report-only `ratio_host` rows (no host limits) for the `__memcmpeq`/`bcmp` shapes (equal, first byte differs, last byte differs; 8-1k) and `memcmp_diff8_*`. Safety lives in `small_compare` (every size and position against the oracle in both builds, every position of the long class 120-1100 B at three alignment pairs) and planted bugs: SSE2 tail chunk skipped, SSE2 head chunk skipped, AVX2 65-128 B last block wrong, 65 B sent to the 33-64 B class, SSE2 65-128 B block 48 dropped (MEMCMP-SPLIT report). ORDERED PART merged in B42 from opt/memcmp-eq (**(ordered part) Head-first probe in the ordered compare** (MEMCMP-EQ / MEMCMP-ORDER on opt/memcmp-eq, merged in B42; the `__memcmpeq` kernel itself is the D-4.41 row above, MEMCMP-SPLIT, whose `eq_mask` the merge kept)): `__memcmpeq` calls `hot::equal_bytes`: 0 equal, 1 unequal (§4.3 equality only; glibc's non-zero values carry no order either, probe 8bcfded6924a), no first-difference search. Classes as D-4.23 up to 128 B (overlapping loads, one test, XOR-OR words below 16 B); above 128 B the tail chunk first (early reject), then chunks from the start, one test per 64 B (SSE2) / 128 B (AVX2); NULL with n > 0 keeps the explicit S6 abort (no folding). `memcmp`/`bcmp` (ordered): the 33-128 B classes test the first block alone first (16 B SSE2, 32 B AVX2) and order a difference there at once - WL sort -C calls memcmp with n 64-127, first difference at 8-31 (ARG-HIST); the rest ANDed as before, `blocks_order` resumes after the probed block. Local decisions: __memcmpeq's unequal value is 1; n == 0 returns 0 without touching the pointers (as before). `bcmp` stays on the ordered path (glibc's bcmp returns the order; switching it to the equality kernel is RULING NEEDED in the MEMCMP-EQ report). Evidence: MEMCMP-EQ MEMCMP-EQ-3: the head probe is folded into the class's one test (all blocks ANDed first; only an unequal result looks at block 0 to order it at once), so equal inputs pay no instruction for it; `memcmp` and `bcmp` compile to byte-identical code at equally aligned entries (Zen 1 disassembly), so a bcmp-only row move is the bench, not the kernel; budgets.tsv gains report-only `ratio_host` rows (no host limits) for the `__memcmpeq`/`bcmp` shapes and `memcmp_diff8_*`. MEMCMP-ORDER (amends): an unequal block class no longer re-reads the bytes (the old `blocks_order` pass reloaded 16-byte blocks one by one, and a 16-32 B difference went out of line for it): the same equality vectors become bitmaps of differing bytes (head bits, tail bits moved up to the tail's offset, or head-then-tail for 65-128 B), one `tzcnt` gives the first difference, `order_at` orders that byte pair (equal on the re-read: a writer changed the text, so the D-4.21 rescan, counted, byte by byte from that index + 1, decides - MEMCMP-ORDER-2; before it the long class fell to the checked path, which did not report the rescan and failed `scanners_rescan_when_a_signal_handler_changes_the_text`). Safety in the chain for a reported index that is too LOW (it lands on an equal byte and the rescan answers right, only slower): `small_compare`'s `each_build` requires the rescan count to stay 0 on stable text (plants sse2-k2 and avx2-long one low: RED). New long class 129 to `CMP_LONG` = 2048 B inside the kernel (out of line behind the 65+ NULL test): 64 B (SSE2) / 128 B (AVX2) chunks from the start, one test each, the last ending at `n`; above 2048 the checked path's scanner (its large-size rows were at or under parity, not re-measured here). 8-15 B and 4-7 B: the deciding word is picked first (cmov), then two byte swaps and one 64/32-bit order instead of four swaps and a 128/64-bit order. Safety lives in `small_compare` (every position at three alignment pairs up to 2100 B, both builds) and eight planted bugs, one per class path. MEMCMP-ORDER-3 (amends): the long class (129-2048) tests block 0 (16 B SSE2, 32 B AVX2) once before its chunk loop (not per chunk), an unequal head ordered at once; the 33-128 B classes keep the one combined test (a separate block-0 probe there cost equal rows a cycle on Haswell-EP, bcmp_eq_64 2.66 -> 3.07 ns, since all loads issue together anyway). Unequal outcomes pick head bits, else tail bits plus the tail offset by a branch instead of a variable shift (`shl %cl`: 3 uops on Intel, see D-4.35's Zen 1 finding). Planted bugs (Zen 1 small_compare): sse2 16-32 tail -1, sse2 long probe +1, avx2 33-64 tail -1: all RED; restored green. Amendment MEMCMP-FOLD (owner ruling 2026-10-10, as D-4.23's): `bcmp` and `__memcmpeq` are the direct equality entry `liella_machine_equal` in fold.S: with folding on, 8 <= n <= 64 compare the first 8 bytes there (different: 1; a NULL faults), equal heads tail-jump to `liella_hot_equal_tail` (the 8-15 last word, else the classes of `ne_small`), everything else to `liella_hot_equal_rest` (checked, S6 abort).
'''
