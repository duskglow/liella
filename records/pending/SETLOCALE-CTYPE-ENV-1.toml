story = "SETLOCALE-CTYPE-ENV"
date = "2026-11-13"
body = '''
**A repeated `setlocale(cat, "")` that selects the names the categories already have is answered without the lock, and its one walk over `environ` reads only the variables the selection needs, stops at a non-empty `LC_ALL`, and reads each candidate entry once** (SETLOCALE-CTYPE-ENV, #5154; spec s7_1_c_0, s7_2_c_4; no ABI or behaviour change: the environment is still read on every call, only the selection and the copies are skipped). Profile of call 11 of the `LC_CTYPE ""` row before (wl_trace, release, Skylake-SP host, next 19c0ea167): 9,562 instructions, of which about 8,500 were the environment walk inlined into `setlocale` (`strnlen` 1,827, `machine_equal` 1,017, the walk itself most of 5,672): the fourteen `LC_*`/`LANG` names all start with `L`, so every entry starting with `L` was measured and compared once per name, and the walk always ran to the end of the environment because `LC_PAPER` and the like are seldom set. The selection itself was already skipped for a kept name (`replace_changed`, D-X.83); the locked path (copy of the global locale, `Locale::eq`, the query cache) was the remaining ~1,000. Changes: (1) `environ::getenv_many` reads an entry past its first byte once, as far as the longest name, its `=` and one value byte, finds the entry's first `=`, and compares only a name of that length (a name holding a `=` keeps the full compare: same answers as `getenv_bounded`, unit test `k_getenv_many_answers_as_getenv_bounded`); a `decisive` mask stops the walk at a non-empty value for a marked name; (2) the boundary asks for `LC_ALL`, `LC_<cat>` and `LANG` only for one category (all fourteen for `LC_ALL`), with `LC_ALL` decisive; (3) `global_locale::setlocale_env_kept` resolves each category's name from those values as `setlocale_locked` does and, when every one is the current name (`"POSIX"` compared as the `"C"` it reports, D-X.80), returns the query cache's answer for that global locale; anything else goes to `setlocale_locked` as before. Considered and not taken: remembering the environment between calls (`environ` may be changed by the program without any library call, so a memo cannot be trusted; the brief requires a read per call). Test: `crates/boundary/tests/setlocale_env_repeat.rs` (LANG and LC_ALL changed between two calls are seen; "" again within 400 per call of the query again).
'''
