id = "D-5.6"
section = "s05"
spec = "§5.3, §4.3, §14"
ann = "PERF"
status = "active"
body = '''
**ASCII case folding without tables where the locale allows it** (PJ-23, D-5.5 follow-up; local decisions, no observable change). (1) `CtypeFile::parse` computes once per loaded `LC_CTYPE` a flag `ascii_case`: the byte maps (`tolower`/`toupper`) and the wide maps (`towlower`/`towupper`) of every character 0..127 are ASCII's. Built-in `C` and `C.UTF-8` always qualify (Unicode's simple case maps of U+0000..U+007F are ASCII's). `tr_TR` (Turkic `I`/`i`) does not, and keep the table path everywhere. The flag deliberately covers case maps only, not class masks: no fast path reads classes (`is*` is one load through the per-thread word since D-5.5), so a class difference must not disable folding. (2) Where it holds, `to_lower`/`to_upper` and `wtrans` (Lower/Upper) of a character below 128 use arithmetic instead of the file tables (`wtrans` used to re-parse a 3-level table header per call); `fnmatch` `FNM_CASEFOLD` and `REG_ICASE` gain through these. (3) `strcasecmp`, `strncasecmp` and the `_l` forms call `ctype::compare_folded`: with the flag, `bytes::compare_text_ascii_folded` compares 8 bytes per step in safe Rust (SWAR): equal words are skipped, ASCII words are lowered arithmetically, a differing word with a byte >= 128 and the tail go through the table fold byte by byte. Answers are the per-byte table fold's in every locale (differential tests: `bytes_exhaustive::ascii_folded_compare_equals_the_per_byte_fold`, `locale_data::ascii_case_flag_and_fast_folding_match_the_tables` over en_US.UTF-8, de_DE.ISO-8859-1, tr_TR.UTF-8, tr_TR.ISO-8859-9). Cost: one `bool` per loaded `LC_CTYPE` (per process), 512 table reads once at load; nothing per thread. Considered: AVX2 (32 bytes per step) needs assembly in csys/ (plan S2/S3): not proposed, see PJ-23 report for the measured share; fusing the two `strlen` scans of the operands into the comparison needs reads past the terminator (unsafe, page-crossing): not done.
'''
