body = '''
**No fixed program-size cap; the process's limits are the bound** (owner ruling #5594 and principle "protect from malice, not from themselves", 2026-11-14; REGCOMP-FALLIBLE-ALLOC, -2). Amends D-14.8 (and the size bound it took from D-14.4): `regcomp` no longer refuses a pattern for its size alone. The former caps, 2^20 instructions and 2^21 matcher states, are removed. What remains is a representation guard: node ids are `u32` below `NONE`, so a program whose state count would pass `u32::MAX` answers `REG_ESPACE` (found while the instructions are emitted, before any table is built; about 65,000 nested `( )*` levels), and the node bases are summed with checked additions, never a wrap. Every allocation of the compiler and of the matcher is fallible (`TryVec`, `InlineVec`, the search's scratch pools, the thread's blocks, `caller_alloc`): when one fails, `regcomp` answers `REG_ESPACE` and releases its partial work, and `regexec` answers `REG_ESPACE` and leaves the program usable. The audit (REGCOMP-FALLIBLE-ALLOC run 1, handoff/regex-fallible-alloc.md) found no infallible growth to convert. So the bound is whatever the process allows: `RLIMIT_AS`, `RLIMIT_DATA`, a cgroup's memory limit. With no limit and the kernel's default overcommit, a pattern that needs more memory than the machine has can end the process through the kernel's OOM killer, as with the reference. In-process harnesses that must bound their own work (the fuzz targets, the oracle comparison, the fuzz-seed replay test) compile with `compile_limited(.., HARNESS_MAX_NODES)` (2^21 states), the former cap, as their own choice. The required-bytes prefilter keeps its own 2^18-instruction bound: past it the analysis is skipped, and no pattern is refused. Measured (Skylake-SP host): `((a)*)*` nested 3000 deep compiles and matches without a limit, and under `RLIMIT_AS` the depth-3000 patterns, `a` with 24 stacked `{2,}` and 20 nested `{1,2}` answer `REG_ESPACE` with no signal (spec/behaviour/regex-nesting-depth.md). In the same child, `regexec` with subexpressions on a depth-1446 program answers `REG_ESPACE` when its scratch does not fit, and the same program then still matches without subexpressions.
'''
