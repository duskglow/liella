body = '''
**REJECTED (memcpy_256 measured slower; coordinator ruling #3608, 2026-11-06; reverted in SSE2-COPY-MID-SPLIT-2): the SSE2 129-256 copy keeps eight 16-byte blocks from each end for every size (D-4.55's body as on next).** Proposal (SSE2-COPY-MID-SPLIT, 2026-11-06; coordinator ruling #3587: land the copy half of ruling #3421's provisional 129-192 split, measured in TIMING-IVB-MEMREF-ENTRY-2): in `csys/src/machine/fold.S`, after the folded class gate of D-4.55, `.Lmove_129_sse2` compared n with 192 and for 129-192 loaded [s, s + 96) and [s + n - 96, s + n) (12 loads, then 12 stores), above 192 the eight-per-end body. Every load preceded the first store, so D-4.55's NULL-folding invariants held. Why it was tried: the SSE2-only hosts retire one store per cycle, so 16 stores looked like the 129-192 copy's floor (6 instructions fewer per 129-192 call; the 193-256 calls gain one compare and branch). Outcome (whole cbench_memref, `bench --stage` trees next vs head, 4 interleaved alternations x 5 rounds, paired ratio head / next; Ivy Bridge / Alder Lake-N at hwcaps=-AVX2): memmove_144 0.828 / 0.851, memmove_192 0.853 / 0.845, memmove_256 1.000 / 1.000, but memcpy_256 (the statx size) 1.155 / 1.077 with 193-256 taking the branch and 1.045 / 1.077 with it falling through the compare (memcpy_144 then 1.044 on Ivy Bridge), so the condition "the _256 rows hold" of rulings #3421 and #3587 fails. The fill half (memset) was rejected earlier on memset_256 (Ivy Bridge 1.117, Alder Lake-N 1.089; TIMING-IVB-MEMREF-ENTRY-2). Both halves are NEGATIVE rows in the saturation register (section 3). The code, the `small_copy` test moves_of_128_to_193 (every size 128-193 at every overlap shift, each build) and the cbench_memref 192 size rows stay on branch task/sse2-copy-mid-split (commit fb8480f9) for reuse; plants handoff/SSE2-COPY-MID-SPLIT-plants.txt. Not tried: the memcpy_256 cost was not profiled (the compare, or the 8-block body's new address, is suspected); a retry needs that profile first.
'''
