body = '''
**Layout contracts: one manifest, checked when the products are built** (LAYOUT-MANIFEST, 2026-11-07; tooling only, no ABI or behaviour change; plan `handoff/layout-contracts-plan.md` 2a A1+A3, 2b B1, 2d). Every deliberate code or data layout of the products is a row of `layout/contracts.tsv` (`id kind subjects rule reason decision`). `cargo xtask layout-check [<products dir>]` (`xtask/src/layout.rs`) checks each row on the built products by its kind, calling the existing checks: fn-align (`align::misaligned`, D-4.33), classed-xref (`classed::check_file`, D-X.34), jcc (`jcc::check_archive`, D-4.67), section-rename (`.bss.*` of `coldbss::MIN` bytes or more renamed `.lbss.*`, D-X.22), object-window (the object's section, and offset modulo min(section alignment, window) plus size within the window, so no link can place it across one), object-align, section-offset and label-align (the entry symbol's section alignment and the instruction `objdump` shows at entry + offset; label-align also the offset modulo the alignment; D-4.56, D-4.63), remap (`remap::check_dir`). A failure prints `layout: <ID> BROKEN: <symbol or section>: <what moved>: <rule> (decision <D-row>)`; an unknown kind, a subject absent from the products, or a rule value that differs from the constant the existing checker holds is an error, never a skip. `cargo xtask so` runs it after the last product of either profile, replacing its direct calls of `align::check`, `classed::check_file`, `jcc::check_archive` and `remap::check` (their own subcommands and static checks stay). `static` (also `layout-check --static`): every row's kind is known and its decision is a row of `plan/07-decisions/`; every `LAYOUT(<ID>)` tag in `crates/` and `csys/` names a row and sits on, or in the comment lines directly above, a `.p2align`/`.balign`/`.align`/`.org`/`align(` line (a deleted tagged directive fails); every row of a kind with a source site (classed-xref, object-window, object-align, section-offset, label-align) has a tag; rule d: with the changed files as `affected` reads them (`.changed` in a role tree), a removed row or a changed kind, subjects or rule fails without a change under `plan/07-decisions/` (in a tree without history any change to the manifest needs one). Rule d as a static failure awaits the maintainer ruling (RULING 1 of the plan); tightening a rule is a local decision row, loosening one or removing a row is an owner ruling. STARTUP-NAMES-WINDOW (TIMER-SIGEV-THREAD-NOSPAWN-4), GETTEXT-SLOTS-PAGE (GETTEXT-HIT-3) and PRODUCT-PATH-REMAP had no decision row and are recorded under this one. | Unit tests in `xtask/src/layout.rs` (manifest parse, D-row and kind errors, rule d, tag placement, readelf and objdump parsing); `cargo xtask layout-check` on fast-profile products (all 10 hold; the release profile was not built here); plants in `handoff/LAYOUT-MANIFEST-plants.txt`.
'''
