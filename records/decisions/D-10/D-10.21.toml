body = '''
**Complex forwarders of `long double`, `_Float64x` and `_Float128`** (milestone 5, MATH-M5-CPLX-FWD). Rust cannot name `long double _Complex` (psABI class COMPLEX_X87: passed in memory, returned in `st(0)` real and `st(1)` imaginary) or `_Float128 _Complex` (32 bytes, memory both ways), so `cargo xtask math-gen` emits C forwarders into `csys/src/adapter/math_*.c` as for the real members (OD-C4, no assembly, #830): the C compiler handles the convention and converts through a union to `struct liella_ldc_bits`/`liella_f128c_bits` (two bit structs, real part first), which the Rust side receives and returns as `mathret::Complex<LdBits>`/`Complex<F128Bits>` (the `CPart` trait maps each part to its `liella-math` format). The exact members (`creal`, `cimag`, `conj`, `cproj`) are bit-identical to glibc, flags and `errno` included, on every encoding (x87 invalid encodings too); `cabs` is `hypot` and `carg` is the x87 `atan2` (`cargf128` waits for `atan2f128`), correctly rounded in every mode. `hypotl`/`atan2l` (and so `cabsl`/`cargl`) take their NaN by the x87 unit's rule as glibc does, through the general rule every x87 operation follows (`fused::nan_operands_by` with `Pick::X87`, X87-NAN-RULE-AUDIT: an invalid encoding gives the default NaN whatever the other operand, equal-significand NaNs of one kind give the positive one). Proof: `crates/math/tests/complex_ld_products.rs` (ABI sentinel with distinct parts, x87 tag word after 20 calls, the grid and random pairs in every mode against glibc and the oracle) and the member checks of `s10_math_symbols.rs`. X87-NAN-RULE-AUDIT-2 probed the rest black-box (`crates/math/tests/x87_nan_products.rs`, oracle `x87_nan_diff.c`, now with `cexpl` `clogl` `clog10l` `csqrtl` `cpowl` `cabsl` `cargl` on `a + bi`, NaN lines compared): `fmaxmagl`/`fminmagl` take the first of two quiet NaNs and the x87 rule once a signalling NaN or invalid encoding is present; `nexttowardl` is `nextafterl` (x87 rule on both operands); `powl` of a signalling NaN to −0 is its quiet NaN with invalid (+0 takes the same path, not probed); `fmodl`, `remainderl`, `dreml` (x, ±∞) and `scalbl` (x, ±0) return a pseudo-denormal x canonical (exponent 1); `cexpl(+∞ + i·invalid)` gives the default NaN; the other complex functions already matched. Liella follows each. KEPT difference (gain: a NaN for a non-number operand, as the x87 unit and every other Liella `long double` function give): an invalid encoding beside a number in `fmaxl` `fminl` `nextafterl` `nexttowardl` `powl` `remquol` gives the default NaN with invalid, where glibc returns the number, +0 or another invalid encoding (invalid raised on both sides); the test lists these pairs as KEPT.
'''
