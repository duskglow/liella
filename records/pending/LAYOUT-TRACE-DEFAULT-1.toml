story = "LAYOUT-TRACE-DEFAULT"
date = "2026-11-13"
body = '''
**Trace-at-build is the default of every product build** (LAYOUT-TRACE-DEFAULT, the default-switch step of `plan/layout-rethink.md`, rulings #5190-#5194; amends D-X.88). `cargo xtask so` with `LIELLA_LAYOUT_TRACE` unset, empty or `1` traces its own build and groups from that trace, in both profiles, so CI trains, the gate, agents' roles, plants copies, `cargo xtask bench`'s product build and the release check all build traced. `LIELLA_LAYOUT_TRACE=ungrouped` stays the explicit opt-out; without a usable gdb the build fails and names it (ruling #5190: no snapshot fallback). `LIELLA_LAYOUT_TRACE=0` selects the committed lists explicitly and is kept for the list tooling only (regen, repair, comparisons) until LT-5 deletes those lists: `tools/hottext/regen.sh --build` sets it for its check of the rewritten list (a unit test requires every product build in regen.sh to be a regen build or name `=0`). A regen build (`--hottext-regen`) reads the committed lists when the switch is unset and refuses an explicit `1` or `ungrouped`; `LIELLA_HOT_LISTS` with the default trace fails and names `=0`. `hot_text_products` checks that the products under test carry `target/liella/.hot-lists` and that each list it names is the one the build grouped from. Tracer availability (gdb 15.1 with Python, checked as the build checks it): present on every build host class (Skylake-SP, Zen 1, Haswell-EP, Broadwell-EP); the timing hosts have no gdb and build nothing. Proof (Skylake-SP and Zen 1 hosts, both profiles, built with the default; next and next plus an unrelated libm-only change; each probe a warm-up and 5 runs, twice, every run identical): the same page-fault table on both hosts and both trees (fast / release: startup only 11 / 10, setlocale + printf 46 / 47, tool 50 / 49, fork child 5 / 5, localtime and localtime + mktime 17 / 18, float 3 / 3), 2 start-up text windows, 1 read-only data window, 11 / 14 written start-up data pages. Release: the four lists identical and libc.a byte-identical across hosts; with the libm change no text section of libc.a differs (only the build tag, symbol-table strings and switch-table label numbers). Fast (multi-unit, incremental codegen): the libm change alone recompiles about 290 functions outside libm differently (inlining), and the hot and probe lists follow (one extra-tier key, `zone::localtime_r`, no longer runs out of line); the fault table does not move, which is what the trace is for. Haswell-EP and Broadwell-EP hosts (the other two agent gate host classes; LAYOUT-TRACE-DEFAULT-3, the final tree of this story, same probes, both profiles, warm-up + 5 runs, twice): the same table, every run identical, and libc.a byte-identical between the two hosts in each profile. Four-host table, fast / release, the same on Skylake-SP, Zen 1, Haswell-EP and Broadwell-EP: startup only 11 / 10, setlocale + printf 46 / 47, tool 50 / 49, fork child 5 / 5, localtime 17 / 18, localtime + mktime 17 / 18, float 3 / 3, start-up text windows 2 / 2, read-only data windows 1 / 1, written start-up data pages 11 / 14. The bounds are ratcheted to the highest of these counts over the four host classes and both profiles, with no margin (hot_text_products: TRUE 17 -> 11, LOCALE 51 -> 47, TOOL 56 -> 50, FORK 6 -> 5, LOCALTIME and LOCALTIME_MKTIME 20 -> 18, FLOAT 5 -> 3; layout/contracts.tsv: STARTUP-TEXT-WINDOWS 4 / 4 -> 2 / 2, STARTUP-DATA-WINDOWS rw 20 / 21 -> 11 / 14).
'''
