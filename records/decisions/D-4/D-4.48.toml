body = '''
**memchr settles every n > 32 in one 64-byte head before any setup** (WL-HOT-GREP, 2026-10-10; HOT KERNELS, RESULT CHECKS rulings as D-4.45) \| `liella_machine_memchr` (AVX2, page offset below `liella_machine_short_lim`): n <= 32 keeps D-4.45's one-vector path; every n > 32 loads `[s, s + 64)` unaligned (inside s's page by the short limit), takes the first match and returns it when its index is below n, else NULL; a head miss with n <= 64 is NULL, a miss with n > 64 sets up `r8 = s + n` (saturated) and `s & -64` and enters the aligned groups as before. Replaces SHORT-2's separate 33..64 two-vector path (same loads, the clamp decides instead of a second branch). Why: grep -F/-E (wl gate rows 1.031x / 1.010x instr) call memchr ~150k times per 40 MB with long n and mostly near matches; the head hit with long n cost 32 kernel instructions (33..64 test, group setup, clamp), now 21; percall memchr_d16 52 -> 41 (glibc 36), d64 52.1 -> 41.3 (43.7). wl_count: grep-F 1.0307 -> 1.0176, grep-E 1.0096 -> 1.0049 vs glibc, no other row moved. Safety lives where D-4.21/D-4.45 put it (selftest settle check, `machine_scanners` sweeps: every alignment, n 0..300 with the target byte all around the region, page-end test); plants on the new code in WL-HOT-GREP's report. Not done: splitting the head into a first-32 test (3 fewer for matches in the first 32 bytes, 4 more otherwise; needs grep's distance distribution); the remaining ~5 instructions/call vs glibc are the Rust entry's NULL and n > isize::MAX tests (S6 policy, kept). Amendment MEMCHR-FOLD (owner ruling 2026-10-11 00:14, "memchr: yes, same caveat, there must still be safety at some level."): `memchr` is the direct entry `liella_machine_memchr_entry` in csys/src/machine/scan.S, falling through into this kernel after one gate: `n - 1 < liella_machine_chr_limit` (csys/src/machine/fold.S, in the fold word's line; isize::MAX while NULL folding is on, 0 otherwise; written by the same startup decision as the copy/fill/compare fold limit). Folded: every 1 <= n <= isize::MAX with no NULL test; a NULL faults on page zero (SIGSEGV). Why every n and not 8-64 as the compares (decide-or-ask): the guard needs the first access of a NULL call to lie below 64 KiB, and every path's first load lies in [s & -64, s + 64) = [0, 64) for s = NULL, whatever n is; no later load is reached. grep's calls have long n, so a 64-byte bound would fold nothing that matters. n == 0, n > isize::MAX and folding off tail-jump to `liella_hot_memchr_rest` (strz::find_n: explicit S6 abort; it also takes the lazy folding decision for any n). Entry cost 3 instructions (lea, cmp, jae) instead of the Rust entry's length and NULL tests plus the jump. Safety in the chain: the guard; the Rust twin (strz::find_n_direct, what the tests call) keeps the selftest settle check (D-4.21); machine_scanners: answers alike with folding on and off at every alignment/n 0-300/position, NULL child test (fold on: SIGSEGV for 1..=isize::MAX; off, or n > isize::MAX: abort; n == 0: NULL). rawmemchr and memrchr NOT folded: separate entries (rawmemchr would save only its jump); memrchr reads from the end first, so for a NULL with large n its first load can lie above 64 KiB and the guard argument fails. MEMCHR-2 amendment (2026-10-11): the in-page AVX2 head (page offset <= 4032) reads [s, s + 32) first for every n and settles a match there with one compare against n (no branch on n's class), then [s + 32, s + 64); after a head miss with n > 64 the aligned group g1 = (s & -64) + 64 (in (s, s + 64], inside the region) is loaded with no end test and its match checked as an index from s; the saturated end pointer is set up only when the 128-byte loop is reached. wl_percall instructions/call vs fold: memchr_space_long 37.2 -> 31.3 (glibc 34.0), d16 39 -> 33 (36), d64 39.3 -> 35.8 (43.7), d265 93 -> 90 (92.5), d1000 171 -> 168 (167.5). Plants (8, all red): each new compare/offset/advance removed or shifted. MEMCHR-SSE2 amendment (2026-10-11): the SSE2 level (no AVX2: Ivy Bridge, Ivy Bridge) takes the same order with page offset <= 4032: block [s, s + 16) first and alone, settled with one compare against n; n <= 16 then NULL; blocks 1-3 folded with por (per-block locate on a hit); after a head miss with n > 64, g1 entered with no end test and r8 set up for its hit check and the 128-byte loop. Page offset > 4032 unchanged (n <= 16 single vector, else the masked aligned group). wl_percall instructions/call on Zen 1 with GLIBC_TUNABLES=glibc.cpu.hwcaps=-AVX2 (both libraries on their SSE2 paths), glibc / memchr-2 / new: space_long 37.1 / 57.1 / 37.4, d16 39.1 / 59.1 / 39.3, d40 45.7 / 61.1 / 46.2, d64 55.4 / 65.2 / 55.4, d265 145 / 144 / 146, d1000 340 / 312 / 314, miss8 35.6 / 35.0 / 35.0, miss16 37.2 / 35.0 / 35.0, miss40 55.7 / 80.2 / 48.0. Decided locally: the n <= 16 exit after block 0 (2 instructions on longer calls, saves the 3-block read on short misses); the por fold over a 48-bit mask (a 48-bit mask cost the head-miss path 4 more instructions).
'''
