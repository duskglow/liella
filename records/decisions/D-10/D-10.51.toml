body = '''
**Two-phase `double` elementary functions: a cheap quick phase with Ziv's rounding test in front of today's fast tier** (LIBM-RETHINK, LIBM-RETHINK-2; owner 2026-11-07 RETHINK direction; contract unchanged: D-10.3, D-10.13, D-10.17). Today's in-place tier (`fast64`, D-10.25) is an accurate phase on every call (bound 2^-70, two exact products, a degree-8 series, a serial Horner chain). The new tier 1 per family: Tang's table-driven reduction with a 128-entry table (Tang, ACM TOMS 15(2) 1989), two-part Cody-Waite constants (Cody & Waite 1980), a short polynomial evaluated by Estrin's scheme (Estrin 1960; Knuth, TAOCP vol. 2, 4.6.4), only the dominant product made exact where FMA is free, and a proven bound of about 2^-61.5 (SSE2, plain products) or 2^-67.4 (one FMA); Ziv's strategy (ACM TOMS 17(3) 1991) with the one-sided test of `fast64::near` (de Dinechin, Lauter & Muller, RAIRO-ITA 41, 2007; CRlibm report 2006) and today's kernels, unchanged, as tier 2 (fallback 0.66% and 0.024% of the cbench operands). Average cost = quick + p·tier 2 (Muller et al., Handbook of Floating-Point Arithmetic, 2nd ed. 2018). Design targets per kernel: instructions, FP operations and the critical-path latency (the result is returned beside the test, not after it); verdict by timing. Measured on the prototype (`handoff/libm-rethink/proto/`, 0 mismatches with the CR exp over 9·10^8 checks): exp 135 -> 77 instructions (FMA builds; glibc 70); Ivy Bridge 40.8 -> 19.2 ns per call (glibc 13.8), latency 53.7 -> 33.6 ns (glibc 24.4); N100 27.0 -> 16.0 ns (glibc 8.0), latency 45.5 -> 31.3 ns (glibc 23.4): the N100 is bound by FP operations, so each kernel states its FP-operation count as a target. First family exp, exp2, exp10, expm1, then log, pow, sin/cos, atan. Both builds stay bit-identical (each correctly rounded).
'''
