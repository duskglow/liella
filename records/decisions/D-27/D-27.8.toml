id = "D-27.8"
section = "s26-29"
spec = "§27"
ann = "SEC"
status = "active"
body = '''
**The loader's ELF reader, part 2 (`liella_ld::elf`, IP-24 part 2, DL-ELF-READ-2): hash tables, versions, relocation iterators.** Same input rules as D-27.7 (no I/O, allocation, panic or read outside the slice; checked arithmetic; iterators yield one error and stop). Tables are found through `Dynamic`: a part-2 tag occurs at most once (`DuplicateDynamic`); address/size pairs (`DT_RELA`/`RELASZ`, `DT_JMPREL`/`PLTRELSZ`, `DT_RELR`/`RELRSZ`, `DT_VERDEF`/`VERDEFNUM`, `DT_VERNEED`/`VERNEEDNUM`) are both or neither (`MissingDynamic(tag)`); `DT_RELAENT` = 24 and `DT_RELRENT` = 8 are required with `DT_RELA`/`DT_RELR`, `DT_PLTREL` = `DT_RELA` with `DT_JMPREL` (`MissingDynamic`/`BadDynamicValue`); a size that is not whole entries is `TableSize`. Fixed-length tables (SysV hash header + `nbucket+nchain` words, GNU hash header + Bloom words + buckets, RELA, RELR) lie wholly in the file-backed part of one `PT_LOAD` (`AddressNotMapped`); tables walked to their end (GNU chain, verdef, verneed, versym) are read within the rest of that segment. GNU hash: at least one Bloom word and a shift below 64 (`BadHashHeader`); a bucket below `symoffset` or a chain past the mapped bytes is `HashIndex`. SysV: a bucket/chain value at or past `nchain` is `HashIndex`, a chain longer than `nchain` `HashChainLoop`; no buckets = empty. Symbol count: SysV `nchain`, else the end of the GNU chain from the highest bucket (all buckets empty: `symoffset`, a lower bound). Versions: revision 1 (`BadVersionRevision`); a chain ending (next 0) before its count is `VersionCount`, an entry past the segment `VersionTruncated`; names through the string rules of D-27.7; a `versym` index above the highest `vd_ndx`/`vna_other` (hidden bit masked) is `VersionIndex`, an entry past the mapping `SymbolIndex` (the count is a hint, not a bound). RELA entries are classified only through `Arch::classify` into `RelocKind`; an unknown type is `Unsupported(n)` and still yielded (design §0a); `TextRel` carries width, pc-relative and signed (32 vs 32S). RELR: an even entry is an address, an odd entry a 63-word bitmap after the previous address or bitmap; a bitmap with no address before it is `RelrNoBase`, an address past 2^64 `RelrOverflow`. Tests: `crates/ld/tests/elf_tables.rs`, `elf_readelf_parity.rs` (readelf -r/-V/--dyn-syms); fuzz target `elf` (docs/fuzzing.md).
'''
