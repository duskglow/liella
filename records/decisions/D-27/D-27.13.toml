body = '''
**The ld.so product (phase 14 DL-5, DL-LDSO-PRODUCT; R14-2 (a), R14-8 entry, R14-12 (a), L14-1..3).** `crates/ld-so` (product workspace) links `liella-boundary` feature `ld` (`ld.rs`: `liella_ld_start`; `arch/`: `set_thread_pointer` and the `liella_machine_ld_entry` declaration) with `machine/entry.S` assembled `-DLIELLA_LD` into `target/liella/<Arch::INTERP>` (new `Arch::INTERP`, x86_64 `ld-linux-x86-64.so.2`): `-shared -nostdlib --gc-sections -z now -z relro -z pack-relative-relocs`, entry `liella_machine_ld_entry`, version script `local: *` (no exports until the loader has some). Start: DL-4 relocator over the image's own headers (`boot::own_headers`, `__ehdr_start` + `e_phoff`), then the provisional block (L14-2: a zeroed `.bss` copy of `ThreadBlock`'s size, word 0 = itself), then argc/argv/auxv. Run as a program (`AT_ENTRY` = own entry): `--version`/`--help` (Liella's own text, `liella_ld::program`) exit 0; anything else, or a start for a program's `PT_INTERP`, a message on fd 2 and status 127 until DL-6. Memory symbols Rust code calls (`memcpy`..`bcmp`) are local twins of libc's (`posix::s04_strings`); the global allocator refuses every request (no heap in DL-5). L14-1 is `liella_ld::link::check` (counts undefined dynamic symbols, `DT_NEEDED`, RELA entries by `RelocKind`, RELR words, `DT_TEXTREL`/`DF_TEXTREL`); `cargo xtask so` refuses an interpreter for which it fails, so xtask now depends on `liella-ld` (workspace crate, no third-party dependency). L14-3 already holds: csys is built `-fno-stack-protector`. Tests: `crates/ld/tests/ldso_link.rs` (one object per violation, linked by the host compiler; the product: link check, 100 starts half with `setarch -R`, refusal as interpreter). Plants: handoff/DL-LDSO-PRODUCT-plants.txt. **Pre-relocation (DL-LDSO-PRODUCT-2):** `liella_machine_ld_entry` takes `__ehdr_start` PC-relatively and passes it as `liella_ld_start(sp, ehdr)`, so no call is made to find the image before it is relocated (the first run's ld.so called `liella_link_image_header` through a GOT slot that still held its link-time address; rustc's calls to foreign functions stay GOT-indirect in the linked object, so linker flags were not the fix). `cargo xtask so` also refuses an ld.so in which any instruction reached by direct calls and jumps from the entry, up to `liella_ld_start`'s call of `bootstrap::relocate_image` and through that function, reads a word a dynamic relocation writes (`liella_ld::link::relocated_words`, objdump listing; a register-indirect call there is refused as unfollowable). Reads through a computed pointer are outside what a static listing check can see. `--version`/`--help` keep Liella's own text (coordinator ruling #3810; differences row).
'''
