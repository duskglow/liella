id = "D-7.12"
section = "s07"
spec = "§7.7, §7.8"
ann = "HIST, ARB"
status = "active"
body = '''
**gettext and catgets (phase 13); decisions.** A `.mo` file is checked whole before use (header, revision major 0/1 and minor 0/1, tables, string starts); a damaged one is absent; a file not ending in NUL is used from a copy with one appended; catalogs are mapped and never unmapped. **No stale answers:** nothing is cached per msgid; `LANGUAGE` and the locale are read at each lookup; a loaded catalog is checked against its file (one `stat`) at most once per second, timed with the vDSO monotonic clock in an atomic word of the catalog's record, and at once after `setlocale` or a `textdomain`, `bindtextdomain` or `bind_textdomain_codeset` that changes its value (each starts a new generation; the same value or name set again changes nothing and starts no check: owner ruling 2026-10-23 on #1056, "Go ahead.", with #1057 for `textdomain`, revising the 2026-10-05 ruling's immediate recheck after every call; GETTEXT-NOCATALOG-PERCALL(-2): a program that binds before every lookup paid a full re-resolution and a recheck per call; glibc, probed, never finds a catalog created after a miss while the binding string is unchanged), so a replaced file is reloaded up to one second late (owner ruling 2026-10-05, `legacy::recheck`; until then one `stat` per lookup); a missing catalog path is tried again on the same clock: at most once per second, and at once in a new generation (PJ-9; until then only in a new generation). **A changed `LANGUAGE` is not a setting change** (owner ruling 2026-10-07, P4): it selects the cached resolution for its value, and catalogs and missing paths keep their one-second clock (until then every change checked each file at once and retried each missing path: 2 `stat` + 1 failed `open` per lookup when alternating); one clock read per lookup serves all its candidates. The reference keeps old translations until `_nl_msg_cat_cntr` moves and never re-reads a replaced file, by any form (probed 2026-10-05). **Resolution cache (optimization stage):** the ordered catalog records a search tries are kept per domain, category, locale name, `LANGUAGE` text and settings generation in four fixed slots (about 2.5 KiB per process; a longer key or more than 32 candidates is searched uncached); the records are still checked as above, so answers are unchanged. A changed `LANGUAGE` moves neither the check generation nor the settings generation (the default domain, bindings and `setlocale`), so alternating `LANGUAGE` values keep their cached lists (decision, GETTEXT-PROF 2026-10-05) and check no file (P4); no copy of `LANGUAGE` is kept. Keys compare eight bytes per word. **Lookup index (decision, PJ-9 2026-10-07):** at load each original's offset and length (from its NUL; the declared lengths stay unused) is recorded and, when the originals are strictly ascending, a hash table of them (open addressing, 2 to 4 slots per entry, probes capped at 64 at build, else no table); a lookup hashes the caller's msgid once (its length is never cached) and compares one candidate; originals out of order or repeated keep the binary search over the stored lengths, so every answer is the uncached search's. Cost per loaded catalog: at most `24n + 12` bytes (n entries; 20 KiB to 48 KiB for 2,000), leaked with the image; a file rewritten in place may serve a stale index until its next check (the same window as its strings; safe Rust, bounds-checked). **Codecs (P11):** the catalog's charset codec is resolved at its first use and kept in its record; the target codec is kept with the bound codeset's text, the `LC_CTYPE` data and charmap that selected it; a name that denotes no codec is resolved again at the next lookup (a charmap may be loaded later; a loaded one is never unloaded). **Plural-Forms** compiled without recursion and never trapping: division or remainder by zero, and a constant beyond 64 bits, fall back to `n != 1` (the reference dies with SIGFPE); an index at or above `nplurals` gives form 0; a blank before `=` makes the field unusable (as the reference). **Conversion** from the catalog's `charset=` to the bound codeset, else the thread's `LC_CTYPE` codeset, transliterating; a bound `""` means none; an unknown charset makes the catalog unusable; a string that will not convert counts as missing; each plural form is converted separately (the reference splits UTF-16 text at a NUL byte). `LANGUAGE`: `C`, `POSIX`, `C.UTF-8`, `C.utf8` end the search; a msgid falls through every directory of every element in order. `dgettext("")` finds nothing; a NULL msgid is returned as given; `_nl_domain_bindings` points at the newest binding record. **catopen:** `NL_CAT_LOCALE` uses the thread's `LC_MESSAGES` name, other flags `LANG` (`C` when unset); a directory, FIFO or non-catalog stops the search with `EINVAL` (the reference: -1 with `errno` 0 for a non-catalog), a missing or unreadable file moves on; a lone trailing `%` in a template skips that template; a `.cat` with plane size 0 or strings beyond the file is not a catalog (the reference dies with SIGFPE or reads past the file); catalogs are snapshotted at open; `catgets` errors set `ENOMSG`/`EBADF` as the spec and POSIX say. **Owner rulings (2026-10-04, security defaults accepted):** locale values containing `/`, or equal to `.` or `..`, are never used as path components (gettext candidates and catopen's `%L`/`%l`/`%t`/`%c`; the reference can be steered to `/usr/share/locale/../../…`, and `LANG` is kept in set-user-ID programs); `LANGUAGE` is read through `secure_getenv` and is not cleared at start (the reference keeps it in secure processes). Written into §7.7–7.8 by owner ruling (2026-10-04), as the reference behaves: catopen stopping at a directory or non-catalog, `%c`/`%t` keeping the modifier, an empty name giving `EINVAL`, `LANGUAGE` ignored for `POSIX` and `C.UTF-8`, `bindtextdomain` with a NULL or empty domain returning NULL without `errno`. **GETTEXT-3 (2026-10-08, decided, no behaviour change):** a resolution slot keeps a candidate memo: for its leading candidates, usable or not, with the earliest and latest last-check time and the record generation; while the generation is the same and no covered candidate is due (one second since its check), a lookup skips their checks. A relative path (retried at every lookup) ends the memo; every setting change moves the generation. A catalog record keeps whether its kept source and target codecs are the same (cleared with the target codec), so a lookup without conversion resolves no codec. Plural rules evaluate on a 16-level local stack (heap only deeper) and `n != 1` without the interpreter. Resolution keys are compared part by part straight from the caller's texts. Safety: the clause tests s7_7_c_0 (memo, language_flips, rechecks) and s7_7_c_3 (codecs kept) and planted-bug runs. **GETTEXT-4 (2026-10-09, decided, no behaviour change):** a resolution slot also keeps a hit plan for the first usable candidate of a search made from the first candidate, when the memo covers it and a hit there needs no conversion: the image, its header fields, the lookup index, the plural rule and, for a catalog that names a charset, the codec selector (bound codeset, LC_CTYPE identity, charmap) under which its codecs were the same. A lookup uses it only while the slot matches (key and settings generation), the memo covers its candidate as usable (record generation, one-second rule), the record still holds that image and the selector is the same; a miss there goes on with the next candidate. The slot's store clears it. Invalidation tests: s7_7_c_0 plan_* (one child per kind: textdomain, bindtextdomain, bind_textdomain_codeset, uselocale LC_CTYPE, setlocale, LANGUAGE, missing path after a second, replaced file after a second). **GETTEXT-5 (2026-10-09, decided, no behaviour change):** `translate`'s path without a slot is out of line (`translate_unresolved`: its path buffers made a multi-KiB frame on the found path); `mo::short_word` (overlapping reads, same value as the byte fold) serves the hash tail, `Resolution` tail words and `mo::same_bytes` (word compares up to 16 bytes, no `bcmp` call) the index probe; `find_in` reads its three head words with one bounds check. Tests: mo `short_word_and_same_bytes`.
'''
