[package]
name = "liella-math"
description = "libm contracts: one generic implementation per operation across all floating formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "liella_math"

[features]
# Test only (M6-0): count fast-path and fallback calls per function (`stats`). Off in the products,
# where `stats::record` is an empty inline function.
fastpath-stats = []

[dependencies]
liella-rt = { workspace = true }

[dev-dependencies]
spectest = { workspace = true }
# The environment tests run against the real machine (CSys), traps in forked children.
liella-boundary = { workspace = true, features = ["selftest"] }
# The shared oracle builder (tests/support/oracle.rs in liella-core) locks with flock.
liella-kernel = { workspace = true }
# The test oracle (D-10.3).
liella-mathtools = { workspace = true }
# The accuracy tests read the fast-path counts (M6-0).
liella-math = { path = ".", features = ["fastpath-stats"] }

[lints]
workspace = true
