body = '''
**System identity and control** (validation stage, 2026-10-05; §24.5–24.6 had been left out of phase 13's scope, validation T2). `uname`, `sethostname`, `setdomainname`, `sysinfo`, `reboot` (the kernel's magic numbers), `acct`, `ioperm`, `iopl`, `vhangup` through `Sys`; `klogctl`, `quotactl`, `capget`, `capset`, `init_module`, `delete_module`, `modify_ldt` thin over the system call (their pointers mean what the command says; the kernel checks them, as for `syscall`). `gethostname` copies the node name and its NUL; when it does not fit, the bytes that fit are written and the result is `ENAMETOOLONG` (§24.5, the reference, probed); `getdomainname` cuts silently (getdomainname(2), the reference); NULL with a size is `EFAULT` (S6; the reference crashes); the `_chk` forms fortify the size. `getloadavg` reads `/proc/loadavg` (two decimals, as the reference) and stores at most three, none for a count of 0 or less (the reference returns 0 for a negative count). `gnu_get_libc_version`/`_release` are `"2.39"`/`"stable"` (three-way: the spec, gnu_get_libc_version(3) and the reference agree): the version of the ABI Liella implements (Appendix B), the same number as `confstr(_CS_GNU_LIBC_VERSION)`'s "glibc 2.39" (D-24.6); one library-owned string each. `modify_ldt`: the kernel returns a 32-bit result zero-extended (observed on 5.10 and 6.8: -ENOSYS arrives as 4294967258); its low 32 bits are the result and a negative one is -1 with `errno` (modify_ldt(2)), where the reference returns the negative value with `errno` untouched (a difference); three-way: the spec's thin wrapper and modify_ldt(2) agree. `CSys::modify_ldt` (the `Sys` read used by the kernel-primitive tests) had the same flaw and reads the result as an `int` too (found by the ledger thread). `_SC_MINSIGSTKSZ` without `AT_MINSIGSTKSZ` (x86 kernels before 5.14): the frame from the XSAVE size counts 64 bytes of alignment padding (448 + 64 + XSAVE + 4; 1348 on an EPYC 7551 under 5.10, the reference's value), where 48 had been counted. Tests (merged 2026-10-04 with the ledger thread's implementation of the same functions, whose tests now run against this one): unprivileged (EPERM, and the argument checks the kernel makes first), in a private user namespace (a namespace root's capability sets read, lowered and raised with `capset`; the rest still refused), and as the first process of a private PID namespace (`reboot`'s commands reach the PID-namespace rules: `EINVAL` for the others, `RB_POWER_OFF` ends the namespace with `SIGINT`), each compared with the reference in `admin_products.rs`; `syscall` with all six arguments in `conformance/c/s24_variadic.c` (clauses `s24_5_c_5`, `s24_6_c_1`, `s24_6_c_4`, `s24_6_c_5`). The compat entries of removed system calls (`bdflush`, `create_module`, `get_kernel_syms`, `query_module`, `nfsservctl`, `sstk`, `sysctl`, `__sysctl`, `uselib`) are phase 15's (§29 removed-syscall stubs).
'''
