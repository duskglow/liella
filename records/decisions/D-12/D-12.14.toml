id = "D-12.14"
section = "s12"
spec = "§12.1, §12.10, §12.2"
ann = "HIST, ARB"
status = "active"
body = '''
**Wide streams** (phase 8; refines D-12.7). A stream's wide layer (`stdio_compat::Wide`, in its `Ext`) holds the codec, the input conversion state (`fgetpos` saves it), and up to four characters given back. The codec is fixed when the stream becomes wide-oriented: the calling thread's locale encoding then, `wchar_t` units for `open_wmemstream`, or the charset of `fopen`'s `,ccs=` (any `iconv` charset, converted through UCS-4 descriptors; output transliterates and writes UTF-16/UTF-32 little-endian without a BOM, as the reference library does). Input decodes byte by byte through the byte engine: an invalid sequence is `WEOF` with `EILSEQ` and the error indicator, its first byte left unread; an incomplete character at end of file is end of file. Characters given back are read before any byte; `ftell` and relative `fseek` count them by their encoded length, and positioning forgets them. **Mixed orientation** (ARB; ISO C leaves it undefined, the spec fixes the orientation): every byte operation on a wide-oriented stream fails (`EOF`, `0`, or `-1` with `EINVAL`, no indicator) and every wide operation on a byte-oriented one fails (`WEOF`, `EINVAL`). The reference library is irregular there (`fputc` and `ungetc` pass, and `fclose` after the latter corrupts its heap); `wstream_products.rs` records the `fputc` case. `wprintf` and `wscanf` go through the same layer. Memory streams (`open_memstream`, `open_wmemstream`) follow the reference library: a seek back moves the end of the data there (the published size and `SEEK_END`), the bytes after it stay in the buffer and reappear if a later write passes them, and `fclose` (not `fflush`) writes a terminator at the published size.
'''
