body = '''
**`erff`/`erfcf` at tiny operands: exact paths on the rounding test's refusal side** (LIBM-RETHINK-ERFC, ruling #4936). Traced (validation/wl_trace.sh, validation/percall/libm_erf_tiny.c): `erfcf` for 0 < \|x\| < 2.4e-14 (results next to the `float` 1, inside `round`'s margin) and `erff` for subnormal results (outside `round`'s normal range) were refused by the fast tier and ran `special::erf_mp` (384-bit): 11.1e3 and 13.1e3 instructions per call against 21 and 33 for the reference (libm_tail probe, Zen 1 host). Approaches weighed: (1) a direct path per band, exact by analysis; (2) a subnormal- and representable-aware rounding test so the existing cores answer (the cores' cost, ~60-110, stays on the band and every family's test changes); (3) per-mode constant tables (erfcf only). Adopted (1), reached only from the entries' refusal arm (LIBM-RETHINK-ERFC-3): `fast32::erf`/`erfc` call one out-of-line function there (`erf_refused`/`erfc_refused`: the direct path inside its band, else the accurate path) where they called the accurate path, and `eval` is unchanged, so a typical operand runs the same code (disassembly of the entries: 183 and 264 instructions as base, only the refusal arm's callee differs). Instructions per call (validation/percall/libm_erf_tiny.c, Skylake-SP host, base / adopted / reference): erff_typ 161.4 / 161.4 / 127.9, erfcf_typ 173.7 / 173.7 / 145.8, erfcf_tiny 11789.2 / 129.3 / 35.0, erff_sub 13151.0 / 120.0 / 47.0. Not adopted: the band test inside `eval` after the rounding test (+8.0 erff_typ and +5.0 erfcf_typ instructions per call, LIBM-RETHINK-ERFC-2) and a `#[cold]` refusal function (LLVM then stopped duplicating the rounding block into one erfc piece: one jump more there, +0.2 erfcf_typ). `erf_tiny`: erf x = c·x·(1 − x²/3 + …), c = 2/√π; for x = n·2^-149 the result is c·n rounded to an integer (units 2^-149); `C·x` in `double` is within 2^-28.4 units, and by best approximation (Khinchin, *Continued Fractions*, ch. II; Hardy & Wright 10.15) c·n stays at least 2^-24.4 from every half-integer (convergent of 2c, q = 145635) and 2^-23.4 from every integer (convergent of c, q = 291270) for n < 2^23, so one hardware conversion plus `round`'s directed step is exact in every mode; underflow and inexact, no `errno`. `erfc_tiny`: for 0 < \|x\| < 2^-26, c·\|x\| < 2^-25 keeps erfc x inside an open interval between rounding boundaries: 1 to nearest, 1 − 2^-24 or 1 + 2^-23 in the directed modes by sign. No exception table is needed (the bounds hold for every operand); the exhaustive sweeps `erff_fast_path_agrees_exhaustively` / `erfcf_fast_path_agrees_exhaustively` check every `float` in every mode. Not in this decision: `erf` (`double`) for \|x\| < 2^-55, refused by `fast_special::erf_nearest` (217-254 against 21-31): the same analysis proves RN(erf x) = c·m rounded with a 128-bit c (c·m at least 2^-57.36 ulp from every midpoint for m < 2^53; the x³ term under 2^-58.58 ulp), left for a follow-up for its hardware-flag shape.
'''
