body = '''
**`_Float128` `atan`/`atan2`: a three-limb integer first tier (Tang's table, exact numerator and denominator, the binary128 quotient `div3`), proved within `2^-160` relative and rounded by the binary128 rounding test** (LIBM-F128-TRIG-INT-4; extends D-10.85/D-10.91 to the inverse functions; contract D-10.19 unchanged: correctly rounded in every mode, the 384-bit route settles what the test cannot decide). Before: every `atanf128`/`atan2f128` call took the 384-bit route (about 161 000 and 169 000 instructions, 27x and 24x glibc time on Ivy Bridge). Method (`crates/math/src/wide_int/quad/arc.rs`): the x87 arc kernel (D-10.52, D-10.75) carried to three 64-bit limbs. `atan(y/x)` for `0 < y <= x`: `j = round(128t)` from a `double` estimate (in range: `h` in `[128, 512)`), `atan(y/x) = atan(j/128) + atan(r)`, `r = (y − cx)/(x + cy)` with the numerator and denominator exact integers on the 113-bit significands (the denominator's carry kept as a 129th bit), the quotient by `div3` (Newton's reciprocal and one residual correction, within `2^-162.2`), and `atan r = r·P(r²)` with ten terms of the odd series (remainder `< 2^-164.3`) by Horner in 64-, 128- and 192-bit words. The table is the x87 tier's 128-bit `atan(j/128)` plus a signed third limb (one 1 KB table, not a second 3 KB one). `atan x = A(\|x\|, 1)` or `π/2 − A(1, \|x\|)`; `atan2` the same on `(\|y\|, \|x\|)` then `π − θ` for `x < 0`. Error budget (module documentation): the series steps `λ_6 u^6` (`2^-162.4`) and `λ_2 u^2` (`2^-161.4`) dominate, `P` within `2^-160.69`, every result within `2^-160.2`; the rounding test assumes `2^-152` (B shared with sin/cos/tan). References: P. T. P. Tang, "Table-lookup algorithms for elementary functions and their error analysis", ARITH 10, 1991; R. Brent, P. Zimmermann, Modern Computer Arithmetic, 2010, ch. 3-4; J.-M. Muller, Elementary Functions, 3rd ed. 2016, ch. 2. Constants from Python `decimal` at 220 digits (π by Machin), pinned against the 384-bit arithmetic by `constants_are_the_rounded_values`. Measured (instructions:u per call, glibc / before / after, `validation/percall/libm_f128_trig.c`): `atanf128` on [-10, 10] 5870 / 161 186 / 1076, on [-1, 1] 5854 / 157 326 / 1033, `atan2f128` 6221 / 168 732 / 1267. `quad::div3` is pinned `#[inline(always)]`: with the arc tier's callers it went out of line and `tanf128` rose 1703.5 -> 1721.5; pinned, every sin/cos/tan/sincos row is at its earlier count. Accuracy: 10^7 seeded operands (half `atan`, half `atan2`) in the four modes against the 384-bit route and the hard cases (`\|x\| = 1` and neighbours, `t` on every index boundary `(2j+1)/256` and one place either side, `t` near 1 and `2^-8`, the extreme and subnormal operands, the denominator carry). `asinf128`/`acosf128` stay on the 384-bit route (LIBM-F128-TRIG-INT-5): their `√(1 − a²)` has 192 significant bits, so the kernel needs a variant whose `x` is a three-limb value and a three-limb root.
'''
