body = '''
**`cosh`/`sinh`/`tanh` (`double`) quick phase** (LIBM-F64-HYPERB-QUICK, under D-10.51; wired as the three entries' tier 1 through `elem_fast`, tier 2 = `fast64::hyperbolic` unchanged, then the accurate path). `fast64::quick` (module doc "cosh, sinh, tanh"): `e^a` and `e^-a` from ONE reduction of the exp quick kernel (Tang, ACM TOMS 15(2), 1989; `e^-a = 2^(-k/128)·e^(-r)`, the degree-6 Taylor polynomial split into even and odd parts so both sides share it); cosh `= (e^a + e^-a)/2`, sinh `= (e^a − e^-a)/2` for `2^-5 <= \|x\| < 23` (kernel low product kept: the cancellation multiplies its error by `coth 2^-5 = 32`), Taylor's odd series `1/3! ..= 1/9!` below `2^-5`, `e^a/2` from 23 to 708; tanh `= N/(N + 2)` with `N = expm1(2\|x\|)` from the expm1 quick pair (Tang, ACM TOMS 18(2), 1992), one division plus a residual correction (Dekker 1971). Every composition is bounded below `RHO_M1 = 1.5·2^-62` and decided by Ziv's one-sided test with `C_M1` (Ziv, ACM TOMS 17(3), 1991; de Dinechin, Lauter & Muller, RAIRO-ITA 41, 2007). Domains `2^-60 <= \|x\| < 708` (cosh, sinh) and `<= 22` (tanh): outside them, overflow thresholds, tanh's saturation and flags stay tier 2's and the accurate path's. The sinh series is Taylor's, not minimax (a minimax odd polynomial could drop a term: not tried). Tests `crates/boundary/tests/hyperb_quick.rs` (clause s10_0_f_0).
'''
