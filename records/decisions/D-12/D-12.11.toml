id = "D-12.11"
section = "s12"
spec = "§12.1, §12.13, C.7, C.9"
ann = "HIST, COMPAT"
status = "active"
body = '''
**The `FILE` object** (phase 8; refines D-12.2). A `FILE *` addresses 28 words: `struct _IO_FILE` and the vtable word of the exported `_IO_2_1_*_` objects. The buffer window and `_flags` (`_IO_EOF_SEEN`, `_IO_ERR_SEEN`, `_IO_USER_LOCK`, the public bits) are always current, so header-inline `getc`/`putc`/`feof`/`ferror` work; before each operation the engine re-reads the window (C code may have moved it). `_lock` points to the stream's recursive lock and `_codecvt` to Liella's record (state, backing, buffer); `_fileno`, `_mode` (orientation) and `_chain` (the open-streams list headed by `_IO_list_all`) are kept as glibc keeps them. Other `_flags` bits are not set: glibc's private meanings are not in the spec (gnulib reads some of them; revisit at the coreutils acceptance, phase 15). Streams the library opens live in slots that are recycled, never freed, so every `FILE *` it handed out stays readable. The standard streams are set up at first use: `stdout` line-buffered on a terminal, else fully buffered; `stderr` unbuffered; buffers sized by `st_blksize` (else `BUFSIZ`). The list lock is taken before stream locks; the ISO C flush of line-buffered output before input try-locks, so it never waits for a stream while holding another. `exit` flushes after the exit handlers; `fork` holds the list lock and the child frees stream locks held by threads that are gone. stdio functions are not cancellation points (§12 lists none). The stream data objects (`stdin`, `stdout`, `stderr`, `_IO_2_1_*_`, `_IO_list_all`) are exported by the products only: in the test pass with exports, the host library's own exit-time flush reads its objects of those names. `fmemopen` follows the reference library's observed rules (`w`/`a` keep room for a NUL after the data, `r+` does not; `w+` alone stores a NUL at open); its `GLIBC_2.2.5` compat contract comes with phase 15. Missing `fopencookie` callbacks are errors, as the reference library behaves.
'''
