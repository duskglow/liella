body = '''
**The hot-text regen is hermetic and its build never fails on a layout contract** (LAYOUT-FAULT-CONTRACTS, brief C of LAYOUT-STABILITY-RETHINK, 2026-11-11; layout tooling only, no ABI or behaviour change; keeps D-X.56, D-X.61, D-X.63). (1) Per-profile lists: HOTTEXT-REGEN-HOSTS-2's `hot-text-fast.list` / `hot-text-release.list` (D-X.61) were merged, not redone; LAYOUT-TEXT-PIN-9's regenerated shared list (both profiles traced on a Haswell-EP host) was split by that rule, keeping the host-class pairs. (2) The regen build (`cargo xtask so --hottext-regen`) reports a broken `layout/contracts.tsv` contract and goes on (`layout::regen_verdict`), as D-X.56 does for dead keys: a contract must never block the tool that restores it; the plain `so` that `regen.sh --build` runs after rewriting the lists enforces every contract. (3) Hermetic trace: the probes run under `env -i` with LANG fixed and LC_ALL and every other LC_* unset (as the bound tests run them), TZ passed only where a probe sets it (p_cold's zone, which `env -i` had dropped), gdb's default disable-randomization, a fixed-length work path under /tmp whatever TMPDIR says, every helper as `python3 -B` and `bash`; probe_text.sh passes merge.py the host class regen.sh computed. (4) Per-class fault contracts (ruling #4349; LAYOUT-FAULT-CONTRACTS-2): kind `fault-classes` in `layout/contracts.tsv` (rows STARTUP-, LOCALE-, TIME-FAULT-CLASSES, one probe mode each) links `page_faults.c` as the bound tests do, runs it once under `setarch -R perf record -e page-faults -c 1 -d` (empty environment but LANG and a fixed PATH, stdin /dev/null, cwd /) and classes every fault address by the probe's program headers: `text` (an executable segment, in a 64 KiB window holding hot-group text; a window, not the group's own bytes, since the first fault in a window maps it for whatever code lies there), `text-cold`, `ro`, `relro` (GNU_RELRO), `written` (the rest of a writable segment, `.bss` included), `other` (outside the image; reported, not bounded). Each bounded class has `<class>-<profile>=`; one over its bound names the symbol and offset at each of its fault addresses. Where perf cannot run, the row prints NOT MEASURED, except under CI, where it fails. The key-based STARTUP-TEXT/DATA-WINDOWS rows stay enforced for now. Not done (next step): the four-pad phase test of these classes, regen tracing every contract mode, and the dispatch-independent regen (#4767). Checked by `hottext::tests::regen_traces_in_a_hermetic_environment`, `layout::tests::a_broken_contract_is_reported_in_the_regen_build_and_fails_any_other` and `layout::tests::fault_addresses_are_classed_by_segment_and_a_rise_names_the_symbol`.
'''
