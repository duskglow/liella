body = '''
**Library search, the cache reader and `--list` (phase 14 DL-8, DL-SEARCH-CACHE; design §4 and §19; R14-3 (a), R14-15, R14-18, owner #940 and #941; clause s27_1_c_1_1).** `liella_ld::search` (pure, no allocation; the boundary opens): a name with `/` is tried as given after token expansion; Liella's pinned sonames (`search::PINNED`: libc, libm, the DL-1 placeholders, `libc_malloc_debug.so.0`) resolve to `<prefix>/lib` only, after `LD_LIBRARY_PATH` outside secure mode (R14-3: the override is for testing a libc build), never through RPATH, RUNPATH, the cache or another directory; the loader's own name is the loaded loader. Otherwise: `DT_RPATH` of the requester and of each object that loaded it up to the program (an object's RPATH only when it has no RUNPATH; all of them only when the requester has none), `LD_LIBRARY_PATH` (`:` or `;`; ignored in secure mode), the requester's `DT_RUNPATH`, the cache, the default directories. Each directory is tried with the supported `glibc-hwcaps` subdirectories first, highest first (`Arch::hwcaps`, the x86-64 psABI levels from the same `Features` libc dispatches on). Tokens `$ORIGIN`, `$LIB`, `$PLATFORM` (bare or braced); an unknown token skips the element. Secure mode (threat model rules 1-3): `$ORIGIN` only when the object's directory is trusted, `LD_ORIGIN_PATH` ignored, an element empty or relative after expansion skipped; outside it an empty element is `.`. Prefix: compile-time `LIELLA_PREFIX`, default `/`; cache `<prefix>/etc/ld.so.cache`; default directories `Arch::SYSTEM_DIRS` when the prefix is `/` (the reference's `ld.so --help` list: `/lib/x86_64-linux-gnu`, `/usr/lib/x86_64-linux-gnu`, `/lib`, `/usr/lib`), else `<prefix>/lib`; trusted (threat model rule 5 as amended by owner #4237): `<prefix>/lib` for another prefix, and for `/` exactly `Arch::SYSTEM_DIRS` (`/lib64` and `/usr/lib64` are not trusted). `$LIB` = `lib/x86_64-linux-gnu` (DL-0b probe); `$PLATFORM` = `haswell` for an x86-64-v3 or v4 CPU (probed on Haswell only), `x86_64` otherwise. `liella_ld::cache`: new format only (#941; old and compat files are "no cache"); every offset, count and string end checked against the file and the string table, an entry whose path does not start with `/` is inconsistent (a relative path would be opened from the current directory), any inconsistency on the way of a lookup = not in the cache. Lookup: binary search under the Appendix D.3.3 comparison (digit runs numeric, so `1.09` matches `1.9` as the reference's does), then the run of equal keys in file order: entries whose flags are not `Arch::CACHE_FLAGS` skipped, a legacy hwcap word skipped, the best supported hwcaps entry before the first plain entry, else that plain entry (#940). `ld.so --list PROGRAM`, `LD_TRACE_LOADED_OBJECTS` (kernel start or `ld.so PROGRAM`; ignored in secure mode, rule 11): every needed object found and mapped through `map::load` breadth first, each once (name or `DT_SONAME`), a file that is not this architecture's object skipped and the search continued; lines `\tlinux-vdso.so.1 (0x…)`, `\tNAME => PATH (0xBIAS)`, `\tNAME => not found`, then the program's `PT_INTERP` with the loader's base; status 127 when one was not found. Bounds: 256 objects and 64 KiB of paths per list (refused beyond, with a message); paths over `PATH_MAX` skipped. Running a program with dependencies stays refused until DL-10 relocates them.
'''
