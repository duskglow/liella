body = '''
**The `double` `exp` quick phase runs in the caller's directed rounding direction, in place** (LIBM-DIRECTED-INPLACE; amends the switch of D-10.13 for `exp` only; the quick phase is D-10.51 / D-10.54). Under an MXCSR word that is the default one but for its rounding field (traps masked, no FTZ, no DAZ: `fpu::is_default_but_rounding`, on the one MXCSR read the entry already makes), the `exp` entry (`mathret::elem_fast_dir`, its directed branch cold and out of line so the round-to-nearest entry is unchanged) runs `fast64::quick::exp_directed` in the caller's direction instead of switching to round to nearest. Method: Tang's table-driven reduction (P. T. P. Tang, "Table-driven implementation of the exponential function in IEEE floating-point arithmetic", ACM TOMS 15(2), 1989) as in the nearest quick phase, with the integer step `t = ∘(∘(x·128/ln2 + h) + 1.5·2^52)`, `h = −1/2` when the caller rounds up and `+1/2` when it rounds down or toward zero, so that `k` is `x·128/ln2` rounded to nearest within `2^-34` in every direction and `r1` stays exact. The kernel's error bound is recomputed with every rounding worth one ulp instead of half of one, and Fast2Sum's error term taken as one more rounding (S. Boldo, S. Graillat, J.-M. Muller, "On the robustness of the 2Sum and Fast2Sum algorithms", ACM TOMS 44(1), 2017): totals `2^-60.50` (SSE2) and `2^-66.84` (FMA), stated `1.5·2^-61` and `1.25·2^-67` (module doc of `crates/math/src/fast64/quick.rs`, "Directed rounding"; the `directed_bounds` test recomputes the terms). Rounding test: `e = ∘(zh·rho)`, accept iff `∘(zh + ∘(zl − e)) == ∘(zh + ∘(zl + e))`, returning that value times `2^m`: rounding is monotone in every direction, so equal ends decide the correctly rounded result with no midpoint or exactness argument about `e^x`. A decline, and every word with FTZ, DAZ or an unmasked trap, takes the switched path as before; flags are those of the switched path (the in-place arithmetic raises inexact only, over the domain `2^-60 <= |x| < 708`, where overflow and underflow cannot occur). `expf` already computes in the caller's direction on the one-pass path (D-10.63, D-10.72) and is unchanged. Tests: `crates/boundary/tests/exp_quick.rs` (`exp_directed_declines_at_breakpoints_and_the_entry_rounds_them`: `x = ±2^-k`, where `e^x` lies within `x²/2` of a directed rounding boundary, must decline and the entry must round right; `exp_directed_rounds_correctly_in_both_builds`; the ignored `exp_directed_accuracy_job`, 10^7 operands per distribution, direction and build), `crates/math/src/fast64/quick/tests.rs` (`directed_bounds`), `crates/boundary/tests/s10_math_symbols.rs` (results and MXCSR flags in every direction).
'''
