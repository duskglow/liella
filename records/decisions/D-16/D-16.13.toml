id = "D-16.13"
section = "s16"
spec = "§16.3"
ann = "COMPAT"
status = "active"
body = '''
**`host.conf` keywords and `RESOLV_*` overrides** (HOSTCONF-OPTIONS-PROBE, 2026-10-24; black-box record in `crates/core/tests/hostconf_probe.rs`; supersedes D-16.9's "of `_res_hconf` only `multi`"). Settled by probe of glibc 2.39 (`unshare -r -m`, private `/etc/host.conf` and `/etc/hosts`, `hosts: files`). **Honoured and implemented** (`liella::names::hostconf`, state in `legacy::nss::HOST_CONF`): `multi`; `reorder` (a by-name IPv4 answer's first address on a local interface's network, by its prefix, loopback included, swaps with the first address; interfaces asked only when on); `trim` (by-address answers, `gethostbyaddr` and `getnameinfo`: each name loses the first listed domain it ends in, ASCII case ignored, never the whole name; up to 4 domains, separators white space `,` `;`; repeats kept); keywords and `on`/`off` ignore case, a bad value keeps the setting, the last line wins; `RESOLV_MULTI`, `RESOLV_REORDER` override the file, `RESOLV_OVERRIDE_TRIM_DOMAINS` replaces and `RESOLV_ADD_TRIM_DOMAINS` appends one list (`:` is not a separator). The environment is read once, at the first host lookup, through `secure_getenv` (like `HOSTALIASES`; the reference's AT_SECURE behaviour is not probed); no lookup walks it. Trim and reorder run after the name-service cache (D-16.10). **Matched no-ops** (the reference ignores them): `spoof`, `nospoof`, `spoofalert`, `order`, every other keyword, `RESOLV_SPOOF_CHECK`, `RESOLV_SERV_ORDER`. **Gaps (labelled):** `RESOLV_HOST_CONF` (honoured by the reference: it names the file read instead) is not implemented yet; the reference's stderr diagnostics (`<file>: line N: bad command ...`, `expected 'on' or 'off'`, `cannot specify more than 4 trim domains`) are not printed; `_res_hconf` carries `multi`/`reorder` flags but not the trim domains; `reorder` of IPv6 answers and `trim` of DNS answers are not probed (applied to IPv4 only, and to every source).
'''
