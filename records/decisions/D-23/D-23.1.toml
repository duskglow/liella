body = '''
**Internal:** `Timespec{sec: i64, nsec: u32}` (validated) and `Duration`. `time`, `gettimeofday`, `ftime` and `clock` are translations of `clock_gettime` (vDSO). The `tz` argument is zero-filled, per the contract.
'''
