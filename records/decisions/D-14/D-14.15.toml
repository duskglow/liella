body = '''
**regexec capture pass: one bucket per state without back-references** (RX-T4C, 2026-10-09). Without back-references `Matcher::run` keeps per frontier the start of each state (`start`, usizes pool) and its best threads at a fixed offset (`State::info`: per node instruction index, chain index, best slots, offset; built once per search) - no bucket list, no 4-word pack/unpack, no per-insert `masks_of` for the slot count; captures copied in 16-byte blocks (`copy_caps`; stride padded to a multiple of 4 with -1, sliced back in `Found`); threads past `Run::end` dropped (no back-references, so no budget changes), so an ASCII span needs a ring of 2 in UTF-8 locales. Back-references keep the bucket/table path unchanged. Local decisions: padding only without back-references; `Buf::expose` (no fill) for `start`/`bests`, read only where `node_gen` marks the node. Measured and NOT kept: (a) one direct pass with captures for anchored patterns (`^`): re_sed_kv-like 81.7k -> 53.1k instr, but an anchored line failing late cost 2.25x the overall pass alone (101k vs 44.9k, 4.1x glibc) - guardrail 1; (b) one direct pass for subjects <= 64 B: aud1 +24%, a late match 2x; (c) decoded instructions cached per node: no change. Safety: oracle diff (all modes) + regex unit tests; planted bug (keep the first thread on ties) fails both oracle-diff tests. OPEN: regexec_backref +7.5% instructions (40.0k -> 43.0k), cause not found (advance inlining tried: no change). PROPOSED (RULING NEEDED): change of frame for the capture pass - a one-pass capture walk when the program has at most one live thread per node (checked at regcomp), else a tagged DFA (Laurikari 2000). AMENDMENT RX-ONEPASS (owner ruling YES 2026-10-09): ONE-PASS CAPTURE WALK. Definition (regcomp, `Built::one_pass_check`, flag bit 4 of the header): an ENTRY is (start, j 0) or (b, j 0) after a `Byte`/`Set` instruction; its ENDS are the `Byte`, `Set` and `Match` states its epsilon edges reach (`Built::eps`, assertions taken as passable). The program is ONE-PASS when it has no back-reference, at most 4096 states, and for every entry: no state is reached twice, the first-byte sets of the consuming ends (a byte; a set's table, plus every byte >= 0x80 in a multibyte locale - the superset `first_bytes` uses) are pairwise disjoint, and at most one end is `Match`. Proof that it is conservative: the epsilon paths of an entry form a tree, so each end has one path and one capture effect; assertions only remove paths; so at any position at most one path consumes the next character and at most one accepts. By induction over the positions, a match [s*, e*] found by the span passes has exactly one accepting path, and the thread-set pass (which returns the policy-best accepting path from s* ending at e*) returns its captures; the walk returns the same. This is stronger than at most one live thread per node (it bounds the whole walk to one thread). regexec (`Matcher::one_pass`): per position a depth-first walk of the entry's epsilon edges (split stack of (instruction, j, log length) and a capture-effect log, both from the search's u32 pool: 4 words per state, 0 allocations, 0 per process/thread memory), first end found = the only one; effects applied with the position; a walk that finds no path or exceeds 3 x states steps per position (a damaged regex_t) falls back to the thread-set pass. Not built: tagged DFA. Zen 1 instr/call (cf08a7d / RX-ONEPASS / glibc): re_sed_kv 19,675 / 8,020 / 12,888; re_sed_swap 19,912 / 8,746 / 40,670; regcomp_regfree_sed_kv 85,707 / 88,047 / 209,423 (+2.7%: the check); regexec_backref 43,053 / 42,746 / 21,959 (plain visit/insert moved out of line, `#[inline(never)]`: -0.6%; the +3k of RX-T4C remains OPEN, cause not found in the 15-call cap). Tests: `one_pass_programs_are_the_single_path_shapes_and_agree_with_the_oracle` (eligibility accepts/refuses listed shapes in C and C.UTF-8; 1680 oracle comparisons); planted bugs that fail it: every non-back-reference program walked (36 differ), first iteration kept without reset (14), end effects dropped (86).
'''
