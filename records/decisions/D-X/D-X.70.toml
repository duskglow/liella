body = '''
**The `.data1` cluster's members are declared in one hand-kept list, not keyed by trace** (LAYOUT-DATA-CLUSTERS-6 and -7, 2026-11-11; #4694; supersedes D-X.69's trace keying, extends D-X.64; layout only, no symbol, no behaviour change). `crates/libc-so/startup-state.list` names the written start-up state and the state every fork child reads: one Rust path per line (any crate hash, LLVM `.N` split or `.llvm.N` suffix matches), `symbol <abi name>` or `section <name>` (C). `xtask/src/coldbss.rs` moves exactly the sections these name into `.data1`. Every entry must name a section in every profile unless it is marked `fast-only` (release LTO folds it), so a renamed static is a build error, and a matched section over 8 KiB is refused. Why: keys taken from perf first-touch traces of the current layout cannot converge (an object already in `.data1` drops out of the next trace, #4679), a profile's `--replace` pass dropped the other profile's keys (#4678), and first-touch tracing misses objects on pages that already faulted (#4602). Options weighed: (A) `#[link_section = ".data1"]` on each static, rejected: edition 2024 makes it an unsafe attribute (allowed only in liella-boundary, while liella_legacy and liella hold members), and LLVM gives a zero-initialised static in a named section the NOBITS type, so one unit could mix NOBITS and PROGBITS `.data1`; (B) a macro wrapping each static in a marker module whose path the mover matches, kept as the follow-up if renames of declared statics become a burden (about 50 statics in 15 modules renamed, `#[no_mangle]` statics still need names); (C) the list, adopted: one file plus the matcher, profile-independent, no trace drives placement. The fork child's state is listed because fork copies no page-table entry for a `.data` or `.bss` page the parent never touched: each such page the child reads cost it a fault (LAYOUT-DATA-CLUSTERS-7: release fork child 7, and 8 at the `data 0x3000` pad, against 6 on next, Haswell host). `startup-data.keys` stays only as the STARTUP-DATA-WINDOWS contract input (D-X.50) and for the read-only keys. Carried over from D-X.69: `init_data_clusters_hold_at_every_text_phase` pads `.data` by 0x800, 0x1000, 0x2000 and 0x3000 bytes ahead of every library object and requires the start-up, tool and fork-child counts to stay; `init_startup_data_accesses_are_in_the_data1_cluster` traces `page_faults true` in the isolated link and names any small static start-up touches outside `.data1` (declare it in the list).
'''
