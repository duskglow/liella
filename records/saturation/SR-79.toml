open = "The AVX2 kernel was built after all: CASECMP-K1 (D-4.27, 2026-10-08), the SSE2 form (CASECMP), then the ordering entries `liella_machine_casecmp_ord_{avx2,sse2}` (STRCASECMP-SHORT, -2). The 256-byte rows beat glibc in cycles. Open: the short rows, `strcasecmp_c_16` (cycles 1.42, i 1.74) and `strncasecmp_c_64` (1.29, 1.53), are fixed entry and stop cost, not the fold loop. PERF-STRCASECMP-AVX2 (2026-10-23, Zen 1 host, job `perf-strcasecmp-avx2-pc-1`, `bench --compare --counters --runs 3`, i Liella / glibc): a 32-byte head with no constant set-up and no bound test before a stop, a both-end exit taken from the vector masks, NULL tested in the kernel, AVX2 tested first in the export. `strcasecmp_c_16` 54.1 / 50.1 (1.08; it was 86.1 / 45.0 on Skylake-SP host), the 256-byte rows 253.3 / 234.3 (1.08), `strncasecmp_c_64` 94.1 / 68.1 (1.38). NEGATIVE so far: still above glibc. Left: the export's locale-view and ascii-flag tests, the page test, and the 64-byte row's second 32-byte step. PERF-STRNCASECMP-64-AVX2 (2026-11-04, Zen 1 host, job `perf-strncasecmp-64-avx2-count1`, `bench --compare --counters cbench_locale`): that second step is now inline for bounds of 64 or less (the head's memory-operand constants, one page test, no loop entry, no constant set-up), and bounds above 64 enter the 64-byte step directly. `strncasecmp_c_64` i 94.1 -> 76.1 (glibc 68.1, 1.12; time 1.11 -> 1.03), `strcasecmp_c_256` 253.2 -> 251.3, `strcasecmp_c_16` unchanged at 54.1. Left, about 8 instructions: the export's locale-view and ascii-flag tests (the fold needs the locale's ASCII map known) and the two blocks' separate fold sequences (about 17 instructions each); not closed"
