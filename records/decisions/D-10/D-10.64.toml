body = '''
**`exp2` and `exp10` on the `exp` quick kernel** (LIBM-F64-EXP-FAMILY-QUICK, under D-10.51 and D-10.54). `fast64::quick::{exp2,exp10}_tiered` in both builds, wired in `hot/exp_log.rs`; tier 2 on a miss is today's `fast64::exp2_nearest` / `exp10_nearest` (which also answer exp2's integers exactly). The kernel from `T_j` on is exp's (one shared `kernel`); the reductions are their own: exp2 `k` from `RN(x·128 + 1.5·2^52)`, `s = x − k/128` exact, `r = s·ln2` with the product's low part exact by one FMA; exp10 `k` from `RN(128/log10 2)`, `log10(2)/128` in three Cody–Waite parts (`LOG10_2_64_CW` halved, exact), `r = (sh + sl)·ln10` (Tang, ACM TOMS 15(2) 1989; Cody & Waite 1980). The SSE2 builds drop the product's low part (`<= 2^-62`) instead of a Dekker product: it doubles their bound (`RHO_FAM_SSE2 = 1.4375·2^-61`, fallback 1.14% instead of 0.57%), which at tier 2's cost is about one instruction per call against about six for the Dekker product on every call. FMA bound `RHO_FAM_FMA = 1.6875·2^-68` (fallback 0.010%). Exact cases: exp2 of an integer gives `zl = 0` exactly and is declined without raising inexact; exp10 of the integers 1..=23 is declined before the kernel (one compare on the hot path). Bounds recomputed from the constants by `quick/tests.rs::family_constants_and_bounds`. **`expm1`** (LIBM-F64-EXP-FAMILY-QUICK-2; Tang, "Table-driven implementation of the expm1 function", ACM TOMS 18(2) 1992: table region and polynomial region): `fast64::quick::expm1_tiered` in both builds, tier 2 today's `fast64::expm1_nearest`. `\|x\| >= 2^-5`: exp's reduction and kernel, then `vh − 1` by 2Sum and the kernel's low part added before one Fast2Sum, so the `−1` is folded in before rounding; the kernel keeps `th·rh`'s low part in the SSE2 build too (Dekker's product, about 13 more operations on this path only), because `e^x/\|e^x − 1\|` (up to 32.5 at `2^-5`) would magnify the dropped part to `2^-56.5` and a fallback rate near 18%. `\|x\| < 2^-5`: `x + x²/2 + x³·P(x)` (Taylor `1/3! ..= 1/9!`, Estrin) with an exact head: `xh` = `x` with its low 27 significand bits cleared (one AND), `x²/2 = xh²/2 + xl·(x + xh)/2`, the first product exact, so every bit of `x` reaches the result without a two-product. One stated bound for both builds and regions, `RHO_M1 = 1.5·2^-62` (computed `2^-62.57`/`2^-62.66` table region SSE2/FMA, `2^-62.04` series), expected fallback about 0.6%; the threshold `2^-5` balances the two regions' bounds. No exact cases (`e^x − 1` irrational for double `x != 0`). Bounds recomputed by `quick/tests.rs::expm1_constants_and_bounds`.
'''
