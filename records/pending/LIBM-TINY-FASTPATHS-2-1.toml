body = '''
**The `float` `sin`, `cos`, `tan` and `sincos` fast paths reduce 2^19 ≤ \|x\| < ∞ themselves, by Payne–Hanek in fixed point, and evaluate the result with the fast range's kernel** (LIBM-TINY-FASTPATHS-2, ruling #4936). Before, every finite operand from 2^19 up (42.6% of the encodings) left the fast path through the full envelope to the double-double accurate path: 1327-1474 instructions per call (LIBM-TAIL-PROBE, all `float` inputs; the reference 60-124). Method: Payne and Hanek, "Radian reduction for trigonometric functions", SIGNUM Newsletter 18(1), 1983, and Muller, *Elementary Functions: Algorithms and Implementation*, 3rd ed., 2016, ch. 11 (range reduction for huge arguments). x = m·2^(E-150) with the 24-bit significand m; a 109-entry table (`TRIG_LARGE`, built at compile time from 256 bits of 2/π pinned to the generated `TWO_OVER_PI`) holds ⌊2^(E-23)/π⌋ mod 2^128 per biased exponent E, so one 24×128-bit product modulo 2^128 is x·64/π modulo 128 with 121 fraction bits (error below 2^-97; a negative x negates it). The rounded top 7 bits are n mod 128; the signed fraction f is normalised by its high word's leading zeros, multiplied by π/4 in Q63 in integers and converted once, so r = f·π/64 has \|Δr\| ≤ 1.01·2^-53\|r\|, inside the 2·2^-53\|r\| the fast range's proof allows: the kernel's bounds (24.3·2^-53 for sin and cos, 49.7·2^-53 for tan) and the rounding test's margins (`TRIG_DELTA`, `TAN_DELTA`) hold unchanged. A fraction below 2^-31 (\|r\| < 2^-35.3) is refused, which keeps \|r\| above the 2^-36 of the fast range's proof. Only integer operations and one `cvtsi2sd` are added (no conversion of x, so no denormal-operand; inexact only, where the result is inexact anyway), so the round-to-nearest entries keep the contract of D-10.79. `trig_core` keeps the fast range alone for cexpf and the Bessel functions, whose proofs state it. Checked: the bound against the accurate path on every 2003rd encoding above 2^19 of either sign and the table against an independent computation (`trig_core_wide_is_within_its_bound_above_2_19`, `trig_large_table_is_two_over_pi`), and every `float` in the four directions (`{sinf,cosf,tanf}_fast_path_agrees_exhaustively`). Measured cost: handoff/LIBM-TINY-FASTPATHS.md.
'''
