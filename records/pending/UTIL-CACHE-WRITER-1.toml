body = '''
**The loader cache writer (UTIL-2, UTIL-CACHE-WRITER; plan/utilities.md §4 and §5, owner's approval 2026-11-14; format: spec Appendix D.3.1-D.3.3; reader: D-27.16).** `liella_ld::cache::write` lives beside the reader and shares its constants and `cache::compare`, so the writer's order is the reader's search order by construction. Format: exactly the D.3.1 new format (`glibc-ld.so.cache1.1`, header flags byte 2, 24-byte entries with osversion 0, hwcap word `1<<62 \| index` for a glibc-hwcaps entry) with the D.3.2 extensions: a tag 0 record (generator text, no NUL; omitted when the text is empty) and a tag 1 record (u32 offsets of the hwcaps names; only when an entry has one); no extension directory when neither is written. Layout (Liella's choice; byte equality with the reference's files is not a goal, D.3.1 says the string table is unsorted with shared tails): the string table holds the distinct hwcaps names (sorted by bytes, which fixes their indexes) and then each entry's path in entry order, and a key is the tail of its own path; the extension directory starts at the string table's end rounded up to 4, its records (tag 0, then tag 1) are followed by the generator text, then the name array at the next multiple of 4. **Order** (`cache::order`, total): descending by key under the D.3.3 comparison; ties by configuration order (`Entry::order`, the position of the entry's directory; a hwcaps entry takes its directory's), then a directory's hwcaps entries before its plain entry, then path bytes, then key bytes, hwcaps name and flags (which only separate entries no reader can tell apart). The output depends only on the set of entries, never on their arrival order, so identical inputs give byte-identical caches on any file system. Probe (UTIL-CACHE-WRITER, reference ldconfig 2.39, one AVX2 build host): the reference's relative order of plain entries of one directory whose keys are equal under the comparison (`libv.so.1.9`, `libv.so.1.09`) differed between two runs over the same files on two file systems (ext4, zram), i.e. it follows the directory listing (D.3.3 "not settled"); Liella orders them by path bytes, so a request for `libv.so.1.9` resolves to `libv.so.1.09` in that tie under both Liella's and the reference loader (one of the reference's possible outcomes, so no differences row). **Untrusted input** (threat model rule 5): before anything is written, a key and a hwcaps name must be a file name (1 to `NAME_MAX` = 255 bytes, not `.` or `..`, no `/` or NUL); a path absolute, at most `PATH_MAX` = 4095 bytes, every component a file name, and ending in `/<key>` (`/glibc-hwcaps/<name>/<key>` for a hwcaps entry: the value is the soname link in the scanned directory, D.3.1); at most `HWCAPS_MAX` = 64 distinct names, `ENTRIES_MAX` = 2^20 entries, `GENERATOR_MAX` = 4096 bytes of generator text without NUL; every offset must fit the format's 32 bits. A refusal names the entry (caller's index) and writes nothing. **No allocation**: the caller's entry slice is sorted in place (`sort_unstable_by`, deterministic because the order is total) and the file is written into the caller's buffer (`cache::encoded_len` gives its size; a short buffer is refused with the size needed), so the freestanding ldconfig (UTIL-3) and the loader crate need no allocator; nothing is mapped or executed. The reader gains `Cache::get(i)` (an entry as stored, with its hwcaps name) and `Cache::generator()` (tag 0) for the round trip and for `ldconfig -p` (UTIL-3); `parse` and `lookup` are unchanged. Proof: round trip writer to reader over generated sets (digit runs, leading zeros, case, punctuation, duplicates, other architectures' flags, hwcaps levels, empty, 3000 entries): every entry read back, in the order above, every key's lookup as the order rule predicts for four hwcaps sets, same bytes for reversed and rotated input; the reference `ldconfig -p` lists a Liella-written cache for a private root exactly as its own (the directory-listing tie compared as a set); the reference loader resolves four libraries through a Liella-written cache bind-mounted over `/etc/ld.so.cache` (unprivileged user and mount namespace) as through its own; fuzz targets `ld_cache` (reader) and `ld_cache_write` (writer then reader); plants in handoff/UTIL-CACHE-WRITER-plants.txt.
'''
