body = '''
**`dlopen` in `ld.so`: loader state, refusal order and dlerror texts (phase 14 DL-16a, stories DL-DLOPEN-LOAD and -2; plan/ph14/dl-16-dlopen.md §1-§4; implements D-27.30, D-27.31, D-27.34).** (1) **State on first use:** the loader's state (object records, global scope, path and dependency arenas) lives in one private `MAP_NORESERVE` mapping made at the first `dlopen`, so a program that never calls it pays nothing; the start-time objects are described from their memory images (`image_view`), and the start records what that needs (program headers, bias, `(st_dev, st_ino)` per object; argc, argv, envp and auxv) without allocating. Capacity: 512 objects in the process and `init::OBJECTS_MAX` new objects per call; one more is refused with a dlerror text. (2) **Order of the checks per candidate file** (`liella_ld::dlopen::check`): the ELF header, the segments, the dynamic section, a position-independent executable, then static TLS (refused until DL-16d places it); the first failing check gives the text, each one the reference's text as probed (`spec/behaviour/dynlink.md`, "dlerror texts"). A header the reader refuses for a rule the reference does not check (`e_ehsize`, a `p_align` that is not a power of two) gives `malformed ELF object` (registered options for ruling #5294 in the pending records of this story). (3) **Mode:** every bit outside `RTLD_LAZY\|RTLD_NOW\|RTLD_NOLOAD\|RTLD_DEEPBIND\|RTLD_GLOBAL\|RTLD_NODELETE` is refused with `invalid mode parameter` before any search, and a mode with neither binding bit with `<file>: invalid mode for dlopen(): Invalid argument`; the test sweeps all 32 bits. This is the reference's behaviour (probe P-1), so it has no differences row. (4) **Texts:** `<name as given>: <reason>`, or the reason alone where the reference gives no name (a missing dependency names the dependency), composed into the calling thread's record (D-27.2) and cut to the record's size. (5) **Constructors** of a new set run after the loader's exclusive borrow of its state ends, under the re-entrant writer lock (D-27.30), so a constructor's own `dlopen` (probe P-7) works; the open count saturates at `u32::MAX` and pins the object. (6) **Identity:** a bare name is matched against `DT_SONAME` first, a found file by `(st_dev, st_ino)` (D-27.34 item 2); `ld.so` by any path is the start-time object (ruling #5126, registered option in this story's pending records). Tests: `crates/ld/tests/dlopen.rs` (`s27_1_c_1_dlopen_loads_and_refuses_with_texts`), `crates/boundary/src/dlerr.rs` (`s27_1_c_5_compose_concatenates_and_cuts_before_the_nul`), `crates/ld/tests/elf_reader.rs` (`bad_ehsize`, `bad_align`).
'''
