body = '''
**`exp` quick phase: constants and bounds** (LIBM-F64-EXP-QUICK, under D-10.51; not wired, LIBM-F64-EXP-QUICK-WIRE wires it). `fast64::quick`: Tang N = 128 (Tang, ACM TOMS 15(2) 1989), `ln2/128` in two parts with a 36-bit high part (Cody & Waite 1980), `k` from the shifted sum's bits, Taylor degree 6 by Estrin's scheme (Estrin 1960), Fast2Sum assembly (Muller et al. 2018), the one-sided test of `fast64::near` (de Dinechin, Lauter & Muller 2007) with the result formed beside it; Ziv's strategy (Ziv 1991), `None` runs today's tier. Bounds proved in the module doc and recomputed by its tests: SSE2 2^-61.503 (stated 1.4375·2^-62), FMA 2^-67.727 (stated 1.25·2^-68); tables `EXP2_J128`, `LN2_128_CW`, `SCALE_128` from `cargo xtask tables`. Measured (LIBM-F64-EXP-QUICK-2, Haswell-EP): 0 mismatches over 10^8 operands per distribution and build (uniform [-10, 10], uniform bits over the domain, uniform [-745.2, 709.8]); fallback on uniform [-10, 10] SSE2 0.562%, FMA 0.0079%; largest relative error SSE2 2^-61.583; instructions per call with the fallback (not wired; targets 80 FMA, 95 SSE2): the count loop's results in handoff/LIBM-F64-EXP-QUICK.md.
'''
