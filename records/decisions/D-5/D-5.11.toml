body = '''
**The thread block holds the current view's class-word table** (WCTYPE-RETHINK proposal 3, coordinator ruling #3878; the 0x180 slot and the zero fallback in a block glibc made: coordinator ruling #4133, provisional; WCTYPE-TRIE-FILE; extends D-5.5 and D-7.13). `ThreadBlock::wclass` (offset 0x180) is stored with the `view` word by every writer of it (`uselocale`, `setlocale` for threads on the global locale, thread creation, `newlocale` changing the active object in place), so it follows exactly what `view` follows. **Safety rule (owner, 2026-11-10, a condition of this decision; WCTYPE-TRIE-FILE-3):** the words at 0x138-0x187 (`view`, the cache line 0x140-0x17f, `wclass`) lie where a block another `ld.so` made (D-22.10) keeps its own data, so they are Liella's only in a block the runtime made (`FLAG_OWN`), tested per block, never only by the process-wide `thread::owned()`: in any other block they are never written (`store_view` and the time zone period's stores check the block's flag) and never read as a pointer or value (`isw`, `view()` and `with_period` test `FLAG_OWN` first; such a block takes the view path and starts with no period, whatever the words hold). The first store of both words into a `FLAG_OWN` block also sets `FLAG_VIEW` (0x9c bit 1, after the words; WCTYPE-TRIE-FILE-4), and only `store_view` sets it, only in a listed thread of a process the runtime started, so every later locale change reaches the words. `isw*`, `iswctype` and `view()` test `FLAG_VIEW` and then read their word without a zero check (one flag test, one load: the `view()` callers such as `towupper` cost what they did before the safety rule); a foreign block, an own block not stored yet (startup before the initial thread is listed, or a process whose initial thread could not be listed) or an unresolved block takes the view's path in a tail call. Both flags are read through one helper pair in `locale.rs` (`block_flags`, `block_flags_of`), so a different ownership test replaces only those bodies. Proven by `locale::tests::foreign_block_words_are_never_read_or_written` (non-canonical garbage in all ten words of a foreign block: answers unchanged, nothing written) and its plants. The `_l` entries read the object's view, which holds its own table. Proven by `conformance/c/s05_ctype_words.c` (wide tests after `uselocale`, `setlocale`, other threads, `newlocale` in place) and the stale-word plant in handoff/wctype-trie-file-plants.txt.
'''
