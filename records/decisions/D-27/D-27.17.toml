id = "D-27.17"
section = "s26-29"
spec = "§27"
ann = "SEC"
status = "active"
body = '''
**Eager relocation of loaded objects (phase 14 DL-10, DL-RELOC and DL-RELOC-2; design §6; R14-13, D-27.11; amends D-27.15 for empty segments).** `liella_ld::reloc` (pure; memory through the `Image` trait, `ProcImage` in `boundary/src/ld.rs`). Arithmetic only through `Arch::apply` (x86-64 psABI §4.4.1: RELATIVE/IRELATIVE B+A, 64 S+A, GLOB_DAT and JUMP_SLOT S, the 32/32S/PC32 text widths checked for fit). Order: objects in reverse load order (dependencies before their users, the program last); per object RELR, RELA, JMPREL; IRELATIVE and references bound to an IFUNC are deferred to a second pass after every plain store of that object, so a resolver never runs before the data it may read is relocated. COPY: only in the program, looked up in the global scope without the program, copies min(program size, definition size). TEXTREL: the read-only segments are made read-write (never executable and writable at once) for pass 1 and restored before any resolver runs; a deferred store into text is refused. Every store is checked to lie inside a writable `PT_LOAD` (or a text segment opened for TEXTREL). TLS relocation kinds are refused (DL-12). RELRO is protected after relocation. Version check before relocation (D-27.11): a versioned need from an object without version definitions stops with status 127 naming the object and version; a missing version stops with status 1; weak needs are skipped. Dependencies load by path only until DL-8; one object reached by two paths (symlink, hard link) is loaded once, identity (`st_dev`, `st_ino`) of the opened file (L14-4, ruling #4231). A program asking for an executable stack (`PT_GNU_STACK` with `PF_X`) and any such dependency are refused (R14-13). An empty `PT_LOAD` (`p_memsz` 0; binutils 2.42 emits one for `-z notext`; the gABI allows it) is skipped and never mapped, amending D-27.15's "each `PT_LOAD` non-empty". When the dynamic symbol count is only a lower bound (no SysV hash and a GNU hash table whose buckets are all empty, as a program exporting nothing has), the symbol table's index limit is raised to cover every RELA/JMPREL symbol; objects that hash a symbol pay nothing. Open: a program started through `PT_INTERP` is still read from `/proc/self/exe`; ruling #4229 replaces that with a reader over the memory image (`AT_PHDR`), DL-RELOC-3. Proof: `crates/ld/tests/reloc.rs` (arithmetic, model corpus, version check, ld.so runs: multi-object both modes, unversioned stub, executable stack, RELRO, two paths); plants handoff/DL-RELOC-2-plants.txt.
'''
