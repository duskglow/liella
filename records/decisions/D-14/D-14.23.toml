body = '''
**A repetition scope's split and group live in its ENTER and EXIT** (REGCOMP-SCOPE-COST-2, ruling #5593; refines D-14.8's node count, the 2^21 cap unchanged). A matcher node is (instruction, j) with j over the enclosing scopes, so an instruction inside k scopes costs k + 1 nodes. `ENTER` now carries an optional iteration's split as its second successor (`c`; `NONE` for a mandatory iteration): `X*` and each optional copy of a bounded `X{m,n}` have no `SPLIT` of their own. When the operand is a plain group whose number is the first of the scope's groups, `ENTER` opens it (after the per-iteration reset) and `EXIT` closes it (flag `SCOPE_GROUP`, bit 30 of `a`; the shared-scope flag is bit 31 of `a` for both, the scope number below). A level of `((...)*)*` costs 2k + 1 nodes instead of 5k + 3: `((a)*)*` and `((a*)*)*` compile through depth 1446 (n^2 + 3n + 2 and n^2 + 4n + 3 nodes) and answer REG_ESPACE from 1447 (was 915). Every matcher path applies the fused effects where the separate instructions did: the thread-set search and the back-reference walk take the iteration on a copy of the captures as a split's first branch (the walk buckets the skip first when no copy fits), the fast search and the lazy DFA follow both successors, the one-pass walk keeps the skip as its branch and logs up to two effects per node (its log is 2 x nodes), and the required-bytes scan stops at an `ENTER` that can be skipped. Not fused: `X+`'s loop split (its `ENTER` is also the mandatory copy's entry) and hidden groups. The remaining gap to the reference (which compiles these shapes through 3000) is the cap's, removed by REGCOMP-FALLIBLE-ALLOC (ruling #5594).
'''
