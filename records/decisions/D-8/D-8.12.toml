id = "D-8.12"
section = "s08"
spec = "§8.2, §8.3, §12.7"
ann = "ARB"
status = "active"
body = '''
**Float conversions raise the IEEE exceptions their rounding implies** (STRTO-FENV-FLAGS, ruling #4639, 2026-11-11). C Annex F.5: `strtod`, `strtof`, `strtold`, the `wcsto*` and `_l` variants, the `__strto*_internal` entries, `atof` and the scanf float conversions raise inexact when the correctly rounded result is not exact, overflow when it rounds beyond the largest finite value in the current mode (truncation to the largest finite value is no overflow), underflow when it is tiny after rounding and inexact; an exact result raises nothing; `errno` stays `ERANGE` exactly with overflow or underflow. Mechanism: `float::round`'s `Rounded` already decides all three; `ParsedFloat` carries `inexact` and `signals()`, and the boundary raises them once after the conversion (`num_compat::raise_signals`, `fpu::raise`: MXCSR flags, or the trapping SSE operation for an enabled trap). Scanf collects them over its conversions (`Scanned::signals`) and raises them at the end. The `double` fast paths (one IEEE multiplication, division or integer conversion of exact operands, round to nearest only) run in the caller's environment and raise inexact in hardware, exactly when the result is inexact; they cannot overflow or underflow, so they add no work. `finish`'s certain-overflow/underflow bounds are integer arithmetic (log10(2) scaled by 10^12), so the conversion itself raises nothing by accident. Settled by the black-box probe `crates/core/tests/oracle/strto_fenv_flags.c` (43 inputs, 11 entry points, 4 modes; record `crates/boundary/tests/data/strto_fenv_flags.txt`: every entry point of one format agreed); pinned by `conformance/c/s08_strto_fenv_flags.c`.
'''
