id = "D-6.8"
section = "s06"
spec = "§6.2–6.4"
ann = "HIST"
status = "active"
body = '''
**Charsets from the system charmaps** (owner ruling 2026-10-01, phase 7; refines D-6.4). Built in, with no file access: UTF-8, UTF-16, UTF-32, UCS-2 and UCS-4 (both byte orders and the BOM forms), `WCHAR_T`, ASCII (`ANSI_X3.4-1968`) and ISO-8859-1. Every other charset is read on first use from `/usr/share/i18n/charmaps/<name>.gz` (or uncompressed): installed system data in the POSIX charmap format, read under the format-inspection decision. Its `<code_set_name>`, `% alias` lines, `<mb_cur_max>` and mapping lines (including `<U…>..<U…>` ranges) are compiled in memory into a decoding trie and an encoding map, cached per process and immutable. Gzip decompression (RFC 1951/1952) is a small safe-Rust inflater in core. Stateful encodings that glibc implements only in modules (ISO-2022 family, UTF-7, stateful EBCDIC) are not supported: `iconv_open` reports `EINVAL` (deviation). A locale whose codeset has no codec (charmaps not installed) fails to load its `LC_CTYPE`. Charset names match case-insensitively, through the charmap's name and aliases. **Compared with the reference iconv** (all 231 charmaps that list mappings, every mapping of small charsets and an even sample of large ones, both directions): 200 agree exactly; 26 are unknown to the reference iconv; 5 differ where the charmap and glibc's module disagree, and Liella follows the charmap: the teletex sets (ANSI_X3.110-1983, ISO-IR-90, ISO_6937, T.61-8BIT) list their non-spacing diacritic prefixes as private-use code points that the modules combine with the next letter, and MAC-CYRILLIC's 0xA2 is U+00A2 in the charmap, U+0490 in the module. Composing charsets (TCVN5712-1, TSCII) decode the longest listed sequence; a code point listed under several sequences encodes as the lowest. **Names** match a charmap's name and aliases as codeset names do (case and punctuation aside: `eucjp` is `EUC-JP`). A name no loaded charmap answers to is tried as a file name, then found by a scan of the directory: first by file name, then by the header's `<code_set_name>` and aliases (read from the first 4 KiB of each file, without parsing it). Runs of mappings that continue one another merge into one range when parsed, so the 8-bit charsets search a few ranges. **Locale differential test** (`locale_products`, adds ja_JP.EUC-JP, ru_RU.KOI8-R and zh_CN.GB18030): `mbrtowc` returns −2 only for a valid prefix (§6.2), where the reference also returns it for a prefix no character extends (UTF-8 `ED A0`, a surrogate; EUC-JP's lone 0xA0); and the GB18030 charmap lists supplementary characters only up to its Unicode version (U+1F600 is absent), where the reference module maps the whole linear four-byte range. The test records these three lines and fails if one stops differing. **Owner: the recorded differences are accepted (2026-10-01).** GB18030's newer characters stay as the charmap gives them; revisit only if they cause coreutils failures (phase 15).
'''
