body = '''
**SSE2 head probes and equality classes for `memcmp`, `bcmp`, `__memcmpeq` without AVX2** (TIMING-COV-MEMCMP-NONAVX2, 2026-11-06). In `csys/src/machine/fold.S`, the SSE2 65-128 and long compare classes test the 16-byte block at 0 alone before any other block (the 65-128 class then ANDs seven blocks into the last block's register and finds the first difference by block group; the long loop starts at a + 16 rounded down to 16 and ANDs into its fourth block). The equality entry without AVX2 gets SSE2 classes instead of the Rust tail and large entries: 33-64 the word at 8 and blocks at 16, n - 32, n - 16; above 64 the explicit NULL tests (S6 unchanged: no folding is added), the words at 0 and 8, then seven blocks (65-128) or 64-byte chunks. AVX2 paths unchanged; results unchanged. Evidence: tests/small_compare.rs (both builds, folding on and off), handoff/TIMING-COV-MEMCMP-NONAVX2-plants.txt, handoff/timing-cov-memcmp-nonavx2.md. **NULL folding in the SSE2 65-2048 classes** (TIMING-COV-MEMCMP-NONAVX2-2; ruling #3592 (coordinator, 2026-11-06) under the owner's standing NULL-folding rule; amends D-4.22 option B as D-4.52 did for AVX2): with folding on and no AVX2, sizes 65 to 2048 of `memcmp`, `bcmp` and `__memcmpeq` have no NULL test; the first access is offset 0 of a, then of b (compare: the 16-byte head block; equality: the word at 0), read-only, inside the `[0, 64 KiB)` proof obligation of `dispatch`, so a NULL dies by SIGSEGV. Two words in `fold.S`, stored by `dispatch::store_cmp_gates`: `liella_machine_cmp_sse` (2048 with folding on and no AVX2, else 0) replaces the compare's 65-128 split (which moves after the head probe) and gates the equality class; `liella_machine_cmp_sse_null` (0 exactly while that word is 2048, else `SIZE_MAX`) replaces the `a` NULL test above it, so above 2048 the explicit S6 tests stay and with folding off every size above 64 takes the checked Rust entries (`liella_hot_compare_big`, `liella_hot_equal_big`); with folding off the AVX2 build sends 65-128 compares to its AVX2 class (`.Lcmp_avx_long`, explicit NULL tests) instead of the SSE2 class (amends that sentence of D-4.52). Up, the size word is raised first; down, the `a` bound rises first, so the bound is never 0 while the size word is 0. AVX2 paths and SSE2 sizes above 2048: same instruction count as before. Evidence: tests/small_compare.rs `null_faults_at_every_sse2_folded_size_and_aborts_with_folding_off` (every size 64-2049, six calls, folding on: SIGSEGV to 2048, abort at 2049; off: abort) and the existing NULL test (both builds); plants handoff/TIMING-COV-MEMCMP-NONAVX2-2-plants.txt. **Equality entry order** (TIMING-COV-COMPARE-HEAD-SSE2, 2026-11-07): above 64 bytes the equality entry goes from the `cmp_long` test straight to `.Leq_sse` (the SSE2 classes first, as the compare entry already did); the AVX2 flag test (`liella_machine_cmp_mid`) moves into `.Leq_sse_over`, so SSE2 65-2048 runs 2 instructions and one taken branch fewer, and AVX2 above `cmp_long` (above 2048 with folding on, above 64 with it off) runs 2 more (the `cmp_sse` test). Results and NULL outcomes unchanged. Timed base -> new vs glibc (9 interleaved rounds, medians): Ivy Bridge class `__memcmpeq`/`bcmp` head_128 8.03/7.63 -> 6.83/6.43 ns (glibc 5.22), eq_128 9.64 -> 8.43 (7.63), eq_1k 38.9 -> 36.2 (36.5), tail_128 8.84 -> 7.63 (8.43/8.04); Alder Lake-N class forced SSE2 head_128 5.02/4.60 -> 4.18/3.76 (4.59), eq_1k 32.6 -> 28.6 (27.2); Alder Lake-N default (AVX2): 47 compare rows unchanged within one timer step. Plants handoff/TIMING-COV-COMPARE-HEAD-SSE2-plants.txt.
'''
