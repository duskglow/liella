id = "D-4.14"
section = "s04"
spec = "§4.1–4.3, §4.8"
ann = "—"
status = "active"
body = '''
**C-layer scanners and ERMS** (OD-C2 standing approval, P7). `strlen`, `strnlen`, `rawmemchr` and every byte-text conversion in `strz` use `csys/src/machine/scan.S`. Loads are aligned 32-byte (AVX2) or 16-byte (SSE2) vectors, which never cross a page. The unrolled 128- or 64-byte groups are aligned too, so a group stays in one page. `strnlen` loads a block or group only if it starts before `s + max`. The path is chosen once from CPUID and XCR0 (`boundary::cpu`), with SSE2 until then. Rust checks in constant time that the reported byte is the terminator (or the searched byte) and that a bounded result is within its bound; a failure aborts. **Amended (owner ruling 2026-10-08, STR-K1: approved "as long as there's safety somewhere in the chain"):** the `strlen`, `strnlen` and `rawmemchr`/`__rawmemchr` exports form no Rust slice and return the scanner's answer directly (`strz::len`, `len_n`, `index_of`: NULL test, `cpu::ready`, tail call; `cpu::init` never inlined, so no frame); their D-4.21 check (re-read; past-bound aborts, a changed byte is rescanned and counted) runs only in the `selftest` build, which is the build every `cargo xtask test` run of liella-boundary uses (its dev-dependency on itself enables the feature), and the exhaustive sweeps (value checks against a byte loop, and no rescan allowed in a single-threaded sweep) and planted-bug tests of D-4.24 run there. A shipped answer is the index of a byte that WAS the terminator when the kernel read it: correct for a call racing a writer, so no abort and no re-read. Every scanner use that forms a slice (`strz`, `strz_n`, `until`, ...) keeps the check in all builds. The first-terminator property is held to exhaustive tests (`crates/boundary/tests/machine_scanners.rs`): every alignment of a 64-byte window × every length to 300 × both paths, terminators on a page's last byte before an unmapped page, and starts at a page's first bytes after an unmapped page. A planted masking bug was confirmed caught. `memcpy`/`memmove` on disjoint regions and `memset` use `rep movsb`/`rep stosb` from 1,280 bytes on ERMS CPUs; overlapping moves stay on the Rust loops. The crossover was measured on an i9-14900KF with FSRM: loops 9.0 ns against ERMS 9.8 ns at 1 KiB, and 15.0 against 10.6 ns at 1.5 KiB. Wide text is still scanned unit by unit, since the approval does not cover it. **Copy retune and AVX2 copy (owner ruling 2026-10-05, task PJ-7):** the `liella-mem` loops copy the first block alone and store whole blocks at block boundaries (Zen 1 split stores: 4 KiB worst placement 394 → 116 ns); a destination 1–255 bytes above the source modulo 4 KiB takes them in descending order (4 KiB at +100: 161 → 85 ns on Haswell); `rep movsb` keeps its placement check up to 64 KiB (16 KiB at +16: 1045 ns against 344). Disjoint copies of 128 bytes to 64 KiB use `liella_machine_copy_avx2` (`scan.S`) when `boundary::cpu` allows AVX2 (CPUID and XCR0): unaligned first and last 32 bytes, aligned 32-byte stores between, direction by (dst − src) mod 4 KiB (backward for 1–2047), `vzeroupper`, no non-temporal stores. Thresholds from `crates/boundary/examples/copy_sweep.rs` on Haswell-EP and Zen 1. Tests: `machine_scanners.rs` (every alignment pair of a 64-byte window, PROT_NONE at both ends of both regions, each dispatch path, overlapping `memmove`). **Amendment MEM-BULK (2026-10-09):** the AVX2 copy is overlap-safe and also named `liella_machine_move_avx2` (returns dst): it holds the first and last 32 bytes in registers until every other store is done, each loop step loads all its vectors before storing, and overlap fixes the direction (dst − src < n: backward; src − dst < n: forward; disjoint: the 4 KiB rule above); one induction pointer (loads at dst + (src − dst), base-only store addresses). `hot::move_large` (out of line: inline it made LLVM push/pop on the 65–128 class) sends 129 B–64 KiB with the kernel flag (`dispatch::avx2`) straight to it after the NULL tests, overlap or not; `conv::move_regions` sends overlapping moves of 128 B and more to it at any size (before: the generic `liella-mem` loops, 4.4x glibc instructions at 4 KiB). `hot::fill_large` from the `rep stosb` threshold with ERMS: the 64-byte class over the first 64 bytes, then `rep stosb` from the next 64-byte boundary, NULL tested first, `n > SMALL_MAX` guards a tunable threshold below 64. Zen 1 instructions/op (main → MEM-BULK, glibc): memmove_4k 1800 → 414 (412), memcpy_4k 520 → 419 (418), memmove_64k 26779 → 5711 (6189); 1–128 rows unchanged. Tests: `machine_scanners.rs` avx2_move (every overlap shift 1–40 and edges, both directions, 32 alignments, COPY_SIZES), memmove around 64 KiB, memset around the threshold with ERMS forced off and on (`selftest::set_erms`: Zen 1 has no ERMS); planted bugs (backward overlap run forward, tail dropped, fill one byte short) each red. **Amendment MEM-FALLBACK (2026-10-09):** (a) `liella_machine_move_sse2`: the overlap-safe move in 16-byte vectors for CPUs without AVX2 (same rules: first and last 16 bytes held to the end, eight aligned stores per step, overlap fixes the direction, disjoint by the 4 KiB rule); `hot::move_large` sends 129 B–64 KiB to it without AVX2 (overlapping always; disjoint unless `rep movsb` is chosen as in `conv::copy_large`), `conv::move_regions` overlapping moves ≥ 128 B of any size, `conv::copy_large` disjoint 128 B–64 KiB in place of the generic loops. (b) `liella_machine_fill_avx2` (n ≥ 128): head 32 B unaligned, four aligned 32-byte stores per step, last 128 B as four unaligned stores; `hot::fill_large` and `conv::fill` use it from 129 B whenever `rep stosb` is not chosen (no ERMS, e.g. Zen 1, or below its threshold). (c) The choice is `hot::bulk_move`/`fallback_move`/`bulk_fill` (one predicate for the entries and `selftest::bulk_move_kernel`/`bulk_fill_kernel`); `conv` AVX2 copy branches now also require `dispatch::avx2()` so `selftest::set_kernel_avx2(false)` forces every fallback path. `move_large`/`fill_large` tail-call every arm (checked paths moved to `move_checked`/`fill_checked`/`fill_rep`); `fill_large` reads ERMS with `cpu::erms_decided` (no inline `init`): both had saved five registers per call (+11 instructions). Zen 1 instr/op: memset_4k 518→262 (glibc 246), memmove_4k 414→408, memcpy_4k 419→413; without AVX2 (hwcaps tunable) memmove_4k ~1800→692, memmove_64k →9829. Not done: an SSE2 fill for CPUs with neither AVX2 nor ERMS (none of our hosts). Tests (machine_scanners): SSE2 move every overlap shift/alignment/size, disjoint too; AVX2 fill 64 alignments × sizes 128–65537; kernel choice per flag set; memmove/memset through the exports on every (AVX2 build, ERMS) combination. Planted bugs (SSE2 backward overlap run forward; fill tail vector dropped; dispatch ignoring the AVX2-off build) each red. **Amendment MEMCPY-POLICY (2026-10-22, SUPERSEDED by MEMCPY-POLICY-2 below; kept for the record): a `rep movsb` window in the AVX2 range, decided by cycles.** On ERMS CPUs, disjoint copies of 8,192 bytes up to, not including, 32,768 (`cpu::AVX2_ERMS_MIN`/`AVX2_ERMS_END`) at a placement `erms_placement_ok` accepts take `rep movsb` (`hot::avx2_erms`, one predicate for the exported entries, the internal copy `internal_large` and `conv::copy_large`). The AVX2 move keeps every other size and placement, and every overlapping move (rep movsb runs forward only). Without ERMS (Zen 1) and before the startup decision the window is empty (`usize::MAX`). `glibc.cpu.x86_rep_movsb_threshold` / `liella.cpu.rep_movsb_threshold` moves its start. `liella_machine_copy_erms` returns dst, so the entry tail-calls it. Measured with cycles:u per call, warm caches, the minimum of 15 batch means (`tools/probe/memcpy_cycles.c`, static, one binary per library; Liella's kernels selected by the tunables): rep movsb against AVX2 move, disjoint, dst aligned. Skylake-SP 8151 (Skylake-SP host, ERMS, no FSRM): 4 KiB 137/133, 6 KiB 169/198, 8 KiB 203/262, 10 KiB 235/327, 16 KiB 421/671, 32 KiB 3677/2460, 64 KiB 7168/4861 (glibc 221 at 10 KiB, rep movsb). Broadwell E5-2699 v4 (Broadwell-EP host, ERMS, no FSRM): 2 KiB 116/133, 8 KiB 309/485, 10 KiB 374/615, 16 KiB 672/1935, 32-64 KiB tie. Both destinations +7 at distance 0 (the slowest accepted placement) on Broadwell: 8 KiB 605/544, 10 KiB 716/624 (a loss of 11-15%, against gains of 25-50% at aligned destinations and on Skylake-SP). Destinations 1-511 bytes after the source modulo 4 KiB keep the AVX2 move (d7 10 KiB on Broadwell: glibc's rep movsb 2403 against Liella 745). Zen 1 (Zen 1 host, no ERMS): unchanged, Liella within 2-4% of glibc at 256 B-64 KiB. Not measured: FSRM CPUs (Ice Lake and later, Zen 3 and later) and Zen 2 (no such host reachable). They get the same window as ERMS. Haswell (Haswell-EP host, CI only) and Ivy Bridge (Ivy Bridge host A/Ivy Bridge host B, unreachable) were not measured either. NOT VERIFIED (2026-10-22): re-running the final build showed cycles:u varying up to 2x between processes on these VMs for unchanged code (Broadwell 256 B: 25, then 14 cycles; Skylake-SP at load 31 slower throughout). The one-process-per-kernel comparison above is therefore not reliable. On a quiet Broadwell the window's rep movsb with both pointers +7 took 604 cycles at 8 KiB against glibc's 337 and 684 at 10 KiB against glibc's 375 (glibc uses rep movsb at 10 KiB and is fast at that placement). Next: re-measure with the kernels interleaved on a booked host, and try a destination-aligned rep movsb (vector head to the next 64-byte boundary, as `fill_large` does). Tests (`machine_scanners.rs`): the kernel choice at 8191/8192/32767/32768, disjoint above and below, +16, overlapping up, down and by one, adjacent; memmove/memcpy against a byte loop at the window's edges with ERMS forced off and on. Planted bugs (start `>` for `>=`, end `<=` for `<`, overlap test dropped) are each red. **Amendment MEMCPY-POLICY-2 (2026-10-22): the window per CPU class, mutually aligned copies only.** METHOD: `tools/probe/memcpy_cycles.c` now runs the library memcpy (L; Liella with `glibc.cpu.x86_rep_movsb_threshold=999999999` = the AVX2 move), `rep movsb` (R) and a 64-byte head store then `rep movsb` from the aligned destination (A) interleaved in ONE process pinned to one CPU, 21-31 rounds in rotating order; it reports the median of the per-round paired ratios R/L and A/L with their 10-90% range (a range containing 1.0 does not decide). Two separate processes agreed within 1-2% on every host. RESULTS (ratio to the AVX2 move; a0 both aligned, b7 both +7, s7 source +7, d600 dst 600 bytes after the source mod 4 KiB): Skylake-SP 8151 (Skylake-SP host, booked, ERMS, AVX-512F, no FSRM): 2 KiB 1.21, 4 KiB 0.90, 6 KiB 0.76, 8 KiB 0.70, 10 KiB 0.66, 12 KiB 0.60, 16 KiB 0.43-0.46, 20-64 KiB 0.93-0.98 (a0; b7 likewise, s7 0.57-0.75 to 16 KiB then 1.06), d600 1.07-1.19 (0.96 at 16 KiB) with R or A. Broadwell E5-2699 v4 (Broadwell-EP host, ERMS, no AVX-512, no FSRM): a0 1.01-1.04 at 6-12 KiB, 0.74-0.82 at 16 KiB (0.76 at 14 KiB a0, 1.01 a2k), 0.98-0.99 from 20 KiB; b7 R 1.77-1.93 (the #789 regression), A 0.89-1.02 at 6-12 KiB, 0.72-0.85 at 16 KiB; d600 R 1.2-1.3, A 1.1-1.25. N100 (AVX2 timing host, ERMS, FSRM, AVX2): rep movsb 1.4-2.0 at 2-16 KiB, about 1.0 from 20 KiB aligned, d600 1.4-2.0 everywhere. DECISION: a disjoint copy in the AVX2 range whose destination and source agree modulo 64 takes `liella_machine_copy_erms_a64` in the class window `cpu::avx2_erms_window`: FSRM: none; ERMS + AVX-512F: 4,096 up to 65,537 (`AVX2_ERMS_WIDE`); ERMS without AVX-512: 16,384 up to 20,480 (`AVX2_ERMS_NARROW`; Haswell, same class, not measured); no ERMS: none. Every other placement keeps the AVX2 move (rep movsb lost at d600 on every class), so `erms_placement_ok` no longer gates the window. A tunable threshold sets the start with the end at `AVX2_COPY_END`. The FSRM bit (CPUID.7:EDX bit 4) is now kept in `Features`. Final build, new default against forced AVX2 move (alternate processes, two each; cross-process cells still vary by up to 10% on unchanged paths): Skylake-SP host a0 0.88 at 6 KiB, 0.73 at 10 KiB, 0.48 at 16 KiB, 0.94-0.96 at 20-64 KiB (4 KiB 1.07, in the noise; paired in-process 0.90); AVX2 timing host 0.97-1.02 throughout; Broadwell-EP host 0.80-0.84 at 16 KiB, 0.98-1.03 elsewhere. The 16 KiB gain on Broadwell sits where source plus destination fill the 32 KiB L1D in this repeated-copy loop. Real workloads with colder destinations may see less. Ivy Bridge (Ivy Bridge host A, Ivy Bridge host B; ERMS, no AVX2, no window): Liella's existing non-AVX2 path takes rep movsb from 1,280 bytes (`COPY_ERMS_MIN`), which loses to its SSE2 move by 1.07-1.16 at 2-4 KiB aligned and 1.25-1.5 at misaligned destinations up to 16 KiB (A at b7: 0.90-0.96). Follow-up, not changed here. Tests: the kernel choice at 16383/16384/16448/20416/20479/20480 with forced ERMS (narrow window), placements +0/+64/both +7 (window) and +1/+7/+16/+32/+600/+4095 (AVX2), overlap by 64 and 8 both ways, adjacent; memmove/memcpy against a byte loop at three source offsets and shifts including ±(n+64). Plants: start `>`, overlap-up test dropped, `& 31` for `& 63`, head store dropped (asm), narrow end +1. **Amendment MEMCPY-NONAVX2-THRESHOLD (2026-10-22): rep movsb without the AVX2 copy, and above 64 KiB with FSRM.** Same paired method (memcpy_cycles.c, 21 rounds, pinned; hosts idle, load 0.00, not booked). Ivy Bridge (Ivy Bridge host A E3-1220L v2, Ivy Bridge host B E3-1265L v2; ERMS, no AVX2), ratios to the SSE2 move: R and A lose at 2-4 KiB at every placement (a0 1.03-1.07, b7 R 1.28-1.33, d600 R 1.32-1.47); from 6 KiB A wins where the addresses agree modulo 64 (b7 0.87-0.98 to 64 KiB, R 1.07-1.53 there) and R = A at 64-byte-aligned destinations (a0/a2k/s7 0.82-0.98); at d600 A 0.78-0.98 to 16 KiB, 1.04-1.05 from 20 KiB, R 1.01-1.31 to 16 KiB, 0.99-1.00 above; d7 both lose (unchanged: SSE2). The library's A was 1-4% slower than its R at a0/a2k/s7 (cross-process vs next). DECISION (`hot::erms_kernel`): no AVX2 copy, ERMS, disjoint: SSE2 below 6,144 (`COPY_ERMS_MIN`, was 1,280); to 64 KiB, a 64-byte-aligned destination takes plain rep movsb where `erms_placement_ok` accepts (next's choice); else addresses agreeing mod 64 take `liella_machine_copy_erms_a64`; other accepted placements A below 16,385 (`ERMS_A64_MISALIGNED_END`), R from it; rejected placements SSE2. N100 (AVX2 timing host; FSRM, AVX2) at 1 MiB, rep movsb against the AVX2 copy: a0 1.01, a2k 0.99, s7 1.01, b7 1.10, d7 1.07, d600 1.67 (A 1.57-1.60): never a win, so FSRM + AVX2 copy + no tunable keeps the AVX2 copy up to 1 MiB (`ERMS_LARGE_FSRM_FROM` = 1,048,577, `cpu::erms_large_window`); above 1 MiB unchanged (not measured); Ivy Bridge/Broadwell/Skylake-SP keep rep movsb from 64 KiB + 1 (Ivy Bridge 1 MiB 0.80-0.89). RESULT, final build vs next (cross-process, the inline R column as anchor, 1.00 +- 0.01 unless noted): Ivy Bridge both hosts 2 KiB 0.70-0.87, 4 KiB 0.66-0.92, b7 6-16 KiB 0.66-0.77, b7 24-64 KiB 0.90-0.92, d600 6-16 KiB 0.75-0.81, other cells 0.98-1.01; one cell a0 16 KiB 1.035 on Ivy Bridge host A only (Ivy Bridge host B 1.00; same plain kernel as next, so cross-process placement, NOT VERIFIED in-process); AVX2 timing host 1 MiB d600 0.60, b7 0.92, d7 0.94, a0 0.97, a2k 1.00; AVX2 timing host up to 64 KiB unchanged path (d7 1.01-1.03, noise). Not measured: Sandy Bridge, Atom/Tremont without AVX2, FSRM P-cores (Ice Lake+, Zen 3+: get the 1 MiB rule by class). Tests: bulk_kernel_choice_follows_the_cpu_flags (6143/6144/16384/16385/65536 at +0, +64, src +7, dst aligned +16, both +7, +600, -7, +16, +32; erms_large_window classes); memmove_and_memset_match_a_byte_loop_on_every_bulk_path adds 6143-6145, 16384, 16385 and shifts +(n+600), +-far (mod 64 = 0). Plants (all caught): threshold `<=`, mod-64 test false, misaligned end `<=`, FSRM rule without the AVX2 test, misaligned A as R, dst-aligned rule dropped.
'''
