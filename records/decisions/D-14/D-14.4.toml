id = "D-14.4"
section = "s14"
spec = "§14.9"
ann = "HIST"
status = "active"
body = '''
Regex engine: automata-based matching (guaranteed linear time) for patterns without back-references. Back-reference patterns use bounded backtracking with `re_max_failures` as the budget. `REG_STARTEND` supports embedded NUL. The `re_comp`/`re_exec` global pattern is legacy. **Submatch selection (owner ruling 2026-10-03): POSIX XBD 9.1** for every case, including those where glibc differs (categories I1–I4 and E2 of `spec/behaviour/regex-submatch-analysis.md`); Liella also finds the matches glibc misses (O1). §14.9 cites XBD 9.1. **Designed for, not built:** the engine is structured so that a glibc-compatible alternation-priority submatch mode can be added without a rewrite (a per-pattern flag in the native interface, and a process-wide default read once at the first `regcomp` from an environment variable, ignored under `AT_SECURE`); it is added only if the coreutils/bash/sed validation finds a concrete program that depends on glibc's choice. **Implemented (phase 12):** a Thompson automaton with per-iteration scopes and a breadth-first simulation in two passes (the overall match without captures, then the subexpressions anchored on it), generic over a submatch `Policy` (only `Posix` exists; the alternation-priority mode would plug in there); back-references bucket threads by the referenced groups' offsets under a budget of `re_max_failures` (2000) × 65536 thread insertions, then `REG_ESPACE`. Linear in the subject without back-references (tested by doubling). **Decisions:** `regerror` of an unknown code gives `Unknown error`; `re_exec` with no pattern returns 0; a count above `RE_DUP_MAX` is `REG_BADBR` (§14.9 and POSIX; glibc `REG_ESIZE`); a NULL or uncompiled `regex_t`, subject or pattern is `REG_BADPAT` (-2 in the GNU searches); a subject above `INT_MAX` or a tree deeper than 256 levels or an automaton above 2^20 instructions or 2^21 matcher states (each instruction counted once per enclosing repetition scope plus one; FZ-1: stacked repetitions such as `b*++++` double per level, and glibc too returns `REG_ESPACE` or runs for minutes on them) is `REG_ESPACE`; a compiled pattern keeps the locale it was compiled in; `REG_ECOLLATE` for a C.UTF-8 range with a non-ASCII end point (observed); an invalid byte in a bracket matches nothing; `RE_NO_POSIX_BACKTRACKING`/`RE_DEBUG` are ignored; GNU registers as observed (`REGS_UNALLOCATED` allocates re_nsub + 2). **Owner ruling (2026-10-04):** back-references see a group as reported under the POSIX rule (so `((a)\|b)*\2` on `aba` does not match; glibc matches). **Three-way (applied):** a single-character collating element such as `[[.é.]]` in a UTF-8 locale is accepted, as POSIX defines and §14.9's POSIX semantics include (glibc gives `REG_ECOLLATE`); the shared bracket parser (`text::collating_element`) serves regex, fnmatch and glob alike (done, phase 12). **Subpatterns (validation T5, 2026-10-05):** XBD 9.1 weighs every subpattern left to right, not only the subexpressions: a repetition (one holding groups only in a pattern without back-references), or an alternation or back-reference without groups, that comes before a group and is neither a group's whole body nor part of an alternative gets a hidden group, all groups renumbered in opening order and mapped back for reporting (`parse::hide_subpatterns`); so `.*/\(.*\)` on `a/b/c` reports `c`, as glibc does. **Optimization target:** the overall-match pass is about 7× glibc on dense text (a lazy DFA for pass 1, in the optimization stage before phase 14, P10).
'''
