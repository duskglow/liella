id = "D-13.4"
section = "s13"
spec = "§13.3"
ann = "HIST, COMPAT"
status = "active"
body = '''
**Internal:** walkers use `openat`-relative traversal and never change the cwd. They have no depth limit and no `nopenfd` tuning (P-lift). **Boundary:** where the contract makes cwd changes observable (fts without `FTS_NOCHDIR`, `FTW_CHDIR`), legacy performs the `fchdir` calls. **fts paths (FTS-SHARED-PATH, ruling #615, reverses #557):** one path buffer per stream, as fts(3) allows and as the reference does: every `FTSENT`'s `fts_path` points at it with `fts_pathlen` as the entry's length; only the entry `fts_read` returned last is NUL-terminated there, and its ancestors (valid while the walk is inside them) are its prefixes. `fts_accpath` is `fts_path` (`FTS_NOCHDIR`, `FTS_LOGICAL`, roots) or the entry's own `fts_name` (chdir mode). When the buffer grows, every live entry is re-pointed. Behaviour change: entries kept past fts(3)'s validity rules, entries from `fts_children`, and entries the comparison sees show whatever path the buffer holds now (the reference behaves the same way). Gain: the per-entry copy of the parent path was ~225 of ~280 user instructions per entry at 2 KiB paths (FTS-DEEP-PROFILE). **fts instructions (FTS-INSTR-DIRECT, -2):** fts acts on the `fts_instr` an entry holds, written by `fts_set` or by the caller directly, as the reference does. On an entry `fts_children` listed, only what fts(3) defines is compared with the reference: `FTS_SKIP` on a listed directory means none of its descendants is visited, and `FTS_FOLLOW` on a listed root shows the target. The rest is Liella's own behaviour, tested in `s13_3_c_4`, because fts(3) does not define it or the reference does not do what fts(3) says: a listed directory marked `FTS_SKIP` is never returned (the reference returns one only when it heads the list), a listed non-directory so marked is returned with `fts_instr` 4 (fts(3): `FTS_SKIP` concerns descendants only), a listed link marked `FTS_FOLLOW` is returned showing its target, or `FTS_SLNONE` when the target is missing (fts(3)), and a listed entry marked `FTS_AGAIN` is returned twice, as the reference returns it.
'''
