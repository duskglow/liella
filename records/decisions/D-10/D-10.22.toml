body = '''
**Hardware square root under the caller's control word** (M6-2, MATH-M6-SQRT and MATH-M6-SQRT-FTZ). `sqrt`/`sqrtf` run `sqrtsd`/`sqrtss` in place whenever every MXCSR exception is masked, in any rounding direction, with or without FTZ and DAZ (`fpu::is_sqrt_in_place`); `sqrtl` runs `fsqrt` at 64-bit precision control with every x87 exception masked; anything else (an unmasked exception) takes `fused::sqrt` on the operand as the caller's DAZ reads it. **Caller's FTZ/DAZ honoured (OWNER RULING 2026-10-23, MATH-M6-FPENV-HONOR; reverses the provisional calls #1278 (DAZ half) and #1490):** the caller's floating-point environment, FTZ and DAZ included, is the caller's choice and Liella does not subvert it. For every libm entry the envelope covers (`mathret::elem`, `lgamma`, `lgamma_r`, `sincos`, `cplx`, `cplx2`, `cplx_real`), for `sqrt`/`sqrtf`, and (MATH-M6-FPENV-HONOR-REST, #1509) for every software form whose result came through `mathret::ret` and its siblings, now `mathret::Soft` (`ret`, `ret_out`, `remquo`, `intmax`, `uintmax`: fma, fdim, the narrowing operations f32/f64 from wider formats, nextafter/nexttoward/nextup/nextdown, ldexp/scalbn/scalbln/scalb, ceil/floor/trunc/round/roundeven/rint/nearbyint, lrint/llrint/lround/llround, fromfp/ufromfp and the x variants, the fmax/fmin/fmaximum*/fminimum*/fmaxmag/fminmag families, fmod/remainder/drem/remquo, modf/frexp, ilogb/llogb/logb/significand, __iseqsig, hypot; `cargo xtask math-gen` emits the form when an operand or the result is `float`/`double`, and it enters the default word like the envelope so the internal arithmetic never runs under the caller's mode). Bit-level operations (`mret::pure` classification, `payload`, `canonical`, `cpart`) are not arithmetic and keep their operands. `long double` is x87: FTZ and DAZ are MXCSR (SSE) controls and do not apply to x87 arithmetic, so x87 operands keep their identities (a `daddl` or `faddl` operand is not read by DAZ, and their `double`/`float` result is not flushed by FTZ: black-box probe of glibc 2.39 under MXCSR FTZ, DAZ and both, MATH-M6-FPENV-HONOR-REST-2/-3, spec/behaviour/math-ftz-daz.md) and no rule is invented for them; `_Float128` is software and keeps its identities too: under the caller's DAZ a `float`/`double` operand that is subnormal is read as a zero of its sign (raising nothing); under the caller's FTZ a `float`/`double` result whose encoding is subnormal is a zero of its sign with underflow and inexact raised (the SSE unit's FTZ, Intel SDM), and so is a result of exactly the smallest normal that the computation reported as underflowed (tiny after rounding with an unbounded exponent, which the subnormal grid rounded up; probed on Haswell-EP host with mulss/mulsd under MXCSR FTZ in all four directions: zero, underflow+inexact; a value that the unbounded rounding takes to the smallest normal is not tiny and stays; test `ftz_flushes_the_tininess_edge`); `errno` stays what the computation reports. The internal arithmetic (double-double, error-free transforms, D-10.13) is NOT valid under FTZ/DAZ (a flushed error term would give a wrong result for normal operands), so it still runs in the default SSE word whenever the caller's differs, and the caller's DAZ/FTZ are applied at the boundary by the bits (`mathret::Denorm`): normal operands with normal results are bit-identical to the default word's. The hot path (caller's word already the default) tests only `in_place`. Not flushed: x87 `long double` (MXCSR does not reach the x87 unit) and `_Float128` (a software format). Known limits: the FTZ test is on the rounded result's encoding, so an exact value just below the smallest normal that rounds to it is not flushed (the hardware's tininess rule there not probed); the software forms follow the reference as probed (#1549, spec/behaviour/math-ftz-daz.md): fma, fdim, ldexp/scalbn and the narrowing from `float`/`double`/`_Float128` apply both DAZ and FTZ; the operand-returning forms are never FTZ-flushed (`Soft::kept`: fmax/fmin/fmaxmag/fminmag return the operand as DAZ reads it; `Soft::pick`: fmaximum*/fminimum* compare as DAZ reads and return the raw operand; `Soft::step`: nextafter gives `y` for operands equal as DAZ reads them, else steps the raw `x`; `Soft::raw`: nextup/nextdown/nexttoward step the raw `x`; a step from an `x` DAZ reads as zero raises nothing); fabs/copysign are bit operations; a form entered for the x87 unit (`Soft::enter(Unit::X87)`: daddl, faddl ... from `long double`) is never FTZ-flushed. sqrt follows directly: the hardware under the caller's DAZ gives +-0 for a +-subnormal, no flag, no EDOM, as glibc 2.39 does (black-box probe MATH-M6-SQRT-FTZ); there is no difference row for it. EDOM on the hardware path is set when a non-NaN operand gives NaN (exactly x < 0 as DAZ reads x). EDOM follows x < 0, never the sign bit (probe MATH-M6-SQRT-FTZ-2, glibc 2.39 Zen 1 host, identical under every FTZ/DAZ word and direction, all three formats): -0 gives -0 and a negative quiet NaN comes back unchanged, both with no flag and no EDOM; a negative signalling NaN comes back quieted with invalid and no EDOM; a negative normal operand (-1, -infinity, the smallest negative normal) gives the default quiet NaN, invalid and EDOM (probe MATH-M6-SQRT-FTZ-5, same words and directions, sqrt/sqrtf/sqrtl; x87 ignores FTZ/DAZ). Tests: `math_sqrt_hardware_matches_the_software_square_root`, `math_envelope_keeps_the_callers_mxcsr`.
'''
