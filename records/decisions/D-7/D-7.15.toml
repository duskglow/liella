body = '''
**strfmon engine** (COLD-REWRITE2-cold-02-REWRITE-3 with PROOF to PROOF-5, 2026-10-21; record `liella-historic:handoff/decisions/COLD-REWRITE2-cold-02-REWRITE-3.md`; D-7.11; zone-loader part D-23.15). (1) Parser: a byte loop filling one directive; `+` and `(` share one sign-style bit (a second is EINVAL); `=f` keeps the last fill; numbers saturate. (2) Output straight into the caller's buffer as the format is read (errors in format order; a saturated width is E2BIG at no cost). (3) Number: `format_float` of the signed value with the sign byte dropped, so directed rounding sees the sign (D-7.11, a recorded difference); the sink is capped at the room left, so `%.999999999n` does no work before E2BIG. (4) Grouping: one generator of separator positions from the right (size 0 or end repeats, >= 127 stops, empty grouping or separator: none); positions are counted, not bytes. (5) Frame: an 8-row order table per (`cs_precedes`, `sign_posn`); sep 1 = one space between number and symbol side, sep 2 = one space between symbol and the adjacent sign position; the space is printed only when the symbol is printed and there is non-empty text on both sides (no dangling space, nothing order-dependent; glibc prints a dangling space for some orders, pinned in `monetary_rules.rs`); parentheses mode drops both sign strings. (6) `#` alignment pads the shorter sign lead-in in front; the trailer is never padded. (7) Lint shape: a shrinking `&[u8]` parser and checked `Out::claim` ranges. (8) (coordinator ruling #336) `#` fill positions for separators come from `mon_grouping` alone, one each, an empty separator included, as the reference reserves them; printed separators take one position each when non-empty, none when empty. Boundary glue: rounding mode from MXCSR (the source printf uses) for both `double` and `L`.
'''
