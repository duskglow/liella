id = "D-25.5"
section = "s25"
spec = "§25.3, §25.4"
ann = "HIST, KERN"
status = "active"
body = '''
**POSIX message queues and shared memory (phase 13); decisions.** Queue names: the one leading slash is stripped and the kernel judges the rest (`EACCES`/`ENOENT` as §25.3 now says); `mq_unlink`'s `EPERM` becomes `EACCES`; `mq_open` always sets `O_CLOEXEC`; `__mq_open_2` with `O_CREAT` is `EINVAL` (the reference aborts); send and receive are cancellation points. `SIGEV_THREAD` (D-25.3): one netlink socket and one service helper per process; each notification runs in a new thread with the attributes copied at `mq_notify` (stack size and address, guard, scheduling, affinity; always detached: owner ruling 2026-10-04) and an empty signal mask; a caller-supplied stack serves one notification at a time (owner, 2026-10-04; `boundary::stacks`, as D-23.3): a function that registers again and is still running when the next message arrives is followed by the next notification once its thread has left the stack; a notification whose thread cannot be made (thread limit, memory), at once or after it waited for its stack (`boundary::stacks` hands it back: `mqueue::abandoned`), is not dropped (glibc drops it) but retried, like a timer's (owner ruling #680, extending #269, NOTIFY-RETRY-MQ-AIO 2026-10-22; gain: a notification is delivered late instead of lost when threads or memory are short for a moment; a deliberate difference with a compat-flag placeholder, as #269's; such a flag would be read only after a refusal, so the default path would pay nothing): its record is kept and the timers' helper (D-23.3) retries it with the timers' back-off (10 ms doubling to a 1 s ceiling; `mqueue::retry_due`), once, until a thread starts; the helper is made with the process's first `SIGEV_THREAD` registration (one thread and two descriptors per process, shared with the timers; once made, a registration pays one atomic load), so the retry needs no thread after the refusal; the message used the kernel's registration up, so meanwhile the queue takes a new one (this process's or another's), `mq_notify(q, NULL)` does not cancel the pending retry, and a fork child does not inherit it (tests `mq_refused_notification_retried`, `mq_abandoned_notification_retried`); a NULL function is `EINVAL`; a fork child drops everything. Shared memory: any number of leading slashes; empty, a further slash, `.` or `..` is `EINVAL` (`ENOENT` for `shm_unlink`; the reference opens `/dev/shm` or `/dev` for `.`/`..`); over 255 bytes `ENAMETOOLONG`; opened `O_NOFOLLOW\|O_CLOEXEC\|O_NONBLOCK`, anything not a regular file `EINVAL` (the reference blocks on a FIFO), `O_NONBLOCK` cleared unless asked for; no file-system type check on `/dev/shm`. §25.4 now states the name rules and that `/dev/shm` fails only when missing (owner ruling 2026-10-04).
'''
