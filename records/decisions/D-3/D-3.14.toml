body = '''
**Under an address-space limit (T14, milestone 5, 2026-10-04).** `RLIMIT_AS` counts reservations made with `MAP_NORESERVE`, so the heap's registries (8 MiB of segment bases, 16 MiB of segment hash, 8 MiB of caches, 16 MiB of large blocks) and a 16 MiB segment over-mapped to 32 MiB for its alignment made every `malloc` fail at 20 MB. The registries' capacities are now chosen once, before the first reservation, from `Pages::address_limit` (`getrlimit(RLIMIT_AS)`): unlimited (or 64 GiB and more) keeps the maxima; a limit `L` gives powers of two sized to it (segments for `L`, a cache per MiB, a large block per page; at 20 MiB about 130 KiB in all). Below four segments (64 MiB) no segment is mapped at all. A small request that cannot get a slab (no segment, or a segment that does not fit) is served by a page mapping of its own, as a large block (wasteful, but it allocates what fits). A segment whose over-mapping does not fit is placed exactly: the kernel's choice for 16 MiB, else the aligned addresses around it with `MAP_FIXED_NOREPLACE`. Tests: `an_address_space_limit_sizes_the_registries` (rt) and `conformance/c/s03_rlimit_as.c` (20 MiB through `prlimit`: 1 MiB and 3,835 KiB-sized blocks, then the standard streams still print). **Growth (owner requirement 2026-10-05, milestone 6):** a process that raises `RLIMIT_AS` after start grows the heap past the earlier limit. The sizes chosen at the first reservation are generation 0 of each registry; when an allocation needs more, a new generation is mapped (segment bases and caches: twice the entries before it; the segment hash: one table per generation of bases; the large-block table: a new table of twice the slots when the newest is three quarters full), if the current limit allows the mapping. Generations are never moved or unmapped, so lock-free readers stay valid; a lookup searches the generations (one in the unlimited case, whose generation-0 sizes are the maxima as before). Adding a generation asks the limit again, and segments return when it allows four. Tests: `a_raised_address_space_limit_lets_the_heap_grow` (rt: 20 MiB, then 4 GiB, 50,000 more blocks, then no limit, 40,960 more; merged at 2026-10-05 with the validation thread's test of the same name) and `without_an_address_space_limit_the_registries_keep_their_maxima` (rt: no limit or 64 GiB gives exactly the earlier mappings) and `conformance/c/s03_rlimit_as_raised.c` (soft 20 MiB, hard unlimited; after `setrlimit` 100,000 more blocks and 64 MiB). The remap path of `realloc` also no longer loses a block whose new entry finds no slot (it enters the newest generation). **Measured** (an earlier machine, `cargo xtask bench` under `~/bin/timing`, ns per malloc/free pair, before → after, several runs each): 64 B 13.72 → 13.71–13.81, 4 KiB and 64 KiB 13.7 → 13.7, 1 MiB 33.4–40.3 → 33.7–36.4, batch of 1,000 13.5 → 13.5, one thread 16.8 → 16.7–17.0, four threads 5.1 → 4.7–5.3; sixteen threads 1.2–3.5 before and 2.6–4.0 after, within that row's run-to-run spread (the reference itself ran 0.55–2.74 ns, and the unchanged code failed its 2× budget once). The segment registry, read by every `free`, is kept on cache lines of its own.
'''
