id = "D-13.14"
section = "s13"
spec = "§13.1–13.3, §13.8–13.9"
ann = "HIST, ARB"
status = "active"
body = '''
**Implemented (phase 12); decisions.** *cwd:* `getcwd` asks the kernel, and on `ENAMETOOLONG` walks `..` (`openat`/`getdents64`/`fstatat`, by inode then `stat`); an unreachable directory is `ENOENT` with the kernel's `(unreachable)…` text left in the buffer; `getcwd(NULL, n)` allocates n bytes; `getwd` beyond `PATH_MAX` is `ENAMETOOLONG` (getwd(3); glibc `ERANGE`), NULL `EINVAL`; the `_chk` forms terminate per D-C0.5 literally. *Streams:* a 32 KiB buffer; `readdir` returns the kernel record in place; `opendir` uses `O_NONBLOCK\|O_CLOEXEC\|O_DIRECTORY`; `fdopendir` refuses `O_PATH` and write-only descriptors (`EBADF`), sets close-on-exec and keeps the position; a NULL `DIR*`/`FTS*` is `EINVAL`, a closed one `EBADF`; `readdir_r` with a name over 255 bytes is `ENAMETOOLONG`; `getdirentries` with a NULL `basep` is `EFAULT`; `scandir`'s sort is stable and `*namelist` is written only on success. *Walks:* `nftw` reports each directory once (a global dev/inode set only when following links); `EACCES` from `stat` gives `FTW_NS`, `ENOENT` on a symlink `FTW_SLN`, an `EACCES` open `FTW_DNR`, other `stat` errors end the walk with -1; `nopenfd` is ignored (D-13.4; descriptors are closed and reopened on `EMFILE` with a dev/inode check); with `FTW_CHDIR` the caller's cwd is always restored through an `O_PATH` descriptor; fts: an empty `argv` is `EINVAL`, NULL `EFAULT`; `fts_set` accepts only 0, `AGAIN`, `FOLLOW`, `SKIP` (else -1 `EINVAL`, fts(3); glibc 1); `fts_cycle` points to the ancestor (fts(3); glibc too: FTS-SHARED-PATH found the earlier "glibc the entry" record was the shared path buffer read through the ancestor); `FTS_NOSTAT` skips `stat` unless `d_type` is `DT_DIR`/`DT_UNKNOWN`; a path over 65,535 bytes or a level over 32,767 is `FTS_NS` `ENAMETOOLONG`; `fts_read`/`fts_children` set `errno` to 0 when returning NULL without error, as fts(3) requires (**an exception to X3**). *realpath:* at most 40 links per call; `..` is applied without examining the directory it leaves; the allocating form has no limit (D-13.5), a caller buffer `PATH_MAX`; on failure the buffer holds the resolved prefix including the failing component for `ENOENT`/`EACCES` and is untouched otherwise (as glibc; §13.8 amended 2026-10-03 by owner ruling: the contents are unspecified after any failure). *Temporary names:* 238,328 (62³) attempts, then `EEXIST`, the template keeping the last name tried; names from 64-bit `getrandom` (`GRND_NONBLOCK`) with a clock fallback; the access mode is replaced by `O_RDWR`; a negative suffix length is `EINVAL`; `mktemp` empties the template on failure (mktemp(3)). **Owner rulings (2026-10-03):** `get_current_dir_name` accepts `$PWD` only when it is absolute, has no `.` or `..` component and names the working directory (same device and inode), else the physical path; `$PWD` is ignored in secure-execution mode (`spec/security/threat-model.md`, environment list). Compat-only `nftw@GLIBC_2.2.5`, `nftw64@GLIBC_2.2.5`, `realpath@GLIBC_2.2.5` wait for phase 15.
'''
