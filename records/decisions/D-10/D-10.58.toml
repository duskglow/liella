id = "D-10.58"
section = "s10"
spec = "§10.0"
ann = "—"
status = "active"
body = '''
**`remez --check` runs its fits in parallel and replays unchanged verdicts from a content-keyed cache** (GATE-REMEZ-CHECK-CACHE; D-10.12). Parallelism lives in the `remez` binary (`std::thread::scope`, at most `available_parallelism()` workers on a shared index; one process, one hash of the process image), each fit's output buffered and printed in command-line order, followed by that fit's `step: remez/<fit> <seconds>s` line (XTASK-TEST-STEP-TIMES; the fit's own time measured in its worker, a replayed verdict ~0.0 s, so the per-fit times overlap and no longer sum to the step's wall time), exit status the failure of any fit (a fit left unreported fails). With `--check`, each fit's key is SHA-256 (FIPS 180-4, std-only in `liella_mathtools::check_cache`: the workspace has no external crates and `std` has no 128-bit-or-wider hash) over tagged, length-prefixed fields: the running executable and every file mapped into the process (`current_exe` + `/proc/self/maps`: the executable, `ld-linux`, `libc.so.6`, `libgcc_s.so.1`), the mode, the fit argument and display path, the fit file, the `output` path and the coefficient file (absent is its own field). `strace -f -e trace=openat` of an uncached check over all 22 fits opened only those plus `/etc/ld.so.cache` (loader lookup), `/proc/self/cgroup` and `cgroup cpu.max` (worker count only; output order is fixed) and `/proc/sys/vm/overcommit_memory` (allocator). A fit that checks up to date stores its report in `<target>/remez-check/<key>` (temporary name + rename); a matching stamp prints the report and `up to date (cached <key>)` without fitting; a failing fit stores nothing; the generating mode never reads the cache; `LIELLA_REMEZ_NO_CACHE=1` turns it off. `tables --check` took 5.7 s: not cached.
'''
