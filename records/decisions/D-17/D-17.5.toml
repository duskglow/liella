id = "D-17.5"
section = "s17"
spec = "§17.6"
ann = "HIST, ARB"
status = "active"
body = '''
utmp records keep the ABI layout with the 32-bit `ut_tv` (the file format is shared; Y2038 is F38, a documented limitation, owner 2026-10-04); `liella::users::Utmp` keeps 64-bit seconds. **Unsigned seconds (owner ruling 2026-10-22, #415, option A; a deliberate difference, UTMP-Y2038-UNSIGNED):** the 32-bit `ut_tv.tv_sec` (and `ut_time`, which aliases it) is read and written as UNSIGNED seconds, so login times are correct until 2106-02-07 06:28:15 UTC (`users::ut_tv`, `users::ut_sec`, `users::UT_SEC_MAX`); the file layout and every byte of a time before 2038-01-19 03:14:07 UTC are exactly glibc's (proved by `users_products`: the same records, 0 to 2^32-1, written through utmp, utmpx, wtmp and wtmpx by glibc and by Liella compare equal byte for byte). Gain: correct login times for 68 more years. A time outside `[0, 2^32)` is written, and handed to C, as no time, `(0, 0)`, never wrapped; the times the library stamps itself (`logwtmp`, `logout`; `login` keeps the caller's) are `(0, 0)` after 2106-02-07 06:28:15 UTC or before 1970 (`accounting::stamp`). The C ABI type is unchanged (glibc's signed 32-bit member; sizes and offsets checked by `appendix_c_layouts` and `s17_6_c_3`): a C caller's 32 bits pass through unchanged both ways, and C callers must read the member as `uint32_t` after 2038 (Liella ships no headers, so there is no helper macro; the cast is the documented way, `docs/differences-from-glibc.md`). Readers on the host (black-box, records written by Liella): coreutils 9.4 `who`, util-linux 2.39.3 `last` and `utmpdump` read the member as signed and print 1901-12-13 to 1969-12-31 for a post-2038 time (none shows the correct date; before this change they printed 1970-01-01 for the `(0, 0)` record, equally wrong but with the time lost); `w` reads only the system utmp and `lastlog` only `/var/log/lastlog`, which Liella never writes (glibc has no lastlog interface; `struct lastlog`'s 32-bit `ll_time` is layout only), so neither was checked. Compat flag placeholder COMPAT-9 (`docs/compat-flags.md`) would restore `(0, 0)` after 2038; default-path cost: none (the range check is the same one compare with another bound). utmp and utmpx share one layout and one set of translations. The cursor (`accounting::UtmpDb`, process-wide, locked) opens the file read-write, else read-only, in which case `pututline` fails with the refusal's error (`EACCES`; glibc returns NULL without errno). Searches go forward from the position; `pututline` replaces the record `getutid` finds or appends. Missing files are never created (observed). Locks are OFD locks with a timed 10 s retry, then `EAGAIN`; no `SIGALRM`; they do not exclude programs that take classic locks on the same files. `updwtmp` appends and truncates back a partial write. `login`, `logout` and `logwtmp` use their own descriptors, not the cursor; `login` without a terminal writes `???` to wtmp only, as login(3) documents (glibc also writes an empty-line utmp record). `utmpname` with a name of `PATH_MAX` or longer gives `ENAMETOOLONG`. The 2.2.5 compat aliases of `login`/`logout`/`logwtmp` wait for phase 15.
'''
