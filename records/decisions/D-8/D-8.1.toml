body = '''
**Internal:** `parse_int::<T>(text, radix, dialect) -> Parsed<T>`, one of `Value{v, used}`, `NoDigits`, or `OutOfRange{clamped, used}`. **Boundary:** `endptr` and `ERANGE` come from `ret`. The `__isoc23_*` names select `dialect = C23`.
