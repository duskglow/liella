body = '''
**AVX2 scan loops, memchr, pointer-returning rawmemchr** (STR-K2, 2026-10-08; owner hot-kernel and RESULT CHECKS rulings). `csys/src/machine/scan.S`: the AVX2 paths of `liella_machine_strlen`, `_strnlen`, `_rawmemchr` and both paths of `_memchr` take D-4.24's shape: head [s, s + 64) unaligned when it stays in s's page (page offset <= 4032), else the aligned 64-byte group holding s masked below s; aligned group g1 = (s & -64) + 64; 128-byte aligned groups from (g1 + 64) & -128 with ONE branch per 128 bytes (strnlen/memchr add the bound test before each group: a group is loaded only if it starts below s + n, saturated). AVX2 heads and g1 build the 64-bit mask of their two blocks directly; the loop exit reuses the compares (rawmemchr, memchr) or the first half's minimum (strlen, strnlen). memchr: n == 0 reads nothing; the n < 16 byte loop is gone (the head covers it); found indices at or past n give n. SAFETY per loop in its comment (D-4.14 page rule as in D-4.24). rawmemchr SSE2 keeps D-4.24's 16 + 48 head: measured on Ivy Bridge (cycles/call, 64-byte string) old 16-byte-steps head 30-32, one 64-byte fold 27, D-4.24 27, glibc 15 - the STR-K1 handoff's hypothesis (head shape caused the cbench 1.41 -> 1.58) did not reproduce. `liella_machine_rawmemchr` now returns a POINTER (decided, internal symbol): `strz::find` (was `index_of`) tail-calls it in shipped builds; `strz::until` derives the index. Wrappers `len`/`len_n`/`find` test `cpu::is_ready()` and send the first call to a `#[cold]` trampoline (`*_cold`: `cpu::init`, call again), so the hot path keeps no frame (push/pop pairs gone). D-4.21 selftest rescan unchanged. Evidence: machine_scanners sweeps (lengths 0..512 x alignments 0..63, page end; memchr every position) on both paths, 7 planted bugs red, scanner_races green; instruction counts in liella-historic:handoff/str-k2.md.
'''
