body = '''
**One-pass kernels for strchr/index, strchrnul, memrchr and strncmp** (SHORT-1, 2026-10-09; owner RESULT CHECKS, HOT KERNELS, ALIGNED BLOCKS rulings). Before: strchr/strchrnul measured the string then searched it (two passes), strncmp measured both texts then compared (three), memrchr ran a Rust byte loop (`bytes::rfind`). Now each export validates once in Rust (`strz::chr`, `chr_or_end`, `rfind_n`, `order_n`: NULL aborts with EFAULT as before; memrchr n == 0 -> NULL without a read, n > isize::MAX aborts; strncmp n == 0 -> 0 without a read, any pointer) and calls one SSE2 kernel in scan.S (`liella_machine_strchr`/`strchrnul`/`memrchr`/`strncmp`). strchr: min(x ^ splat(c), x) == 0 marks c or NUL; head = one unaligned 16-B vector when in s's page, else the aligned block masked below s; then aligned 16-B blocks to a 64-B boundary and pminub-folded aligned 64-B groups. memrchr: from the end, four unaligned vectors ending at s + n when in that byte's page, else the aligned 64-B group with a shifted mask; then (AVX2 level) aligned 128-B blocks wholly inside the region, then aligned 64-B groups; a hit below s is NULL. strncmp: 64 B under one page test of both sides (offsets <= 4032), else 16 B (<= 4080), else one byte; min(x, x == y) == 0 marks a difference or NUL, a hit at or past n is none. Writers (D-4.21): strchr and strncmp re-read the deciding byte(s) and resume the scan after a changed one, so every answer comes from bytes the call read; strchrnul and memrchr return the byte that matched when read. RESULT CHECKS: shipped builds return the kernel's answer; the selftest build compares every answer with the byte-loop reference (`check_answer`, abort on a difference), and machine_scanners sweeps every alignment/length/position plus unmapped-page neighbours; five planted bugs turned it red (liella-historic:handoff/short1.md). FINDING: a variable `shr/shl %cl` in the head cost ~40 cycles per call on Zen 1 (Zen 1) when the count was 0 (aligned inputs): strchr_16_hit 56 cycles with it, ~11 without; the in-page heads therefore use unaligned loads and no shift. Not done here: strlen 16-63 B second SSE2 block, memset zero entry, strcmp/STATE test (IDEAS-SHORT 2, 3, 8).
'''
