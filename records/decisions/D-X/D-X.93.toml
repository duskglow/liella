story = "SETLOCALE-CTYPE-ENV"
date = "2026-11-13"
body = '''
**A repeated `setlocale(cat, "")` that selects the names the categories already have is answered from the query cache without the lock; one category looks its variables up through `getenv`'s scanner, and `LC_ALL` walks `environ` once only when `LC_ALL` itself decides nothing** (SETLOCALE-CTYPE-ENV, #5154; spec s7_1_c_0, s7_2_c_4; no ABI or behaviour change: the environment is read on every call; only the selection, the lock and the locale copies are skipped). Profile of call 11 of the `LC_CTYPE ""` row before (wl_trace, release, Skylake-SP host, next 19c0ea167): 9,562 instructions, ~8,500 of them the walk for all fourteen `LC_*`/`LANG` names inlined into `setlocale` (`strnlen` 1,827, `machine_equal` 1,017): every name starts with `L`, so each `L` entry was measured and compared once per name, and the walk always ran to the end. The selection was already skipped for a kept name (`replace_changed`, D-X.83); the locked path (copy of the global locale, `Locale::eq`, the cache) was ~1,000. Changes: (1) `global_locale::setlocale_env_kept` resolves each category's name as `setlocale_locked` does and, when every one is the current name (`"POSIX"` compared as the `"C"` it reports, D-X.80), returns the cache's answer for that global locale; anything else goes to `setlocale_locked`; (2) one category: `LC_ALL`, `LC_<cat>`, `LANG` through `getenv` lazily, as far as the first non-empty one (a few instructions per entry); (3) `LC_ALL`: `LC_ALL` through `getenv`, the other thirteen from one `getenv_many` walk only when it is unset or empty; (4) `getenv_many` reads a candidate entry once, as far as the longest name and its `=`, and compares only a name whose length puts its end at the entry's first `=` (same answers as `getenv_bounded`; unit test `k_getenv_many_answers_as_getenv_bounded`); (5) `setlocale(cat, "")` is a separate out-of-line function in the boundary, so named calls carry none of its locals (inline it cost the "C" and "POSIX" rows +7). wl_percall release, Skylake-SP, instructions per call, base 19c0ea167 / this / reference: query 76.0 / 70.0 / 44.0; LC_CTYPE "C" 147.3 / 124.3 / 156.1; LC_ALL "C" 141.6 / 119.6 / 156.2; LC_CTYPE "POSIX" 160.3 / 137.3 / 2120.0; LC_ALL "POSIX" 154.6 / 132.6 / 2643.1; LC_CTYPE "" 8254.8 / 587.1 / 2551.0; LC_ALL "" 8804.6 / 1093.0 / 11401.0; LANG only: LC_CTYPE "" 7067.2 / 919.0 / 6225.1, LC_ALL "" 8466.2 / 7180.0 / 21088.6 (the walk for thirteen names remains; open). Considered and not taken: remembering the environment between calls (a program may change `environ` without any library call). Test: `crates/boundary/tests/setlocale_env_repeat.rs` (`LANG` and `LC_ALL` changed between two calls are seen). SETLOCALE-CTYPE-ENV-2: the selection names the variables by number (`ENV_LC_ALL`, `env_key`, `ENV_LANG`) rather than by name, the walk compares an entry whose `=` comes before a name's end only when the name has `=` at that place, and an entry's first byte is read without `strnlen`; LC_ALL set but empty takes the same lock-free path as unset (s7_1_c_0). Release, Haswell-EP host, glibc / 19c0ea167 / new: LC_CTYPE "" 2662.0 / 8257.0 / 515.1; LC_ALL "" 11868.0 / 8801.6 / 1045.0; LANG only LC_ALL "" 21763.4 / 8458.8 / 4296.0; LC_ALL empty, LANG set 22281.4 / 9514.4 / 4831.0; the C, POSIX and query rows unchanged.
'''
