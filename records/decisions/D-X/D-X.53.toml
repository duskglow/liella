tests = ["crates/core/tests/hot_text_products.rs::init_short_programs_stay_within_their_page_fault_bounds", "crates/core/tests/hot_text_products.rs::init_startup_path_lies_in_the_hot_text_range", "crates/core/tests/hot_text_products.rs::init_startup_state_statics_are_in_data1", "xtask/src/hottext.rs::unmatched_keys_of_the_built_profile_fail_unless_allowed"]
body = '''
**Start-up page-fault bounds are the count plus at most 1; every dead hot-text key fails `so` unless allow-listed; start-up state words share `.data1`** (STARTUP-FAULTS-RESTORE, 2026-11-10; owner ruling #4079, 11-07; layout and test policy only, no ABI or behaviour change; extends D-X.22, D-X.47). (1) Bounds: each page-fault bound in `crates/core/tests/hot_text_products.rs` is the count measured after the change plus at most 1 (runs are deterministic under `setarch -R`), and it is lowered whenever a count falls; it is never raised to fit a change (a change that needs a higher bound is a ruling, not an edit). (2) Dead keys: in a fast or release products build, every key of `crates/libc-so/hot-text.list` must match a function section, whatever its tier (D-X.47 guarded only start-up and fork keys). The exceptions are a key whose trace names only the other profile and a line of `crates/libc-so/hot-text.absent` (`<key>\t<profile>\t<reason>`, the reason required); an allow line whose key now matches or is no longer listed also fails. `so` writes `target/product/<profile>/hot-text.matched`, and `tools/hottext/prune.py` drops keys that no profile matches (75 dropped at this change; 27 keys the release build inlines are allow-listed). (3) State: `xtask/src/coldbss.rs::move_startup_state` (the D-X.22 renaming mechanism) renames the sections of the small statics that start-up first-writes (`process::AUXV_WORDS`, `sys::SYSINFO_EHDR`, `cpu::AVX2_ERMS_{FROM,TO}`, `global_locale::{GLOBAL,LOCK}`) to `.data1`, which the linker places after `.data` next to `.bss`, and `scan.S` puts `scan_level` there; each listed static must be found exactly once or `so` fails. A structural check, `init_startup_path_lies_in_the_hot_text_range`, links a test program with a map and requires `_start`, `__libc_start_main`, `start::<false>` (and `apply_irelative`, `liella_rt::start::program` when out of line) inside the `.text.startup*` + `.text.sorted.h*` range. \| Zen 1 host (60 vCPU), kit static `printf '%s %d %x\n' a 1 1`, `setarch -R`, warm-up + 5 runs, every run identical: 62 -> 61 page faults (.data 4 -> 3, .bss 3, .text 9). `hot_text_products.rs` counts: startup 17, setlocale+printf 56, tool 59, fork child 7; bounds 18 / 57 / 60 / 8 (fork lowered from 9 by this rule). Skylake-SP host, same test: the same counts, 17 / 56 / 59 / 7. `validation/wl_count.sh` against main (Skylake-SP host), page faults main -> this change: printf-loop 1258745 -> 1240079, seq 126 -> 123, wc 264 -> 259, md5sum 146 -> 144; instructions:u and gating syscalls within 0.01%, output the same. NEGATIVE: moving further statics (`cpu` COPY_MIN/FILL_MIN/ERMS_LARGE_FROM, `fold.S` cmp_sse, `global_locale::MAPS`) to `.data1` left the count at 61: the freed pages got other first writers, so a hand-kept symbol list does not converge; the next step is a trace-generated placement. Plants in `handoff/STARTUP-FAULTS-RESTORE-plants.txt`.
'''
