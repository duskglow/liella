body = '''
**`strftime` boundary fast lane (STRFTIME-FAST; coordinator decision 2026-10-09, internal and testable, no interface change).** `strftime`/`strftime_l` (byte output only; `wcsftime` unchanged) first try `time::fast::strftime`, which reads the caller's `struct tm` in place (`TmRead`, implemented on the C structure by the boundary: no `Tm` copy, no `tm_zone` strlen unless `%Z`), and handles literals plus the conversions of the engine's direct path (numbers, names, `%p`, `%z`, `%Z` with a caller-supplied name, `%T %R %D %F`, `%n %t %%`) and the LC_TIME composites `%c %x %X %r` (built in a 96-byte scratch, stored as one field). It returns `None` BEFORE the call has any effect that the engine would not also have, for everything else: a flag, width or modifier, any other conversion, a trailing `%`, a number outside 0..=9999, `%Z` with NULL or empty `tm_zone` (the process zone is the engine's), a composite past the scratch or the nesting limit, and any text that does not fit (so truncation contents are the engine's). On `None` the boundary runs the general engine from the start; the lane stores only whole fields in order, so the engine rewrites the same bytes and the buffer ends as if the lane had not run. Number and field code is shared (`Small`). Tests: `time::format::tests::fast_lane_is_the_general_path` (7 locales x 102 times x ~870 formats - every letter alone and with each flag, a width and each modifier - x every buffer length for the edge times: result and buffer identical to the engine, also after a bail; a decorated format is never taken) and `fast_lane_takes_the_plain_formats`; planted bugs (wrong zero pad, month index, no bail on `%E`/`%O`, stores without room for the terminator) each fail the first.
'''
