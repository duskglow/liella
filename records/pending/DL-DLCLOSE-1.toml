body = '''
**`dlclose`, unloading and deferred reclamation in Liella's `ld.so` (phase 14 DL-17; plan/ph14/design.md §8-§10, plan/ph14/dl-16-dlopen.md §4; probe `tools/probe/dl/close` C-1..C-9, record `== close (DL-17)` in spec/behaviour/dynlink.md).** (1) **Liveness:** an object stays loaded while it is a start-time object, `RTLD_NODELETE`, has an open count above 0, or is reachable from such an object through its `DT_NEEDED` objects or its binding dependencies (objects outside its own dependency closure that its relocations bound to, reported by the relocator; C-3). A bound `STB_GNU_UNIQUE` definition pins its object (C-6). `dlclose` decrements the open count and, at 0, marks from the roots; every unmarked loaded object is unloaded. A promoted object needs as many closes as opens (C-3b); the program's handle closes with 0 (C-9). (2) **Finalisation:** the unloaded set in reverse constructor order; per object `DT_FINI_ARRAY` in reverse, then `DT_FINI`. The finalisers run holding the writer lock only, with the objects still published, so a destructor may call `dlopen`/`dlclose` (C-8) and an exception thrown and caught in a destructor can unwind. `__cxa_finalize(dso)` also drops that object's `pthread_atfork` handlers. A finalised object is skipped by the exit-time finalisers. (3) **Unpublication:** under the state lock the objects leave the global scope, the constructor log, the `l_next`/`l_prev` chain and the reader table (an entry's header count set to 0); `dlpi_subs` moves before `dlclose` returns (C-1). (4) **Reader epochs (implements D-27.44's `read_section`):** two-parity reader counters striped by thread pointer over 32 cache lines. A reader increments its stripe's counter for the current parity, re-checks the parity, and decrements on leaving. A retired object goes in two steps, both taken by a writer (under the loader's locks) only when the parity readers no longer enter with has drained (its counters sum to 0): the parity flips, which marks every object retired since the last flip, and at the next such moment the marked objects are unmapped. The parity never flips while the other one still counts a reader, so a reader that entered before one flip is never counted with readers that entered after the next (a flip on every `dlclose` would let two closes inside one `dl_iterate_phdr` walk unmap the object the walk is visiting). With no reader inside both steps happen at once, before `dlclose` returns; otherwise at a later `dlopen`/`dlclose`. No writer waits for a reader while it holds the loader's locks, so a `dl_iterate_phdr` callback that calls `dlclose` cannot deadlock, and the object it closed stays mapped until its walk has left (the one wait, at entry and holding no lock, is (9)). Chosen over per-thread epochs in the thread block (design.md wording): same guarantee, no thread walk; the only per-thread word is (9)'s depth. (5) **Slots:** the 512-object table stays; a freed slot is reused once every slot above it is free and reclaimed (the path and dependency arenas rewind), so an open/close loop reuses the same slots. `_dl_find_object` keeps scanning the published table in load order (the sorted index is left to DL-OBJ-TABLE-GROW). (6) **TLS:** a closed module's static-TLS surplus place is freed and its module ID returned; IDs are handed out lowest-free first (C-4, C-5: the same ID on re-open) and every release moves the TLS generation on, so a thread whose dtv names the old block repairs it in the slow path; each thread's entry for the ID is cleared under the thread-list lock. (7) **Errors:** NULL, a pointer that is not a handle, or a handle with no open left: -1 and `dlclose: invalid handle` (D-27.32 and its differences row); a success clears a pending text (C-2). (8) **Known edges:** an object a destructor re-opens stays, its destructors already run (they run again at exit); a `dl_iterate_phdr` callback that leaves by `longjmp`, or whose thread exits inside it, stays counted: objects closed meanwhile stay mapped (never a fault), and once (9)'s threshold is passed every later `dlopen`/`dlclose` outside a read section waits for that reader for ever; `dlsym` does not create binding dependencies; thread-local destructors a plugin registered do not pin it; the atfork nodes of dropped handlers are kept (40 bytes each). (9) **Waiting for room (ruling #5651, 2026-11-14, story DL-DLCLOSE-3):** a reader preempted inside a walk stalls every unmap, so a loop of opens and closes could fill the 512-object table and refuse a valid `dlopen` (15 of 240 stress runs of the concurrent test). When more than a quarter of the table (128 objects) is retired, `dlopen` and `dlclose` first reclaim at their entry, holding no loader lock, and while that leaves too many they poll (`clock_nanosleep`, 50 µs) until the parity drains, then reclaim again. Reason: refusing a valid load is the worse failure, and a `dlopen` that waits behind `dl_iterate_phdr` is the behaviour applications already meet with the reference. The caller never waits when it is itself inside a read section (a callback that calls `dlopen` may be the reader it would wait for: it goes on and fails with `cannot load more objects` only if the table is full) or holds the writer lock (a constructor or destructor: another thread's callback may be blocked on that lock). "Inside" is the thread block's `dl_reading` depth (0x288, one of the spare words), written by its own thread around every read section: exact, where the reader's stripe can be shared with another thread. A `fork` child clears the reader counts of the threads it does not have; when it forked from inside a read section it keeps them and never waits. No lock is held while waiting, so a callback's `dlopen` in another thread proceeds. Tests: `s27_1_c_4_dlopen_waits_for_readers_only_outside_them` (a callback's open/close loop fails cleanly at the full table; a stalled reader makes the main thread wait after 100..200 pairs, not fail; a constructor passing the threshold behind a reader blocked on the writer lock does not deadlock), and the concurrent test under stress.
'''
