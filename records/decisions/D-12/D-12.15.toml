body = '''
**Temporary names and the libio entry points** (phase 8). `ctermid` is `/dev/tty`; `cuserid` (added in the validation stage, 2026-10-05, validation T2) is the effective user's name from the user database (the reference's choice), at most `L_cuserid` - 1 = 8 bytes and a NUL, in the caller's buffer zero-filled to `L_cuserid` bytes, or (NULL) in the calling thread's `getlogin` block, which cuserid(3) says `getlogin` may overwrite (static results per thread, D-C0.2); a user without an entry gives an empty string in the caller's buffer (only its first byte written) and NULL for NULL, `errno` untouched, as `getpwuid`'s "not found"; a lookup that fails is NULL with its error (the reference, probed in a user namespace and with a fixture database in `users_products.rs`; clause `s12_12_c_4`). Merged 2026-10-04 with the ledger thread's implementation of the same function: its per-thread string, its one-byte write without an entry and its error result replaced the process-wide buffer. The libio main entry points (`_IO_getc`, `_IO_putc`, `_IO_feof`, ... `_IO_padn`, `_IO_sgetn`, `_IO_seekoff`/`_IO_seekpos`, the list lock and iterator) are the public functions under their old names, as §12.13 says. The vtable objects and the libio internals are phase 15 (F32); `_IO_popen` and `_IO_proc_*` come with `popen` (§18). `stdio_products.rs` covers them. `tmpnam`/`tmpnam_r`/`tempnam` (rewritten under the clean-room rules of §1.4, item 5, in a fresh session from the spec, `spec/behaviour/tempnam.md` and black-box probes): a name is `dir/` + prefix + six characters from `[A-Za-z0-9]`, from one `getrandom(GRND_NONBLOCK)` 64-bit draw per attempt (clock bits when it fails); trailing slashes of `dir` are dropped keeping its first byte (`/` gives `//r…`, as observed). The name is checked with `lstat`: `ENOENT` returns it, an existing name means another try, up to `TMP_MAX` (62³) tries, then `EEXIST`; any other error is the failure. `tmpnam`/`tmpnam_r` always use `P_tmpdir` (`/tmp`) with prefix `file` and never `TMPDIR`; `/tmp` not being a directory is `ENOENT`; `tmpnam(NULL)` uses one library-owned 20-byte buffer; `tmpnam_r(NULL)` is `EINVAL` (S6; the reference returns NULL without `errno`). `tempnam` takes the first directory of: `TMPDIR` (ignored in secure mode or when empty), `dir`, `P_tmpdir` (following symlinks; writability is not checked; none is `ENOENT`), the first five bytes of `pfx` or `file`, and returns a `malloc`ed name. `errno` is never written on success (X3; the reference leaves `ENOENT` from rejected candidates). `stdio_products.rs` (`== names`) covers the observable rules. `_IO_getline(fp, buf, n, delim, extract)`/`_IO_getline_info(..., &eof)` (rewritten under the clean-room rules of §1.4, item 9, in a fresh session from the spec, `spec/behaviour/getline-info.md` and black-box probes): bytes are read into `buf` until the delimiter, end of input, or `n` bytes; the count stored is returned and no NUL is written. The delimiter is stored and counted when `extract` > 0, consumed but not stored when 0, and left in the stream when < 0. A full buffer stops without looking at the next byte. `*eof` (may be NULL) is 0 on entry and `EOF` when end of input or a read error stops the read. The stream is not locked (observed: the call does not wait for a lock held by another thread). The delimiter is compared by its low byte, as `getdelim` does; the reference's result for a delimiter outside 0..255 depends on its buffer state, which Liella does not reproduce (a deliberate difference, §1.4 goal). Implementation: `boundary::stdio::getline_info`. `stdio_products.rs` (`== libio`) covers it.
'''
