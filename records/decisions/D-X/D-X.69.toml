body = '''
**Start-up data keys are regenerated by access per profile, and a stale key is caught by a trace** (LAYOUT-DATA-CLUSTERS-5, 2026-11-11; #4602; extends D-X.64 and D-X.67; layout only, no symbol, no behaviour change). `crates/libc-so/startup-data.keys` is refreshed with `tools/hottext/startup_data.sh` once per profile (fast, then release) without `--replace`: each pass replaces only its own profile's keys, so the other profile's keys stay and the release build's STARTUP-DATA-WINDOWS contract still finds its profile (a fast `--replace` pass drops the release keys and the release build then refuses). The keys come from the isolated link of D-X.67 (every `.data`/`.bss`/`.lbss` input section on a 64 KiB boundary of its own), so every writable object `page_faults true` touches is keyed, and `xtask/src/coldbss.rs` moves each one of at most 4 KiB in a section of its own into `.data1`. Tests (crates/core/tests/hot_text_products.rs): `init_startup_data_accesses_are_in_the_data1_cluster` traces `true` in that isolated link with `perf record -e page-faults -d` and names every such static start-up touches outside `.data1` (the existing `init_written_startup_objects_are_in_the_data1_cluster` reads the keys file, so it cannot see a key that no longer matches a renamed or re-split static); `init_data_clusters_hold_at_every_text_phase` gains the `data` region, `.data` padded by 0x800, 0x1000, 0x2000 and 0x3000 bytes ahead of every library object, with the start-up, tool and fork-child counts required to stay.
'''
