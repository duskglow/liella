body = '''
**strcmp head, exact page test, page-end step-back; upper state rule** (STRCMP-2, STRCMP-3; amends D-4.29/D-4.31). (1) AVX2 level: a 16-byte VEX.128 head at the strings' starts with no index register settles 1-15 B equal strings and early differences (arghist: most calls); its page test is exact (bit 12 of a^(a+15) or b^(b+15)): the D-4.31 OR pre-test misjudged ~1 in 5 random pairs and its branch mispredicted (Zen 1 strcmp_names 0.166 -> 0.043 misses/call). The equal return yields a's byte (0); the zero vector is a 16-byte .rodata constant. A head miss restarts the general steps at 0 (going on from 16 shifted the long rows' block positions: late_256 +20 cycles on Zen 1). (2) Near a page end the block no longer shrinks to single bytes: above the last full-block offset it steps back by k so it ends exactly at that page's end (bytes before i are known equal and not NUL; the other string's block stays inside its page); single bytes only while i < k. SSE2 16 B, AVX2 32 B. (3) AVX2 group hit: the two blocks' min vectors stay in registers and form one 64-bit mask (no re-read, no branch on the half). Result -1/0/1 and the rescan unchanged. Planted bugs red on Zen 1 (STRCMP-2): wrong sign, AVX2/SSE2 step-back one short (SIGSEGV), locate wrong half. (4) STRCMP-3 (coordinator decision 2026-10-09, decide-or-ask): the D-4.31 rule "vzeroupper before every AVX2 return" becomes "the kernel never returns with upper state it dirtied": the head's two returns (they ran only VEX.128 instructions, which zero the upper halves of what they write) return without vzeroupper (Zen 1 equal_16 experiment 15.1 -> 11.5 cycles); every return after a 256-bit instruction keeps it. A caller that enters dirty keeps its own state. Test: selftest `liella_machine_clean_upper_call` (csys, AVX2 only) runs vzeroupper, calls the kernel with no code in between and ORs the upper halves of ymm0..ymm15 (positive control: a fixture that dirties ymm15). Every `ret` in liella_machine_strcmp sits under a `.Lstrcmp_[v_]ret_<path>` label; the test reads the labels from scan.S and needs a case for each (routes: head, blocks, group, page step, bytes), on both levels, plus 0..40 B at three offset pairs. (5) SSE2 level: the same 16-byte head with the exact page test (both loads movdqu, zero vector from the aligned constant). Planted bugs red on Zen 1 (STRCMP-3): 256-bit equal/differ return without vzeroupper (ymm test), an unlabelled ret (label check), SSE2 step-back one short (SIGSEGV), SSE2 head wrong sign, AVX2 head wrong sign. (6) STRCMP-HEAD (2026-10-10, amends (1) and (5)): the head restarted the general steps at 0 when the first stop was past byte 15 (+14 instr for every such call; RC1 strcoll_utf8_16 57 -> 70). Now one exact page test over 64 bytes, then AVX2: VEX.128 blocks at 0 and 16 (returns without vzeroupper), one 32-byte block at 32 (256-bit returns, vzeroupper); SSE2: four 16-byte blocks; a later block settles with its offset in the displacement; a miss goes on at 64 through the general page test (blocks keep their positions relative to the strings' starts). Zen 1 wl_percall instr/call vs 65c8d2a, measured on the bsf-as-zero-test build 2c47ba1 (the final test+jz build runs one more instruction per head block passed; its own numbers NOT YET MEASURED): d0-15 38 -> 37, d16-31 54 -> 44, d32-63 62 -> 52, d64-127 84 -> 70-78, d128+ +2..+4, C.UTF-8 strcoll d16 72 -> 62 (glibc 62). Rejected on Zen 1 cycles (Zen 1): a 32-byte first block (met the instr target, 37 for d0-31, but +5 cycles on short calls: 256-bit ops + vzeroupper); 32-byte blocks at 16/48 with resume at 80 (cache-line splits for aligned strings, d100 +3 cycles); bsf as the zero test (6 ops on Zen 1, +3.5..7 cycles from d64). Planted bugs red on Zen 1: 12 (H1-H12, $S/work/STRCMP-HEAD/planted.sh). STRCMP-MIX (2026-10-11): the head's exact page test covers 128 B and two 32-byte blocks at 64 and 96 settle stops in bytes 64-127 with no page test of their own (was: the general steps' OR-offset test at 64, which misjudged about 1 in 5 random pairs); a miss resumes at 128. Zen 1 wl_percall instr/call: mix64 86 -> 76, mix128 116 -> 100 (glibc 66.5 / 115.4), no row worse; cost: pairs whose 128-byte window crosses a page take the general start (about 3% -> 6% of random pairs). Planted bugs caught on Zen 1: 6 of 6 (64/96 displacements, resume at 129, page window 63, each missing settle; $S/work/STRCMP-MIX-2/plants.txt).
'''
