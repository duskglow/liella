body = '''
**The environment contract** (ENVIRON-TABLE-CONTRACT; owner rulings #519, #520, 2026-10-22): a Liella extension, off by default, where `getenv` is exactly the reference's (an early-reject scan of the live `environ`). `int32_t liella_environ_contract(int32_t on)` (LIELLA_NATIVE_1) turns it on or off and answers the previous state; `void liella_environ_reload(void)` rebuilds. While on, `getenv` answers from a hashed index of the names (first entry per name, linear probing, at most half full; a hit is re-read at its entry, a miss is trusted), which `setenv`, `putenv`, `unsetenv`, `clearenv` and `liella_env_*` keep current under the environment lock (an append is indexed; anything else rebuilds). A change made any other way (a slot stored, a `putenv` string's name edited) may be unseen until reload; a replaced `environ` is seen at once (the index answers only for its own array). Lookups take no lock and never build or allocate (a sequence word; a lookup racing a writer scans), so `getenv` stays async-signal-safe. The slots are allocated from the library heap when the contract is turned on (none reserved statically) and grown by a new block; old blocks are never freed (a lock-free reader may still be probing one), at most twice the final size. No environment variable switches it (it would pass across `exec` to programs that never agreed); secure mode needs no special case (`secure_getenv` is unchanged and still scans). `fork` children inherit the table (the environment lock is held across `fork`); `exec` starts a new image with the contract off. Off-mode cost: one load and a predicted branch per `getenv` and `setenv`/`putenv`/`unsetenv`/`clearenv`. Documented in docs/interfaces.md §2; not a differences row (the default is unchanged). Run 1's exact default-mode cache was dropped: glibc sees a `putenv` string's name edited in place, so an exact cache must scan for every miss.
'''
