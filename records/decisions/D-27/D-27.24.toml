body = '''
**`__libc_start_main` under Liella's `ld.so` (phase 14 DL-14, plan/ph14/design.md §14): start steps 1-4 run once, in libc's early init; libc runs the program's `DT_INIT`/`DT_INIT_ARRAY`.** Detection: `__liella_libc_early_init` (D-27.22) sets a libc-private flag as its last act, and `__libc_start_main` takes the dynamic path when the thread pointer is set and the flag is set; only Liella's `ld.so` calls the early init, so no other loader's thread block is read to decide, and a static program tests the flag only after its own `ARCH_GET_FS` answer (its start does no added work). The dynamic path skips steps 1-4 (thread block, secure-mode clearing, publishing `environ`, the names and `__libc_stack_end`, tunables and CPU paths), so a constructor's `setenv` or change of the program names reaches `main`; it keeps `set_tid_address`, threads forbidden until DL-15 gives them the loader's TLS interface, the program's `__fpu_control` (D-10.5, #814), the heap perturb byte, the name-service cache, the initial descriptor and the internal signal, and registers `rtld_fini` (every object's `DT_FINI_ARRAY`/`DT_FINI`, the program's included) and `fini` when the start object passes one. The loader runs the program's `.preinit_array` and every shared object's initialisation and passes the program's `DT_INIT` and `DT_INIT_ARRAY` in `StartInfo` (same build, tag-checked); libc runs them after all shared objects when `init` is NULL (2.34+ start objects) or calls `init` (pre-2.34 start objects), each with `(argc, argv, envp)`, harmless to a `void (*)(void)` under the psABI and what an `init` that runs the arrays itself passes on. Secure mode: the early init opens `/dev/null` on a closed descriptor 0, 1 or 2 before any constructor runs (s1_1_g_3), so a constructor of a privileged program never gets a standard descriptor number from `open`. Proof: `reloc_libc_start_hello_world` (output equal to the host C library's for the same source; three start objects; kernel-started and `ld.so PROGRAM`) and `sym___fpu_control` (the dynamic `fpu_control_*` conformance programs run on Liella; the #814 skip is lifted). Plants: handoff/DL-LIBC-START-plants.txt.
'''
