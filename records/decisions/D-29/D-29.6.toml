id = "D-29.6"
section = "s26-29"
spec = "§29.2, §27"
ann = "COMPAT, SEC"
status = "active"
body = '''
**`libnsl.so.1` is a placeholder of failing NIS/YP and NIS+ stubs** (owner rulings R13 and 2026-10-27, LG-17/LG-18 re-scope; D-27.9's machinery; LEGACY-RPC-LIBNSL-PLACEHOLDER). `cargo xtask so` builds it like the D-27.9 placeholders: its version node and exports from `spec/abi/versions.tsv` (121 names, all `compat` at `GLIBC_2.2.5`, so only an already-linked program binds them; the 6 `GLIBC_PRIVATE` rows are left out, R14-12), `DT_NEEDED libc.so.6`, checked by `product_errors`. No `libnsl.a` (versions.tsv has only `compat` rows, so no static link could use one). **Table-driven:** `crates/libc-so/placeholders/libnsl.tsv` has one row per export (kind and value); `placeholders::stub_bodies` generates each C body from it and refuses a table that misses an export or names a non-export; the test reads the same table. Every stub returns at once and opens, reads or writes no descriptor, socket or file, starts no thread and keeps no memory. **Values** (from black-box probes of the reference with no NIS domain, `ypbind` or NIS+ cold-start file, so a program sees what it sees there): `yp_bind` `YPERR_YPBIND` (10), `yp_get_default_domain` `YPERR_NODOM` (12), `yp_first` `YPERR_RPC` (2), `yp_all` `YPERR_DOMAIN` (3), `yp_match`, `yp_next`, `yp_order`, `yp_master`, `yp_maplist`, `yp_update` `YPERR_YPERR` (6), `ypprot_err` 6, `__yp_check` 0; outputs are left untouched; the NIS+ calls that return a result object (`nis_lookup`, `nis_list`, `nis_add`, `nis_remove`, `nis_modify`, the `_entry` forms, `nis_first_entry`, `nis_next_entry`, `nis_checkpoint`) a new 56-byte result with status `NIS_UNAVAIL` (41) and no objects (the reference's object size and status), freed by `nis_freeresult`; the `nis_error` calls (`nis_mkdir`, `nis_rmdir`, `nis_servstate`, `nis_stats`, the group calls but `nis_ismember`, `__nisbind_create`/`_connect`/`_next`) 41; `nis_ismember`, `nis_write_obj`, `writeColdStartFile`, every `xdr_*` 0 (`FALSE`); `nis_dir_cmp` `NOT_SEQUENTIAL` (3); `__nis_default_ttl`, `__nis_default_access`, `__nis_hash` 0; every other pointer (`nis_local_*`, `nis_leaf_of`/`nis_name_of`/`nis_domain_of` and their `_r` forms, `nis_getnames`, `nis_getservlist`, the `nis_clone_*`, `nis_read_obj`, `readColdStartFile`, `__nis_finddirectory`, `__nis_default_owner`/`_group`) `NULL` with `errno` `EOPNOTSUPP`. **Harmless choices** (no failure value exists): `yperr_string`, `ypbinderr_string`, `nis_sperrno`, `nis_sperror` return the text "NIS and NIS+ are not supported" for every code; `nis_sperror_r` copies it into the caller's buffer (truncated, terminated) and returns the buffer (`NULL` for no buffer); `nis_perror` prints `<label>: <text>` to stderr; `nis_lerror` does nothing (no syslog socket); the `nis_print_*` printers print nothing (no stub ever yields an object to print); `nis_freeresult` frees what it is given (every result comes from a stub, one block); `nis_freenames`, `nis_freeservlist`, `nis_freetags`, `nis_free_directory`, `nis_free_object`, `nis_free_request`, `nis_destroy_object`, `__free_fdresult` do nothing (no stub returns their objects, and freeing a caller-built object could free what its owner frees again); `yp_unbind`, `nis_ping`, `__nisbind_destroy` no effect. No restore option (security, as D-29.4/D-29.5). Test: `crates/core/tests/s29_legacy_clauses.rs` `s29_2_c_0`; `placeholders::tests`.
'''
