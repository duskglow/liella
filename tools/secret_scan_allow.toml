# Allowlist for the release secret scan (checklist gate 3), read by BOTH passes:
#   - tools/secret_scan.py reads [[py_allow]] (rule + path regex + reason; an entry silences exactly that rule on
#     exactly the paths it matches, in every commit and in the worktree);
#   - gitleaks reads this file as its config (--config) through tools/secret_scan_cut.sh: [[allowlists]] with
#     condition = "AND", paths and targetRules (one rule per entry, one path set per entry).
# Never add a blanket path or rule. Every entry carries a one-line reason. A hit that no entry names fails the scan.
# Values were never opened; entries are triaged from rule + path (see handoff/release-secret-scan.md).

[extend]
useDefault = true

# ---- secret_scan.py (git-grep style pass) ----

[[py_allow]]
rule = "url-credentials"
path = '^tools/secret_scan_selftest\.py$'
reason = "the scanner's own decoy/plant fixtures (fake bob:hunter22 URL); the selftest proves they are still CAUGHT"

[[py_allow]]
rule = "url-credentials"
path = '^handoff/release-secret-scan\.md$'
reason = "the scan report quotes the url-credentials rule shape; no real credential"

[[py_allow]]
rule = "secret-assignment"
path = '^crates/core/tests/oracle/nscache_check\.c$'
reason = "nscache oracle test fixture (passwd/secret-named test data), triaged 10-2x as false positive"

# ---- gitleaks pass ----

[[allowlists]]
description = "generic-api-key on identifier/table strings in time-zone code (triaged false positive)"
condition = "AND"
paths = ['''(^|/)crates/core/src/time/zone\.rs$''']
targetRules = ["generic-api-key"]

[[allowlists]]
description = "generic-api-key on symbol-name strings in the legacy-symbol test (triaged false positive, old path)"
condition = "AND"
paths = ['''(^|/)crates/posix/tests/s29_legacy_symbols\.rs$''']
targetRules = ["generic-api-key"]

[[allowlists]]
description = "generic-api-key on symbol-name strings in the legacy-symbol test (triaged false positive, moved path)"
condition = "AND"
paths = ['''(^|/)crates/boundary/tests/s29_legacy_symbols\.rs$''']
targetRules = ["generic-api-key"]
