body = '''
**`jn`, `yn`, `jnf`, `ynf` (orders `\|n\| >= 2`) take a recurrence tier before the 384-bit path (LIBM-F64-BESSEL-N).** `crates/math/src/fast_bessel_n.rs` builds a double-double value with a proved absolute bound from the fast `J0`, `J1`, `Y0`, `Y1` kernels (D-10.13's fast tier) and settles it with a rounding test in the caller's mode; a bound that does not settle, and every operand or result outside the tier's range, goes to the 384-bit path unchanged, so results stay correctly rounded (D-10.13). Method: `yn` by the forward three-term recurrence (A&S 9.1.27, stable upward); `jn` by the power series when `x² <= n + 1` (A&S 9.1.10), the forward recurrence when `n <= x`, and otherwise Miller's backward recurrence normalised by the forward value at `⌊x⌋` (Gautschi, SIAM Review 9 (1967); the start index from the ratio bound `J_k/J_{k−1} <= x/(2k − x)`); the `float` forms through the same `double` kernels with a `float` rounding test. Error bounds: a rounding error at step `k` reaches index `m` through the Casoratian `(πx/2)(Y_k J_m − J_k Y_m)` (A&S 9.1.16), bounded with `\|J_k\| <= min(1, (x/2)^k/k!)` (A&S 9.1.60, 9.1.62) and the modulus `M_ν = (J_ν² + Y_ν²)^(1/2)`, increasing in `ν` (Nicholson's integral, DLMF 10.9.30); on the oscillatory side by Cauchy-Schwarz `\|Y_k J_m − J_k Y_m\| <= M_m²` with `M_m` bounded from both recurrences (the smaller root of `M <= a + cM²`, capped a priori by the first bound); double-double step errors per Joldes, Muller and Popescu, ACM TOMS 44 (2017). Declines by design: orders above 4096, `\|x\|` outside `[2^-990, 2^500]`, forward values beyond `2^960` (`yn`'s overflow region), and the oscillatory side above about `x = 2^100` where the a priori cap fails. Tests: `crates/math/tests/fast_bessel_n.rs` (the tier against the 384-bit path in four modes per regime with a settled share of at least 95%, operands next to zeros, kernel bounds against the 240-bit oracle, rounding-test straddles, and an ignored 10^7-operand sweep per function).
'''
