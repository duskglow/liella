body = '''
**Static TLS of the initially loaded objects (DL-12 `DL-TLS-STATIC`, design §7, R14-4).** `liella_ld::tls` lays out the static TLS of the program and its dependencies as pure logic over the `Arch` table (new rows: `TLS_VARIANT`, `TCB_SIZE`, `TCB_ALIGN`, `SELF_SLOT`, `DTV_SLOT`, `STACK_GUARD_SLOT`, `POINTER_GUARD_SLOT`, `DTP_BIAS`, `TP_BIAS`, `apply_tls`). Offsets follow Drepper, "ELF Handling For Thread-Local Storage" §3.4 (variant II for x86_64: the program's block ends at TP, later modules below it in load order; variant I implemented from the same paper, tested by A-4), extended so that a block keeps `p_vaddr mod p_align`. Module IDs start at 1 over the objects with `PT_TLS`, in load order. Below the last block: a 64 KiB surplus of untouched anonymous memory (R14-4). **The initial area** is one anonymous mapping: surplus, blocks, Liella's thread block at TP (FLAG_OWN, self words, canary and pointer guard taken from AT_RANDOM through the provisional block, `%fs:0x28`/`%fs:0x30`), then the dtv. Images are copied after relocation (a `.tdata` word may hold a relocated address) and only from inside a `PT_LOAD`'s file part (else the object is refused). **The dtv** is Liella's own layout: word 0 the generation it was built for, word 1 the slot count, word 1+m module m's block. **Relocations:** `DTPMOD64` (no symbol: the object's own module), `DTPOFF64` and `TPOFF64` via `Arch::apply_tls`; an `STT_TLS` symbol's value is not moved by the load bias; a TLS relocation against an object without `PT_TLS` is refused; `TLSDESC` stays refused (later story, R14-8 primitives). **`__tls_get_addr`** is exported by `ld.so` at the version `spec/abi/versions.tsv` gives it (`GLIBC_2.3`; `cargo xtask so` writes the version script from the table); it refuses a thread block without FLAG_OWN (D-5.11 safety: never read another loader's block word as a pointer), then compares the generation and the slot count before reading a slot; anything else is a failure until the dlopen family adds the slow path. An object naming the interpreter's soname (`DT_NEEDED`) gets the running interpreter (its file read for the tables, its image not relocated again), so `__tls_get_addr` resolves in the global scope. Tests: `crates/ld/tests/tls.rs` (layout, arithmetic, dtv lookup; the LE/IE/GD/LD matrix over a program and two libraries, alignments 4-64, as `ld.so PROG` and through `PT_INTERP`). Not covered: variant I host tests (A-4), TLSDESC, threads (DL-13 `__liella_tls_init`).
'''
