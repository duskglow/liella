body = '''
**argp core: one compiled option table, explicit parse phases, a returned result** (COLD-REWRITE2-W-far-01-REWRITE, 2026-10-21; record `liella-historic:handoff/decisions/COLD-REWRITE2-W-far-01-REWRITE.md`). (1) *Table:* `Table::new` compiles the parser tree once, in preorder with the standard options last, into one ordered table: entries (owner, key, argument, flags, text, group), names with a `shown` bit (the first claimant of a name wins in parse and help alike), `by_letter` (O(1) short lookup), the getopt view (`longs`, `optstring`) and the help order; all storage `TryVec` (ENOMEM, never a panic). A glibc-shaped design keeps per-parser getopt tables. (2) *Parse phases:* INIT (preorder; `view.next` 0), options through `getopt::next` over the table, operands (`ARG` then `ARGS`, preorder; an operand nobody takes, or any under `NO_ARGS`, stops the parse: `Parsed{index, stopped}` with an index, else EINVAL), finish (`NO_ARGS` to parsers with `arg_num == 0`, `END` reverse preorder), then `SUCCESS`/`FINI` or `ERROR`/`FINI`. Probe-settled accounting: `ARGS` accepted consumes every remaining element; `ARG` with `next` raised by k counts `1 + k`; `next` lowered to the operand's own index resumes at `i - 1` (coordinator ruling #397: follow the reference). (3) *Help and usage:* each entry's place key (group rank, own entries before child clusters, cluster preorder) computed once; sections sort by first shown name ignoring case, long-only first on a tie, documentation entries not starting with `-` last; exactly one blank line between sections; usage `[-abc]`, then shorts with an argument, then longs; `ARGP_HELP_FMT` values decimal up to 65535, `rmargin` at least 1, `COLUMNS` sets `rmargin = COLUMNS - 1`. `POST_DOC` filters are called for every parser with a filter (NULL when it has no post text), as probed. (4) *Error exit:* the core never prints or exits; `parse` returns `Result<Parsed, Failed>` and reports through `Host`; exit policy stays in `liella_legacy::argp`. Run 2: `ARGP_PARSE_ARGV0` starts at element 0 only with `ARGP_NO_ERRS`; an `INIT` error takes the error path; a short option shows its argument without `dup-args` when it has no shown long name; the `Longs` view's `val` is a name index.
'''
