body = '''
**Proposed, not in force until the owner rules: the start-up layout comes from a trace of the build being grouped, and no function name crosses a build** (LAYOUT-RETHINK; planning only, no product, ABI or behaviour change; would later amend D-X.20, D-X.47, D-X.53, D-X.56, D-X.63, D-X.77 and D-X.78; full text `plan/layout-rethink.md`). What a hot-text key must identify is a function section of the archive being built, its first-touch order and its tier. A committed name only carries a trace of build N into build N + 1, and under fat LTO that carry breaks in three ways: inlined (the bytes sit in a traced caller; the dead-key check fails), renamed (the check fails), and newly outlined (the section is missing from the list and lands in cold text; nothing fires). Proposal: `cargo xtask so` links the probe programs against the archive it just built, traces them, and groups exactly the sections they ran (LT-1). Clusters are defined by probe phases opened by ABI calls (LT-2). A ptrace tracer replaces gdb (LT-3). The trace is made independent of the build host (IFUNC candidates by rule, in-tree locale data; LT-4). Then the committed lists, `hot-text.absent`, `hot-text.unpinned`, the dead-key check, `--hottext-regen`, `hottext-repair`, `hottext-recheck`, the train's `hot-lists` step and the lane are deleted, and the 45 key-only pins are reviewed (LT-5). \| Haswell-EP host, relay harness, every run identical, base b31418181. A list traced from this build only, against next, fast / release: start-up 11 / 10 against 11 / 10, setlocale + printf 49 / 50 against 49 / 51, tool 53 / 53 against 52 / 54 (fast +1, one text window, open), localtime 17 / 18 against 19 / 18, puts 17 / 17 against 18 / 17, cat 24 / 22 against 24 / 22; group 507 / 546 KB against 521 / 563 KB. Re-tracing the same products gave a byte-identical list; tracing costs 59 s (fast) / 26 s (release) per build with today's gdb tracer and no second compile. Compiler change (LLVM inline threshold, fast): at 200, next's list had 2 dead keys but 26 newly outlined functions were missing from it, setlocale + printf 58, tool 59, localtime 22; at 300, 9 dead keys, 49 -> 52 and 52 -> 55. Lists traced from those builds read 49-50 / 52 / 17. The loss follows the newly outlined functions, not the dead keys. At 300 the fresh list's rebuild still failed on `hot-text.clusters`, which names an inlined closure. The closure of the exported roots (keys on ABI names only) is 2.1x the traced bytes (4x in the start-up tier), misses 61 sections reached indirectly, and breaks STARTUP-TEXT-WINDOWS / the start-up read-only window: rejected. PGO cannot express order or clusters and drops stale profile entries silently; post-link reordering cannot reach `libc.a`. Open for the owner: tracing at build time and its sandbox fallback, cross-host reproducibility before the default changes, HOTLIST-TRAIN-REGEN-2, and a warning-only dead-key check as the interim.
'''
