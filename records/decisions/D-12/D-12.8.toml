id = "D-12.8"
section = "s12"
spec = "§12.11"
ann = "HIST"
status = "active"
body = '''
Implemented under the clean-room rules of §1.4 (item 1) in a fresh session, from the spec, `spec/behaviour/printf-registry.md` and black-box probes. **Internal:** the engine knows registrations only through two hooks, `printf::Registry` while parsing (modifiers, and the arguments a registered letter takes) and `Env::custom` while rendering (the handler's output); the format language has no global state. **Boundary:** the registry is process-wide in legacy (contract): `legacy::printf_registry` keeps letters 0–255 (handler and argument function), sixteen modifiers (one `user` bit each; characters below 256, at most 64; a re-registered text gets a new bit and wins) and types 8–255 (`ENOSPC` beyond) in atomics; registration takes one lock (observable, stricter than MT-Unsafe), formatting takes none. A modifier is matched once, longest first, after the precision and before the length. An argument function is called with room for one type and again with room for all (for `parse_printf_format`, with the caller's room from its position); -1 or none means the built-in rules. A positional registered conversion takes arguments p to p+k-1 (the reference reads only p). Registered types are read by their own function on the caller's `va_list`, into objects the handler sees through a pointer. A handler gets a memory stream oriented like the destination and a `struct printf_info` whose length bits follow observation (`q` is `L`; `ll`, `w64` and `wf16`+ set `is_long_double` and `is_long`); what it writes is the whole field and is counted as written (its return value is ignored); -2 falls back to the built-in conversion (or the text as written); other negatives fail with its `errno` (`EINVAL` if it left 0, spec over reference). While anything is registered, stream output is collected and written at the end, so no handler runs while a stream record is borrowed. `printf_size` and `__printf_fp` (legacy, over `printf::float_text`) follow the observed rules (scaling by 1024/1000 by repeated correctly rounded division, units ` kmgtpezy`/` KMGTPEZY` by letter case, default precision 3). Reference behaviours matched that may be historical (candidates for a later cleanup): `__printf_fp`'s non-`f`/`e` letters use `%g` form with the exponent letter two below the conversion letter; `parse_printf_format` reports `PA_INT` for `%Li`/`%qi`; `printf_size` never scales negative values and drops the sign of a negative NaN. `registry_products.rs` compares the reference end to end with an empty KNOWN list.
'''
