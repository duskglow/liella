id = "D-5.5"
section = "s05"
spec = "§5.1, §7.3"
ann = "COMPAT, PERF"
status = "active"
body = '''
**The per-thread ctype table pointers are always current, and every byte-classification entry reads them** (APPROVED by the owner 2026-10-06; the probes below come first). **Evidence (Haswell-EP, perf, Liella's own binary):** `toupper` resolves the locale on every call: thread pointer, the thread's `uselocale` word, the global handle, the interned object, its kind and table length, then the table: about 5 dependent loads and 5-6 branches; `toupper_c` is 2.4x glibc (about 1.3x expected after PJ-21). The ABI already has a per-thread cache: `__ctype_b_loc`, `__ctype_tolower_loc`, `__ctype_toupper_loc` return the address of the calling thread's pointer to the active table (spec §5.1 COMPAT note; table layouts `u16[384]` / `i32[384]`, index -128..255), and the headers' inline `is*`/`to*` forms read through it. Liella keeps those three words in `ThreadBlock` but fills them lazily (`locale::ctype_slot` re-resolves and stores on every `*_loc` call), and its own `toupper`/`is*` functions do not use them. **Decision:** (1) the three words hold the active tables at all times: `uselocale` stores this thread's; `setlocale` stores them for every thread that follows the global locale (or whatever semantics the probes below establish); thread creation initialises them; (2) `__ctype_*_loc` return the word's address without re-resolving; (3) `isalpha` ... `toupper`/`tolower` (and their internal callers) read the word through the typed thread-block read (PJ-21) and index: one `%fs` load, one range check (EOF and -128..255; other values as today), one table load. Tables are immutable and interned (never freed), so readers take no lock; each word is one aligned atomic store/load (Release/Acquire). **Three-way questions, settled FIRST by black-box probes (glibc vs Liella):** (a) after `p = __ctype_b_loc(); uselocale(l2);` does `(*p)[c]` classify by `l2`? (b) after another thread's `setlocale(LC_CTYPE, ...)`, does this thread's already-fetched `*p` follow it, and when? (c) `uselocale(LC_GLOBAL_LOCALE)` then `setlocale`. If Liella's lazy fill answers differently from glibc today, that is a correctness bug this row fixes (a differences row if the spec says otherwise). **Out-of-the-box follow-up (not in this row):** a per-table flag "ASCII-identical case and class for 0..127", computed when a locale is interned, so bulk internal users (`strcasecmp`, `FNM_CASEFOLD`, `REG_ICASE`, case-insensitive collation in C/C.UTF-8) take an AVX2 path folding 32 bytes per instruction where the flag holds. **Expected:** `toupper_c` and `isalpha_c` about 1.0-1.1x glibc on Haswell-EP; compiled programs stop paying a full resolution per `*_loc` call. **Implemented (PJ-22, 2026-10-07).** Probes (spec/behaviour/ctype-words.md): glibc keeps a fetched pointer current across `setlocale` in the same thread and `uselocale`; a new thread starts on the global locale; another thread's `setlocale` does not reach other threads (glibc), where Liella keeps D-7.8 (every thread on the global locale, at once; differences row updated). Liella before PJ-22 left fetched pointers stale until the next `*_loc` call: a correctness fix. Local decisions: (i) writers are `uselocale` (own words), `setlocale`/`liella_locale_invalidate` (every listed thread whose choice is the global locale, plus the caller, `thread::each_block`), thread listing (`list_insert`); every store of the global tables and every switch to or from the global locale holds the thread-list lock and reads the global handle inside it, so the last update is the newest locale; object-to-object `uselocale` and processes that certainly have one thread take no lock; no new lock order (the lock is taken with nothing held and nothing taken under it). (ii) Readers index the word through `conv::mapped_bytes` (the existing slice site that already serves locale file bytes): no new unsafe, tb-field stays 1. (iii) A word of 0 (a thread the runtime does not list: test processes, D-22.10) takes the old resolution path; `*_loc` fills it once. (iv) `pthread_create` clears the new block's `locale` word (a reused mapping could hold the old thread's). Cost: no memory per process or per thread; `uselocale` to/from the global locale in a multi-threaded process takes the thread-list lock once; `setlocale` walks the thread list once.
'''
