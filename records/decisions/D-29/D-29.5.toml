body = '''
**The ONC RPC client, port mapper calls and server are failing stubs** (owner rulings R13 and 2026-10-27; the client/server item of D-29.4; supersedes D-29.2 and the LG-14/LG-15 behaviour of D-29.1; LEGACY-RPC-CLNT-SVC-STUBS). Each name stays exported at its compat version, and the 17 not exported before (`clnt_create`, `clntraw_create`, `clntunix_create`, `callrpc`, `clnt_broadcast`, `pmap_set`, `pmap_unset`, `pmap_getmaps`, `pmap_rmtcall`, `getrpcport`, `get_myaddress`, `rtime`, `registerrpc`, `svcraw_create`, `svcunix_create`, `svcunixfd_create`, `svcudp_enablecache`) are now exported as stubs, so an old program loads. Every stub sets `errno` `EOPNOTSUPP` and opens, reads, writes or closes no descriptor (a caller's `*sockp` and socket untouched), contacts no port mapper and keeps no memory. Failure table: the client and transport constructors (`clnt_create`, `clntudp_create`, `clntudp_bufcreate`, `clnttcp_create`, `clntunix_create`, `clntraw_create`, `svcudp_create`, `svcudp_bufcreate`, `svctcp_create`, `svcfd_create`, `svcraw_create`, `svcunix_create`, `svcunixfd_create`), `authnone_create` and `pmap_getmaps` `NULL`; `callrpc`, `clnt_broadcast`, `pmap_rmtcall` `RPC_SYSTEMERROR` (outputs untouched); `pmap_getport`, `getrpcport`, `pmap_set`, `pmap_unset`, `svc_register`, `svc_sendreply`, `svcudp_enablecache` `0`; `registerrpc`, `rtime` `-1`; `_authenticate` `AUTH_FAILED`; `get_myaddress`, `xprt_register`, `xprt_unregister`, `svc_unregister`, `svcerr_*`, `svc_getreq*`, `svc_exit` no effect; `svc_run` returns at once; `_seterr_reply` stores `RPC_SYSTEMERROR`/`EOPNOTSUPP` in its `rpc_err`. Every client-side stub and every constructor also sets `rpc_createerr` to `RPC_SYSTEMERROR` with `re_errno` `EOPNOTSUPP`, which `clnt_spcreateerror` prints. Kept: `__rpc_thread_createerr` (per thread), the `clnt_*err` printers, `__rpc_thread_svc_fdset` (always empty), `bindresvport` (D-15.7), `_rpc_dtablesize`. COMPAT-12 withdrawn and the tunable `liella.compat.rpc_reply_any_source` no longer read. No restore option (security, as D-29.4). Not exported yet (internal names, no documented contract): `__libc_clntudp_bufcreate`, `__rpc_thread_svc_pollfd`, `__rpc_thread_svc_max_pollfd`. Test: `crates/boundary/tests/s29_rpc_clnt_svc_stubs.rs`.
'''
