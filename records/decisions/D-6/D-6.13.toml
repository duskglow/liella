id = "D-6.13"
section = "s06"
spec = "§6.4"
ann = "PERF"
status = "active"
body = '''
**Fused single-byte charmap <-> UTF-8 transcoder (ICONV-3).** COORDINATOR DECISION (ruling 2 of 2026-10-09, yes): each single-byte charmap carries, behind the existing charmap cache, an immutable table of about 1.75 KiB more per process (the `SingleByte` tables grow from 1.5 to about 3.3 KiB: a 256-entry UTF-8 form `(len,[u8;3])` per byte, and the BMP code points from U+0100 sorted with their bytes for a binary search); no per-thread cost, no allocation per call. `Conv::convert` offers `fast::single_to_utf8` / `fast::utf8_to_single` first in each loop turn when the other side is UTF-8 and `fused`; both convert whole characters and stop, touching nothing further, at anything the tables do not own: a byte with no character, a surrogate or a code point above U+FFFF (length 0 in the table), an incomplete or invalid UTF-8 sequence (`decode_multi`, as ICONV-1), a character the charset lacks, or no room for the next character; the general loop then handles that one character (`E2BIG`, `EINVAL`, `EILSEQ`, `//IGNORE`, `//TRANSLIT`, the recorded WINDOWS-1252 difference all unchanged). A miss of the reverse table is never an error, only a hand-back, so the tables are accelerators built from the general lookups (`decode`, `encode`). ASCII runs (charset with ASCII in place) copy up to eight bytes per step (`ascii_copy`, writes exactly the bytes it reports). Tests: `fused_single_byte_equals_the_pivot_loop` (3 synthetic charsets with holes, BMP letters, 3-byte, astral and surrogate entries, a duplicated code point, no ASCII; both directions; every prefix x every output size x 4 flag sets x 2 locales, plus resume), `single_byte_tables_agree_with_the_general_lookups` (every byte, every code point below U+10000), `planted_bugs_of_the_single_byte_paths_are_caught` (7 wrong table entry, 8 reverse map off by one, 9 no hand-back of an unmappable character). Counters (Zen 1, instructions per op): utf8_8859_15_latin_4k 184,108 -> 51,847 (glibc 155,556); 8859_15_utf8_latin 188,273 -> 38,078 (glibc 109,304).
'''
