body = '''
**Reloading time-zone and locale data** (owner item 2, 2026-10-04: "they stay pinned and are never reloaded under normal circumstances, but an explicit invalidation (and any case you judge necessary) must be able to reload them. Apply the same discipline as the name-service cache's invalidation", D-16.10). **Pinned:** every zone a process selects (D-23.6: parsed TZif or rule, kept with its `TZ`, `TZDIR` and file identity), every locale file mapped by path (D-7.7: category files and the archive), every parsed charmap (D-6.8), and every interned locale (D-7.8). None is ever freed or unmapped. **Explicit invalidation** (native, `LIELLA_NATIVE_1`): `liella_tz_invalidate()` and `liella_locale_invalidate()` each advance a generation counter of their own (process-wide; an atomic increment). Every pinned item records the generation it was last validated in. The first use of an item after the counter moved validates it, exactly as the name-service cache's first lookup does: the file's identity (device, inode, size, modification and change times, by `stat`) is compared with the one recorded when it was read. If it is unchanged, the item is marked current and reused, so repeated invalidations of unchanged data cost one `stat` per file and no memory. If it changed or disappeared, the file is read or mapped again (a missing file is then missing, as for a first load). `liella_tz_invalidate` then selects the zone `TZ` names at once (an explicit `tzset`: the globals are written). `liella_locale_invalidate` loads the global locale again by its current names, and keeps the old one if a name no longer resolves (`-ENOENT`). Objects from `newlocale` and `duplocale`, and threads' `uselocale` choices, keep the data they were made with: they are snapshots, and a program makes new ones. **Other cases, argued:** (1) `TZ` changed: a new selection, as before (D-23.6), no change. (2) `TZ` unset and `/etc/localtime` replaced: already seen at the next implicit `tzset`, through a `stat` on every one (§23.6, as glibc). This is the one automatic detection; making it rate-limited (one `stat` a second, as the name-service cache) would remove a system call from every `localtime`/`mktime`, but it changes observable behaviour and is the optimization thread's path, so it is left for a ruling. (3) A zone file `TZ` names replaced by a tzdata update: seen by an explicit `tzset` (as before) or after an invalidation; implicit selections stay free of system calls (pinned). (4) A locale or charmap file replaced: only after an invalidation. Locale data changes rarely and only by administration, and glibc never reloads it; a check on every `setlocale` would cost a `stat` per file for every program that switches locales. Programs that must follow an update call `liella_locale_invalidate`. **Hot path:** conversions, `ctype` and collation lookups, `nl_langinfo` and the `_l` functions are unchanged. A zone selection (already under its lock) adds one atomic load. A locale file lookup inside `setlocale`/`newlocale` (already under its lock) adds one atomic load. **Readers of old data stay safe:** nothing is unmapped or freed. A `struct tm`'s `tm_zone`, `tzname`, a `locale_t`, a cached `__ctype_b` pointer and a compiled regex keep pointing into the old, still mapped, data. **Memory bound:** one copy of a zone or locale file per distinct version a process actually loads after an invalidation (unchanged files are reused), within the caps (1,024 interned locales; 1,024 file slots and 2,048 mappings in all, D-7.7: a replaced file reuses its slot while the old mapping stays, and past the mapping cap a changed file fails to load rather than map again). **Threads:** the counters are atomics; validation and reloading happen under the existing zone and locale locks. **fork:** the child inherits the counters and the pinned data, as any memory. Both locks are already handled across `fork`. **AT_SECURE:** an invalidation reads the same paths a selection would (`TZDIR` and `LOCPATH` are ignored in secure mode as before). It is only the program's own call: no environment variable or file triggers it. **Not covered:** gettext catalogs (their own per-lookup check, D-7.5), and the `iconv` codecs built in. **Tested:** an invalidation with nothing changed reuses the data (no growth). A replaced zone file and a replaced locale file are seen after an invalidation and not before. A reload races with readers in other threads (conversions and `ctype`/`strcoll` lookups never see torn data). The state across `fork` is checked. **Measured** (Zen 1, AMD EPYC 7551, under `~/bin/timing`, 5 rounds after a warm-up, medians, libc.a before and after this change): `mktime_new_york` 443.9 to 435.1 ns, `localtime_r_new_york` 293.3 to 296.2 ns, `strcoll_utf8_16` 24.2 to 24.2 ns, `newlocale_free` 4310 to 3556 ns. Paths the change does not touch moved by -12 % to +15 % (code layout: `isalpha_c` 5.1 to 5.8 ns, `strtod_c` 92.7 to 82.0 ns), so the cost is below what this measurement resolves.
'''
