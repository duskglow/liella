status = "active"
body = '''
**Elementary functions of `long double`** (milestone 5a, `math::wide`, generic over `Float` so that `_Float128` can reuse it). Each function is evaluated in `math::mp` (384 bits) and rounded once, so every result is correctly rounded in every mode: `exp`, `exp2`, `exp10`, `expm1` by `mp::exp`; the logarithms by `mp::ln`/`ln1p`; `sin`, `cos`, `tan` with the argument reduced in 384 bits below 2^29 and by Payne–Hanek above (`mp::reduce_wide`, any significand up to 113 bits over the whole exponent range; the binary64 reduction now calls it); the inverse and hyperbolic functions from `mp::atan`, `sinh_cosh`, `ln1p` in forms without cancellation; `cbrt` by Newton's iteration; `pow` as `e^(y·ln\|x\|)`. Exact results are computed exactly: powers of two (`exp2`, `log2`), powers of ten (`exp10` of 1..55, `log10` of 10^0..10^27), perfect cubes, and every `pow` whose result is a dyadic number of at most 128 bits (`y = m/2^k` with `k <= 6`, `m <= 200`: exact square roots, then an exact power; powers of two to any integral exponent). Arguments whose deviation from a representable value is below a quarter of its last place (`\|x\| < 2^-34` for the cubic ones, `2^-67` for the linear ones, `tanh` beyond 23.45, `expm1` below −50.8, `pow` with `\|y·ln\|x\|\| < 2^-67`, `atan2` with `\|y/x\| < 2^-72` from the exact quotient) are rounded by the side of the deviation. Dispatch: the trait `math::real::Real` (one method per function, implemented for `f32`/`f64` by the double-double code of D-10.13 and for `F80` by `wide`) is what the single body per family in `s10_math.tsv` calls. Conventions as glibc's `long double` forms (`spec/behaviour/libm-elem-ld.md`): the domain NaN of `logl` and `log2l` is positive (unlike `log`, `log2`), `acosl` returns a NaN operand with its sign cleared. Flags and `errno` as D-10.14. **`_Float128`** (milestone 5, M5-5 `MATH-M5-F128-ELEM-1`): `Real` is implemented for `F128` by `wide` too; `expf128`, `exp2f128`, `exp10f128`, `expm1f128`, `logf128`, `log2f128`, `log10f128`, `log1pf128`, `powf128` and `cbrtf128` are exported; M5-6 `MATH-M5-F128-ELEM-2` exports the rest: `sinf128`, `cosf128`, `tanf128`, `sincosf128`, `asinf128`, `acosf128`, `atanf128`, `atan2f128`, `sinhf128`, `coshf128`, `tanhf128`, `asinhf128`, `acoshf128`, `atanhf128` (Payne–Hanek up to `FLT128_MAX` by `mp::reduce_wide`, checked in s10_3_c_r4). Re-derived for 113 bits: the complete over/underflow cut-off of `e^v` is now (EMAX + PREC + 2)·ln 2 per format (11401.6 for x87, 11435.6 for `_Float128`, whose subnormals reach e^-11433 — the old fixed ±11400 would have flushed them; `exp`, `exp2`, `exp10`, `pow`); `exp10` is representable for 1..48 (5^48 < 2^113) and rounded exactly for 49..55; `log10` exact for 10^0..10^48; `pow` exact for 113-bit odd parts by the same rule (3^71 exact, 3^72 rounded exactly); cubes exact up to 120-bit roots; the tiny-argument cut-offs follow from `PREC` (2^-58 cubic, 2^-116 linear, `expm1` below −85.1). Conventions settled by probe (`elem_f128_products.rs` against glibc 2.39): the domain NaN of `logf128`, `log2f128` and `log10f128` is the default negative one (unlike `logl`), and `log1pf128` returns a NaN operand quieted with its sign cleared (−qNaN and −sNaN both probed, M5-6). M5-6 probed the rest: the domain NaN of `asinf128` and `acosf128` is the default negative one (unlike `asinl`, `acosl`: positive), and `acosf128` keeps a NaN operand's sign (unlike `acosl`); `wide` selects the x87 forms by `F::EXPLICIT`. Every other NaN, flag and `errno` of the 14 names already matched glibc; `atanf128(±∞)` raises inexact with ±π/2 where glibc's `atanf128` raises none (kept: ±π/2 is rounded, so inexact is the flag of the correctly rounded result, and glibc's own `atanl(±∞)` raises it too). Known limit, the same as for `long double`: integral `pow` exponents whose exact result has more than about 350 significant bits rest on the 384-bit evaluation's margin, not on an exactness proof.
'''
