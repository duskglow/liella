id = "D-22.16"
section = "s22"
spec = "§22.5 (s22_5_c_5), §22.6"
ann = "ARB"
status = "active"
body = '''
**A static link that takes the keys also takes `pthread_once`** (STATIC-CXX-THROW-PTHREAD-ONCE, -2; ruling #3741, 2026-11-07). libc.a's Rust member (`__pthread_key_create`, the mutexes, ...) holds a `#[used]` static `LIELLA_LINK_EDGE_PTHREAD_ONCE` = `liella_machine_once` (crates/boundary/src/posix/s22_threads.rs), so it refers to machine/once.S's member and every static link that takes it also takes `pthread_once`/`__pthread_once`/`call_once`: a compiler runtime's weak thread references never find the keys without `pthread_once` (a static C++ throw without threads called address 0). A static named `LIELLA_LINK_EDGE_*` is a link edge only: `cargo xtask so` marks its section `SHF_EXCLUDE` in the archive (`exclude_link_edges`; `#[used]` makes it `SHF_GNU_RETAIN`, which `--gc-sections` keeps), so the word and its relocation reach neither a program nor `libc.so.6`, while the undefined symbol still pulls the member; the build fails if no such section is found or `libc.so.6` has one. Tests: `static_cxx_throw_without_threads_runs`, `static_cxx_throw_with_one_thread_runs`, `static_c_pthread_once_alone_runs`, `shared_library_carries_no_link_edge_word` (crates/core/tests/cxx_throw_products.rs).
'''
