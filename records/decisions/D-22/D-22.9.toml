id = "D-22.9"
section = "s22"
spec = "§22.1–22.2, §22.6, §22.9"
ann = "KERN, ARB"
status = "active"
body = '''
**The thread runtime** (phase 6). `pthread_t` is the thread pointer (as glibc). One mapping per thread: guard (rounded to pages; none when 0), stack, static TLS block, thread block, then the *descriptor* (start routine and argument, result, join and detach state, cancellation word, cleanup-buffer chain, setxid request word, stack bounds, the robust-list head, the 32-byte-aligned rseq area, the key table pointer, the per-thread result slots of D-H3), whose address the thread block holds. A caller-supplied stack (`attr_setstack`) gets the TLS block, thread block and descriptor at its top. Creation is `clone3` (falling back to `clone`) with the flags of §22.1, through `machine/thread_start.S`, which switches to the new stack, calls the runtime's entry, and makes the `exit` system call if it ever returns. The kernel writes the TID into the thread block (0x84, `CLONE_PARENT_SETTID`) and clears it at exit (`CLONE_CHILD_CLEARTID`), which is the futex `join` waits on; `gettid` is that load. The main thread's TID comes from `set_tid_address` at startup. The new thread registers its robust list and rseq area itself (Liella owns rseq in its processes, D-22.7; `glibc.pthread.rseq=0` disables it) and publishes `__rseq_offset`/`__rseq_size`/`__rseq_flags`. Stacks of exited threads are cached (up to 40 MiB, glibc's figure) and reused only once their TID word is 0. **No transparent huge pages on thread mappings (owner ruling 2026-10-01).** Before Linux 6.7 a `MAP_STACK` mapping may take transparent huge pages; one that merges with an adjacent anonymous mapping can then have a fault fill a whole 2 MiB range, making the neighbour's untouched pages resident (found by `s11_10_c_10`, which a glibc thread stack did this to). So on a kernel whose `uname` release is below 6.7, each thread mapping is made `PROT_NONE`, marked `MADV_NOHUGEPAGE`, then opened, so it is never usable unmarked. 6.7 made `MAP_STACK` imply `VM_NOHUGEPAGE`, and there the mapping is made as before. Default stack size: the `RLIMIT_STACK` soft limit at startup, 2 MiB if unlimited (§22.2). A thread list (lock-protected; changed only at create and exit) serves setxid, `fork` and `pthread_getattr_np`. `__libc_single_threaded` becomes 0 at the first creation and stays 0 (P5).
'''
