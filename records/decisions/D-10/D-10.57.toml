body = '''
**Verdict cache of the math accuracy sweeps** (TVA-MATH-VERDICT-CACHE, owner ruling #3820). A sweep shard (the C-oracle sweeps complex_ld_cr, complex_f128, special_ld, special_f128, complex, elem_ld, special products; the pure-Rust special_cr and fast_gamma tests; the fast32 inverse-trig cores unit test) runs its D-10.3 check only when its input key differs from the key of its last green run; otherwise it prints `verdict cached: <name> <key>` and returns. Key (`crates/core/tests/support/verdict.rs`): the shard name; the test binary's bytes (`/proc/self/exe`, the image running: checker, mathtools oracle and every Liella byte a pure-Rust sweep calls); the `flags` line of `/proc/cpuinfo` (what the dispatch reads) and the kernel release; for C-oracle shards the shard index and count, the bytes of both programs (the static Liella program holds every Liella byte it runs; the reference program holds the C source's code) and of every shared object the reference program loads as the dynamic loader resolves them (`LD_TRACE_LOADED_OBJECTS`, ld.so(8): host libm, libc and loader); a sweep sized by an environment variable adds it (`LIELLA_GAMMA_SWEEP`). Complete because a shard's outcome is a function of exactly these: the programs run with an empty environment and read no files, the checker reads none, and what the code does beyond its bytes depends only on the CPU (dispatch) and the kernel (vDSO). Each file is hashed as two SipHash streams (128 bits) plus its length; an unreadable input makes the key incomplete (always run, never recorded). The record (`target/test-verdicts/<name>`, temporary file then rename, so per tree and host) is removed when a shard starts and written only by `pass()` after the last assertion, and only when the key read again then is unchanged, so a cached verdict is only ever a green one for identical inputs. `LIELLA_NO_VERDICT_CACHE=1` runs every shard (nightly and release runs). Tests: `crates/math/tests/verdict_cache.rs`. `verdict.rs` runs no program and touches no C code; the loader query (the only part that starts a program) is in `verdict_programs.rs`, included by the C-oracle sweeps only, so the pure-Rust special_cr stays `nextest::PASS0_ONLY`: that check lists the `#[path]` includes a pass-0-only target may have (`PASS0_INCLUDES`, `verdict.rs` only) and scans each with the target's own rules (TVA-MATH-VERDICT-CACHE-2; chosen over an exception that skips the include, which would leave its contents unchecked, and over dropping special_cr from the list, which would add a second run of a sweep the interposed exports cannot change, #889).
'''
