body = '''
**Small compares in a register kernel at the entry** (MEM-K3, owner hot-kernel ruling 2026-10-08, plan S2 *hot-kernel*; the D-4.22 treatment for compare). `memcmp`, `bcmp` and `__memcmpeq` go through `hot::compare_bytes`: size first (`n - 1 < 64`; 0 and >64 tail-call the unchanged checked path), then two fused NULL tests (out-of-line `EFAULT` abort, S6 unchanged), then the kernel: 33-64 bytes two 16-byte blocks from each end, 16-32 one (SSE2 `pcmpeqb`, the equality vectors ANDed, one `pmovmskb` test for equal); 8-15 two big-endian words as one 128-bit number, 4-7 two 4-byte words as one 64-bit number, 1-3 bytes 0, n/2, n-1 as one 24-bit number (branch-free -1/0/1). Unequal blocks: an out-of-line pass re-reads the blocks in order and the first differing byte pair (as `unsigned char`) decides; should a concurrent writer have made them equal meanwhile, the checked path decides (D-4.21). Results stay -1/0/1 for all three (bcmp/__memcmpeq keep the order value: no observable change). Decided locally: the limit 64 (SSE2 only; >64 with AVX2 needs the IFUNC ruling of D-4.22); `scanner_races` memcmp case moved from 64 to 100 bytes so it still reaches the scanner whose rescan it requires (the kernel has none). Evidence: tests/small_compare.rs (0..256 x 16x16 alignments x first-difference positions x pairs across 0x80, lone differences, guard pages); planted bugs (signed bytes, limit 65, word tail one low, block tail one low, little-endian word) each red. **Amendment MEM-K5** (2026-10-08): the kernel limit is 128. The entry tests 1-64 first (unchanged classes, nothing added on their way), then 65-128 (n - 65 < 64) in the out-of-line compare_mid (a second inline null_region site defeated shrink-wrapping: the stack-alignment push/pop moved to every size, +2 instructions on memcmp_16/64, measured): the explicit NULL tests (S6 abort; the compare never folds a NULL, owner ruling option B on D-4.22), then four 16-byte blocks from each end (SSE2) or, on a CPU with AVX2 (the D-4.25 flag), 32-byte blocks at 0, 32, n - 64 and n - 32; all equality vectors ANDed and tested once; an unequal result goes to the same ordering (blocks_order) and the D-4.21 fallback. Decided locally: the 65-128 range as a second test after the first, its body out of line (1-64 rows unchanged); Zen 1 instructions/op incl. bench loop (glibc): memcmp_100 115.1 -> 39.1 (39.1), memcmp_128 96.1 -> 39.1 (39.1), memcmp_16/64 32.1 unchanged; scanner_races memcmp case moved from 100 to 200 bytes (its page offsets B 128 -> 256, ENV 256 -> 512, so the 200-byte read stays in front of the next text). Evidence: small_compare.rs sweep with every alignment pair up to n = 130 and first-difference positions at the 65-128 block edges, both builds; a NULL child test (every class, folding on and off, both builds: SIGABRT); planted bugs, each red: range bound 129 (byte 64 skipped), signed byte order, SSE2 tail block one low, AVX2 tail block one high (guard-page SIGSEGV), compare_mid without its NULL tests (SIGSEGV instead of the abort). **Amendment MEM-K5b (code placement): every assembly kernel starts on a 64-byte line.** MEM-K5 added no instruction to `memset`, yet Haswell-EP measured `memset_16` 1.126 against 0.92 (limit 1.094): in that build `fill_fold1` (`.p2align 4`) sat at offset 0x30 of a line and its 16-byte path (20 bytes to the first branch) crossed it; the Rust trampoline in front of it (0x30 as well) crosses too. Rule (ASSEMBLY): each kernel in `csys/src/machine/fold.S` is `.p2align 6` (at most 63 bytes of padding each). The Rust entries (`memset`, `memcpy`, ...) cannot be aligned on stable Rust; an own-section + module-assembly trick was tried and rejected by the unsafe-audit (inline assembly outside csys/, `unsafe` attribute form), so their placement is open (liella-historic:handoff/mem-k5.md). Amendment MEMCMP-FOLD (owner ruling 2026-10-10, "ruling: exception granted. As with the others, safety still must be maintained at some level in the process."): `memcmp` is the direct entry `liella_machine_compare` in csys/src/machine/fold.S. With folding on (`liella_machine_fold_limit` = 64, the copy classes' guard word), 8 <= n <= 64 run the head probe there with no NULL test (a NULL faults on page zero, SIGSEGV): different heads return -1/1 (bswap, cmp, sbb, or), equal heads tail-jump to `liella_hot_compare_tail` (Rust, the 16-32/33-64 classes and the 8-15 last word; both pointers were just read, debug-asserted non-NULL). 0-7, n > 64 and folding off tail-jump to `liella_hot_compare_rest` (the checked entry, explicit S6 abort; it also takes the lazy folding decision). 1-7 not folded (decide-or-ask: the abort stays, cannot return a wrong answer): the measured hot callers compare 16-64 bytes (WL-HOT-SORTC2 pair model) and wl_count showed no regression from the extra entry test. Head-decided path 14 instructions (was 20). Tests: small_compare sweeps run with folding on and off in each build; NULL child test: fold on 8-64 SIGSEGV, else abort. **Amendment MEMCMP-EQ64 (2026-10-10):** after an equal 8-byte head the direct entries (machine/fold.S) finish 8-16 (last word), 17-32 (two 16-byte blocks) and 33-64 (two 32-byte AVX2 blocks) themselves; memcmp orders from the blocks' masks and re-reads the first differing pair, falling back to the Rust tail if that pair reads equal (D-4.21). The 33-64 class is selected by the entry's first test `n - 33 < liella_machine_cmp_span` (32 only while folding AND AVX2 are on; cleared before either is switched off), the head probe stays first on it (sort-C's unequal pairs). NULL fold scope unchanged (8-64; the head load is the first access). memcmp_eqline 46.3 -> 37.4 instr/call (glibc 36.1), memcmp_sortC 36.0 unchanged. Plants: liella-historic:handoff/memcmp-eq64.md. **Amendment MEMCMP-SHORT (2026-10-10):** 0-7 bytes stay in the direct entries (fold.S) in every folding state: the `n < 8` test now comes right after the span test, then explicit NULL tests (NULL -> the checked entry, S6 abort; the NULL fold scope stays 8-64), then 4-7 one 4-byte word and 2-3 one 2-byte word from each end, 1 the byte, 0 returns 0. memcmp compares each word from memory and on a difference re-reads b's word and orders by bswap (re-read equal under a concurrent writer -> the checked entry, D-4.21); bcmp/__memcmpeq XOR both words and OR them into one test. Sizes above 64 tail-jump to `liella_hot_compare_big`/`liella_hot_equal_big` (the checked classes without the 1-64 range test and the folding decision) so they pay nothing for the moved test. Decided locally: test order (4-7 first: most short calls in arghist), separate order tails per probe (no jmp). wl_percall instr/call incl. harness (glibc): memcmp 2 B equal 65 -> 32 (32), 4-7 B equal 58 -> 30 (32), 1 B 65 -> 32 (23: the 4 NULL-test and 5 entry-test instructions alone exceed glibc's margin; RULING asked in liella-historic:handoff/memcmp-short.md), 100 B equal 56 -> 53. Plants: liella-historic:handoff/memcmp-short.md. **Amendment MEMCMP-HEAD-2 (2026-10-20; brings this row in line with the code of MEMCMP-MID/-MID-2 and records this story's path change; no behaviour change):** the direct compare entry (fold.S) finishes every size up to `liella_machine_cmp_long` (2048 with AVX2) itself: 65-128 (32-byte blocks at 0, 32, n - 64, n - 32) and 129-2048 (32-byte head block, 128-byte chunks from byte 32, last chunk at n - 128), both after the explicit NULL tests (option B on D-4.22); above that word, and above 64 without AVX2, `liella_hot_compare_big` (the checked classes). The "sizes above 64 tail-jump to `liella_hot_compare_big`" sentence of MEMCMP-SHORT holds only there. For every block class (17-2048) the first differing byte comes from the blocks' masks (first block first; the last block's position from the ANDed mask, the blocks before it being equal), is re-read (a's byte loaded, b's compared from memory) and ordered -1/1; should that pair read equal (a concurrent writer, D-4.21), the call goes to `liella_hot_compare_rescan` with the index: the counted rescan from the next byte (D-4.21), replacing the checked-path / `liella_hot_compare_tail` fallback the MEMCMP-EQ64 text above names (65-2048 since MEMCMP-MID-2, 17-64 since MEMCMP-HEAD-2). A too-low index from the assembly therefore shows as a rescan on stable text in the self-tests instead of a silent recompute. `liella_hot_compare_tail` remains for 33-64 without AVX2; the 0-7 word classes keep the checked entry (MEMCMP-SHORT); the 8-byte head probe (D-4.46) is unchanged. Evidence and counts: liella-historic:handoff/memcmp-head-2.md.
'''
