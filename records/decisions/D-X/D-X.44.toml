body = '''
**Unsafe category *machine-register*: the libm envelope's inline MXCSR read and empty `xmm` barrier** (LIBM-ENVELOPE-ASM, owner ruling 2026-11-07 #3938/#3939/#4004). One file, `crates/boundary/src/hot/fpregs.rs`, holds exactly (a) `mxcsr()`: one `stmxcsr dword ptr [{p}]` into its own 4-byte stack local (not `pure`: reads are never merged), and (b) `Pin::pin`: an empty barrier, template `/* {x} */` (an assembler comment naming the operand, no instruction: rustc refuses a template `""` that does not use its operand) with `inout(xmm_reg)` and `options(pure, nomem, nostack, preserves_flags)` for `f32` and `f64` (a pair pins each element). `mathret::elem_fast` (every `double` and `float` quick-tier entry, `elem32_fast` included) and `mathret::sincos_fast` read MXCSR with (a) instead of calling `liella_machine_mxcsr_get`, and put (b) on the operand behind the mode branch instead of `core::hint::black_box`: the call clobbered every `xmm` register and `black_box` forced a store and reload. Behaviour is unchanged: the caller's word decides the path as before (rounding, FTZ/DAZ, sticky flags and, new test, each unmasked trap). `cargo xtask static` (unsafe audit) refuses inline assembly anywhere but this file and the *tb-field* site, any other unsafe form in this file, any template here other than the MXCSR store (exactly once) and the barrier comment, and a barrier without `pure, nomem`. Plants: handoff/LIBM-ENVELOPE-ASM-plants.txt.
'''
