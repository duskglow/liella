id = "D-X.10"
section = "x"
status = "active"
body = '''
**The native Rust interface is a first-class artifact** (owner requirement 2026-10-01; mechanism decided by the owner 2026-10-02: option 3, both a stable native C ABI and a versioned Rust dylib, with a fully documented toolchain). The POSIX translation layer stays the default and C programs are unchanged; Rust programs may bypass it. **One instance of state:** a process has exactly one C library, so libc.so.6 / libc.a own every piece of process state (heap, thread blocks, `errno`, environment, current locale, time zone, streams, exit handlers). Rust data structures never cross between separately compiled objects (Rust has no stable layout), so the dividing line is: **stateful services** are reached only through the native C ABI of the library that owns the state; **stateless computation** (parsers, formatters, Unicode, calendar, math) is compiled into each Rust consumer. **Four ways in:** (1) C: the POSIX exports, unchanged. (2) **Native C ABI** (stable, any compiler): symbols `liella_<area>_<name>` exported from libc.so.6 and libc.a under version nodes `LIELLA_NATIVE_1`, `LIELLA_NATIVE_2`, ... (old nodes are never changed; additions go in a new node), with Rust-friendly C conventions: byte slices as pointer and length, no NUL termination, results as a signed value or a negative error number (no `errno`), explicit out-parameters, fixed-width types, opaque handles; described by a generated header `include/liella/native.h`. (3) **Static Rust**: the facade crate `liella-native` (`crates/native`, `#![forbid(unsafe_code)]` except its C-ABI declarations, no logic) with feature `static` re-exports the clean API (`liella`, `liella-math`, the public types of `liella-rt` and `liella-kernel`) and the stateful services as safe Rust; the program links like a product (statically, `liella-crt1.o`, libc.a, no host C library), so std's C calls and the native calls reach the same instance. (4) **Rust dylib** (toolchain-bound, versioned): `liella-native` with feature `dylib`, built as a Rust `dylib` named by its **Rust ABI version** (`libliella_rust.so.<abi>`, soname the same), containing the stateless clean API compiled by that toolchain and the stateful services as wrappers over the native C ABI, so it needs libc.so.6 and holds no state of its own; Rust ABI versions coexist in one process (different sonames). The **Rust ABI version** is `lr<N>` for the toolchain recorded in `spec/abi/rust-abi.toml` (exact rustc version and commit, target, target features, codegen options, panic strategy, std linkage, allocator), embedded in the soname, in an ELF note `.note.liella.rustabi`, and in the exported string `LIELLA_RUST_ABI`; a new toolchain or any ABI-relevant option gets a new `lr<N+1>` built beside the old ones, never in place. **lr versions are immutable** (owner ruling 2026-10-02): a released lr version is frozen permanently and never rebuilt from changed source; any change to source or toolchain, however small, requires a new lr version. `docs/toolchain.md` documents every build parameter so that a third party can build a compatible dylib or consumer without Liella's build system; `docs/interfaces.md` describes the four paths, when to use each, and the complexity they carry. **Scope of v1:** the stateful services a Rust program needs (heap, environment, file descriptors and the file system calls, clocks, the current time zone and conversions, the current locale, process exit and arguments); the stateless API is the whole clean library. Shipped with example programs for the static and dynamic paths, built and run in the gate (`cargo xtask native`). The clean API's semver policy is decided at release. **Open until the first release, Butterfly Wing (owner, 2026-10-03):** `LIELLA_NATIVE_1` and `lr1` still change (functions are added, `lr1` is rebuilt); the immutability rule begins at that release and is not yet binding.
'''
