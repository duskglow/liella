body = '''
**`asinf`, `acosf` and `atanf` with one long-latency operation per call** (LIBM-ASINF-NODIV, ruling #4924; amends D-10.82's kernels, its one-pass frame, margin test and conversion unchanged). Booked timing showed asinf/acosf at 2.3-3.0x the reference in time on Ivy Bridge and N100 at 1.2-1.35x by instructions: each call issued a square root and two divisions in series on the one divider. Method (Cody & Waite, *Software Manual for the Elementary Functions*, 1980, ch. 10, the asin/acos reduction; the rational approximation there is replaced by a polynomial so that no division remains): for \|x\| < 1/2, asin x = x + x·z·R(z), z = x², R from an odd degree-23 minimax fit of asin on [-1/2, 1/2] (`crates/math/fits/fast32_asin.fit`, relative error 2^-51.9 after rounding to `double`), evaluated by Estrin's scheme with powers up to z⁴ only (every intermediate a normal `double` for \|x\| ≥ 2^-126, so FTZ/DAZ change nothing and only inexact is raised); for \|x\| ≥ 1/2 the half-angle form asin x = π/2 - 2·asin √g, g = (1 - \|x\|)/2 exact, whose argument is again in [0, 1/2]: one `sqrtsd`, no division. acosf uses the same pieces: π/2 - asin x below 1/2, 2·asin √g (x > 0) or π - 2·asin √g (x < 0) above. The root's operand is formed as its own expression so that `sqrtsd` writes the register it reads (D-10.68). atanf for \|x\| > 1: atan x = π/2 - atan c - atan u, u = (1 - x·c)/(x + c) (the table reduction of D-10.82 applied to s = 1/x without rounding 1/x first), with c = j/32 read from a 160-byte table indexed by the operand's exponent and top five fraction bits (j = round(32/a_m), a_m the bin's midpoint; j = 0 at \|x\| ≥ 32, where u = 1/x), so \|u\| ≤ 1/32, and a new odd degree-9 fit of atan on [-1/32, 1/32] (`fast32_atan32.fit`, 2^-62.1): one division instead of two. \|x\| ≤ 1 keeps D-10.82's single-division reduction. Bounds in any direction: asinf 19.3u, acosf ≤ 15u, atanf above 1 5.4u, all under the shared 24u of the margin test (64 ulp of the `double`). Proof by exhaustion (every `float` operand in the four directions against the envelope, 0 mismatches each), and a unit test that holds the kernels' `double` results within 24u of a double-double reference, dense around the split at 1/2 and across atanf's table. Measurements in handoff/LIBM-ASINF-NODIV.md.
'''
