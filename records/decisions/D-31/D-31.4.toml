body = '''
**Identity strings of the utilities are Liella's (`plan/utilities.md` Q3; owner's approval 2026-11-14).** The first line of `--version` is `<command> (Liella <version>) 2.39`, the bug-report line of `--help` names Liella's channel, and ldconfig's tag 0 text (`Cache generated by:` in `-p`) names Liella's ldconfig; the trailing ABI level `2.39` stays, so scripts that read the version number see the ABI they get. No compatibility option: the banner states who built the program, and a script that tells C libraries apart (for example by `ldd --version`) must see the truth. The mirror scan of LIELLA-SYSTEM-LIBC-PLAN counts scripts that match the reference's banner text before UTIL-3 ships; a match it finds is raised with the owner. The transcript harness (UTIL-1) masks identity strings when it compares. `getconf GNU_LIBC_VERSION` follows `confstr` (§24), not this decision.
'''
