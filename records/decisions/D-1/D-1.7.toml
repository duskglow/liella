body = '''
Written under the clean-room rules of §1.4 in a fresh session, from the spec, the public header, `spec/behaviour/argp.md` and black-box probes. **Internal** (`liella::argp`): a tree of parsers in preorder plus the standard options (`-?`/`--help`, `--usage`, hidden `--program-name` and `--HANG`, `-V`/`--version`, merged at the root in group -1), combined into one table (a name already taken goes to the first claimant); `parse` runs `liella::getopt` over it (permuting by default, operands in place with `IN_ORDER`, `NO_ARGS` ending the options at the first operand, `POSIXLY_CORRECT` honoured) and returns `Result<Parsed, Failed>`; callbacks, standard options and diagnostics go through a `Host` trait. Events: `INIT` preorder; options to their owner; each operand as `ARG`, then `ARGS`, to each parser in turn; `NO_ARGS` preorder to parsers with no operands; `END`/`SUCCESS`/`FINI` in reverse preorder; on error `ERROR` preorder then `FINI` in reverse; an operand no parser takes stops the parse (success with an index, `Too many arguments` without one). `help` builds usage, documentation, option list, notes and bug line as clusters and sections, one blank line between sections, with the observed sort and columns; `Format` reads `ARGP_HELP_FMT` (invalid values reported and ignored) and `COLUMNS` (right margin COLUMNS − 1, as the spec says; the reference ignores it). **Legacy** (`liella_legacy::argp`): when messages print and the process exits (`NO_ERRS` silences everything, `NO_EXIT` prevents exits, `--version` exits unless `NO_EXIT`). **Boundary** (`argp.rs`): reads the C tree, keeps `struct argp_state` on its stack (`name` set before `INIT`), calls parsers, filters and the version hook through `liella_machine_call3`, writes help to the given stream and getopt-style errors with `argv[0]` to `stderr`, exits with `argp_err_exit_status`. The four program-wide objects are weak C definitions (`adapter/runtime.c`), so a program's own definitions replace them; `argp_error` and `argp_failure` are variadic C adapters. Deliberate differences (listed in `docs/differences-from-glibc.md`; probe lines recorded in `argp_products.rs` `KNOWN`): a blank line between every section (option groups separated as the reference: only once a header has appeared, ARGP-HELP-FILTER-KEYS-2), a short option `+`, `:` or `-` listed first not read as a getopt option-string control character (owner ruling #458 for `+`, ruling #703 for `:` and `-`), documentation entries left out of usage, shadowed names hidden, names wider than the margin start their text on the next line, invalid `ARGP_HELP_FMT` values rejected (the reference loops for ever on some), `name` valid during `INIT`, real indices under `PARSE_ARGV0\|NO_ERRS`, NULL state or name handled. Spec gaps decided without evidence: the `POST_DOC` filter for a parser without post text, `ARGP_KEY_HELP_DUP_ARGS_NOTE`, `argp_domain` ignored (no gettext yet), `--HANG`'s duration; `_argp_unlock_xinl` is named in §1.7 but absent from the ABI tables.
'''
