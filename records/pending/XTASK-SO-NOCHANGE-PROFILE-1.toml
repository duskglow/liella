body = '''
**The product builds that share a cargo target directory build with the same flags and environment; the interpreter, whose flags differ, builds in its own directory `target/product/ld-pie`** (XTASK-SO-NOCHANGE-PROFILE, 2026-11-13, #5121; tooling only, no ABI or behaviour change: the release products are byte-identical before and after, all 23 files of `target/liella`; of the fast products only `libm.a` and `libm.so.6` differ in bytes, since libm's dependencies are now the tagged copies shared with libc). Profile (exec trace of a no-change `cargo xtask so` on a Zen 1 build host, EPYC 7551, 4-core slot): nearly all of the 195-205 s (fast) and 393-416 s (release) was rustc rebuilding unchanged crates. The libc, libm and interpreter builds shared `target/product`, but libm ran without `LIELLA_BUILD_TAG` (read with `option_env!` by the library crates) and the interpreter with `-Crelocation-model=pie`. Cargo keeps one copy of each dependency per target directory and profile and rebuilds it when the flags or a tracked variable differ from the last build, so each build rebuilt what the previous one had built (`liella_boundary` three times per run, 24-26 s fast and 78-80 s release each, then the staticlibs). (1) `so::ProductBuild` describes each build (manifest, archive, target directory, own flags); `LIBC_BUILD`, `LIBM_BUILD` and `LD_BUILD` give all three `cargo rustc` commands and the paths of their archives. (2) Every build sets the build tag, so libc and libm share their dependencies. (3) The interpreter builds in `target/product/ld-pie`; its first build there compiles its dependencies once. The test checks that builds sharing a directory have the same flags and environment, that every build is tagged, and that each archive is read from the directory cargo built it in. A no-change build now takes 23 s instead of 393-416 s (release) and 42 s instead of 196-205 s (fast); a one-file change costs what it did (the tag changes, so the tagged crates rebuild); measurements in `handoff/XTASK-SO-NOCHANGE-PROFILE.md`. What is left is the post-processing (about 1400 `objcopy` and 770 `readelf` runs over unchanged archives), not cached here.
'''
