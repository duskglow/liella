body = '''
**Pre-decoded locale views** (DES-LOC; owner ruling 2026-10-08: APPROVED, locales are not hot-loaded; explicit reload on request, D-X.13 `liella_locale_invalidate`, keeps working: a new view, the old one leaked). When a locale is interned, an immutable LocaleView is built and leaked with it: the LC_CTYPE encoding (incl. charmap), MB_CUR_MAX, radix, thousands separator, grouping, collation, the ctype table addresses, and per category file a CatView of every item's nl_langinfo value and string length (shared between locales that map the same file; the built-ins are statics). Validation happens at the build; reads are a load. A ThreadBlock word holds the calling thread's view, written by the D-5.5 writers (uselocale, setlocale/invalidate via publish_global, new threads); `*_l` functions reach the view through the handle. Views are never freed (D-X.13), so an old view stays valid for any thread holding it. Cost: ~192 B per interned locale + 12 B per item per mapped category file (~4.5 KB per locale; < 2.5 MB bound), 8 B per thread. Evidence: Zen 1 probe b230569cb35a (resolution 2-3 ns, item 8-10 ns, Encoding::of ~22 ns over glibc). **Implemented, LV-2** (CatViews: LV-3, not yet): `liella::locale::view::LocaleView` = the interned `Locale` (whose encoding, MB_CUR_MAX and numeric items LV-1 decodes at build) + its handle + for a compiled LC_CTYPE the `Wide` tables (12 standard classes, toupper/tolower, widths; each Table3 header checked once); `INTERNED` holds view addresses, `"C"` is a static view. ThreadBlock word `view` at 0x138 (from the free tail: the block stays 0x300). `locale::view()` = one `%fs` load (word 0: resolve as before); `current()` and `current_handle()` read it, so every `current()` caller (mb*, printf `Env`, strto*, regex/fnmatch, strftime, ...) is migrated; `isw*`, `towupper`/`towlower`, `wcwidth` use the view's wide tables, and the `*_l`/`iswctype` paths test only the classes the mask names (`ctype::is_w`). Local decisions: (a) the view word is stored only in a process the runtime started (every thread that runs library code is listed there); elsewhere it stays 0 and the old resolution runs, so unlisted threads keep today's semantics; (b) `newlocale` reusing the base object in place refreshes the view word of every thread using that object (`current()` followed the object before), the ctype words stay as D-5.5 has them; (c) `freelocale` of the active object leaves the thread on the old view (was: a read of the freed object). Tests: `locale::tests::view_equals_the_per_call_reads` (oracle: every code point < 0x30000 + edges, 20 masks, C, C.UTF-8, en_US.UTF-8, de_DE.ISO-8859-1, ja_JP.EUC-JP; planted bugs caught: wrong class table, width index, ASCII case bound), `conformance/c/s05_ctype_words.c` view checks (red: view filled once; in-place refresh disabled). **LV-3 (implemented):** per-category item tables. `Locale` carries `tables: [Option<&'static [Item]>; 12]` (by `Cat::index`): the built-in `"C"`/`"C.UTF-8"` point at the generated `builtin_items` statics (no heap, no build time); a compiled category gets a leaked table of `Item`s (word items decoded) when its locale is interned (`LocaleView::new`, shared with an earlier view that maps the same file). `Locale::item`/`string` (every reader: nl_langinfo, strftime names, scanf, printf, monetary) index the table; `Locale::item_parsed` keeps the per-call read as the oracle and the fallback for un-interned locales. `nl_langinfo` = table entry, name item/unknown category on a cold path; `localeconv` words are computed once per view and copied into the thread's lconv. Local decisions: (a) the table type is the existing `Item` (24 bytes) rather than a value/len pair, because no consumer needs a pre-scanned length (string readers scan <= 30 bytes) and the built-in statics then need no conversion; (b) an absent item answers `""` at the shared `EMPTY` address (was a literal's address; content identical); (c) the `LocaleView::C` const became `LocaleView::c()` (it holds atomics now). Tests: `locale::tests::item_tables_equal_the_parsed_reads` (all 12 categories from files, every item and 6 past the end, 5 locales; planted bugs caught: word index +1, string offset +1). **LV-4:** the wide ctype `_l` calls (`isw*_l`, `towlower_l`, `towupper_l`) and `iswctype`/`iswctype_l` read the view (`view_of(loc)`) like their non-`_l` twins; the view's item tables are indexed by the C category number (13 slots, slot 6 = `LC_ALL` empty) so `nl_langinfo` does one bounds check and no arithmetic (the name item and an unknown item fall out as no entry); `Locale::string` finds a name's NUL eight bytes at a time; `strftime` copies fields of up to 16 bytes with two overlapping wide stores (`Unit::copy_into`) instead of a `memmove` call. Safety: tests `item_tables_equal_the_parsed_reads` (entry by number), `langinfo_fast_path_is_the_per_call_path`, `copy_into_is_the_unit_copy`, `nul_at_is_the_first_nul`, and the `direct_path_is_the_general_path` sweep.
'''
