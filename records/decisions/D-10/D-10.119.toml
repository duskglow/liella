body = '''
**`csinh`, `csin`, `csinhf`, `csinf` get a quick tier in front of the 384-bit route** (LIBM-CPLX-SINCOS, under D-10.53; every decline reaches the route unchanged, so special values, the axes and the Annex G cases stay the route's). `csinh(x + iy) = sinh x·cos y + i·cosh x·sin y`; `csin(x + iy)` is `csinh(y + ix)` with its parts swapped (no sign change, so all four modes carry over). `double`: `e^a` (`a = \|x\|`) from the `exp` quick kernel (bound `2^-69`), `e^-a` as its double-double reciprocal (Newton correction of `RN(1/E)`, Dekker 1971 products; `2^-103` relative) scaled exactly by `2^-2m` up to `a = 40` and dropped above (`e^-2a < 2^-115`); `cosh = (E + Q)/2`, `sinh = (E − Q)/2` for `a >= 2^-3` (cancellation at most `coth 2^-3`: below `2^-65.9`), the odd Taylor series in double-double below `2^-3` (`2^-68`). Each part is one double-double product with the trig kernel's `cos y`/`sin y` (`2^-30 <= \|y\| < 2^20`, as `cexp`), with an a-priori bound from the factors' proved bounds, and one rounding test per part (de Dinechin, Lauter & Muller, RAIRO-ITA 41, 2007) in all four modes; the results are never exact or midpoints (Lindemann–Weierstrass, as `cexp`). Bands: `2^-60 <= a <= 746` with a normal result (a product that stays finite while `cosh`/`sinh` alone overflow is answered); the route takes `a < 2^-60`, `a > 746`, `\|y\| < 2^-30` or `>= 2^20`, results outside the normal range, zeros, infinities and NaNs. `float`: the `double` products of the `float` quick cores (`sinh_core` 12.2u, `cosh_core` 233u, `trig_core` 24.3u) with margins 64 and 512 ulp of the `double` part (at least 1.5·bound + 1) and `float`'s rounding test. Tests: `complex_fast_sinh_tests.rs` (tier against route, bits and flags, four modes, five regimes, hard cases at the band edges, the hyperbolic factors against a double-double reference, a 10^6-per-regime sweep in the long-sweeps runner). **After a quick decline (LIBM-CPLX-SINCOS-4), in the envelope's tier only** (the in-place nearest entries still decline and the boundary's cold fallback runs the envelope's tier, as D-10.99): (1) an overflowing part, every value within its bound at or above `2^1024`, is answered `±∞` or `±DBL_MAX` by sign and mode with overflow and inexact, and `ERANGE` only with an infinite part (the route's report); (2) otherwise the part is evaluated again near `2^-96` before the route: `e^a` and `e^-a` each from `wide_dd::exp_dd` (`2^-100`), `sinh`/`cosh = (V ∓ Q)/2` (the cancellation costs at most `coth 2^-3 < 8.05`), below `a = 2^-3` the all-positive series `Σ z^k/(2k+1)!`, `Σ z^k/(2k)!` (`z = a²` exact) by Horner in double-double; the trig factor is `cexp`'s middle-tier `sin_or_cos` with its error used relative, `2^-99·\|T\| + 2^-137` (Joldes, Muller, Popescu, ACM TOMS 44(2), 2017 for the double-word additions; Muller, Elementary Functions, 3rd ed., 2016, §11.3 for the distance of doubles to `kπ/2`), so a `y` next to `kπ/2` no longer loses the part to the absolute `2^-89` of the quick trig bound. Part bound `eps = A·(B + 2^-40)·2^-96`; decided or declined by `settle` in every mode. Checked against the 384-bit arithmetic (factor and part bounds, forced middle answers in four modes) and by the 10^6-per-regime sweep.
'''
