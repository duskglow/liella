body = '''
**A static PIE keeps one writable segment: its start object caps the cluster alignments at 4 KiB** (LAYOUT-DATA-CLUSTERS-4, 2026-11-11; amends D-X.64 and D-X.67 for `liella-rcrt1.o` only; layout only, no symbol, no behaviour change). The static-PIE start (D-27.10) relocates an executable with exactly one writable `PT_LOAD` (`crates/ld/src/boot.rs` `image`). GNU ld starts a new segment where the gap before a section reaches a whole page, so a start alignment above 4 KiB on a writable section that is not the segment's first one gives a second writable segment: the 16 KiB `.data1` of D-X.64 left a 3-page gap after `.data` (Skylake-SP host, fast profile: two RW `PT_LOAD`s, exit 127 "cannot relocate the executable", s2_7_c_1/2/3_static_pie), and the size-aligned `.data.rel.ro` of D-X.67 does the same whenever a program's `.tdata` or `.init_array` precede it. `csys/src/machine/entry.S` built with `LIELLA_STATIC_PIE` sets `LIELLA_DATA1_ALIGN` and `LIELLA_RELRO_ALIGN` to 4096: every gap stays under a page and the written cluster still takes ceil(size / 4 KiB) pages. `liella-crt1.o` keeps the measured alignments (a fixed-address static executable is not relocated, so more writable segments cost it nothing). Test: `init_static_pie_keeps_one_writable_segment_at_every_data_phase` (crates/core/tests/hot_text_products.rs): a static PIE with `.tdata`, `.init_array` and relro pointers, `.data` padded to each 4 KiB phase of a 16 KiB boundary, one writable `PT_LOAD` and exit 0. Open: the relocator's one-writable-segment rule also refuses a static PIE (and ld.so a dynamic program) whose own data is aligned above 4 KiB; widening it is a relocator change for its own story.
'''
