id = "D-6.10"
section = "s06"
spec = "§6.2"
ann = "PERF"
status = "active"
body = '''
**The single-character decoders read their input lazily (AUD-M4).** `mbrtowc`, `mbrtoc32/16/8`, `mbrlen`, `mbtowc`, `mblen` read the text one byte at a time (`strz::LazyText`, `mb_compat::MbInput`) and stop where the character does: no `strnlen` over `n` (a loop `mbrtowc(p, end - p)` was O(N^2)), and no byte past the character is touched (the reference returns 1 for an `A` ending a page before an inaccessible one with `n` 100000; Liella faulted: probe 551e4d076fae). The window grows while the decoder says incomplete or, for a multibyte charmap (longest match), while a character took every byte so far; at most `MAX_ENCODED` bytes then the terminator, which is the window the whole-text form used, so every answer is unchanged. Residual difference: in a multibyte charmap locale a complete character at a page end before an unreadable page may still read one byte more than the reference. Tests: `single_character_forms_read_no_byte_past_the_character` (boundary, guard page), `single_character_forms_read_only_the_character` (core, counts bytes read). MB-K2: UTF-8 from the initial state is read and decoded in one pass (`text::decode_utf8_initial`, same rules, bytes read, answer and state as the per-byte loop; `mbrtoc16`/`mbrtoc8` apply `split_utf16`/`split_utf8_units` to its result); `utf8_fast_path_matches_the_per_byte_definition` also compares the state left. Zen 1 3-byte: 360 -> 196 instructions per call (glibc 244). WL-HOT-SEQ3: `mbrtowc`/`__mbrtowc`/`mbrtoc32`/`mbrlen`/`__mbrlen` answer at the export, before the lazy reader and the state machinery, when `s` is non-NULL, `n >= 1` and the state (caller's or hidden) is all zero bytes: a byte below 0x80 in a UTF-8 or ASCII locale, or a well-formed two-byte UTF-8 character with `n >= 2`; the state is left as is (the general path stores the same zero bytes). Everything else takes the general path unchanged. Test: `single_character_quick_path_matches_the_general_decoder` (every 1-2 byte input, n 0..3, against a zero-__count non-zero state that takes the general path). WL-HOT-SEQ4: the 2-byte en_US.UTF-8 'regression' (wl_percall 237 -> 260) was the probe, not the library: its spec never called setlocale, so it ran in the C locale (encoding Ascii: the ASCII quick path applies, a 0xC3 lead correctly declines). In en_US.UTF-8 and C.UTF-8 every case takes the quick path with identical counts. Instruction ceiling (gate-asserted): conformance/c/s06_mbrtowc_quick_ceiling.c single-steps a traced child (exact, no PMU, so it also runs in the 5.10 guest) and fails when any of mbrtowc/mbrtoc32/mbrlen ASCII or 2-byte, caller's or hidden state, in C.UTF-8 or en_US.UTF-8, costs more than 100 instructions per call (quick path 48-71 on Zen 1).
'''
