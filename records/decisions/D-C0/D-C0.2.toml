body = '''
Static results live in per-thread slots (P-scope). "Overwritten by the next call" still holds, and cross-thread clobbering disappears (observable, stricter). **Tests (milestone 5):** `conformance/c/s00_threads.c` (MT-Safe by default, static buffers, process-global state; clauses `s0_6_c0_2_0` to `s0_6_c0_2_2`) and `s00_as_safe.c` (a handler interrupting the library 5,000 times; cancellation at `close`; `s0_6_c0_2_3`, `s0_6_c0_2_4`). **Every result per thread (milestone 6, 2026-10-04/05; owner refinement):** the gap found in milestone 5 (`ecvt`/`fcvt`/`qecvt`/`qfcvt`, `l64a`, `tmpnam(NULL)`, `inet_nsap_ntoa`, `rcmd`'s host name, `ttyname`, `ptsname`, `getttyent`, and found since: `getusershell` and the resolver's `p_type`, `p_class`, `p_rcode`, `p_option`, `p_time`, `p_secstodate`, `sym_ntos`, `sym_ntop`, `hostalias`, `loc_ntoa(NULL)`) is closed. Mechanism: one result area per thread, allocated on first use and freed at the thread's exit: one word in the descriptor's slot area (`SLOT_RECORDS`) points to a table of (address, size) per kind (36 kinds: the 14 database records and these 22 texts), each kind's block also allocated on first use (the texts at their fixed size, so a returned pointer stays valid until the next call of that function in that thread). The kinds are not limited by the 17 slots. Never shared: when the area or a block cannot be allocated the function fails: NULL with `ENOMEM` (the pointer results; `getttyent`, `getusershell` with `errno` set), `rcmd` leaves `*ahost` as the caller's name; the fixed slots in the descriptor (`strerror`, `strsignal`, `gmtime`/`localtime`, `asctime`/`ctime`, `getdate`, `inet_ntoa`, `ether_ntoa`/`ether_aton`) exist for every thread Liella starts, and for a thread it adopts and cannot map one: NULL with `ENOMEM`, `getdate_err` 6, or (no error channel) `strerror`/`strsignal` give the constant `Unknown error`/`Unknown signal` with `ENOMEM`; the process-wide fallbacks are removed. `getpass` keeps its one process-wide buffer (MT-Unsafe by contract, serialised with the terminal). Test: `conformance/c/s00_result_buffers.c` (19 functions, two threads at once and eight under load; `getusershell` across threads; heap bytes in use equal after a thread that used them all and one that used none); the reference fails it at the first (`ecvt`). Recorded in `docs/differences-from-glibc.md`.
'''
