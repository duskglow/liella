body = '''
**Hot text grouped at archive build time** (PAGEFAULTS-2). `cargo xtask so` renames the function sections whose build-stable keys are in `crates/libc-so/hot-text.list` to `.text.hot.<f>` in the archive rustc built (so `libc.a` and `libc.so.6` both get it; reverses stale ones); the program's own static link (GNU ld, gold default scripts) gathers them. The list is generated by `tools/hottext/regen.sh` (gdb one-shot breakpoints on every function of startup / puts / cat / setlocale+printf probes, both profiles, union; keys strip crate hashes). Chosen over `#[link_section]` attributes (cannot reach core or generic instantiations, scattered) and an `ld -r` pre-link into one section (defeats --gc-sections). No symbol or ABI change; a linker that ignores the prefix keeps today's order. \| setlocale+printf probe: .text faults 33 -> 4; whole process 109 -> 80 (fast), 96 -> 78 (release); pinned by `init_short_programs_stay_within_their_page_fault_bounds` (red without the grouping: 111 > 95).
'''
