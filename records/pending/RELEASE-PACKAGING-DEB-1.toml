body = '''
**Reference Debian packages that coexist with glibc (owner ruling RELEASE PACKAGING, 2026-11-13; docs/install-packages.md).** Sysroot `/usr/lib/liella`, laid out as Debian's libc6/libc6-dev lay out `/` (merged `/usr`, multiarch `x86_64-linux-gnu`). Packages (names not Debian's): `liella6` (as libc6: `usr/lib/x86_64-linux-gnu/` `ld-linux-x86-64.so.2`, `libc.so.6`, `libm.so.6`, the placeholders `libpthread.so.0` `libdl.so.2` `librt.so.1` `libutil.so.1` `libanl.so.1` `libc_malloc_debug.so.0`, `libnsl.so.1`; `usr/lib64/ld-linux-x86-64.so.2` -> `../lib/x86_64-linux-gnu/ld-linux-x86-64.so.2`; `lib` -> `usr/lib`, `lib64` -> `usr/lib64`) and `liella6-dev` (as libc6-dev, static archives included as there: `crt1.o`, `Scrt1.o` (both `liella-crt1.o`), `rcrt1.o`, `libc.a`, `libm.a`, `libc_nonshared.a`, the empty `libpthread.a` `libdl.a` `librt.a` `libutil.a` `libanl.a` `libresolv.a`, `libm.so` -> `libm.so.6`, the `libc.so` script `GROUP ( /usr/lib/x86_64-linux-gnu/libc.so.6 /usr/lib/x86_64-linux-gnu/libc_nonshared.a AS_NEEDED ( /usr/lib64/ld-linux-x86-64.so.2 ) )` with sysroot-relative paths; `/usr/bin/liella-gcc`, `liella-g++` -> `liella-gcc`, `liella-gcc.1`). Outside the sysroot only the wrapper, its manual page and `/usr/share/doc/<package>`; no maintainer scripts, triggers, conffiles or shlibs (no ld.so.conf entry, no cache): `tools/deb/check.sh` refuses any other path and any control member besides `control` and `md5sums`. A program selects Liella by its program interpreter `/usr/lib/liella/lib64/ld-linux-x86-64.so.2`: `liella-gcc` compiles with the system compiler and the system's C headers (Liella has none of its own yet; `liella6-dev` depends on `libc6-dev`, `gcc`, `binutils`) and links with `-nostartfiles -nodefaultlibs`, `--sysroot=/usr/lib/liella` for the link editor, `--dynamic-linker` set to that path, Liella's `Scrt1.o`, the compiler's `crtbeginS.o`/`crtendS.o`, `-lc -lgcc -lgcc_eh` from the sysroot (no `crti.o`/`crtn.o`: Liella ships none; `-static`: `crt1.o`, `crtbeginT.o`, `libc.a`; `-shared` likewise against `libc.so`); `liella-g++` links libstdc++ and the unwinder statically so no system C++ runtime is searched; `-static-pie` and `-pg` are refused. Loader layout: the products are built with `LIELLA_PREFIX=/usr/lib/liella` and `LIELLA_LIBDIR=usr/lib/x86_64-linux-gnu` (the companion pending record RELEASE-PACKAGING-DEB-2), so Liella's sonames, the default directory and the trusted directory are the sysroot's multiarch directory and the cache path is `/usr/lib/liella/etc/ld.so.cache` (none shipped). Build: `tools/deb/build.sh` exports HEAD (`git archive`; a synced tree without `.git` with `LIELLA_DEB_COMMIT` and `SOURCE_DATE_EPOCH`), builds the release profile (`LIELLA_FULL_PROFILE=1 cargo xtask so`), strips the shared objects (`--strip-unneeded`, `.comment`, `.note`) and the debug sections of archives and start files, sets every time to `SOURCE_DATE_EPOCH` (default the commit time), modes 0755/0644, and runs `dpkg-deb --root-owner-group -Zxz`; two builds are byte-identical. Version `0.0~snapshotYYYYMMDD+<12 hex commit>` (native; sorts below 0.0). Proof: `tools/deb/proof.sh` (mmdebstrap `--mode=unshare`, official mirrors only) installs, builds and runs the smoke set, checks `dpkg --verify libc6 libc6-dev` and the system's programs, runs lintian, purges and compares the file list. Gain: users of Debian-based systems try Liella without risk to the system's C library; the layout maps onto a later sole-libc layout (prefix `/`).
'''
