body = '''
**The thread block holds the current view's class-word table** (WCTYPE-RETHINK proposal 3, coordinator ruling #3878; the 0x180 slot and the zero fallback in a block glibc made: coordinator ruling #4133, provisional; WCTYPE-TRIE-FILE; extends D-5.5 and D-7.13). `ThreadBlock::wclass` (offset 0x180) is stored with the `view` word by every writer of it (`uselocale`, `setlocale` for threads on the global locale, thread creation, `newlocale` changing the active object in place), so it follows exactly what `view` follows. **Safety rule (owner, 2026-11-10, a condition of this decision; WCTYPE-TRIE-FILE-3):** the words at 0x138-0x187 (`view`, the cache line 0x140-0x17f, `wclass`) lie where a block another `ld.so` made (D-22.10) keeps its own data, so they are Liella's only in a process the runtime started. The gate is the process's ownership word (`thread::owned()` / `owned_mask()`, D-X.58), never a flag in the block (ruling #4281: 0x9c is the other library's data in a foreign block): in a process the runtime did not start the words are never written (`store_view` and the time zone period's stores test `owned()`) and never used as a pointer or value (`isw` reads `wclass & owned_mask()`, `view()` reads `view & owned_mask()`, `with_period` tests `owned()`; a 0 takes the view path and starts with no period, whatever the words hold). `store_view` stores `wclass` and then `view`, only in a listed thread of a process the runtime started, so every later locale change reaches the words; a fresh block holds 0 in both. `isw*`, `iswctype` and `view()` AND their word with the mask in memory, which takes the place of the zero check's `test` (one load, one `and`); a word that reads 0 (a process the runtime did not start, a block not stored yet: startup before the initial thread is listed, or a process whose initial thread could not be listed) or an unresolved block takes the view's path in a tail call. The reads go through `class_word()` and `view_word()` in `locale.rs`. Proven by `locale::tests::foreign_block_words_are_never_read_or_written` (non-canonical garbage in all ten words of a foreign block: answers unchanged, nothing written) and its plants. The `_l` entries read the object's view, which holds its own table. Proven by `conformance/c/s05_ctype_words.c` (wide tests after `uselocale`, `setlocale`, other threads, `newlocale` in place) and the stale-word plant in handoff/wctype-trie-file-plants.txt.
'''
