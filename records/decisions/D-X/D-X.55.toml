body = '''
**Registries take entries as records or fragments; aggregates are generated and train-owned** (RECORDS-1; owner rulings RECORDS and RECORDS-DECISIONS, 2026-11-08). Decision rows, compat flags and the classified saturation rows (sections 1-7) are one file per entry under `records/` (`records/decisions/<series>/<id>.toml`, `records/compat/COMPAT-<n>.toml`, `records/saturation/SR-<n>.toml`), in a strict canonical TOML subset that xtask reads itself (xtask keeps no third-party dependency); a registry that is a set of documents takes a new file (a saturation section `docs/saturation/<n>-<slug>.md`). The aggregates are generated views: `plan/07-decisions/*.md` (not the prose note `x3-regex-lazy-dfa.md`), `docs/compat-flags.md`, `docs/saturation-register.md` and `docs/saturation/01..07-*.md`, rendered by `cargo xtask records-gen` from `records/views.toml`, rows sorted by id, and, like `crates/math/KERNELS.md`, owned by the CI train: a story branch adds or edits records and never commits a view; the train regenerates them, and the stale-view check of `cargo xtask static` is fatal only under `LIELLA_TRAIN=1`. Ids come from the ops store (`ops reserve` for D-<n>, D-X, COMPAT, SR and SAT); without a reserved id a story writes a placeholder record (`D-NEW`, `COMPAT-NEW`, `SR-NEW`) under `records/pending/`. A decision that replaces another is a new record with `supersedes` (superseded is derived from the links, never stored), a partial change uses `amends`, and an existing record is edited only to correct it or add a test reference. `cargo xtask static` validates every record (check `records`: canonical form, schema, path and id, unique ids ignoring case, sections, statuses, dates, links without cycles, test references, table cells with every `\|` escaped). Why: one file per entry means two stories never touch the same file (the three tables caused 38 of the 103 CI conflict events of 2026-11-04..07), and a generated view cannot be hand-edited into disorder.
'''
