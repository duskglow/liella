status = "active"
body = '''
**No DWARF in dev/test builds** (BUILD-DIET, 2026-10-11; build decision, no product code, ABI or behaviour change). `[profile.dev] debug = 0`: test binaries keep their symbol table (function names in RUST_BACKTRACE output) and a panic still names its `file:line` (`core::panic::Location` is compiled in, no DWARF needed; checked with a planted failing assertion in a copy: nextest printed the test name and `panicked at crates/abi/tests/zz_plant.rs:3:5`, the backtrace named both functions, 0 debug bytes). Why: Zen 1 is disk-bound (sda 100% busy, ~4 TB/day). Measured on Zen 1 role z, `cargo test --workspace --no-run`, full debuginfo vs debug = 0: cold 187 s / 8.72 GB written / 8.7 GB target vs 131 s / 1.68 GB / 1.7 GB; warm (two core files touched) 27 s / 7.21 GB vs 17 s / 1.29 GB; s12_stdio_symbols 53 MB (50 MB DWARF) vs 3.4 MB. line-tables-only (Haswell-EP, bytes only) sat in between (4.3 GB cold, 3.5 GB warm). Incremental stays on: CARGO_INCREMENTAL=0 cut bytes further (0.47 / 0.44 GB) but a warm rebuild took 104 s instead of 17 s (Haswell-EP, timing contaminated by its storage fault; to recheck in BUILD-DIET-2). Opt-in for a debugger or source-level backtrace: `CARGO_PROFILE_DEV_DEBUG=full` (or `line-tables-only`); `xtask affected` prints this hint on a red run. Unaffected: the products (`fast` inherits `release`, which keeps line-tables-only; own manifests), the gdb tools (wl_trace, hottext) which step products by symbol, and the unwinder (.eh_frame, not DWARF debug sections).
'''
