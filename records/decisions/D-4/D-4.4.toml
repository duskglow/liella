body = '''
**Internal:** `eq_ignore_case(a, b, &Locale)` uses Unicode full case folding. **Boundary:** `*casecmp` keep the contract's per-byte `tolower` semantics via the locale byte table. `_l` variants pass the explicit locale.
'''
