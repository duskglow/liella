body = '''
**The loader's per-thread TLS rides on the static TLS image word; one signal-mask call per thread creation (DL-TLS-THREADS-COST, fix forward of ruling #5285).** `set_loader_tls` stores the area Liella's `ld.so` reserves below TP as the thread TLS image with address 0 (`TLS_IMAGE`), and its `tls_init` / `tls_release` in two words of their own. `pthread_create` reads one image (size word first: a program without TLS reads one word) and in that image's branch either copies it or, for address 0, calls `tls_init` (before the thread block's stores, none of which touches the dtv word it writes). A reused mapping is cleared from the TLS block as for a static program, so under Liella's `ld.so` the surplus of a reused mapping is zero like a fresh one's. The creator's mask comes from the `sigprocmask` call that blocks every signal for the clone (its old mask), not from a separate query; the mask is restored only when blocking succeeded. Together they bring static `pthread_create` + `pthread_join` back to or below its count before DL-TLS-THREADS (`validation/wl_percall.sh`, instructions:u; numbers in handoff/DL-TLS-THREADS-COST.md), with the exit path's `tls_release` check kept. Local, testable detail; no interface change.
'''
