story = "LAYOUT-TRACE-HOST-CANONICAL-2"
date = "2026-11-13"
body = '''
**The hot-text trace is a function of the tree, not of the build host** (LT-4 of plan/layout-rethink.md; rulings #5191, #5222, #5223; stories LAYOUT-TRACE-HOST-CANONICAL and -2). tools/hottext/trace_gdb.py, used by `regen.sh` and by trace-at-build, removes every host input a trace showed. **CPU:** the program never sees the host's CPU: its two CPU entries (`liella_machine_cpuid`, `liella_machine_xgetbv0`) are answered from a fixed virtual CPU, and every probe runs once per class (`v3-erms`, `v3`, `base-erms`, `base`: the AVX2 and ERMS decisions that choose code); the runs are merged into one first-touch order, so every candidate a class decision can pick is grouped by rule; a host that cannot execute a class's code fails loudly; self-check: a class with AVX2 and one without that ran the same functions fail the trace (the program saw the host's CPU). **Environment:** exactly the variables the caller names (sorted), cwd `/`, address randomisation off, the program run from a copy at a fixed-length path (argv[0]). **Data:** at the entry of the program's path system calls (open, stat, access and unlink families) the tracer points the path at a file the tree supplies (tools/hottext/canon_host.sh): passwd and group for the caller's IDs, a stock host's nsswitch.conf, resolv.conf, host.conf and gai.conf (tools/hottext/hostdata), an en_US.UTF-8-only locale archive, and the name-service cache region `/dev/shm/liella-nscache-<uid>` as a fresh file per run (#5223: every run creates it, whatever the host's /dev/shm holds); not a user or mount namespace, because the cache keeps a private table in a non-initial user namespace (crates/legacy/src/nscache.rs) and such a trace runs another path than deployed hosts; self-check: any other host path the program touches (absent ones included) fails the trace, except the declared residual inputs (/usr/share/locale, /usr/share/locale-langpack, /usr/share/zoneinfo, /proc, /sys, /dev/null, /dev/urandom, /tmp scratch), whose digests canon_host.sh prints with every trace with the kernel release and the localedef version, so two hosts whose digests match give identical lists. **System call stops** are told from breakpoints by %orig_rax (the call number at a system call stop, -1 at a breakpoint's trap; ptrace(2), x86-64), never by the pc: the instruction after a `syscall` can be a function label (`liella_machine_cancel_window_end`), and gdb ended the program when resumed over that label's breakpoint, cutting the p_cold trace short; such a breakpoint is dropped at the entry stop and its function counted at the return stop. Measured (LAYOUT-TRACE-HOST-CANONICAL, same products on a Zen 1, a Skylake-SP and a Haswell-EP host): byte-identical trace files 17 of 17 (next's tracer: 8 of 17, every difference an ERMS-chosen candidate). Cost: four class runs per probe (a fast-profile trace set took 126 s to 479 s against about 60 s); the owner accepts it (11-13: correctness and byte-identical results first; LT-3's tracer or a trace cache keyed by its inputs are later speed goals).
'''
