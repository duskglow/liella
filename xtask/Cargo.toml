[package]
name = "xtask"
description = "Build, test-generation and policy tooling (cargo xtask <command>)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Tooling runs on the host with std and deliberately has no third-party dependencies. liella-ld
# (workspace, no dependencies outside it) gives the ld.so link check (L14-1, D-27.13) its ELF
# reader and `RelocKind`.
[dependencies]
liella-ld = { workspace = true }
