tests = ["crates/core/tests/hot_text_products.rs::init_startup_state_follows_the_declared_order", "crates/core/tests/hot_text_products.rs::init_startup_data_accesses_are_in_the_data1_cluster", "xtask/src/coldbss.rs::declared_startup_state_is_found_whatever_its_symbol_suffixes"]
body = '''
**First-call start-up state goes to a page-aligned `.lbss` cluster after `.bss`, not into `.data1`** (LAYOUT-STARTUP-STATE-LOCALE-3 and -4, 2026-11-12; rulings #4942 and #4949; amends D-X.70; layout only, no symbol, no behaviour change). Entries after the `cluster first-call` line of `crates/libc-so/startup-state.list` are state that only a first setlocale, setenv, localtime_r, mktime or catalog lookup touches, never a process that makes none of those calls. The zero-filled ones of the member with the most such bytes (the library's Rust object) are renamed `.lbss` (the exact name; the cold tables are `.lbss.<symbol>`), in list order, after the every-process tier and ahead of that member's cold tables in the section table. The first of them is set to 4096-byte alignment (`objcopy --set-section-alignment`) and the build checks that the first `.lbss` section in index order carries it; a later one may be page aligned by its own type (intl::RESOLVED, `align(4096)`, GETTEXT-SLOTS-PAGE), which the cluster keeps. Initialised first-call objects (about 300 bytes) and another member's (`__daylight`, `__timezone`, `__tzname`) stay in `.data1` after the every-process tier. Why: in `.data1` the first-call state (4 KiB of intl::RESOLVED among it) lay between the every-process tier and the C members' start-up words, and the `true` probe touched one page more than next (+1 at every pad). Options weighed: (A) keep it in `.data1` behind the every-process tier, rejected for that page; (B) a `.ldata` cluster, rejected: GNU ld's default script gives `.ldata` its own writable PT_LOAD and the static-PIE start accepts exactly one writable segment (D-X.68); (C) `.lbss`, adopted: the default script places it after `.bss` in the one writable segment, and a page-aligned start makes its page split independent of what precedes it (zero-filled pages have no fault-around window). Measured as in the companion order record: `true` equal to next at every pad and profile, locale and tool keep the order's gain. `init_startup_state_follows_the_declared_order` checks each cluster's order and that the cluster starts a page; `init_startup_data_accesses_are_in_the_data1_cluster` names any first-call object the `true` trace touches.
'''
