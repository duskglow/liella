body = '''
**STARTUP-DATA-WINDOWS: the start-up data objects of the static probe in few 64 KiB windows and 4 KiB pages, checked when the products are built** (LAYOUT-STARTUP-DATA, 2026-11-10; extends D-X.22 under D-X.48, beside D-X.49; tooling only, no ABI or behaviour change; plan `handoff/layout-contracts-plan.md` L5, L6, L14). Row STARTUP-DATA-WINDOWS of `layout/contracts.tsv`, kind `startup-data-windows` (`xtask/src/layout.rs`): `page_faults.c` linked as for STARTUP-TEXT-WINDOWS; the objects of `crates/libc-so/startup-data.keys` (`@generated` by `tools/hottext/startup_data.py`, run by `regen.sh`: data addresses of `perf record -e page-faults -d` of `page_faults true` and the RIP-relative operands of the start-up functions of `startup-text.keys`, resolved to named data symbols, build-stable keys; compiler-numbered `anon.*` constants left out) plus, at check time, every object or unnamed byte the start-up functions' RIP-relative operands address. Kind by the section in the checked link: read-only (not writable) objects count 64 KiB windows (file fault-around), objects of writable sections (.data, .data.rel.ro, .bss, .lbss) count 4 KiB pages; an object larger than the unit counts the units of its head only (the heap reserve is 64 KiB, start-up touches its head); TLS is not counted. Budgets measured on origin/next 21ef00b34 products: fast 3 windows / 20 pages, release 4 / 21. Over a budget the check lists every window or page of that class and names each object alone in one (each costs a fault of its own). Products and counters only, no timing. Not evaluated in this story: renaming the written start-up objects' sections into one section the default scripts place together (brief item 3); see `handoff/LAYOUT-STARTUP-DATA.md`.
'''
