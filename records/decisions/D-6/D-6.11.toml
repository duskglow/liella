id = "D-6.11"
section = "s06"
spec = "§6.4"
ann = "PERF"
status = "active"
body = '''
**Fused UTF-8 -> UTF-16/UTF-32/UCS-2/UCS-4 transcoder beside the pivot (ICONV-1).** `crates/core/src/iconv.rs` is now `iconv/mod.rs` + `iconv/fast.rs` (coordinator decision 2026-10-09, RULING 1: no ABI or boundary change). `Conv::convert` offers a UTF-8 source with a wide target (`fast::wide_target`) to `fast::utf8_to_wide` at the top of each loop turn: one tight loop (const-generic on unit size, order, UCS-2) with inline RFC 3629 decode and unit store, and an out-of-line ASCII widening run entered after eight ASCII bytes in a row. It converts only whole valid characters the target stores natively and stops, touching nothing further, at the end of input, no room for the next whole character (a surrogate pair is both units or neither), an incomplete or invalid sequence, or an astral character into UCS-2; the general loop then handles that one character, so E2BIG, EINVAL, EILSEQ, //IGNORE, //TRANSLIT, the BOM (written before the first fused call; UTF-16/32 without order store little-endian) and the irreversible count are the pivot's, unchanged. Tests: `fused_utf8_to_wide_equals_the_pivot_loop` (every target, flag set, C and C.UTF-8; every input prefix = split at each byte; every output size from 0; resume), `fused_decoder_agrees_with_decode_utf8`, `planted_bugs_are_caught` (no third-byte check, wrong UTF-32 order, no UCS-2 astral fallback: each makes the comparison fail); the `iconv_diff.c` oracle is unchanged. Zen 1 instructions per op: utf8_utf16_mixed_4k 220,317 -> 70,958 (glibc 117,802); utf8_utf32_mixed_4k 216,783 -> 69,268 (116,120); utf8_utf16_ascii_4k 31,584 -> 28,406 (131,764). Considered: eight-byte ASCII attempt at every ASCII byte (mixed 59k but regressed ascii-only, then 75k: the failed attempt's setup spilled registers), per-char run counter chosen.
'''
