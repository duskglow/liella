id = "COMPAT-4"
behaviour = "Regex compile limit on stacked or nested `+` (§14.9; D-14.8 amendment, owner ruling 2026-10-10)"
glibc = "`regcomp` expands each `+` into a second copy of its operand, so stacked or nested `+` grow exponentially and fail with `REG_ESPACE` (from 24 stacked `+` on `b*`; 12 stacked take 10 s and 882 MB)"
liella = "One copy of the operand per `+`: the program grows about linearly (quadratic at most for nested scopes) and these patterns compile; `{m,}` with m >= 2 and bounded repeats still multiply, with no fixed size cap: they compile as far as the process's limits allow, then `REG_ESPACE` (D-14.8 as amended by REGCOMP-FALLIBLE-ALLOC-2). Same class (DFA-TIMEOUT, coordinator ruling 2026-10-11): the back-reference work budget (`re_max_failures` x 65536) charges the work of each thread insertion (buckets probed, groups x capture classes), not one unit per insertion, so nested back-reference patterns such as `(a*)*\\1(a*****...` answer `REG_ESPACE` in bounded time (all pinned fuzz inputs together 1.2 s at the fuzz budget of 16 failures; one took 7-9 s before) and may answer it earlier than before"
restore = "A tunable selecting a lower node cap for `+` expansion that makes `regcomp` answer `REG_ESPACE` at glibc's stacking depth; the compile path already counts nodes, so the check is one compare per allocation"
cost = "none on matching; compile time only"
status = "registered"
