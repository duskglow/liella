id = "D-23.6"
section = "s23"
spec = "§23.6"
ann = "HIST"
status = "active"
body = '''
**Internal:** IP-23, `liella::time::Zone`, from TZif v1–v4 (RFC 8536, leap seconds included; the footer after the last transition, type 0 before the first) or from a POSIX rule. Rule grammar: RFC 8536 v3 times of ±167 h; a missing std name or offset (hh 0–24) makes the value invalid, which gives UTC named by its leading valid name; an invalid DST name means standard time only; an invalid or missing DST offset or date takes its default (one hour east; `M3.2.0`, `M11.1.0` at 02:00). Rules apply in every year (glibc keeps the 1970 state for earlier times), and out-of-range dates or offsets are invalid (glibc clamps or computes odd transitions); both are recorded differences. Selection (`time::load`): TZ unset is `/etc/localtime`, else UTC; TZ empty or `:` is UTC named "Universal"; otherwise, after one leading `:`, the regular TZif file at the path or under `TZDIR` (default `/usr/share/zoneinfo`; ignored in secure mode), else the value as a rule. **Process state:** `legacy::time_compat` keeps every selected zone for the life of the process (keyed by TZ, TZDIR and file identity), so `tm_zone` and `tzname` stay valid; an implicit tzset (`localtime`, `mktime`, `timelocal`, `ctime`) re-selects when TZ or TZDIR change (TZ-FRESH, owner ruling 2026-10-09: both are read from the `environ` array at every implicit tzset with the shared environment scan and compared by value, so a raw write into the array or an in-place edit of the string is seen, as in glibc; no cache is keyed on a change counter or the array's address; TZDIR is read only when TZ changed and by the explicit tzset: with an unchanged TZ the current zone stays whatever TZDIR becomes, as glibc, which reads TZDIR only when it loads a file) or when the zone file's identity (dev, ino, size, mtime, ctime) changes: `/etc/localtime` with TZ unset, as §23.6 says, and a file TZ names (glibc never re-reads one). The file is checked at most once per second by an implicit tzset (the vDSO monotonic clock, one atomic word per kept zone, no lock when nothing is due; COLDSTART-SECOND-LATENCY-3, coordinator decision 2026-11-06: in front of that clock read, the hot path uses D-7.14's TSC gate with the same rule and threshold, `recheck::TscGate` over `tsc_holds`/`tsc_allow`, so while the counter is within the ticks left of the interval at its last clock read no clock is read; `TZ` and the invalidation generation are compared before the gate, so a changed `TZ` is seen at the next call; no counter, a counter that went backwards and a forgotten check read the clock as before; tests `recheck::tests::tsc_gate_in_front_of_a_check`, `reload` `an_implicit_selection_sees_a_replaced_zone_file_after_the_interval` and `a_changed_tz_is_seen_by_the_next_implicit_selection`; PERF-FIRSTCALL-MKTIME-SNPRINTF, coordinator ruling 2026-11-06, provisional until booked timing: a file zone makes the process's one counter query (`PR_GET_TSC`) and starts its gate when it is loaded, because the load already makes system calls and the first `mktime` after `localtime_r` then makes none and takes no fault (cold rows, Haswell-EP host, not booked: first_mktime_new_york 4736 -> 660 ns, glibc 742; first_localtime_r_new_york 1.78 -> 1.79 of glibc, 47639 -> 46675 ns, within run-to-run spread; test `init_first_mktime_after_localtime_r_takes_no_fault`)), at once by the explicit `tzset` and when the selection moves to another kept zone (owner ruling 2026-10-05, `legacy::recheck`; probed: glibc checks `/etc/localtime` at every implicit tzset but misses a replacement within the same mtime second); Reload on request: `liella_tz_invalidate` (D-X.13) makes the next implicit tzset check every kept zone file at once, whatever the time of its last check. the `_r` forms use the current zone; one lock, held across `fork`. **Globals:** `tzset` writes `tzname`/`timezone`/`daylight` (C objects with glibc's aliases in the products; private statics in test builds) on every explicit call and on zone changes, never from the converted period (glibc's `localtime` rewrites them from the period it converts, an artifact): for a file, each flag's abbreviation from the last transition with that flag, the footer's names first; `timezone` the footer's or the last standard offset; `daylight` set if any type is DST; a zone without DST repeats its standard name. `tm_gmtoff` and `tm_zone` are always filled.
'''
