id = "D-14.8"
section = "s14"
spec = "§14.9"
ann = "ARB"
status = "active"
body = '''
**Stacked repetitions are not collapsed** (owner ruling 2026-10-06, FZ-1). `x++`, `x*+`, `x+*` and deeper stacks are compiled as written, as glibc does (glibc expands them too: 10 s and 882 MB for `b*` with 12 stacked `+`, `REG_ESPACE` at 24); rewriting them to `x+`/`x*` in the parser would make Liella accept patterns glibc rejects. Memory is bounded instead by D-14.4's state bound (2^21 matcher states, then `REG_ESPACE`). **Possible future opt-in:** collapsing stacked repetitions is a candidate for an explicit, opt-in incompatibility with glibc (e.g. a Liella-specific `regcomp` flag or tunable) if a use case appears; it must never be the default. **Amendment (REGCOMP-PLUS, 2026-10-10, coordinator decision after fuzz artifact slow-unit-c63eda00):** still no collapse and no rewriting, but `X{m,}` (`X+` is `X{1,}`) no longer compiles its last mandatory iteration as a separate copy: that copy has exactly the loop iteration's instructions (`ENTER X EXIT(empty: next, consumed: loop)`; for a consuming body without groups, `X` then the loop's split), so the loop iteration is entered directly. Each `+` level keeps one copy of its body instead of two: stacks grow linearly in instructions (nested scopes add one node per level to the instructions inside, so quadratic at most) instead of doubling. Measured (Zen 1, test build): `a` with 16 stacked `+` was a 5.2 MB program (38 ms) and 20 was `REG_ESPACE`; 32 is now 2.1 KB (26 us); `((a)+)+...` 32 deep 54 KB (0.3 ms), was `REG_ESPACE` from 16. Every `X+` program is smaller (`a+` 552 -> 504 bytes). Observable (owner ruling 2026-10-10: accepted; registered as COMPAT-4): stacks that answered `REG_ESPACE` now compile (glibc answers `REG_ESPACE` from 24 `+` on `b*`): a resource limit, not syntax. Matches and subexpressions unchanged (`regex_oracle_diff::stacked_repetitions_agree_with_the_oracle`, `tests/regex_stacked.rs`). The remaining cap is D-14.4's (2^20 instructions / 2^21 nodes, then `REG_ESPACE`, about 40 ms to reach): stacked repeats with a minimum above 1 or a bound (`a{2,}{2,}...`, `a{1,2}{1,2}...`) still multiply, as their expansion needs distinct copies. **Amendment (FUZZ-REGEX-TIMEOUTS, 2026-10-24, coordinator rulings #1782, #1818, #1784; fuzz artifacts timeout-17cddcb6 and timeout-03cdcdb2):** still no collapse and no rewriting. (1) Shared level: a scope with no group nested directly in another repetition shares the outer scope's empty-iteration level instead of adding one matcher node per depth, so a group-free stack has nodes linear in its depth (a 60-deep stack is 609 nodes, was > 1024). (2) Unhidden nested Rep: `hide_subpatterns` no longer wraps a group-free Rep that is the whole body (through `?`) of another Rep in a hidden group; the outer Rep of a stack is still hidden, which fixes the stack's span, and for a fixed span the inner choices form a product set, so the subexpressions after it are the same. Without (2) the fuzz inputs' stacks were all hidden groups and (1) never applied. (3) In-call cap: the fuzz harness's `Accel::cap` (test knob, default 0) now also ends the fast pass (`run_fast::<CAP>`, checked once per position; the uncapped instantiation is the default code). Numbers (release): the capture passes over the artifacts took 1.8 s (run 1; 2.55 s with only (1)) against the reference's 0.14 ms; now they finish inside the test bound of 45 ms (10x the reference x the build factor, `tests/regex_stacked.rs::stacked_star_capture_pass_is_linear`). Matches, subexpression offsets and error codes unchanged (`regex_oracle_diff` with subexpressions, `regex_subpatterns`, `regex_stacked`). Measured limit (#1830): a 150-deep stack compiles (more than 1024 nodes: the DFA falls back), 400 deep answers `REG_ESPACE` at regcomp (the reference from 24 stacked `+` on `b*`), so the instruction count still grows faster than linearly in depth; where was not located in this run (open).
'''
