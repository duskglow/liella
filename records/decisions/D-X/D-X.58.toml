body = '''
**Liella's thread-block words at 0x9c-0x17f are read and written only in blocks the runtime made; the test is the process-level fact `owned()`, never a word in the block.** A block another C library's loader made (a test process's threads, a program under another `ld.so`, D-22.10) uses those offsets for its own data, so a word there is never a pointer or a decision for Liella. `owned()` is a hidden byte (`liella_machine_owned`, machine/points.S) that `init_initial` sets when the runtime starts the process: Liella then creates every thread, so every block that runs library code is its own. The asm cancellation-point entries (read, write, pread, pwrite, close) test that byte (a `cmpb` and a branch; in the TID fast paths it replaces the 0x9c test); Rust tests its own mirror (below). `FLAG_OWN` is still written in Liella's blocks and read nowhere (the library has no reader for the word). `ld.so` follows the same rule with its own process byte: `__tls_get_addr` reads the dtv word at `%fs:8` only when this loader built the initial thread's block (`install_tls`, which starts every process it runs), refuses with status 127 otherwise (the object loaded as a library under another loader), and refuses on a zero dtv word (a thread with no vector yet). Elsewhere `thread::words()` gives the calling thread a block-shaped area of its own: an entry in a registry of 64-entry chunks (anonymous mappings, never unmapped) keyed by thread pointer with linear probing and holding the kernel TID. Another TID at the same pointer is a new thread on a reused block (empty words), except for a thread whose TID is the process ID: a process's first thread meets an entry keyed by its pointer only as `fork`'s copy, so a forked child keeps its parent thread's words whichever library's `fork` ran. A thread `create` made keeps its words in its own block (`claim_own` to `release_own`). With no chunk mappable (ENOMEM) every foreign thread shares one static spare of atomics (memory-safe; its state is then process-wide, and its resolver state is never freed). Options considered: (1) the process fact, chosen: safe by construction, about +2 instructions; (2) a value only Liella writes at 0x9c (tp XOR a secret): +3 instructions, and a program can plant it; (3) a registry lookup on every access: a lock or walk per call (it is the foreign-only slow path); (4) ELF TLS for the foreign words: exact per-thread semantics but adds PT_TLS to libc (ruling #4212: only if the foreign path's cost ever matters, decided with phase-14 TLS). Out of scope: the words at 0x80-0x9b (TB-FOREIGN-WORDS-LOW, ruling #4213) and the period cache at 0x140 (the WCTYPE-TRIE-FILE chain, #4214). Tests: crates/boundary/tests/tb_foreign_words.rs (decoys in 0x9c-0x17f with bit 0 of 0x9c set: answers correct, nothing written), s07 `foreign_thread_words_kept_in_forked_child`, conformance/c/tb_period_cache.c (the period words in a process the runtime started, across a thread and a fork), crates/ld/tests/tls.rs `tls_get_addr_refuses_in_a_process_it_did_not_start` (the built `ld.so` loaded by a program of another C library, called on a block shaped like its own with bit 0 of 0x9c set). Cost (rulings #4779, #4888, #4889; TB-FOREIGN-SAFETY-12): Rust's mirror is the crate-private word `OWNED_HERE`, all ones when the runtime started the process, else 0 (`owned_mask()`; `owned()` is `owned_mask() != 0`, one `cmpq`), read with a plain read through `as_ptr()`, not an atomic load, so the compiler folds it into a memory operand. A hot path that loads a word of the calling thread's block and tests it for zero (the `view` word: `MB_CUR_MAX`, `iswalpha`, `towupper`, `wcwidth`, ...; the ctype words: `toupper`, `__ctype_b_loc`) reads `tb::read::<F>() & owned_mask()`: the `and` with the memory operand replaces the `test`, so the gate costs those paths no instruction against a build without it (the `cmpb` and branch of runs 1-11 cost +2 and put `MB_CUR_MAX` over its instruction limit). In a process another library started the result is 0 whatever the block holds: the load happens, its value is discarded (never a pointer or a decision), and the zero sends the call to its unstored path, which tests `owned()` before reading anything else of the block. That read is the S2 unsafe category *process-flag* (owner ruling #4888): a non-atomic read of a word written only before the first thread starts, permitted only in crates/boundary/src/thread.rs and only as `*OWNED_HERE.as_ptr()` (`cargo xtask static` refuses it elsewhere and any other block body; docs/architecture.md S2). It is sound because `init_initial` stores the word once on the initial thread before any other thread exists (thread creation orders that store before every later thread's reads) and a fork child copies the settled word. #4779's bound (<= +2 instructions per one-access locale call against next) is judged on the Release build, which ships (#4889).
'''
