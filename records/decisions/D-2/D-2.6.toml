body = '''
`fmtmsg` and `addseverity`, rewritten under the clean-room rules of §1.4 (item 4) in a fresh session from the spec, `spec/behaviour/fmtmsg.md` and black-box probes. **Message:** label, severity, text, `TO FIX: ` + action, tag, in that order; each present field is followed by its separator (`": "` after label and severity, a newline after text, two spaces after action) and the message ends with a newline; a field is present when its pointer is non-NULL; `MM_NOSEV` prints no severity. **Labels:** the 10:14 byte limits exactly as the contract states, split at the first colon; no colon, an unknown or negative severity gives `MM_NOTOK` whatever the classification. **Environment:** `MSGVERB` (colon-separated keywords, one optional trailing colon; anything else selects all fields) and `SEV_LEVEL` (`keyword,level,printstring`; `strtol` base-0 levels above 4 and within `int`; malformed elements skipped) are read once, at the first `fmtmsg`, into one table shared with `addseverity` (so `SEV_LEVEL` overrides earlier `addseverity` calls for the same level and later calls override it). **addseverity** copies its string (the reference keeps the pointer) and refuses levels ≤ 4 and removal of absent levels; the table holds 256 added severities (`MM_NOTOK` when full; replaced strings are not reclaimed, a known inefficiency). **Output:** `MM_PRINT` writes through the `stderr` stream (unoriented becomes byte-oriented; wide gets the text converted; no flush), a failure gives `MM_NOMSG`; `MM_CONSOLE` writes the full message (ignoring `MSGVERB`) to `/dev/console` as the spec names, a failure gives `MM_NOCON`, both failing give `MM_NOTOK`. The reference sends console messages through `syslog(LOG_ERR)` and never reports a failure; Liella follows the spec (owner ruling 2026-10-02: spec over reference, §1.4).
'''
