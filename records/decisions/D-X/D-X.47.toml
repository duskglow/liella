body = '''
**Hot-text keys carry tier and profiles; a stale start-up or fork key fails `so`** (HOTTEXT-STARTUP-COMPLETE, 2026-11-07; layout only, no ABI or behaviour change; extends D-X.20, D-X.32). Each line of `crates/libc-so/hot-text.list` is `<key>\t<tier>\t<profiles>`: the tier of the first probe that touched the key (startup, fork, stdio, strings, locale, tool, extra) and the profiles whose trace hit it (fast, release; `-` for keys of the older list that no current trace hits, kept unguarded), written by `tools/hottext/regen.sh` / `merge.py` in first-touch order (HOT-ORDER). `hottext::group` fails when a startup- or fork-tier key traced in the profile being built matches no function section ("renamed, now generic or inlined: run tools/hottext/regen.sh"), and prints the count of the other unmatched keys; archives built with other flags (the bench's x86-64-v3 copy) are not guarded. Cause: the key of the non-generic `runtime::start` matched nothing once the function became generic, so `start::<false>` (5.1 KiB) and `apply_irelative` sat in cold `.text` and crossed a 64 KiB window when code before them grew (LIBM-F64-LOG-FAMILY-WIRE-2). The list was regenerated for both profiles and merged into the previous one (a `--replace` regeneration lost 130 keys and read setlocale+printf and tool +3 each in the fast profile, so it was not kept). \| Skylake-SP host, one role, `hot_text_products.rs` counts (5 runs each, every run identical), origin/next e6f60a3ff -> this change: fast startup 21 -> 18, setlocale+printf 60 -> 57, tool 62 -> 60, fork child 7 -> 7; release 20 -> 17, 64 -> 58, 65 -> 61, 6 -> 6. `perf record -e page-faults -d` of `page_faults true` (after exec, ADDR_NO_RANDOMIZE): .text faults 8 -> 5 (fast), 8 -> 4 (release), every other section the same; before, `start::<false>` faulted its own window (0x54xxxx fast). No bound lowered (one host measured). Checked by `init_cold_startup_functions_are_grouped` and the hottext unit tests; plants in `handoff/HOTTEXT-STARTUP-COMPLETE-plants.txt`.
'''
