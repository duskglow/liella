body = '''
**binary128 `expf128` and `logf128` three-limb integer tier: method and proof** (LIBM-F128-EXPLOG, -2, -3; D-10.52's integer fixed point at 192 bits; contract unchanged: correctly rounded in every mode). `crates/math/src/wide_int/quad/explog.rs` is the first tier of the two functions for binary128, ahead of the 384-bit route (`wide::tiers`), and uses the binary128 integer rounding test of `wide_int::quad` with the bound as a parameter (`round_within`). Exponential: Tang's table method (P. T. P. Tang, "Table-driven implementation of the exponential function in IEEE floating-point arithmetic", ACM TOMS 15(2), 1989) in three 64-bit limbs: `k = round(abs(x)·128/ln2)` from one 64×64-bit product, `r = abs(x) − k·ln2/128` in units `2^-199` (`abs(r) < 2^-8.52`), `e^r − 1 = r + r²·g` with `g` by a fixed-point Horner from `1/12!` (four steps in one limb, six in two; Horner in fixed point per R. P. Brent and P. Zimmermann, Modern Computer Arithmetic, 2010, ch. 4), times `2^(j/128)` in three limbs. Logarithm: Tang's logarithm table method (ACM TOMS 16(4), 1990) with the two-step multiplicative reduction of W. F. Wong and E. Goto (IEEE TC 43(3), 1994): `u1 = y·c1 − 1` exact (`abs(u1) <= 2^-7`), `u2 = (1 + u1)·c2 − 1` exact (`abs(u2) < 2^-12.98`), `ln(1 + u2)` by a degree-11 series, `ln x = E·ln2 − ln c1 − ln c2 + u2·h1`. Tables: the x87 tier's (D-10.73) reciprocals and two-limb values are shared; this tier adds only their third limbs (`2^(j/128)` 128, `ln c1` 128, `ln c2` 65 entries of 8 bytes: 2.5 KiB), generated by `crates/mathtools/src/ld_explog_tables.rs` (`cargo xtask tables`). Proved bounds (module documentation, steps X1-X6 and L1-L4): exp `2^-141.77`, log `2^-145.9` (near 1 `2^-146`); the rounding test assumes `2^-140` (`B = 140`). Subnormal and overflowing exp results take the same test at the result's last place, then the float rounding for the flags (refused only at the subnormal boundary with 113 one bits, where tininess after rounding needs the bit below the round bit). Measured: 10^7 seeded operands over twelve bands (typical, near overflow, near and below the underflow threshold, subnormal log operands, near 1) in the four modes against the 384-bit route: 33,333,160 calls 0 undecided, worst `2^-141.96`; near 1 6,666,632 calls 16 undecided (they go on to the 384-bit route), worst `2^-146.53`. Instructions per call (release, Broadwell-EP host, 113-bit operands, `validation/percall/libm_f128_explog.c`): `expf128` 767 (was 33,418; reference 6,682), `logf128` 898 on [0.01, 1000] (was 70,524; reference 7,794), 884 near 1 (was 48,493; reference 7,481). Not adopted: a double-double or triple-double first phase (binary128 needs more than 106 bits before the rounding test can decide), a 256-bit four-limb kernel (the 192-bit bound already leaves 27 bits over the 113-bit significand). Timing (Ivy Bridge, AVX2 host): not yet measured. log2/log10/log1p/expm1/exp2/exp10 for binary128 on the same kernels: the next story.
'''
