body = '''
**The start-up group ends inside the first fault-around window; first-window keys follow the start-up tier** (LAYOUT-FIRST-WINDOW, 2026-11-12; #5026, ruling #5096; layout and build tooling only, no symbol, no behaviour change; extends D-X.63 and D-X.77). The first text fault of a static program maps the 16 pages from the start of its executable segment (the kernel's 64 KiB fault-around window, clipped to the segment start), and the start-up tier fills most of them. `liella_sys_fstat`, which every stdio stream's first output, the locale archive load and the zone file load run but the `true` probe does not (so it is stdio tier), sat behind `puts` and other keys no fault-bounded probe runs; a 0x240-byte start-up growth (LAYOUT-HOTKEY-INLINE-STABLE-4) moved it from 0x417e00 to 0x418040 in the release products, and the tool, locale, localtime and localtime_mktime probes each took one more text fault. (1) A hand-kept `crates/libc-so/hot-text.first-window` (`<key> TAB <reason>`) names keys that `cargo xtask so` links right after the start-up tier, in file order (`xtask/src/hottext.rs::link_positions`); the generated `hot-text.list` keeps its order. A line whose key is not in the list, is in the start-up tier, or lies inside a cluster's range fails `cargo xtask static` and `so` (a regen build reports it and links in list order). It holds `liella_sys_fstat`. (2) `init_startup_group_ends_inside_the_first_fault_around_window` links the probe with a map and fails, naming the four probes, when the start-up group (start file, start-up tier, first-window keys) or `liella_sys_fstat` ends past the executable segment start + 64 KiB; it prints the margin. Options weighed: (A) put what the probes share first, adopted: one key moves, no alignment, no extra page; (B) move the rarely-first keys (`puts`, `puts_general`, untraced extra keys) out of the head, rejected: it needs a change to the generated order through a full two-profile regen, and every program that writes through stdout runs fstat before puts, so fstat first serves the same programs; (C) align `.text` to 64 KiB, rejected: the first window stays 16 pages, so it moves no start-up function into it. Measured (Skylake-SP host, `hot_text_products` with every phase, minimum of five runs, against next): release tool 54 -> 53, locale 51 -> 50, localtime 18 -> 17, localtime_mktime 18 -> 17; fast localtime 19 -> 18, localtime_mktime 19 -> 18; every other probe equal (true, fork, float, mktime, strings, rebind; fast tool and locale). Margins: release 1908 bytes, fast 1012 bytes.
'''
