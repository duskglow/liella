id = "D-18.3"
section = "s18"
spec = "§18.4"
ann = "PATH"
status = "active"
body = '''
**Internal:** file actions are `liella::process::FileAction`, byte-encoded in a caller-heap block (`__actions`/`__used`). Every descriptor an action names is checked when it is added (`EBADF` if negative or ≥ `RLIMIT_NOFILE`, `addfchdir_np` included: glibc accepts -1 and fails in the child; KNOWN). Attributes keep the `posix_spawnattr_t` layout; `setflags` takes 0x1ff; `setschedpolicy` takes every policy `sched_setscheduler` accepts (0, 1, 2, 3, 5; glibc refuses BATCH and IDLE; KNOWN). **Creation (owner ruling 2026-10-09, SPAWN-VFORK):** the caller blocks all signals; `clone3(CLONE_VM\|CLONE_VFORK\|CLONE_CLEAR_SIGHAND[\|CLONE_PIDFD\|CLONE_INTO_CGROUP])` makes a child that shares the caller's memory (no page-table copy) and runs `boundary::spawn::child_main` on a private 128 KiB mmap'd stack (`liella_machine_clone3_run`, the single new unsafe site is `conv::spawn_entry`). The child allocates nothing, takes no lock, uses no stdio, writes no thread-local state and runs no handler (cleared at creation, all blocked until the final mask); it only reads the context on the suspended caller's stack and reports its error through a word there (no shared mapping); no fork handler or cancellation runs. On `ENOSYS` the old copy-on-write path (`clone(CLONE_VFORK)`, shared word, manual handler reset; untested) is used. User-visible `vfork()` keeps D-18.1. Safety lives in: `conformance/c/s18_spawn_vm.c` (exact errnos, no leftover child, heap unchanged by spawns, group signals under load), with planted bugs (child allocates, signals unblocked, errno lost) failing it. Child order: SETSIGDEF, SETSID, SETPGROUP, scheduling, RESETIDS, the actions in order, the mask, exec (the `p` search after the actions). On a child error the child exits 127, the parent reaps it, closes the pidfd (glibc leaks it; KNOWN) and returns the error.
'''
