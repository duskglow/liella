body = '''
**The general object mapper (phase 14 DL-7, DL-MAP; design §3, L14-5; threat model "The dynamic loader" rule 4).** `liella_ld::map` (pure; the system calls through the `Mapper` trait, implemented by `SysMapper` in `boundary/src/ld.rs`). `plan` validates before anything is mapped: `ET_DYN` or `ET_EXEC` (`NotLoadable`); any number of `PT_LOAD`s (no count bound: DL-MAP-PROBE probed the reference loader on 2026-11-10 with objects of 64, 65, 100 to 1100, 4000, 10000 and 30000 `PT_LOAD`s, and it loaded every one through both `ld.so PROGRAM` and `dlopen`; the work stays linear in `e_phnum`, which the ELF reader bounds; the 64 bound of DL-MAP is removed, no differences row); each `PT_LOAD` non-empty (`p_memsz` > 0), `p_filesz` ≤ `p_memsz`, `p_offset` ≡ `p_vaddr` modulo the page, `p_align` 0, 1 or a power of two ≤ 2^46, file bytes inside the file (reader), never `PF_W` with `PF_X` (`WriteExec`); segments in address order and never sharing a page; span ≤ 2^46; an `ET_EXEC` ends at or below `Arch::USER_END`; a `PT_GNU_RELRO` range inside the span (whole pages recorded, `BadSegments` otherwise). `load`: one `PROT_NONE` reservation; `ET_DYN` anywhere, over-reserved by `align - page` and trimmed so the bias is a multiple of the largest `p_align` (also when the first segment is not at 0); `ET_EXEC` at its link-time address with `MAP_FIXED_NOREPLACE` (`Placement` when taken, or when the kernel places it elsewhere). Each segment `MAP_FIXED` inside the reservation with exactly its `p_flags` protection; the `.bss` bytes sharing the last file page are zeroed (writable segment), or, for a read-only segment with `.bss` (no linker emits it, handled for correctness), that page is mapped as zero pages read-write, the file bytes copied, then set to the segment's protection (never W+X at any moment); the rest of the `.bss` anonymous pages. Gaps between segments stay reserved `PROT_NONE` (guard). Any failed call unmaps the whole reservation (`System`). The RELRO range is kept in `Loaded`; `Loaded::protect_relro` applies it after relocation (DL-10). Page size: `Arch::page_size(&Auxv)` = `AT_PAGESZ` when a power of two ≥ `Arch::BASE_PAGE`, else `BASE_PAGE` (x86_64 4096, the only page literal); `ld.rs` passes it to the mapper and the RELRO protection. A program without `PT_DYNAMIC` has no relocations or dependencies: ld.so enters it after RELRO. Messages: `ld.so: <path>: <reason>`, status 127. Proof: `crates/ld/tests/map.rs` (model address space; corpus; `/proc/self/maps` via the product); fuzz target `ld_map`. \| DL-7 row; design §3
'''
