id = "D-4.51"
section = "s04"
spec = "§4.4"
ann = "PERF"
status = "active"
body = '''
**strcoll: lead-byte index into long `extramb` lists** (PERF-STRCOLL-ELEMENTS, 2026-10-23). Per catalog with an ASCII pool slot, up to 16 lead bytes whose `extramb` list has 8 or more entries and closes with the always-matching (length-0) entry get a `LeadIndex`: per next byte (slot 256 = string ends after the lead), the offset of the first entry that can match (a plain entry starting with that byte, a range whose low and high first bytes bracket it, or the closing entry). Entries skipped cannot match, so the walk finds the same element. Built cold at the first element of that lead, published with Release; short, malformed or >= 64 KB lists and a full pool keep the plain walk. wcscoll's `extrawc` lists are not indexed: at most 14 entries (19 in hu_HU) in every test locale. Evidence: tests/locale_data.rs `collation_keys_equal_the_reference_at_lead_list_boundaries` (en_US and zh_CN.GBK, whose ranges span second bytes, against the reference); plants in handoff/perf-strcoll-elements.md.
'''
