id = "D-10.3"
section = "s10"
spec = "§10.0"
ann = "—"
status = "active"
body = '''
Accuracy: correctly rounded where the contract requires it. For every other function, a documented ULP bound per function and format is established by the phase-M tests, and it must be at least as tight as the published bounds OD-1 records. **Owner addition (2026-10-05):** coefficients and tables are generated by project tooling (minimax or Remez fitting, high-precision evaluation) with the derivation recorded, never recalled from glibc's source (which is not read). Goal: results identical to glibc's wherever glibc is correctly rounded or the function is exact; elsewhere within glibc's documented error bound and as close to its output as the algorithms allow. Per function and format, the fraction of a large random sample plus the hard-case corpus on which Liella is bit-identical to glibc is measured; each mismatch is classified with the test oracle (glibc not correctly rounded, or a Liella error) and the table is recorded in `docs/differences-from-glibc.md`. glibc's particular approximations are not reproduced; a program found to depend on glibc's exact last bits is an owner ruling.
'''
