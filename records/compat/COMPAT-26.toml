id = "COMPAT-26"
behaviour = "Program headers whose `p_align` is above 1 and not a power of two (§27, `s27_1_f_0`; reader rule D-27.7, ruling #5294)"
glibc = "An object with a `PT_LOAD` whose `p_align` is 3 loads (gaps probe, `tools/probe/dl/gaps`, ruling #5266); other values and other segment types were not probed"
liella = "Refused as malformed: `dlopen` fails with the dlerror text `<file>: malformed ELF object` and maps nothing; a program or startup dependency with such a header is refused at startup (the one ELF reader, D-27.7)"
restore = "A tunable read at startup that lets the reader accept such a `p_align` and place the segment at page alignment; ignored in a secure (`AT_SECURE`, setuid/setgid) process, as COMPAT-12 is, because it loosens the check of untrusted input"
cost = "none (the flag does not exist; the check is one test per program header in the reader, which stays on every load)"
status = "registered"
decisions = ["D-27.7"]
story = "DL-DLOPEN-LOAD-3"
date = "2026-11-13"
body = '''
Registered option for ruling #5294: the reader keeps refusing a `p_align` that is neither 0, 1 nor a power of two
(the secure default for malformed input). `dlopen` (DL-DLOPEN-LOAD-2) made the refusal visible to programs. Tests:
`bad_align` (`crates/ld/tests/elf_reader.rs`); the dlerror text is `liella_ld::dlopen::Refusal::Malformed`.
'''
