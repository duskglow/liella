body = '''
**`double` `lgamma`/`tgamma` outside the table tier's domain: closed forms in double-double with a proved bound and Ziv's rounding test, not the 384-bit path** (LIBM-RETHINK-GAMMA, -2; ruling #4936; extends D-10.13's tiers). `fast_gamma::domain` covers 2^-60 ≤ \|x\| < 16; outside it every operand took the 384-bit path (probe means: lgamma \|x\| < 2^-60 393 275 instructions, tgamma 426 160, lgamma x ≥ 16 79 395). Rethink: A, per-band asymptotic and series forms (adopted); B, extending the piecewise-Taylor tables over the new ranges (rejected: about a thousand binades of slots up to the overflow, while Stirling needs at most ten terms from 16 on and four from 2^10). **Tiny \|x\| < 2^-60** (`lgamma_tiny`, `tgamma_tiny`): lnΓ(x) = -ln\|x\| - γx + R, \|R\| ≤ ζ(2)x²/2, and Γ(x) = 1/x - γ + R', \|R'\| ≤ 0.99\|x\| + x² (DLMF 5.7.1, 5.7.3: the series of lnΓ(1+x) alternates with decreasing terms). 1/x is q = RN(1/x) plus the exact division residual (two_prod; x scaled by 2^512 below 2^-512, subnormals included, so the residual is exact and q ≤ 2^562); the result is normalized into [1, 2) with its binade m. **Large x ≥ 16** (`lgamma_large`): Stirling's series (DLMF 5.11.1) with ten terms, the remainder below the first omitted term for real x > 0 (DLMF 5.11.ii), 1/(12x) as a double-double; from 2^512 on the whole form runs on the scale 2^-512 (exact; Dekker's split overflows above 2^996) and is normalized, so the band reaches lnΓ's overflow threshold (about 2.5563e305); from 2^1015 the result is an overflow without evaluation. **Rounding**: `fast64::settle` (Ziv's test: A. Ziv, "Fast evaluation of elementary mathematical functions with correctly rounded last bit", ACM TOMS 17(3), 1991) now also takes m = 1023 (a rounded \|v\| ≥ 2 is the overflow in the mode); `settle_wide` takes m ≥ 1024 as the overflow except \|y.hi\| = 1 at m = 1024 (the value may lie just under 2^1024, where the roundings toward zero give DBL_MAX without an overflow: accurate path). Operands whose value lies within settle's slack (2^-100 relative) of a rounding boundary still take the 384-bit path: for tgamma, the powers of two below about 2^-100 in the directed modes and x = 2^k(1 + j·2^-50) for small j. Proof: `gamma_bands` (every operand of a spread over each band and its edges, four modes, bits, status and sign identical to the 384-bit path; the band form answers at least 99% of tiny operands for each function and 98% of large ones, and every ordinary overflow-edge operand). Open bands (LIBM-RETHINK-GAMMA-3): x ≤ -16 (reflection), and the `float` bands (tgammaf \|x\| < 2^-20, x ≤ -34, x ≥ 35; lgammaf x ≤ -42).
'''
