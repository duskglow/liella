body = '''
**Abort only on answers no writer can cause** (owner ruling 2026-10-07, review finding F1; task F1). The constant-time postcondition checks of the C layer's scanners (P7, D-4.14, D-4.20) tell two failures apart. (a) An answer outside its bound (`strnlen` past the limit, `memchr`/`memcmp` past the length) is a scanner bug: `strz::scanner_fault` aborts as before. (b) A reported byte that no longer matches when Rust re-reads it (`strlen`/`strnlen` terminator no longer NUL, `rawmemchr`/`memchr` byte no longer `c`, `memcmp`/`strcmp`/`strcoll` bytes now equal, a `getenv` entry no longer `name=`) proves only that another thread, a signal handler or another process sharing the page wrote the text during the call (glibc returns an answer there: probes 5601ff45b3e7, 6fed6472b76b). The text is then **rescanned once**, unit by unit in Rust from the reported index + 1 (`getenv`: `environ::getenv_bounded` over the array), and that pass's own reads decide the answer, so it needs no further check and cannot disagree with itself. Bound: exactly one rescan, no retry loop; the pass ends at the first terminator, match or difference it reads (or the bound), like any single-pass scan, so a writer can make the call no longer than glibc's own pass over the text it leaves. The answer is valid for a racing input: every byte it rests on was read during the call. Hot path unchanged (the rescans are `#[cold]`, `#[inline(never)]`); memory safety unchanged (the rescans read only bytes the contract makes readable: a string goes on past a byte read as not NUL). Tests: `crates/boundary/tests/scanner_races.rs` (thread, signal handler, `MAP_SHARED` writer process; stale answers; past-bound still aborts). **Amended 2026-10-08 (owner wrapper ruling, STR-K1):** the `strlen`, `strnlen` and `rawmemchr` exports do this check only in the `selftest` build; shipped builds return the scanner's answer unread (a byte that was the terminator when read; D-4.14). **ENV-SCAN (2026-10-09):** `getenv`/`secure_getenv` likewise: `liella_machine_env_find` is a byte loop that compares each byte of the entry as it reads it, so its entry is a correct answer for a racing call; shipped builds return it without `settle_getenv` (selftest builds keep it; `scanner_races.rs` runs there).
'''
