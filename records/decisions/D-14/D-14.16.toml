body = '''
**Lazy-DFA span passes for searches that report positions** (RX-T3, 2026-10-09). `regexec` with nmatch >= 1 and forward `re_search`/`re_match` call `search_with(.., serial, src)`: with `Accel::dfa`, a nonzero serial, a forward window, no back-references and the predecessor section, `Dfa::span` finds the overall match and the matcher only collects the subexpressions on [s*, e*] (`Run::caps` set on entry = span known, `attempt` skips `run_fast`; `Matcher::run` unchanged). (1) Program format `Lrx5`: a trailing predecessor section (presence word; for <= 1024 nodes = NODE_CAP, `nodes + 1` offsets and the lists of nodes with an edge to each node, consuming or epsilon, built in one pass over the nodes at regcomp; larger programs get the presence word 0 and never take the DFA). (2) Span: s* = the leftmost start in the window: first an independent per-byte scan for the first byte that `can_start_with` (none: no match; skipped when the match can be empty), then the reverse pass from the end of the subject to that position over predecessor states (kernel = consuming nodes, context = the character after; END/END_NOTEOL/NL/WORD/OTHER, canonical per the program's `$`/`\'`/word assertions), seeded with the match nodes at every position, accepting where the closure reaches the start node (look-behind = the next byte read, or BOT/BOT_NOTBOL at 0, cached per NOTBOL); it reads every byte to the window start (the last accept is the leftmost). A window of one start (`re_match`) skips it. e* = the anchored forward pass from s* (no seeding, ACC flag where the closure reaches the match, DEAD when no thread survives). Rows carry ACC/DEAD flags under the state offset; all three state kinds share one store entry (D-14.13 caps, flush and fallback rules per pass). (3) Exactness guard: a forward pass that finds no match from a reverse-accepted start hands the search to the NFA (counted in tests: must be 0). Fallbacks as D-14.13 plus: no predecessor section, backward window, a LEAVE byte anywhere between the window start and the end of the subject (the reverse pass reads it all). Tests: `dfa::tests::the_spans_answer_as_the_matcher` (ERE/BRE incl. `ab\|xabc`, `(a?)*`, `(a*)*b`, `(\|a)+`, `\(a*\)\{2,3\}`, `x*`, ends at len; windows to the end / one start / a range; nmatch 1 and full; NOTBOL/NOTEOL; C and UTF-8; full and tiny store); `planted_span_bugs_are_caught` (reverse pass ignores NOTBOL; stops at its first accept); the record/random/corpus oracle diffs now run the optimized side through `search_with` with a store; fuzz `regex_dfa` compares spans and groups. Cost: regcomp +1.7..3.6% instructions (predecessor section), 0 per thread beyond D-14.13's store.
'''
