id = "D-7.1"
section = "s07"
spec = "§7.1–7.3"
ann = "HIST"
status = "active"
body = '''
Every locale-sensitive internal function takes `&Locale`. The global locale and per-thread `uselocale` selection live in `legacy::global_locale`. `setlocale` is MT-safe internally (atomic swap of an `Arc<Locale>`), which is observable and stricter.
'''
