status = "active"
body = '''
**Opt-in diagnostic channel (LIELLA-DIAG-CHANNEL; owner ruling #422, 2026-10-21, with the condition: no performance impact when disabled, particularly on hot paths).** `LIELLA_DIAG=<topic>[,<topic>...]` (`all`: every topic; unknown names and empty items ignored, names exact and case-sensitive) is read once and LAZILY (LIELLA-DIAG-CHANNEL-2, coordinator decision under the owner's condition): the first time a diagnostic call site runs (a rare failure path), `diag::on` checks `process::secure()` (`AT_SECURE`: ignored, like the other tuning), copies the value with `process::getenv_into` (the environment writers' lock, so a racing `setenv` cannot free it; values over 256 bytes are ignored) and caches the topic bits in `boundary::diag::TOPICS` (an `UNREAD` bit until then; compare-exchange, the first answer wins). Startup is exactly as without the channel: run 1 read it at start, and both variants tried there cost startup (a shared `getenv_many` scan with `LIELLA_NSCACHE`: an empty static program 17 -> 20 page faults; a second `getenv`: one more scan per process), so neither was kept. A `setenv` before the first reportable event is honoured; changes after it are not. `diag::note(Topic, text)` (cold, out of line) writes `<program_invocation_short_name>: liella: <topic>: <text>\n` to descriptor 2 with one gathered `writev` (`rt::fatal::message`: async-signal-safe, no allocation, no stdio, no lock; a short write is continued, an error ends it quietly). Call sites sit only on rare paths (a failure episode's start and its end, never per event) and check the one flag there; no common path changes. Default: off, silent (a libc does not write to a program's stderr unprompted). A new topic is one `Topic` constant and one `NAMES` entry. First topic `timers`: `timer::note_episode` (D-23.3), one line per timer's failure episode at its start and one at its recovery. Gain over glibc (no channel; the event is silent): diagnosability. Tests: `timer_episodes_reported_on_the_diagnostic_channel`, `timer_notification_retried` (silent when off), `diag_channel.rs` (a static C program from a real start: the variable at start or set by `setenv` before the failure).
'''
