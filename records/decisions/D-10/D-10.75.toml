body = '''
**x87 `atanl`/`atan2l`/`asinl`/`acosl`/`tanl` integer tier: method and proof** (LIBM-LD-TRIG-INVERSE-INT, LIBM-LD-TRIG-INVERSE-INT-2; D-10.52's third kernel family after D-10.56 and D-10.73; contract D-10.19 unchanged: correctly rounded in every mode). `crates/math/src/wide_int/arc.rs` is the first tier of the five functions for the format with a 64-bit significand, ahead of the 384-bit route of `wide`; the reduction, the `sin`/`cos` polynomials and the integer rounding test of `wide_int` (D-10.56) are shared, not duplicated. One arc kernel `A(y, x) = atan(y/x)` for `0 < y <= x`: Tang's table method (P. T. P. Tang, "Table-lookup algorithms for elementary functions and their error analysis", ARITH 10, 1991) with `c = j/128` (128 entries `atan(j/128)`, 2 KiB), `r = (y − cx)/(x + cy)` formed exactly on operands truncated to `2^-120`, `atan r = r·P(r²)` with 7 odd terms by fixed-point Horner (R. Brent, P. Zimmermann, Modern Computer Arithmetic, 2010, ch. 4; three steps in 64-bit words, three in 128 bits). Quotient and square root: a `double` estimate (one `divsd`) refined by one exact integer residual, Newton's correction (Brent and Zimmermann ch. 3; J.-M. Muller, Elementary Functions, 3rd ed. 2016, ch. 2); no integer `div`; the root's seed is a `double` root within `2^-52` that the caller passes: the boundary's `sqrtsd` for `asinl`/`acosl` (the math crate forbids `unsafe` and cannot issue it; `wide::asin_sqrt`, `wide::acos_sqrt`), a truncated integer root (`soft_sqrt`) for the crate's own callers. Measured with the integer root `u128::isqrt` as the seed: `asinl` 1189 and `acosl` 1237 instructions per call against `atan2l` 869, the root about 330 of them. Compositions: `atan x = A(\|x\|, 1)` or `π/2 − A(1, \|x\|)`; `atan2` the same on `(\|y\|, \|x\|)`, then `π − θ` for `x < 0`; `asin a = atan2(\|a\|, s)`, `acos a = atan2(s, \|a\|)` (`π −` that for `a < 0`) with `s = √(1 − a²)`, `1 − a²` exact for `\|a\| >= 1/2`; `tan` takes the `sinl`/`cosl` reduction and polynomials once and divides `sin\|a\|` by `cos\|a\|` (the other way round in odd quadrants). Proved bounds (module documentation, steps 1-6): quotient `2^-101.8`, root `2^-101.4`, `atan`/`atan2` `2^-100.6`, `asin`/`acos` `2^-100.1`, `tan` `2^-94.1`; the rounding test assumes `2^-92`, and what it cannot decide goes on to the 384-bit route. Operands the entry points settle first (`atan2` with `x > 0` and `\|y/x\| < 2^-72`, the cubic-tiny ranges, `\|a\| >= 1` for `asin`/`acos`) never reach the tier. Constants from Python `decimal` at 200 digits, pinned against the 384-bit arithmetic. Not adopted: x87 `fpatan`/`fptan` as the approximation (no published error bound to build the rounding test on). Tests: `wide_int::arc::tests::{arc_constants_are_the_rounded_values, quotient_and_root_meet_their_bounds, arc_tier_agrees_with_the_wide_route, arc_tier_agrees_with_the_wide_route_long}`. Measured (unit sweep, 2000 operands per function in four modes, half in each function's hard region): 0 undecided, worst `2^-103.7` (arc), `2^-97.9` (`tan`), quotient `2^-103.5`.
'''
