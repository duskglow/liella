date = "2026-11-13"
body = '''
**`setlocale` answers from the query cache in a small function and leaves everything under the lock to `setlocale_locked`; names are compared inline; `setlocale(cat, "")` goes straight to `setlocale_locked`** (SETLOCALE-C-ROWS, fix-forward of D-X.80, which cost the rows it did not target +1 to +2.6 instructions per call; spec s7_2_c_4; no ABI or behaviour change). A repeated call answered from the cache used to run the prologue of the whole function (six saved registers, a stack probe for several kilobytes of buffers only the locked path uses) and compared names through `bcmp`, a library call that kept registers live across it. Three designs were measured with wl_percall (release, Zen 1 host, instructions per call; before = next with D-X.80): (1) the `"POSIX"` alias compare out of line in a cold function on the miss path: `"C"` rows +4, `"POSIX"` rows +12, rejected; (2) the cache answers split from the locked path: query -4 and `"POSIX"` -2, but `"C"` +1 and `""` +21 (the call to the locked path moved its stack buffers, and the memmove count of `""` follows their alignment, D-X.80); (3) adopted: (2) plus an inline eight-bytes-at-a-time name compare (`same_name`) and the boundary calling `setlocale_locked` itself for `""`, so its frame sits where it sat before. Result against next before D-X.80 / next with it / this: query 93.0 / 94.0 / 76.0, LC_CTYPE "C" 180.3 / 182.3 / 147.3, LC_ALL "C" 174.6 / 176.6 / 141.6, LC_CTYPE "" 8261.0 / 8261.8 / 8260.8, LC_CTYPE "POSIX" 2490.4 / 197.3 / 160.3, LC_ALL "POSIX" 11936.6 / 191.6 / 154.6 (reference on the same host: 44, 159, 159, 2662, 2219, 2762). Test: `crates/boundary/tests/setlocale_posix_repeat.rs` also counts the query again and bounds `"C"` again at the query again plus 85 per call (75 measured).
'''
