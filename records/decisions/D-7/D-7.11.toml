body = '''
**`strfmon`** (rewritten under §1.4, item 3, in a fresh session from the spec, `spec/behaviour/strfmon.md` and black-box probes, including about 60 purpose-built locales): `liella::monetary` formats amounts from a locale's `LC_MONETARY` conventions (`Conventions::of`); the boundary reads each amount from the `va_list` as its conversion names it (`double`, or x87 with `L`) and passes the current rounding mode. The format is flags (`=f ^ + ( ! -`; at most one of `+`/`(`), width, `#lp`, `.rp`, `L`, then `n`/`i`; anything else is `EINVAL`. The number is the signed value rounded by `format_float`, grouped by `mon_grouping`, with `mon_decimal_point` (else `LC_NUMERIC`'s); the left precision pads with the fill byte to the positions of `lp` grouped digits (each separator one). The symbol (the first 3 bytes of `int_curr_symbol` for `%i`) and the sign are placed by `cs_precedes`/`sep_by_space`/`sign_posn` as observed (`sep_by_space` 2 adds a space only when sign and symbol are adjacent); `sign_posn` 0 and `(` put parentheses round negatives only; an empty `negative_sign` prints `-`; with `#` the shorter lead-in is padded in front. Widths count bytes; the terminator must fit, else `E2BIG`, errors reported in format order. **Deliberate differences** (`monetary_products.rs` KNOWN): a set sign bit means negative (-0.0, -NaN; glibc prints `$-0.00`); `!` drops the symbol with its separating space and spaces appear only between non-empty parts; `#` alignment counts only printed text; directed rounding applies to the signed value; an oversized left precision is `E2BIG` (glibc wraps). Open (spec silent): POSIX's `#n` equal-length forms would also pad the text after the number; neither library does.
'''
