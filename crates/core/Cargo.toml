[package]
name = "liella"
description = "The clean capability API: one contract per need, explicit state, a single error model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "liella"

[features]
# Test-only counters of which regex execution path ran (`pattern::regex::paths`); enabled by
# liella-boundary's `selftest`, never by a product.
selftest = []

[dependencies]
liella-kernel = { workspace = true }
liella-mem = { workspace = true }
liella-rt = { workspace = true }

[dev-dependencies]
spectest = { workspace = true }
# The clause tests also exercise the C-shaped compositions of liella-legacy (argz, strl*,
# tokenizer steps); integration tests link one copy of liella, so the cycle is harmless.
liella-legacy = { workspace = true }
# Clauses about the C interface itself (fortify aborts, strdup ENOMEM, strtok's hidden cursor)
# run through the exports.
liella-boundary = { workspace = true, features = ["selftest"] }
liella-kernel = { workspace = true }
liella-abi = { workspace = true }

[lints]
workspace = true
