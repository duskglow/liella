body = '''
**STARTUP-TEXT-WINDOWS: the start-up text of the static probe in few 64 KiB windows, checked when the products are built** (LAYOUT-STARTUP-WINDOWS, 2026-11-10; extends D-X.20 under D-X.48; tooling only, no ABI or behaviour change; plan `handoff/layout-contracts-plan.md` findings 1-3, section 3). Row `STARTUP-TEXT-WINDOWS` of `layout/contracts.tsv`, kind `startup-text-windows` (`xtask/src/layout.rs`): `page_faults.c` linked from the products as `crates/core/tests/hot_text_products.rs` links it (with `-Wl,-Map`); the functions `page_faults true` runs (`crates/libc-so/startup-text.keys`, written by `tools/hottext/regen.sh` from a trace of that probe, per profile) mapped by build-stable key to `nm -S` ranges (an assembly entry without `.size` counts its entry byte) occupy at most `budget-<profile>` distinct 64 KiB windows (`budget-fast=5`, `budget-release=4`: the counts measured on this branch's products, base 0b03e0dca), and none outside the hot group straddles a window boundary. A failure names the contract, every start-up function in a window outside the group and the straddling one. Rule STARTUP-TEXT-GROUPED (every start-up function of `libc.a` in the hot group): `grouped=error` (HOTTEXT-STARTUP-COMPLETE is in this base; `warn` reports it without failing). Rule d of the plan: each later `hot_text_products.rs` bound raise for a layout-only delta quotes this check's output. Budgets only tighten; a raise is an owner ruling. \| Unit tests in `xtask/src/layout.rs` (synthetic `nm -S` and link map: size-less entries, wrapped map names, hot sections, profile keys, budget, straddle, GROUPED). `cargo xtask layout-check` on this branch's products: fast 5 windows (110 of 110 keys), release 4 (101 of 101), all in the hot group. The prototype's products: origin/next 9643c81b0 holds (8 windows; GROUPED warns `runtime::start::<false>`, `apply_irelative` and an `Option::map_or` of it, outside the group before HOTTEXT-STARTUP-COMPLETE); LIBM-F64-LOG-FAMILY-WIRE-2 cdf46a2e5 fails, naming `runtime::start::<false>` 0x6ef200-0x6f0676 straddling 0x6f0000 (Skylake-SP role, job lsw-measure-1). Plants: `handoff/LAYOUT-STARTUP-WINDOWS-plants.txt`.
'''
