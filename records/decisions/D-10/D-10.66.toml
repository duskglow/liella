body = '''
**`log2`, `log10`, `log1p` on the `log` quick phase** (LIBM-F64-LOG-FAMILY-WIRE, under D-10.51/D-10.60; tier 1 in both builds, tier 2 = today's `fast64::log{2,10,1p}_nearest` unchanged, then the accurate path). `log2`/`log10`: `log`'s unrounded `(zh, zl)` times `1/ln b` as one double-double product (FMA: 2MultFMA, error `< 2^-103`; SSE2: `zh` cut to 26 bits by a mask times a 26-bit `k26`, exact, plus two rounded cross terms, `< 2^-75.2`), then Fast2Sum; bound `log`'s worst case plus `2^-74` (`2^-64.9`), same `RHO = 2^-64` and `C`. A table pre-scaled by `1/ln b` was weighed and not taken: `r − r²/2` still needs a double-double product by `1/ln b`, so it saves no operation for `log10` and at most one for `log2`, for 4 KiB more table each. Exact results (`log2 2^k`, `log10 10^n`, `0 <= n <= 22`) are the only rational values and come out exact (`zh = RN(zh + zl)` within `RHO` of an integer); the product would raise inexact for them, which the in-place fast entry must not, so `log2_tiered` answers `2^e` with `e` from the bits and `log10_tiered` answers `10^n` (`1 <= n <= 22`) from a 71-entry table by binade, both before any arithmetic. `log1p`: `2^-60 <= \|x\| < 2^-8` by `log`'s series with `r = x` exactly (bound `2^-67`); `\|x\| >= 2^-8`, `−1 < x < 2^960`: `1 + x = yh + yl` (Fast2Sum, larger first), `log`'s reduction of `yh`, and `log1p(yl/yh) ≈ d·(1 + r² − r)` with `d = yl·c·2^-e` (`c·2^-e` from the bits; no division) added to the low sum: `2^-64.34` at worst; tiny `\|x\|` and `±0` stay with tier 2. Rounding test as D-10.60 (de Dinechin, Lauter & Muller, RAIRO-ITA 41, 2007; Dekker 1971 for the products). Proofs in `fast64/quick_log.rs`'s module doc, recomputed by `log_family_constants_and_bounds`. Instructions per call (`bench --compare --counters`, cbench_libm, Zen 1 host), log2 / log10 / log1p: FMA build 111.4 / 111.2 / 113.3 (glibc 63.1 / 103.0 / 83.6; before this row, wl_percall: 195.2 / 205.4 / 245.0), SSE2 build (`glibc.cpu.hwcaps=-FMA`, both sides) 144.4 / 143.2 / 145.5 (glibc 83.2 / 118.4 / 103.1).
'''
