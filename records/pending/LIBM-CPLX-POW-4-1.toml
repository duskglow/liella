body = '''
**`cpow` and `cpowf` get a quick tier, and `cpow` a middle tier, in front of the 384-bit route** (LIBM-CPLX-POW -1..-4, under D-10.53). `z^w = e^E·cis Φ` with `L = log z` (principal branch), `E = c·ℓr − d·ℓi`, `Φ = d·ℓr + c·ℓi`. Every special, degenerate or out-of-range operand, and every part neither tier decides, takes the route unchanged, so the route still decides value and flags there. Why: before this every finite `cpow` call ran the route (a few hundred thousand instructions). Method. Quick tier: `L` from the `clog` quick tier's parts (`ℓi` within `2^-65` relative), `e^E` from the `double` exp kernel with `E.lo` folded into the reduced argument, `cos Φ`/`sin Φ` from the trig kernels with `Φ.lo` folded in; the products and the sum in double-double. Middle tier (cold, per declined part only): `ℓr = ln(x² + y²)/2` by `exp_log::log_dd` (proved `29.8u²` relative, constant `LOG_DD_REL = 32u²`), `ℓi` by `trig::atan_dd` of `\|y\|/\|x\|` (proved `34.6u²`, constant `ATAN_DD_REL = 36u²`) and `π − θ` for `x < 0`, `e^E` by `wide_dd::exp_dd` (`2^-103`), `cos Φ`/`sin Φ` by a three-word Cody–Waite reduction and double-double Taylor series (`2^-100` absolute). The proofs are written step by step in the doc comments of `log_dd`, `atan_dd` and `crates/math/src/complex_fast_pow.rs` (series truncation, `double` tails, table facts, per-branch sums); the error constants of the composed bound (`LR_REL`, `LR_ABS`, `LI_REL`) are derived from them, never estimated. Error bounds of the double-double operations: M. Joldes, J.-M. Muller and V. Popescu, "Tight and rigorous error bounds for basic building blocks of double-word arithmetic", ACM TOMS 44(2), 2017 (Algs. 4, 6, 9 and the products and quotient derived there); argument reduction: J.-M. Muller, "Elementary Functions", 3rd ed., 2016. Strict rounding test: a part is answered only when the interval `P ± eps` holds no `double` and no midpoint (`\|P.lo\| > eps`), in every mode. The parts of `z^w` can be `double`s (`(3+4i)^1.5 = 2 + 11i`) and for `d != 0` no theorem excludes rational parts, so exactness is never assumed: such parts decline to the route (`cpow_tiers_decline_exact_parts`). `cpowf`: the quick tier's parts from the widened operands, answered when `P ± eps` lies strictly between two neighbours of the 25-bit grid (the `float`s and their midpoints), in every mode; no middle tier. Measured (`cpow_decline_rates`, 2^21 random operands per band of `\|w·log z\|`: `2^-6..1`, `1..16`, `16..512`): the quick tier declines `2^-9.1`, `2^-6.4` and `2^-2.4` of the parts; the middle tier decided every one of them (0 declines); the rate its proved bound implies for the route is `2^-38.1`, `2^-39.5` and `2^-35.8` per part. The tiers agree with the route bit for bit in the four modes (`cpow_tiers_match_the_384_bit_route_in_every_mode`); a bound constant made 2x too small fails `cpow_middle_bounds_cover_their_proofs`. Performance against next and the reference: not measured yet (the products did not build on this branch, see the story's handoff).
'''
