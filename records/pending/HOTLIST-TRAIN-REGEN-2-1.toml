tests = ["xtask/src/hotlists.rs::train_fails_on_a_stale_tracked_list", "xtask/src/hotlists.rs::branch_reads_the_fresh_copy_with_an_info_line", "xtask/src/hotlists.rs::a_regeneration_of_another_tree_is_not_read"]
body = '''
**The generated start-up lists are train-owned and read from a stamped out-of-tree copy on a branch** (HOTLIST-TRAIN-REGEN). `crates/libc-so/hot-text.list`, `startup-text.keys`, `probe-text.keys` and `startup-data.keys` are output of `tools/hottext/regen.sh`; `hot-text.clusters`, `hot-text.absent`, `hot-text.unpinned` and `startup-state.list` are hand-written inputs that stay on story branches and are always read from the tracked tree. `cargo xtask hot-lists` regenerates the four for both profiles (`regen.sh . --both --allow-drop`, merge mode #4839 with the tracked copies as the merge base) into `target/hot-lists/` and writes `target/hot-lists/STAMP`, a hash of `Cargo.lock`, `crates/`, `csys/`, `include/`, `layout/` and `tools/hottext/` without the four lists. Every reader (the `so` grouping and its dead-key check, the start-up read-only group, the layout contracts, `hottext-recheck`, `hottext-repair`, static's `hottext` check) asks `xtask/src/hotlists.rs` where to read a list: `LIELLA_HOT_LISTS` when set (`hot-lists` sets it for its own regen, so the regen's builds read the lists being rewritten); off the train, `target/hot-lists` while its stamp matches this tree, with one info line naming the lists that differ from the tracked copies; otherwise the tracked copies (a regeneration of another tree state, such as a reused build directory, is never read). `--in-place` or `LIELLA_TRAIN=1` (the train) rewrites the tracked copies and keeps a stamped copy; under `LIELLA_TRAIN=1` a tracked list that differs from a stamped regeneration of the same tree is an error. Only "the committed generated file is stale" moved to the train: the dead-key, unpinned-key, layout-contract and page-fault checks run on the copy that is read, on every branch. Why: a branch that moved start-up code had to regenerate and commit the lists (19 to 29 min per regen before HOTLIST-REGEN-CHEAP, about 5 min after), and two such branches conflicted on generated files; the train now regenerates them once per landing, as it does the records views (D-X.59) and the code map (D-X.66). A missing stamp is not an error on the train, so the train can switch its generator list before or after this lands.
'''
