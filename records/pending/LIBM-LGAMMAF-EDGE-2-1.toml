body = '''
**`lgammaf` below -42 by reflection, a second try for 2^-8 ≤ \|y\| < 1, and an exception table** (LIBM-LGAMMAF-EDGE-2, #5033-#5035; builds on the `float` gamma rulings #2760, #2784, #2783, #2889, D-10.95 and the table method of D-10.109). Before: x < -42 off the poles and the rounding-test refusals in 2^-8 ≤ \|y\| < 1 took the multi-precision path. Now, for -2^23 < x < -42 (every `float` at or below -2^23 is a pole), with X = -x: lnΓ(x) = -ln(X·\|sin πx\|/π) - lnΓ(X) and sign Γ(x) = sign sin πx (DLMF 5.5.1, 5.5.3; Γ(1 - x) > 0). The reduction is exact (r = x - 2·nearest(x/2), t = min(\|r\|, 1 - \|r\|), sign Γ(x) = sign r, no integer conversion as D-10.95 asks), sin πt is one Taylor polynomial of an octant (the `float` Bessel band's sin(πg/2)/g and cos(πg/2), g = 2t or 1 - 2t ≤ 1/2), lnΓ(X) is Stirling's series with ln X by `ln64`. There is no cancellation: lnΓ(X) > 114.03 and the log term lies in [-14.8, 9.47], so y < -104.5. Error ≤ 8.2 ulp of y (the proof is in `lgamma_reflect`'s doc comment); margin 16. On a sample of 4459 operands the largest error measured against the correctly rounded `double` accurate path is 3.0 ulp. The refusals of the 2^-8 ≤ \|y\| < 1 piece (margin 11 264) take `lgamma_edge`'s double-double kernel as a second try; an exhaustive enumeration finds that every one of them is then decided. What the rounding test still refuses in these two pieces (18 operands, all below -42) is answered from a sorted table of (x, \|F\|, side). The table is written by `lgammaf_table_is_the_refused_set` (an exhaustive enumeration in the long sweeps, which writes the file with LIELLA_LGAMMAF_TABLE_OUT); the value is rebuilt a 2^-28 relative step from F with y's sign, and one rounding test with margin 1 gives every mode and the inexact flag, as in D-10.109. No multi-precision path runs for these operands. `lgamma_edge`'s own refusals (\|x\| < 2^-20 and \|y\| < 2^-8: 608 operands, 594 of them below 2^-60) stay on the accurate path as before. The second try and the table are reached only on a refusal, through one out-of-line cold call (`lgamma_rest`), and the reflection sits in the cold `lgamma_edge`, so the answered path does not change. The test oracle's lgamma reflection now covers -2^23 < x < -64 too (`lgamma_unknown`), so the exhaustive sweep checks the new operands without the multi-precision path.
'''
