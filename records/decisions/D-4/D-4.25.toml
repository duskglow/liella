body = '''
**CPU-variant builds of the small copy, fill and compare kernels, selected once** (MEM-IFUNC; owner rulings 2026-10-08 "CPU-variant kernels" and store width). Mechanism: one `AtomicBool` in `crates/boundary/src/dispatch.rs`, `false` (SSE2 baseline) until `cpu::init_with` (startup step 4, the same `liella_rt::cpu::Features` decision as the scanners' D-4.14 flag, so the `glibc.cpu.hwcaps=-AVX2` tunable switches it off too) sets it; a kernel tests it only on the size class that has an AVX2 build and tail-jumps (direct, PC-relative) to a `#[target_feature(enable = "avx2")]` function in `hot::avx2` (a module at the end of hot.rs: plan S2 allows hot-kernel unsafe in src/hot.rs only) (no asm; the compiler adds `vzeroupper`). Chosen over `STT_GNU_IFUNC`/`R_X86_64_IRELATIVE` and over a resolved-once pointer: Liella's `ld.so` and the static startup do not process IRELATIVE yet (crates/ld/src/reloc.rs is phase 14), a pointer needs a RELATIVE relocation before the static-PIE startup has relocated itself, and an IFUNC symbol would change the exported symbol type; the flag needs no relocation, is right from the first instruction in `libc.so.6` and `libc.a` (calls before startup run SSE2), and costs one load and one test-and-branch on the selected class only. Classes (as measured, Haswell-EP, AVX2 vs the `-AVX2` tunable on one static binary, 2 runs, glibc in brackets; liella-historic:handoff/mem-ifunc.md): copy 65-128 B two 32-byte blocks from each end (65 B 4.26-4.80 ns against 5.46-6.14 [3.07]; 96 B 3.63-4.21 against 3.92-4.27 [3.06-3.25]; 128 B even); copy 33-64 B stays SSE2 (AVX2 slower at 33, 48, 64: memcpy_64 3.35-3.54 against 2.79 [2.23-2.37]); fill has no AVX2 build (slower at every size 33-128); compare 33-64 B two 32-byte blocks per region (33 B 3.35-3.89 against 3.62-4.21; 64 B even to better). So copies and fills up to 64 B carry no feature test. The AVX2 functions return `black_box(d)` (an entry that sees the result is `d` keeps `d` in a saved register: push/pop on every small call, measured). Tests force each build (`selftest::set_kernel_avx2`, test-only; tests/small_copy.rs and small_compare.rs run every case in both); planted bugs in each AVX2 build fail only the AVX2 run. conformance/c/s04_strings_early_copies.c sweeps copies and fills from a constructor before main (static). Decided locally: the classes above. AMENDMENT COPY-256 (2026-10-10, decided by the coordinator): `memcpy`/`memmove` 129-256 B is a straight-line class in machine/fold.S after the 65-128 one (explicit NULL tests, option B): AVX2 four 32-byte blocks from each end + vzeroupper, SSE2 eight 16-byte blocks from each end (xmm0-15), every load before the first store; the 65-128 path keeps its instruction count (129-256 is reached from its range compare's taken branch). The library's internal copy (D-X.15) takes 65-256 through `liella_machine_move_mid` (the same classes without NULL tests; its contract has non-NULL regions); decided locally: internal 65-128 moved from Rust `move_small` to that label too. Tests: small_copy sweeps 0-257 (every alignment pair mod 32, overlaps both directions, each build, exports and internal); planted bugs (AVX2/SSE2 tail offset, export and internal bound 257, store before the last load in each build, missing NULL test) fail. **Amendment MEMSET-MID (2026-10-11):** the memset export's 129-256 class moves from Rust `fill_rest` into fold.S, straight-line like the copy's: `.Lset_big` keeps 65-128 as the fall-through and branches on `n - 65 > 63` to `.Lset_129` (`<= 191`, explicit NULL test of d, option B); AVX2 build `vpbroadcastb` + four 32-byte stores from each end + vzeroupper, SSE2 build eight 16-byte stores from each end. Local detail decided: 65-128 unchanged (SSE2 in both builds). Tests: small_copy fill sweep 0-257 in each build and the NULL-abort sizes 129/144/200/256/257 already cover the class.
'''
