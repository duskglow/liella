body = '''
**Number-text conversion core** (COLD-REWRITE-W-far-05 and -2, 2026-10-14; record `liella-historic:handoff/decisions/COLD-REWRITE-W-far-05.md`; D-8.4, D-8.5, D-8.9). (1) Big numbers: u64 limbs with u128 products in a fixed array (`LIMBS` = 1024, 65,536 bits) plus a used length, so work follows the value's size; overflow saturates and sets a flag; no allocator (no ENOMEM for printf or strtod); long division by shift-and-subtract on parse's slow path only. (2) Digit generation splits the value at the binary point: the integer part by repeated division by 10^9 (two 64-bit divisions by a constant per limb), the fraction top down by multiplying by 10^9; both exact, no power-of-five tables, no floating point. (3) One rounding predicate serves binary, decimal and hex rounding in all four C modes; tininess is judged after rounding with an unbounded exponent (probed: `strtod("0x1.fffffffffffff8p-1023")` gives `DBL_MIN` without ERANGE); overflow is IEEE's (probed under `fesetround`); `%g` follows C's rule; `%a` as D-8.9, and a `float` prints as the `double` it converts to. Open since the record: with `#` and a rounding carry glibc prints `1.e+02` for `%#.2g` of 99.5 where C gives `1.0e+02`; Liella keeps C (owner ruling 2026-10-22, #573: correctness is a gain, though the owner called it borderline); recorded in `docs/differences-from-glibc.md` with the compat-flag placeholder COMPAT-8, pinned by `s8_4_c_3_hash_g_carry_keeps_c_digits`. (4) Run 2: `float::round` is one rounding step at a computed LSB exponent shared by normal and subnormal results; `q = 0` with sticky is a certain underflow; x87 invalid encodings read as documented; `%a` formats from the canonical encoding; digit rounding reads the discarded part as its first digit plus anything non-zero after.
'''
