body = '''
**`dlclose`, unloading and deferred reclamation in Liella's `ld.so` (phase 14 DL-17; plan/ph14/design.md §8-§10, plan/ph14/dl-16-dlopen.md §4; probe `tools/probe/dl/close` C-1..C-9, record `== close (DL-17)` in spec/behaviour/dynlink.md).** (1) **Liveness:** an object stays loaded while it is a start-time object, `RTLD_NODELETE`, has an open count above 0, or is reachable from such an object through its `DT_NEEDED` objects or its binding dependencies (objects outside its own dependency closure that its relocations bound to, reported by the relocator; C-3). A bound `STB_GNU_UNIQUE` definition pins its object (C-6). `dlclose` decrements the open count and, at 0, marks from the roots; every unmarked loaded object is unloaded. A promoted object needs as many closes as opens (C-3b); the program's handle closes with 0 (C-9). (2) **Finalisation:** the unloaded set in reverse constructor order; per object `DT_FINI_ARRAY` in reverse, then `DT_FINI`. The finalisers run holding the writer lock only, with the objects still published, so a destructor may call `dlopen`/`dlclose` (C-8) and an exception thrown and caught in a destructor can unwind. `__cxa_finalize(dso)` also drops that object's `pthread_atfork` handlers. A finalised object is skipped by the exit-time finalisers. (3) **Unpublication:** under the state lock the objects leave the global scope, the constructor log, the `l_next`/`l_prev` chain and the reader table (an entry's header count set to 0); `dlpi_subs` moves before `dlclose` returns (C-1). (4) **Reader epochs (implements D-27.44's `read_section`):** two-parity reader counters striped by thread pointer over 32 cache lines. A reader increments its stripe's counter for the current parity, re-checks the parity, and decrements on leaving. A writer that unpublished objects flips the parity and retires them tagged with the old parity; a retired object is unmapped once that parity's counters sum to 0, checked at once and again at every later `dlopen`/`dlclose`. Nothing waits for a reader, so a `dl_iterate_phdr` callback that calls `dlclose` cannot deadlock, and the object it closed stays mapped until its walk has left. Chosen over per-thread epochs in the thread block (design.md wording): same guarantee, no thread walk and no per-thread word. (5) **Slots:** the 512-object table stays; a freed slot is reused once every slot above it is free and reclaimed (the path and dependency arenas rewind), so an open/close loop reuses the same slots. `_dl_find_object` keeps scanning the published table in load order (the sorted index is left to DL-OBJ-TABLE-GROW). (6) **TLS:** a closed module's static-TLS surplus place is freed and its module ID returned; IDs are handed out lowest-free first (C-4, C-5: the same ID on re-open) and every release moves the TLS generation on, so a thread whose dtv names the old block repairs it in the slow path; each thread's entry for the ID is cleared under the thread-list lock. (7) **Errors:** NULL, a pointer that is not a handle, or a handle with no open left: -1 and `dlclose: invalid handle` (differences row of `records/pending/DL-16-PLAN-3.toml`); a success clears a pending text (C-2). (8) **Known edges:** an object a destructor re-opens stays, its destructors already run (they run again at exit); a `dl_iterate_phdr` callback that leaves by `longjmp` stays counted (objects closed meanwhile stay mapped, never fault); `dlsym` does not create binding dependencies; thread-local destructors a plugin registered do not pin it; the atfork nodes of dropped handlers are kept (40 bytes each).
'''
