id = "D-6.9"
section = "s06"
spec = "§6.4"
ann = "HIST, ARB"
status = "active"
body = '''
**iconv** (phase 7; refines D-6.4). A descriptor decodes to code points and encodes from them (pivot UCS-4), with its decoder and encoder states in the descriptor, so a conversion resumes at any split point. `//TRANSLIT` uses the current `LC_CTYPE` locale's transliteration table (Appendix D.1.3) and its default replacement. The built-in `C`, `POSIX` and `C.UTF-8` locales have no table file; their transliteration is derived from the UCD and is not the reference library's table, which the spec does not give: in `C.UTF-8`, a character's full decomposition without combining marks; in `C` and `POSIX`, only a decomposition that involves a compatibility mapping, with marks kept (they then become `?`, as in the reference `C` locale); then an ASCII-equivalents table (quotes, dashes, guillemets, `© ® ™ € × ⁄`, `ß æ œ` and their capitals); a vulgar fraction is set off by spaces (` 1/2 `); what still does not convert becomes `?`. `//IGNORE` reports as the contract says (−1/`EILSEQ` at the end if anything was dropped). **The reference library's behaviour, observed and followed** (phase 7; compared line by line by `iconv_products.rs`): `UTF-16` and `UTF-32` read an optional BOM in either order and otherwise assume little-endian; written, they begin with a little-endian BOM, once per descriptor until a reset or flush (no room for it is `E2BIG`); the forms that name an order neither read nor write one. `UCS-2` is little-endian, `UCS-4` big-endian, `WCHAR_T` little-endian. Every UTF-16 and UCS-2 form rejects surrogates. The `UCS-4` forms carry values up to `0x7FFFFFFF`, which `UTF-8` writes in the original 5- and 6-byte forms; `UTF-16`, `UTF-32` and the byte charsets reject values above U+10FFFF. Suffixes count on the target name only, separated by `/` or `,`, in any case; unknown ones are ignored. Incomplete input stays in the caller's buffer (`EINVAL`). With `//IGNORE`, invalid input is skipped as well; `E2BIG` still reports first, and an incomplete end after a drop is `EILSEQ`. The empty name is the current `LC_CTYPE` codeset. **Recorded differences** (the test lists them and fails if one stops differing): ISO-2022-JP and UTF-7 (stateful, D-6.8); the alias `WINDOWS-1252`, which no charmap lists; CP932's U+2014, which WINDOWS-31J's charmap does not map. **Owner: accepted (2026-10-01).**
'''
