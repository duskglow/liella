body = '''
**Every Rust hot-text key names a function with a fixed boundary or has a reasoned line in `crates/libc-so/hot-text.unpinned` (a ratchet)** (LAYOUT-HOTKEY-INLINE-STABLE, -2, -3; rulings #4997, #5024, #5025; layout and build tooling only, no ABI or behaviour change; extends D-X.53, D-X.56). Since D-X.53 a dead key of any tier fails `cargo xtask so`, and LLVM's inlining choices move with unrelated code: two libm changes inlined `Vdso::lookup_many::<5>` and another start-up function away (#4986, #4991), and a dummy libm growth (a never-called table function, scratch only) killed `locale::builtin` (locale tier), `nscache::real_secs` (tool tier) and `iconv::load` (extra tier) in the fast products. (1) `cargo xtask static` (`hottext`, `xtask/src/hottext.rs::check_pinned`) requires every Rust key of every tier of `hot-text.list` to name a workspace function whose every definition is `#[inline(never)]` in the source (free, generic, inherent or trait-impl method), or to have a line `<key>\t<tier>\t<reason>` in `hot-text.unpinned`. A line whose key gained a boundary, left the list or changed tier fails, so a key a regen moves to an earlier tier is justified again for that tier. One file with a tier column, not one file per tier: the check and its stale-line rule stay in one place, and a key changing tier shows as one edited line. (2) The list is a ratchet: lines may only be removed; a listed key is pinned later only with counts that show no cost. Reasons accepted (#4997): a hot path or a measured boundary cost, a closure, a function of `core`/`alloc`, a generic whose other instantiations are hot. The 298 locale/tool/extra/stdio keys listed when the check reached those tiers carry the reason "boundary cost not measured yet" (plain functions) or the generic reason; they are candidates, not settled. (3) Pinned: the start-up/fork keys of -2 (`Vdso::lookup_many`, `sys::vdso_fn`, `cpu::init_with`, `runtime::{start, run_fini}`, `process::exit`, `stdio::new_slot`, `KernelPages::map`, `exit_handlers::{Registry::register, run_all}`, `stdio_compat::each_stream`), and of the three keys the dummy growth killed, `nscache::real_secs` (-3; free: getpwnam_r per call equal to next, wl_percall). (4) A key whose fixed boundary costs instructions is not pinned: its function is `#[inline(always)]` into its callers and `cargo xtask hottext-repair` drops the dead key, so no growth can kill it either (-4): `iconv::load` (pinned, 34 more instructions per iconv() call) and `locale::builtin` (pinned, about 25 more per setlocale(LC_CTYPE, "POSIX")); with them inlined the iconv rows equal next. (5) The release `tool` start-up probe takes one text fault more than next (53 against 52, bound 56: `liella_sys_fstat` moves 0x240 bytes past the first fault-around window); coordinator decision 11-10: it lands, and LAYOUT-FIRST-WINDOW fixes it structurally. Tests: `listed_plain_functions_must_be_inline_never`, `startup_keys_without_a_fixed_boundary_fail_unless_listed`.
'''
