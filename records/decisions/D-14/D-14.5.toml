id = "D-14.5"
section = "s14"
spec = "§14.10"
ann = "HIST"
status = "active"
body = '''
`wordexp`: tilde, parameter, arithmetic, field splitting, globbing and quote removal run in-process. Only command substitution spawns `/bin/sh`, and never with `WRDE_NOCMD`. **Owner rulings (2026-10-03, binding):** `WRDE_NOCMD` detection is syntactic and fails closed: any command substitution anywhere in the words (`$(...)`, backquotes, including inside `${X:-$(cmd)}` whether or not `X` is set, and a backquote inside `${...}`) gives `WRDE_CMDSUB` before anything is expanded (glibc misses `${X:-$(cmd)}` when `X` is set and never treats a backquote inside `${...}` as a substitution). **Arithmetic expansion (owner ruling 2026-10-03): the spec (§14.10) governs.** The full POSIX shell arithmetic operator set is implemented on signed 64-bit `long`: unary `+ - ~ !`, `* / %`, binary `+ -`, `<< >>`, `< <= > >=`, `== !=`, `&`, `^`, `\|`, `&&`, `\|\|` (short-circuit), `?:`, parentheses, decimal, octal and hexadecimal constants, and variables by name (with or without `$`). `WRDE_SYNTAX` applies only to constructs POSIX does not define (`++`, `--`, `**`, a malformed expression) and to the explicit cases below; never a wrong value and never a crash. **Pinned down:** division or modulo by zero is `WRDE_SYNTAX`; a shift count that is negative or at least 64 is `WRDE_SYNTAX`; signed overflow (in `+ - *`, unary minus, `LONG_MIN / -1` and `LONG_MIN % -1`) is `WRDE_SYNTAX` (C leaves all three undefined; an error is the only result that is never wrong); command substitution inside `$(( ))` is refused under `WRDE_NOCMD` like anywhere else; a variable inside arithmetic honours `WRDE_UNDEF` (`WRDE_BADVAL` when it is unset), and an unset variable is 0 without it; a variable whose value is not a valid integer constant is `WRDE_SYNTAX`. **Assignment operators (`= *= /= %= += -= <<= >>= &= ^= \|=`): the spec is silent** on them and on where their side effects live (POSIX defines them for the shell, whose variables they change; `wordexp` has no shell of its own, and glibc's `${X:=w}` writes the caller's environment): **owner ruling (2026-10-03): refused** with `WRDE_SYNTAX`: expanding a string must not change the caller's state, and refusing can be relaxed later without breaking anyone. glibc's restricted operator set is a recorded difference (`docs/differences-from-glibc.md`).
'''
