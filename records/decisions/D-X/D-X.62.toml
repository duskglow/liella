body = '''
**The read-only data start-up reads in one 64 KiB-aligned `.rodata1`, so its window count no longer moves with the text size; STARTUP-DATA-WINDOWS read-only budgets 3/4 -> 1/1** (LAYOUT-STARTUP-RODATA, 2026-11-10; amends D-X.50, item 3 of its brief, read-only half; tooling and layout only, no ABI or behaviour change). `cargo xtask so` (`xtask/src/startup_ro.rs`, after the hot-text grouping) renames to `.rodata1` in the archive every read-only `.rodata*` section that the relocations of a start-up function (keys of `crates/libc-so/startup-text.keys`, any profile, found by symbol, including the `__liella_libc_` name the weakening pass gives later) address, in its own member or through a global symbol, plus the section of every `ro` key of `crates/libc-so/startup-data.keys`. The start object (`csys/src/machine/entry.S`, first in every link) holds an empty `.rodata1` with `.balign 65536`: GNU ld gives an output section the largest alignment of its inputs and places the start object's first, so `.rodata1` starts on a window boundary and, no larger than 64 KiB (the archive-wide upper bound is checked by `cargo xtask so`: fast 33441 bytes, release 23366), sits in one window. Why 64 KiB and not less: the fast profile's single codegen unit keeps every string literal of the library in one merge section that start-up literals live in (`.rodata.str1.1`); objcopy renames whole sections. Cost: the alignment gap between `.rodata` and `.rodata1` (zero bytes in the file, never touched): fast 32680, release 29612 bytes in the probe on next 2e33a3cb9; it varies 0..64 KiB with the program. Measured on mei (jobs lsr-base-measure, lsr-after-4; `page_faults.c` linked as the contract links it, plus 0..64 KiB of extra text in 4 KiB steps): read-only start-up windows before 2-4 (fast) and 4-6 (release) depending on the text size, after 1 in every link of both profiles. The check is unchanged; the row's decision is this record. Written objects: not moved (the `.data1` half of D-X.50 item 3): their page count did not move across the same text shifts (fast 20, release 21: `.data` starts on a page boundary after RELRO), and STARTUP-FAULTS-RESTORE measured no fault gained by moving more of them into `.data1`.
'''
