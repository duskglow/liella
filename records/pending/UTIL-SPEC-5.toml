body = '''
**Not installed: `iconvconfig`, `/etc/bindresvport.blacklist`, `sprof`, `sotruss`, `mtrace`, `nscd` (`plan/utilities.md` Q4, owner's approval 2026-11-14; R8).** `iconvconfig` indexes conversion modules and Liella has none (D-6.8: charsets are built in or read from the installed charmaps); `/etc/bindresvport.blacklist` serves Sun RPC, which Liella does not implement; the `libc-devtools` commands have no caller in the caller search of the design; `nscd` is dropped (R8; Liella's name-service cache is in the library, D-16.10). No compatibility option: there is nothing for a restored command to act on. Revisited if the mirror scan of LIELLA-SYSTEM-LIBC-PLAN finds callers. gencat and pldd are kept (UTIL-14, UTIL-15).
'''
