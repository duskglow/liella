body = '''
**The hot-text lists are the union over every traced host class; a key leaves only when no host class reaches it** (HOTTEXT-REGEN-HOSTS, 2026-11-10; layout tooling only, no ABI or behaviour change; keeps D-X.56). `tools/hottext/regen.sh` traced one host and `merge.py` took that trace as the whole truth for its profile, so a key another host class reaches (fill_erms: Zen 1 has no ERMS; locale ctype/charset and gettext paths) was dropped, and lists regenerated on different hosts flipped keys in and out (WCTYPE-TRIE-FILE-5, TB-FOREIGN-SAFETY-3, HEAP-FIRST-USE-4). Now `hot-text.list` and `startup-text.keys` carry a 4th column, the `<profile>@<host class>` pairs whose trace hit the key (class = `<vendor>-<family>-<model>` from /proc/cpuinfo, e.g. `intel-6-85` Skylake-SP, `amd-23-1` Zen 1, `intel-6-63` Haswell-EP; `HOTTEXT_HOST_CLASS` overrides). A trace removes only its own pair; a key with no pair left is dropped. A line without the column (older lists) reads as `<profile>@?`: a hit resolves it to the tracing class, a miss keeps it, so only `regen.sh --replace` or `prune.py` removes such a key. The profiles column stays (it is what the dead-key check of xtask/src/hottext.rs reads); `parse_list` checks the provenance names exactly those profiles. Chosen over forcing every dispatch path in the probes: forcing covers CPU dispatch only (not the locale data and catalogs a host has), needs a test-only dispatch override in the library, and silently misses each new dispatch point; the union needs no knowledge of why a host differs. Cost: a key only an untraced class reaches is not added until someone regens there, and the layout position of a key only one class reaches follows the trace order around its anchor (the key set, tiers and provenance do not depend on the host order; tested). Regen on every host class the gates use (Skylake-SP and Zen 1 at least). Not decided here: pinning start-up keys against inlining (brief step 5) conflicts with owner ruling HOTTEXT-PINNING (D-X.56); raised as RULING NEEDED in handoff/HOTTEXT-REGEN-HOSTS.md.
**One hot-text list per profile** (HOTTEXT-REGEN-HOSTS-2, 2026-11-10): `crates/libc-so/hot-text-fast.list` and `hot-text-release.list` (`xtask/src/hottext.rs` `list_path`). The list is a layout order (first touch in a trace), and fast and release inline differently, so one shared order cannot be both profiles' first-touch order: `merge.py` lets the new trace's order win, so a fast regen reordered the release keys, and the release build then failed STARTUP-TEXT-WINDOWS (5 windows against budget-release 4 on the Zen 1 host; the inherited list fails the same way with no regen). `regen.sh` now rewrites only the list of the profile it traced, and `cargo xtask so` reads and dead-key-checks only the list of the profile it builds; a line traced in the other profile fails the build and `cargo xtask static`. The host-class union and provenance above apply within each list. Split from the shared list: a key went to profile P's list when a P pair hit it (only the P pairs kept) or when it had no pair at all; release-only keys left the fast list (a fast trace does not reach them) and fast-only keys left the release list. `startup-text.keys` stays one file: its order does not drive the layout (the window check counts the windows its keys occupy). Rejected: a single list with a per-profile rank column (two orders in one file, and every reader must pick its column) and keeping the old order on merge (the fast order then never follows its own trace).
'''
