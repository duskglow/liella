body = '''
**One-pass `float` pow in the caller's environment** (LIBM-F32-POWF; extends D-10.63 under D-10.67). `powf` and `powf32` answer through `mret::elem2_32_onepass` with `fast32::pow_onepass_any`: no MXCSR read, one evaluation in `double` in the caller's rounding direction, one `cvtsd2ss`; every refusal goes, out of line, to the unchanged `elem` envelope. Decided on the bits before any floating-point operation: y = ±0 with x not a NaN (1); a zero, subnormal, infinite or NaN operand (envelope); y = 1 (x); y = 2 for 2^-63 ≤ abs(x) < 2^64 (x² exact in `double`, one conversion); x < 0 needs an integer y (sign from the units bit, abs(y) in [2^23, 2^24) included); the exact results (abs(x) a power of two, or 0 < y < 16 with 8y an integer: the only exact cases, by the odd-part argument in the doc comment of `fast32::exp_log::pow_onepass`) go to the envelope so the arithmetic never raises a spurious inexact. The operands reach `double` from their bits (no `cvtss2sd`, `cvtsi2sd`). Error bound in every direction ε ≤ 2^-42.45 (ln abs(x) to 3.9·2^-52 with the split ln 2 and the r^8 series, z = (y·L)·RN(128/ln 2), the Tang 2^(j/128) kernel with abs(r) < 1), margin 4096 ulp of the `double`; results only for a `double` y0 in [2^-126, the largest `float`) (one compare on the bits; the bound is the largest `float`, not 2^128, since above it round to nearest and upward give infinity), so no overflow, underflow or errno on the fast path. Method: the classical log-then-exp reduction (Tang, "Table-driven implementation of the exponential function in IEEE floating-point arithmetic", ACM TOMS 15(2), 1989; and of the logarithm, TOMS 16(4), 1990) with the rounding test of Ziv ("Fast evaluation of elementary mathematical functions with correctly rounded last bit", ACM TOMS 17(3), 1991). Also: `fast32::eval_pow`'s parity test now covers abs(y) in [2^23, 2^24) (odd y there gave a positive result for x < 0).
'''
