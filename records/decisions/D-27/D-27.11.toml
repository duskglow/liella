body = '''
**Symbol lookup (`liella_ld::symbols`, phase 14 DL-9, DL-SYMBOLS).** Pure logic over the reader (no I/O, allocation or panic; malformed tables give a typed `LookupError`). The reader gains `Dynamic::symtab` (`DT_SYMENT`, when present, must be 24; an index at or past the hash-table symbol count is `SymbolIndex`). **Hashes:** gABI SysV hash and the GNU hash (`h*33+c` from 5381); an object is searched through its GNU table when it has one (Bloom check, then chain entries whose hash matches with bit 0 ignored), else SysV; both give the same answers. **Definitions:** defined (`st_shndx` not `SHN_UNDEF`), binding GLOBAL/WEAK/GNU_UNIQUE, type NOTYPE/OBJECT/FUNC/COMMON/TLS/GNU_IFUNC, visibility not HIDDEN/INTERNAL, versym index not 0. **Versions** (probe-settled, spec/behaviour/dynlink.md "Symbol binding"): an unversioned relocation reference (versym 0/1 or no versym) binds the definition with the lowest version index, hidden or not (base first, then the oldest version); a lookup by name alone (`dlsym`) binds base or default (not hidden) definitions only; a named version (`vna_other` resolved to its name, `dlvsym`) binds exactly that version, hidden or not, never a base (index 1) definition; in an object without `versym` every definition matches every request (the lookup stays permissive: a program that needs a version from an object without version tables is REFUSED like the reference loader, exit 127 and a message naming the object and the version, with no warn-and-continue and no COMPAT option; that refusal belongs to the load-time version check, DL-10 in the plan, not to the lookup; coordinator ruling #3655). Names are compared as bytes, no node is special (`LIELLA_PRIVATE` included, R14-12). **Scopes** (design §5): global; global then the dlopen group (local first with `RTLD_DEEPBIND`); `RTLD_NEXT` = after the caller in the global scope, else in its local scope; a COPY lookup excludes the program. **Binding:** the first object in scope order that defines the name wins, weak or strong (probe: link order decides, `LD_DYNAMIC_WEAK=1` changes nothing); an undefined weak reference binds 0, an undefined strong one is `Undefined`; an `STB_GNU_UNIQUE` definition is replaced by the namespace registry's entry for (name, version name), or recorded there (probe: shared across two `RTLD_LOCAL` dlopens). Version names are found by walking `DT_VERDEF` per lookup (a per-object index is the L14-7 memo, later).
'''
