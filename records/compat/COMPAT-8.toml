id = "COMPAT-8"
behaviour = "`%#g` after a rounding carry (§8.4, §12.6; D-8.11 (3), owner ruling 2026-10-22, #573)"
glibc = "With the `#` flag, a value that rounds up to the next power of ten keeps no digit after the point: `printf(\"%#.2g\", 99.5)` gives `1.e+02`, `%#.3g` of 999.5 gives `1.e+03`"
liella = "C's rule: the precision counts significant digits and `#` keeps trailing zeros, so the same calls give `1.0e+02` and `1.00e+03`. The owner called this borderline and kept the C output"
restore = "A tunable read at startup making the `#` general-format path drop the zero digits after a carry. Not designed further; the affected code is the cold number-text core, so a flag would not touch a hot call"
