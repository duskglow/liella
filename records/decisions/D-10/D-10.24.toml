body = '''
**The real wide logarithms take a proven `ln`** (MATH-F128-WIDE-LN-PROVEN, #1939). The ten callers of the Halley `mp::ln` in `math::wide` and `math::special` now call `mp::ln_atanh` (the atanh series of D-10.17's kernels, absolute error `< 2^(max(e, 0) + 12 − B)` for `\|ln x\| < 2^e`, proved in its documentation; `B = 384`). Halley's form has no written bound (its convergence from a 1e-12 start is cubic, but its rounding errors were never bounded), so it is not used where a correctness claim rests on it; `mp::ln` stays only for the complex sites that still call it. The callers and what rests on them: `log`, `log2` (÷ `ln 2`), `log10` (÷ `ln_atanh(10)`) of `long double`, `_Float64x` and `_Float128` (D-10.19, correctly rounded): `\|ln x\| ≥ 2^-114` for `x ≠ 1` (`2^-65` for x87), so the result is within `2^-257` relative (x87 `2^-308`); `pow` (D-10.19): `z = y·ln\|x\|` within `\|y\|·2^(max(e,0)+12−384)`, and `\|y\| ≤ 2^(1−e)·\|z\|` with `\|z\| < 2^14` short of overflow, so `z` is within `2^-244` absolute and `e^z` within about that relative; `math::special` (D-10.20): Stirling's `ln y`, the shifted product's `ln`, the reflection's `ln π` and `ln\|sin πx\|`, `jn`/`yn`'s `ln(x/2)`, `ln(2/x)`, each within `2^-371` relative when `\|ln\| ≥ 1` and `2^-372` absolute below, inside D-10.20's per-regime budgets. Correct rounding still rests on an estimate, not a proof: the closest approach of `log`/`pow` of `_Float128` to a rounding boundary is not known; 257 (pow 244) bits exceed the `2·113 + 10 = 236` the estimate asks for.
'''
