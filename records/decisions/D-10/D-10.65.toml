body = '''
**`asinh`/`acosh`/`atanh` (`double`) quick phase** (LIBM-F64-INVHYP-QUICK, under D-10.51; wired as the three entries' tier 1 through `elem_fast`, tier 2 = the accurate path `hyper` unchanged). `fast64::quick_invhyp`: the logarithm's argument as an unevaluated pair within `2^-98` (acosh below 2: `log1p(a + sqrt(2a + a²))`, `a = x − 1`; asinh below 1: `log1p(a + (sqrt(1 + a²) − 1))`; above: `ln(x + sqrt(x² ∓ 1))`; from `2^32`: `ln 2x`; atanh: `log1p(2a/(1 − a))/2` with one division and the remainder by an exact product), the root as `sqrtsd` plus one Newton correction, exact products by 2MultFMA or Dekker (Dekker 1971; Knuth TAOCP 2 4.2.2; identities as in Muller, Elementary Functions 3rd ed. 2016). New pair entries of D-10.60's kernel, `quick_log::log_pair_parts`/`log1p_pair_parts` (on the kernel's `split`/`join`, shared with D-10.66's `log1p`): the low part `d` folded in as `d·(1 − r + r²)`, stated `RHO_PAIR = 2^-63` (module docs derive each term), Ziv's one-sided test with `C_PAIR` (expected fallback 0.2%). Ranges `2^-200 <= |x| < 2^1000` (no spurious flag); outside them, and on a miss, `None`. Tests `crates/boundary/tests/invhyp_quick.rs` (both builds, correct rounding against the accurate path, fallback rate). Instruction counts and timing in handoff/LIBM-F64-INVHYP-QUICK.md.
'''
