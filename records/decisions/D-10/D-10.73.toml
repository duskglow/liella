body = '''
**x87 `expl`/`exp2l`/`exp10l`/`expm1l` and `logl`/`log2l`/`log10l`/`log1pl` integer tier: method and proof** (LIBM-LD-EXPLOG-INT, LIBM-LD-EXPLOG-INT-2; D-10.52's second kernel family; contract D-10.19 unchanged: correctly rounded in every mode). `crates/math/src/wide_int_el.rs` is the first tier of the eight functions for the format with a 64-bit significand, ahead of the double-double tier (`wide::tiers`); the x87 entry and the integer rounding test of `wide_int` (D-10.56) are shared, not duplicated. Exponentials: Tang's table method (P. T. P. Tang, "Table-driven implementation of the exponential function in IEEE floating-point arithmetic", ACM TOMS 15(2), 1989) in 64-bit limbs: `x·128/ln2` exact in 192 bits, `k = round`, `r = f·ln2/128` (magnitude below `2^-8.5`), `e^r − 1` by a degree-10 fixed-point Horner, a 128-entry `2^(j/128)` table; `expm1` uses the exact `x` when `k = 0`. Logarithms: Tang's logarithm table method (ACM TOMS 16(4), 1990) with a two-step multiplicative reduction (W. F. Wong, E. Goto, IEEE TC 43(3), 1994): 128 entries of 17-bit reciprocals, then 65 entries around 1 (second reduced argument below `2^-12.98` in magnitude), a degree-8 series; `log2`/`log10` by one product; `log1p` feeds the exact `x` below `2^-7`. Horner in fixed point per Brent and Zimmermann, Modern Computer Arithmetic (2010), ch. 4. Proved bounds (module documentation, steps E1-E4 and L1-L4): exponentials `2^-110.4`, `expm1` `2^-101.8`, logarithms `2^-103.2`; the rounding test assumes `2^-92`. Measured: 10^7 random operands per function in four modes, exponentials 0 undecided, worst `2^-112.0` (`expm1` `2^-103.6`); `logl` worst `2^-103.9` with 0.064% of calls undecided (they go on to the double-double tier; cause open, LIBM-LD-EXPLOG-INT-3). Results outside the normal range and the operands the entry points settle first (`expm1` below `−50.8`, `log 1`) are refused and go to the later tiers. Reuse: `exp_fix`, `exp_table` (powl passes its own `k` and the magnitude of `r`), `ln_fix` (any positive `t·2^q`). Not adopted: x87 `f2xm1`/`fyl2x` as the quick phase (faithful at best, microcoded), tuning the double-double tier in place, triple-double (DESIGN section 21). Tests: `wide_int_el::tests::{constants_are_the_rounded_values, tier_agrees_with_the_wide_route, hairline_results_are_refused, tier_agrees_with_the_wide_route_long}`. Timing (Ivy Bridge, N100) and instruction counts: not yet measured (LIBM-LD-EXPLOG-INT-3).
'''
