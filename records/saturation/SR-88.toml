body = '''
Do not repeat H2, S1, (c), a static bound pointer, or the SSE2 entry alone. What is left of these rows waits on a
binding that is free per call and per start: a per-ISA entry for dynamic programs through IFUNC in the phase-14 loader
(COMPARE-IFUNC-DYNAMIC), or a reversal of #3994. Open question from the rethink: whether the 29.3 us start cost is paid
once per process however many function families share the classed swap (if so, the trade changes). The S equality
kernel's 17-64 head rows (Ivy Bridge 1.10 of next) need another look in any later per-ISA entry.
'''
