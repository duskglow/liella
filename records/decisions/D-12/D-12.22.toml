id = "D-12.22"
section = "s12"
spec = "§12.8"
ann = "SPEC DEVIATION"
status = "active"
body = '''
**A seek inside the read window keeps the buffer (STDIO-SEEKWIN).** Owner ruling 2026-10-10 23:10, verbatim: "keep the buffer, mark for inclusion for a COMPAT flag later." A descriptor stream tracks its offset (`Ext::pos`), learnt from its own successful `lseek` and advanced by its reads; a write or a failed call forgets it. A fill records the offset where the window ends (`State::win_end`, `win_known`); pushback of a different byte over a window byte, a new buffer or any idle state forgets it. `fseek`/`fseeko`/`fsetpos`/`rewind` with `SEEK_SET` or `SEEK_CUR` to a target in `[win_end - window length, win_end]` on a reading stream moves the read pointer, drops pushback, clears end of input, and calls `lseek(fd, win_end, SEEK_SET)` once, result not used: a caller who moved the descriptor under the stream (POSIX 2.5.1 handle switch, then `fseek` to resync) must find it at the window end, or the next refill would read from the wrong place; glibc does the same (seccomp probe: an `lseek` on every in-window seek, failure ignored, no `read`). Kernel offset: stays at the window end, so `ftell` (offset less the unread bytes) is unchanged and `fflush`/a switch to writing give back the unread bytes as before. Outside the window, `SEEK_END`, writing streams, non-descriptor backings and a stream whose offset is not known (no seek yet, e.g. right after `fopen`/`fdopen`, as glibc): the full seek, unchanged. Coordinator decision 2026-10-10 (STDIO-SEEKWIN-2): keep this one `lseek` per in-window seek for the POSIX 2.5.1 hand-over above; the target is no `read` and no refill, not zero syscalls. Not done: a zero-syscall variant (would read the wrong bytes after a caller's own `lseek`); `SEEK_END` in the window (needs `fstat` or two seeks). Spec-literal behaviour registered as COMPAT-5 (STDIO-SEEKWIN). FTELL-CACHE (SEEKWIN-3, decided locally): `ftell`/`ftello`/`fgetpos` take the backing's offset from `Ext::pos` when it is known, with no `lseek` (seccomp probe f21612fa: glibc makes none once its offset is known - after an own seek, reads, pending writes, pushback, `SEEK_END` - and then ignores a descriptor moved under the stream); a writing append stream still asks for the end. Forgotten, so `ftell` asks the kernel, where glibc asks too: no seek yet, end of input (a read of 0), `fflush` giving read-ahead back, any write. Same result as the `lseek` whenever the descriptor was not moved behind the stream (POSIX 2.5.1 requires an `fseek` after such a move).
'''
