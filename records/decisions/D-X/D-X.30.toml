id = "D-X.30"
section = "x"
status = "active"
body = '''
**Bench tables of a staged tree go to `bench-out/`; every `--counters` run writes only its own rows** (XTASK-BENCH-OUTPUTS, 2026-11-06). A staged tree (`bench-stage.manifest` at its root) writes every table (ratio_host, rounds, bench_times, decision, counters*, measure, *.compare) to `<staged root>/bench-out/`, never into the staged products, so one unpacked tree can be run any number of times; `bench --stage` leaves the build host's run tables out of the products, and a product changed after staging is still refused. Every `--counters` run (also `bench --compare --counters`, and a run whose counting fails part-way) rewrites `counters.tsv` with its own rows only and writes `counters-<bench>.tsv` per bench counted; columns unchanged. Why: a stale counters.tsv from another bench was read as this run's counts (TIMING-IVB-MEMREF-ENTRY) and a staged run refused its own tree after writing into it (CLASSED-SLOT-INFRA-5). Tests: `bench::tests::counters_files_hold_only_their_own_runs_rows`, `benchstage::tests::a_staged_tree_runs_twice_and_its_files_stay_as_unpacked`.
'''
