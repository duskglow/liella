body = '''
**Start-up relro and written state in size-aligned clusters** (LAYOUT-DATA-CLUSTERS, 2026-11-11; layout only, no symbol, ABI or behaviour change; brief B of `handoff/layout-stability-rethink.md` sections 3-4; keeps D-X.50, D-X.53, D-X.62, D-X.63; bounds unchanged). (1) RELRO HEAD: `cargo xtask so` (`xtask/src/startup_ro.rs`) renames each `.data.rel.ro*` section the start-up functions reach (the same reachability as the `.rodata1` grouping) or that holds a writable-kind key of `crates/libc-so/startup-data.keys` to `.data.rel.ro.local.<rest>`; GNU ld's default script places `.data.rel.ro.local*` first in `.data.rel.ro`. (2) WRITTEN STATE: `move_startup_state` (`xtask/src/coldbss.rs`) also moves `timer::EPOLL` (read by the fork child's `fork::child_reset`; coordinator note #4493) and every writable-kind key of `startup-data.keys` whose `.data.<s>`/`.bss.<s>` section is at most 4 KiB to `.data1`. (3) ALIGNMENT: the start object (`csys/src/machine/entry.S`, first in every link) holds empty `.rodata1`, `.data.rel.ro.local.liella_cluster` and `.data1` sections aligned to `LIELLA_RODATA1_ALIGN`, `LIELLA_RELRO_ALIGN`, `LIELLA_DATA1_ALIGN`, which `so` passes as the smallest power of two not below each cluster's bytes over the whole archive (size + alignment - 1 per input section), at least 4 KiB and at most 64 KiB (`startup_ro::cluster_aligns`); a cluster no larger than its alignment cannot straddle a 64 KiB window, and `.data1` takes ceil(size / 4 KiB) pages. Large written tables already moved to `.lbss` (D-X.22: `heap::HEAP`, `process::EXIT_HANDLERS`, `global_locale::SLOTS`) stay there. Tests: `hot_text_products` `init_written_startup_objects_are_in_the_data1_cluster`, `init_data_clusters_hold_at_every_text_phase` (pads 0x800/0x2000/0x8000/0xF000 `pre` and `cold`; equal true/tool/fork counts at the `cold` pads, fork within FORK_BOUND), EPOLL in `init_startup_state_statics_are_in_data1`; xtask `startup_ro::tests::cluster_alignment_is_the_smallest_power_of_two_window_safe_and_page_sized`, `coldbss::tests::written_startup_keys_join_the_state_cluster_up_to_a_page`.
'''
