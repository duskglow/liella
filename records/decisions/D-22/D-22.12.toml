body = '''
**rt futex, sync, cpu, tls and fatal cores** (COLD-REWRITE-W-far-13 with proof passes -2 and -3, 2026-10-15; records `liella-historic:handoff/decisions/COLD-REWRITE-W-far-13.md`, `-13-2.md`, `-13-3.md`; D-22.1, D-22.4, D-22.9, D-22.10). (1) Futex wrappers thin and typed; private scope adds `FUTEX_PRIVATE_FLAG`; a deadline uses `FUTEX_WAIT_BITSET` with `FUTEX_CLOCK_REALTIME` (the only absolute wait); errors returned, callers re-check. (2) `RawMutex`: one zero-initialised `u32`, bit 0 locked, bits 1-31 the count of registered sleepers; lock CAS 0 to 1, slow path a short read-only spin, then register (+2) and wait on the exact value; unlock one `fetch_sub(1)`, wake exactly when the count was non-zero (the classic 0/1/2 design wakes needlessly). `reset` in the fork child stores 0. (3) `RawOnce`: bit 0 running, bit 1 sleepers, 4 done; an unwinding routine puts the word back to new and wakes the sleepers (POSIX `pthread_once` rule; a deliberate change, pinned by P1). (4) `RawRwLock` (D-22.4 reader-preferring): bit 0 writer, bit 1 sleepers, readers in units of 4; the unlock that frees the lock clears bit 1 and wakes all. (5) `RawCondvar`: a sequence word; `notify_all` increments then wakes all (no lost wake-up); broadcast only. (6) `cpu::Features`: a `Copy` value of the raw registers, cached once by the boundary; at most five `cpuid` (STARTUP-COST); out-of-range leaves not read; AVX family needs XCR0 bits 1-2, AVX-512 bits 1-2 and 5-7; psABI levels v2/v3/v4. (7) TLS: the thread-block layout and its offset asserts unchanged (ERRATA E7, D-22.10); initial area `A = max(64, p_align)`, thread pointer the first A-aligned address at least `tls` above the base, slack `A - PAGE` when A exceeds a page, checked arithmetic; canary = first 8 `AT_RANDOM` bytes with the low byte zeroed, pointer guard the next 8. (8) Fatal path: no allocation, lock or stdio; one `writev` per diagnostic (chunks of 16), resuming after partial writes and EINTR, giving up on other errors (P2); `abort` unblocks and raises SIGABRT, then the default disposition, then a trap, then `_exit(127)`, streams not flushed; assertion texts in the ERRATA E8 form. (P1-P2, P4) The unwind rule of `RawOnce` and the EINTR rule of `fatal::message` are new contracts with tests; four further contracts (condvar sequence, futex realtime clock, leaf-7 bound, canary bytes) got deterministic tests.
'''
