body = '''
**Special functions of `long double`** (milestone 5b). `math::special` is generic over `Float`: operands enter as their exact values (`mp::Mp`), so the 384-bit evaluation of D-10.15 serves `float`, `double` and x87 `long double` alike (`_Float128` next) and every result is correctly rounded in every mode. Format-dependent thresholds come from `Float::EMAX`/`PREC`: `erfc` underflows completely beyond `a² > (EMAX + PREC)·ln 2` (106.77 for `long double`), `tgamma` overflows when `lnΓ > (EMAX + 1)·ln 2 + 1` and underflows below `−(EMAX + PREC)·ln 2`, Bessel recurrences stop beyond `2^(EMAX + 100)`, `yn` takes the overflow shortcut beyond `(EMAX + PREC)·ln 2 + 50`. `sin(πx)` of the reflection splits `x` exactly in `Mp` (any significand up to 113 bits); Hankel's phase is reduced in 384 bits below 2^29 and by `mp::reduce_wide` above, so huge arguments up to the largest finite value are exact. `tgamma` is exact at the integers up to 92 (91! has 380 significant bits; was 60). Tiny `jn` arguments (below 2^-180, orders 1 to 91) whose leading term `(x/2)^n/n!` is a dyadic number (n = 1, 2, or the odd part of n! dividing odd(x)^n) are computed exactly and rounded just inside it (`jn_tiny`; the series drops the correction below 2^-392 and rounded such terms to the wrong side in the directed modes: found by the `long double` differential test, in code shared with `double`); orders of 92 and more underflow there; the `j1` shortcut moved from 2^-200 to 2^-180 into this rule. Recurrences of more than 5000 steps still run in double-double (relative error about n·2^-106, 2^-22 of a `long double` last place at n = 2^20: a known limit, as for `double`). Conventions as `float`/`double` (D-10.16), which the `long double` probe confirmed (`spec/behaviour/libm-special-ld.md`), except `lgammal(2)` downward: +0 as C F.10.5.3 requires (glibc −0; three-way, recorded). **`_Float128` (M5-7, 2026-10-22):** the same bodies (`s10_math.tsv` format `q`, 11 names; glibc has no `gammaf128`). Three thresholds that assumed at most 64-bit significands are derived per format: `erfc`'s beside-one shortcut below `2^min(−100, −PREC−36)` (−149), the switch from `1 − erf` to the continued fraction at 6 instead of 10 for `PREC > 64`, and every recurrence in 384 bits for `PREC > 64` (double-double's 106 bits are short of 113; cost O(n) 384-bit steps, a speed item for milestone 6). Precision bound per regime (bits of 384 left for a 113-bit result; correct rounding is claimed where about 2·113 + 10 = 236 remain, the usual estimate of the hardest case): `erf`, `erfc` of negative operands, `tgamma` (`\|lnΓ\| < 2^14`): over 360; `erfc` by `1 − erf` below 6: over 320 (at most 55 cancel); `lgamma` next to 1, 2 and its negative zeros: about 250 (results down to about 2^-114 against terms of 2^7); Bessel power series below about 20, Hankel above about 121, recurrences away from zeros: over 236. **M5-W (MATH-M5-MP-WIDE, 2026-10-22) closes the limit below by Ziv's strategy:** the power series and Hankel's expansion return an absolute error bound with each 384-bit value (the derivation is in `special.rs`: `5K²·2^emax·2^-383` for the series' `K` terms below `2^emax`, the first omitted term and the phase error for Hankel); `jn`/`yn` (so `j0`, `j1`, `y0`, `y1`) round only when both ends of that interval round to the same encoding and flags, and otherwise evaluate the power series again in 768 bits (`mpw`: the `mp` arithmetic expanded with twelve limbs by `mp::mp_core`, `π`, `ln 2`, `γ` from `cargo xtask tables`) for `x < 160` and orders up to 160 (no zero of `J_n`/`Y_n` lies below `x = n`). Next to a zero below 160 the 768-bit series keeps more than 380 bits (terms up to 2^226 at 160, results down to about 2^-130); Hankel at and above 160 keeps more than 330 of 384 (truncation 2^-461 at 160): both well above the 236 the hardest case is estimated to need. Every other operand decides in 384 bits and costs only the test (two roundings). Proof: `special_cr.rs` `float128_bessel_*_next_to_zeros` (the four `_Float128` operands around each zero of `J0`, `J1`, `Y0`, `Y1` on [20, 160) and of orders 2, 3 and 7, every mode, against the oracle with up to 2^16 bits); the generic code serves `float`, `double` and `long double` alike. The oracle's `euler_gamma` now scales its Brent–McMillan `n` with the precision (a fixed 96 was right to only about 550 bits). Still without a bound: the recurrences (orders above √x beyond 100, `n > 160` anywhere), which round their 384-bit value as before, and #841 (the `_Float128` recurrences run O(n) 384-bit steps up to 2^31, a speed item for milestone 6). **Former known limit (queued for M5-W, closed above):** the Bessel power series for 20 ≤ x < 100 next to a zero of `J`/`Y` (the terms reach e^x/√(2πx), about 2^140 at 100, against results down to 2^-117: about 120 bits left) and Hankel's expansion for 100 ≤ x < 121 next to a zero (truncation about e^(−2x) = 2^-288 at 100: about 170 left) are faithful, not proven correctly rounded; the ceiling of `libm-ulps.tsv` (`j0` 2, `j1` 4, `y0` 3, `y1` 5, `jn` 7, `yn` 5) holds with a wide margin. X87-NAN-RULE-AUDIT-2 (owner ruling 2026-10-23, #902): an invalid x87 encoding beside a number in `fmaxl`, `fminl`, `nextafterl`, `nexttowardl`, `powl` and `remquol` gives the default NaN with invalid; glibc's per-function results are listed in the differences row for those functions and registered as COMPAT-10 (not implemented).
'''
