body = '''
**`__libc_start_main` under Liella's `ld.so`: start steps 1-4 run once, in libc's early init; libc runs the program's `DT_INIT`/`DT_INIT_ARRAY` (phase 14 DL-14, plan/ph14/design.md §14).**
Detection: `__liella_libc_early_init` (D-27.22) sets a libc-private flag as its last act; `__libc_start_main` takes the dynamic path when the thread pointer is set and that flag is set. Only Liella's `ld.so` calls the early init, so another loader's thread block is never read to decide (a foreign thread block's words are not Liella's); a static program tests the flag only after its own `ARCH_GET_FS` answer, so its start does no added work.
The dynamic path skips steps 1-4 (thread block, secure-mode clearing, publishing `environ`/names/`__libc_stack_end`, tunables and CPU paths): a constructor's `setenv` or change of the program names survives into `main`. It keeps the thread's kernel registrations (`set_tid_address`), threads forbidden until DL-15 gives them the loader's TLS interface, the program's `__fpu_control` (D-10.5, #814), the heap perturb byte, the name-service cache, the initial descriptor and the internal signal. It registers `rtld_fini` (the loader's termination: every object's `DT_FINI_ARRAY`/`DT_FINI`, the program's included) and `fini` when the start object passes one.
Initialisation: the loader runs the program's `.preinit_array` and every shared object's initialisation; it passes the program's `DT_INIT` and `DT_INIT_ARRAY` in `StartInfo` (same build, tag-checked), and libc runs them after all shared objects when `init` is NULL (2.34+ start objects), or calls `init` when a pre-2.34 start object passes one. Each call gets `(argc, argv, envp)`: harmless to a `void (*)(void)` under the psABI, and what an `init` that runs the arrays itself needs to pass on.
Secure mode: libc's early init opens `/dev/null` on a closed descriptor 0, 1 or 2 before any constructor runs (s1_1_g_3), not later at `__libc_start_main`: a constructor of a privileged program cannot receive a standard descriptor number from `open`.
Proof: `reloc_libc_start_hello_world` (output equal to the host's C library's for the same source; three start objects; kernel-started and `ld.so PROGRAM`); `sym___fpu_control` runs the dynamic `fpu_control_*` conformance programs on Liella (the #814 skip lifted). Plants: handoff/DL-LIBC-START-plants.txt.
'''
