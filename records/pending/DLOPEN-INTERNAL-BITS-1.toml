story = "DLOPEN-INTERNAL-BITS"
date = "2026-11-13"
body = '''
**The eight high `dlopen` mode bits are internal to glibc and unsupported in Liella (DLOPEN-INTERNAL-BITS; owner ruling DLOPEN INTERNAL MODE BITS, 2026-11-13).** glibc's maintainers confirmed that `0x01000000`, `0x02000000`, `0x04000000`, `0x08000000`, `0x10000000`, `0x20000000`, `0x40000000` (used internally for profiling) and `0x80000000` are internal, undocumented flags and suggested leaving them out of any analysis. **The eight bits are reserved for Liella** (owner ruling, 2026-11-13): Liella owes glibc's internal meaning of them nothing, refuses them today with `invalid mode parameter`, and keeps them available for a possible future Liella-defined use (none planned; any use is a new public-interface decision). **Rule:** Liella's behaviour is unchanged: `dlopen` refuses every bit outside `RTLD_LAZY`, `RTLD_NOW`, `RTLD_NOLOAD`, `RTLD_DEEPBIND`, `RTLD_GLOBAL`, `RTLD_NODELETE` with `invalid mode parameter` before the file is looked for (`ModeError::Unknown`), and DL-16a's sweep test keeps asserting it for every undefined bit, these eight included. They are excluded from the comparison with the reference: probe P-1's sweep (`tools/probe/dl/dlopen/probe.c`) skips all eight and no longer probes `0x80000000` alone; the existing raw lines in `spec/behaviour/dynlink.glibc.txt` stay. **Record:** `spec/behaviour/dynlink.md` row "P-1 unknown bits" and one row in `docs/differences-from-glibc.md`. No compatibility option: they are not a public interface (owner ruling).
'''
