body = '''
**The scanf engine** (phase 8; refines D-12.6; rewritten under the clean-room rules of §1.4, item 8, in a fresh session from the spec, `spec/behaviour/scanf.md` and black-box probes). `liella::scanf::scan` runs a format (bytes or `wchar_t`) over an `Input` yielding one unit at a time with one unit of pushback: bytes for the narrow functions; characters decoded by the stream's codec for `fwscanf`, or the string's units for `swscanf`. A field ends at the first unit that cannot continue it, which is given back; a field that is then only the start of a number is consumed and the conversion fails, as the spec's §12.7 guarantee says (`1e`, `1e+`, `0x` and `.` as floating fields, `-`, `infin`, a field cut by its width such as `%2lf` on `0x1p3`). Integer fields read like `strtol` (`d`, `i`) or `strtoul` (`o u x X b p`; `-` negates modulo 2^N) at the destination's width; out of range stores the nearest bound (D-12.6). The `0` of `0x`/`0b` is a digit (`0x` alone is 0); `0b` is a prefix for `%b` in every set and for `%i` in the `__isoc23_` set. Floating fields accept decimal and hexadecimal forms, `inf`/`infinity` and `nan` (not `nan(...)`) with the locale's radix, converted by the exact float engine (D-8.5) to `float`, `double` or x87 `long double` in the current rounding mode; with `'` the locale's thousands separator is accepted after a digit, without grouping validation. Text: `%c` stores what is there if input ends early; `%[` keeps a reversed range as three characters and `]`/`-` as literals first or last; byte input to `%ls`/`%lc`/`%l[` is tested byte by byte, decoded, the width counting characters; wide input to `%s`/`%c`/`%[` is encoded, with **one** terminator (the reference writes a second zero byte past it, which can overrun a buffer sized for the string: a deliberate difference, §1.4 goal). An invalid or incomplete sequence fails the conversion with `EILSEQ`, keeping what was stored. `%m` (and in the plain set `%a` before `s`/`S`/`[`) stores a `malloc`ed copy, and NULL when the conversion fails. `%n` stores the units consumed and is not a conversion. The result is the count of assignments, or `EOF` when end of input, a read error or an encoding error comes before the first conversion, suppressed ones included (spec over reference: the reference ignores suppressed ones); read and encoding errors also set `errno`. An invalid specification (`%y`, `%5%`, an unclosed `%[`, a trailing `%`) stops the scan without `EOF`. Pointer arguments are read on demand by `legacy::scanf_va::Pointers` through `abi::va::VaSource`, kept for positional access (up to `NL_ARGMAX`, 4096); positional and sequential conversions have separate counters. `boundary::scanf` provides strings and locked streams; a byte-oriented stream refuses `fwscanf` with `EINVAL` (D-12.14). The variadic names are C adapters forwarding to `liella_v{f,s,fw,sw}scanf4`; the exports return through `ret::int_or_eof`. `scanf_products.rs` compares about 40,000 scans across the three symbol sets and three locales; the recorded differences are the partial fields (KNOWN), the clamped integers (`clamped`) and the single terminator (`one_terminator`).
'''
