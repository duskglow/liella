id = "D-16.3"
section = "s16"
spec = "§16.4"
ann = "ARB, HIST"
status = "active"
body = '''
**Internal:** the resolver configuration is unbounded (P-lift; `liella::names::dns::conf`). **Boundary:** the exported `_res` (568 bytes) shows the first 3 servers and 6 search domains, IPv6 servers in `_u._ext.nsaddrs`; while the state still holds exactly the file's first 3 servers or 6 domains, the file's further entries are used too. `_res` is per thread: the initial thread uses the `_res` object, other threads a state in thread-block word 0x130, freed at thread exit; a mark and generation (offsets 560, 564) re-read the thread state when `resolv.conf` changes unless `RES_NORELOAD`; caller-created states are never reloaded; a missing file means the defaults (options 0x2c1, server 127.0.0.1, domain from the host name). **Parsing (observed):** limits ndots 15, timeout 30 (0 allowed), attempts 5; `inet6` and `debug` ignored; `options` lines add up; the last `domain`/`search` wins; invalid `nameserver` skipped, `%zone` accepted; `sortlist` (at most 10, natural masks) applies to `gethostbyname` and `getaddrinfo`; `LOCALDOMAIN`, `RES_OPTIONS`, `HOSTALIASES` (dot-less names, not with `RES_NOALIASES`). **Transport (observed):** servers in order, an unreachable one skipped at once; the timeout per server without doubling, `attempts` rounds; SERVFAIL/REFUSED/NOTIMP/FORMERR move to the next server; `rotate` is a process-wide round-robin; EDNS payload 1200, DO with `RES_USE_DNSSEC`; AD set in queries and kept from responses only with `trust-ad`; A and AAAA in parallel on one socket (A first, a lost query resent alone) unless `single-request(-reopen)`; ID and question checked; TCP on TC or `use-vc`. **Failure:** `h_errno`/`res_h_errno` report failures only, a success leaves them unchanged; NXDOMAIN → HOST_NOT_FOUND, NOERROR without answers → NO_DATA, SERVFAIL/REFUSED/no response → TRY_AGAIN, FORMERR/NOTIMP/other → NO_RECOVERY; the same over UDP and TCP (a response to another question is no response, per §16.4 Guarantees). **Query IDs (owner, 2026-10-03, permanent):** each query's 16-bit ID comes from its own `getrandom` call. The ID and the source port are the only defence of a stub resolver without DNSSEC against off-path spoofing (RFC 5452): an attacker who can predict the next ID needs far fewer forged answers to poison a lookup. A generator seeded once would be faster (`res_mkquery` is 1.24× glibc) but makes every ID depend on one seed and on generator state that survives `fork` into children, which can then repeat each other's IDs; a system call per query costs well under a microsecond against a network round trip, so security wins. **Deliberate differences** (KNOWN in `dns_products`): `res_search` after a success leaves `h_errno` alone (glibc: 1); REFUSED and wrong-question answers over TCP as over UDP; `LOCALDOMAIN` with leading white space or empty gives no empty domain (resolv.conf(5)); LOC text uses the RFC 1876 ranges (glibc wraps). **Secure-execution mode (owner ruling 2026-10-03):** `HOSTALIASES`, `RES_OPTIONS` and `LOCALDOMAIN` are read through `secure_getenv`, so a set-user-ID or set-group-ID program ignores them (ld.so(8); the reference agrees, and also removes them from the environment, a question left to the loader's threat model); the cache keys hosts by the resulting configuration (`tests/secure_env.rs`).
'''
