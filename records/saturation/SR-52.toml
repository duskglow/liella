id = "SR-52"
section = "4"
row = "`malloc` + `free` pair, cycles on Ivy Bridge (PERF-MALLOC-IVB-CYCLES, 2026-11-05)"
now = "Ivy Bridge host A (E3-1220L v2), booked and idle, `perf stat` on a probe that is the cbench_malloc `pair()` loop alone (same volatile pointers, 50M pairs, pinned), Liella static (bench build of next e8a36c58) against glibc 2.39 dynamic, interleaved, 3 rounds, sd under 0.1: sizes 16/64/1024 give 51.6/51.1/51.1 cycles and 123.2 instr (132.1 uops retired) against glibc 45.9/44.1/45.9 cycles and 148.1 instr (180.1 uops); cycles 1.12 to 1.16, the bench's time ratio. The gap is all in `resource_stalls.rs` (scheduler full): 19.9 to 20.4 cycles per pair against glibc 6.0 to 7.7. Zero or under 0.1 per pair for both: `ld_blocks.store_forward`, `machine_clears.count` and `.memory_ordering`, branch misses, L1D misses, `misalign_mem_ref.loads`, `ild_stall.lcp`, `int_misc.recovery_cycles`, `resource_stalls.sb`/`.rob`, `dsb2mite_switches`; `ld_blocks_partial.address_alias` 0.67 against 0.95; uops come from the DSB (115 of 132)."
limit = "a dependency chain, not a stall event: the pair is latency-bound on a chain carried from one pair to the next through the bitmap word, so the scheduler fills with the uops waiting on it"
reason_class = "design (first-principles, see right)"
basis = "M"
source = "PERF-MALLOC-IVB-CYCLES"
tried = "**Cause (precise-cycles samples on the probe; latencies are the documented Ivy Bridge values, the chain total is a model, not measured):** the next fast malloc loads the bitmap word that this free stored, and free can store it only at the end of its index computation. The chain per pair: malloc's bitmap-word load (forwarded from the previous free's store), `not`+`tzcnt` (4), the stride `imul` (3) and the add give the pointer; free's slab-hint record load (its address comes from the pointer, so it waits for the forward from malloc's record store), the offset subtract, the magic `imul` (3), the shifts, then the bitmap-word load (address from the multiply, value forwarded from malloc's `bts` store), the bit clear and the store. Samples sit on that path (the `imul`s, the forwarded loads, `tzcnt`, the first store to the block in `pair`). A free list keeps the freed pointer itself as the next result, so its loop-carried part is one forward and one load; the bitmap design adds the index computation to the loop. Ivy Bridge's scheduler (54 entries) holds about 40% of a pair's 132 uops, so little of the next pair overlaps; Skylake-SP's 97-entry scheduler and its shorter forward latency are the likely reason the gap does not show there (row above). Which of the two it is was not measured. **Tried, measured negative on this host:** `K_HINT` stored in `freed_into` only on a change (to take the hint's forward off the next malloc's address path): +2.0 instr, +0.2 uops, cycles +0.15 to +0.35 at all three sizes, `resource_stalls.rs` +0.2; reverted. The hint's address is not on the critical path: the bitmap word's value arrives no earlier."
flag = "**next:** a free of the block the cache's latest fast malloc returned (the pair shape) could take the word and bit from the cache instead of the record load and magic multiply, which removes about 12 cycles of the chain. It still has to read the word to test liveness (the double-free report). That is a new fast path and a D-12 design question; not built here."
