body = '''
**Complex functions of `float` and `double`** (milestone 4a, `math::complex`). Each part is evaluated in `math::mp` (384 bits) from formulas without cancellation and rounded once, so each part is correctly rounded in every mode: `cexp`, `csin`/`ccos`/`csinh`/`ccosh` as products of the real functions of the parts; `clog` as ½ ln(1 + (x² − 1 + y²)) near \|z\| = 1; `csqrt` by `√((\|z\| + \|x\|)/2)` placed by the sign of x; `ctanh`/`ctan` as `(sinh x cosh x + i sin y cos y)/(sinh² x + cos² y)`, the real part as ±(1 + δ) far out; the inverse functions by Hull, Fairgrieve and Tang's decomposition (`A − 1`, `A − \|x\|` as sums of positive terms); `catanh` with the larger part paired with the 1. New `mp` kernels: `ln1p`, `atan`/`atan2`, `sinh_cosh`, `sin_cos` of any argument, `sin_cos_pi`, `exact_sqrt`, exactness-tracked `mul_x`/`add_x`. Exact parts are recognised: exact square roots (120-bit candidates), \|z\|² = 10^m for `clog10`, small integer powers of `cpow` by exact multiplication, `cpow` of a base on an axis or a diagonal (the only bases whose argument is a rational multiple of π) by exact reduction of the angle, z^½ as `csqrt`. Where a part is a short dyadic number to within 2^-300 (both parts below 2^-150, \|z\| next to 1, \|x\| = 1 beside a tiny y, one part negligible beside the other with an exact root), the leading-order expansion gives the side of the deviation (`Part::Dev`). Known limit: a short dyadic part beside a negligible correction in the remaining asymptotic regimes (for example `catanh(2^-100 + i·2^200)`, whose real part is 2^-500·(1 − 2^-400 + ...)) may be one unit off in a directed mode; a wider fallback precision is the remedy (handoff). (M6-10, MATH-M6-CPLX-DIRECTED: Ziv's ladder below is that remedy; for `float` and `double` every part on a grid of part exponents over the format's range, both significands 1 and 1 + ulp, in all four modes, is the oracle's correct rounding (`complex_directed.rs`); the `long double` and `_Float128` grids are open findings, ignored there until a follow-up decides them.) The oracle (`liella_mathtools::cplx`) uses different formulas (from `hypot` and the real oracles, with error bounds; cpow with absolute bounds through the exponent and angle). **Long double (M5-2, MATH-M5-CPLX-LD-1):** `cexp`, `clog`, `clog10`, `cpow` and `csqrt` (`l` and `f64x`, and `__clog10l`) run on the same core for any `Float` behind C forwarders (D-10.21); a part enters `Mp` from the decoded significand and is rounded once into the format. Cut-offs: the short-dyadic test is `TINY_EXP = -150` (derived for significands up to 73 bits; `derived_for::<F>()` asserts `PREC <= 73` at compile time, so `_Float128` derives its own in M5-4); the exact-root candidate is `max(120, 2·PREC + 2)` bits (#860: x87 `(1 + i(2^64 − 1))²` has a 127-bit \|z\|); `cpow`'s angle reduction is an exact mod 2 (#861: "above 2^56 is even" was wrong for 64-bit significands). The trigonometric, hyperbolic and inverse functions stay on `Small` until M5-3. Proof: `complex_ld_cr_products.rs` (grid over the x87 exponent range in every mode, random lines, the oracle on every differing line; its oracle needs up to 2^16 bits for parts 2^-32891 from a short dyadic value). Known limit (#859): `cpow` whose exponent or phase product exceeds about 2^(370 − PREC − 10) (x87 about 2^296, `double` about 2^307) while the result is still representable is not correctly rounded within 384 bits; no correct-rounding claim is made in that regime, and the remedy is the wider multi-precision work (M5-W `MATH-M5-MP-WIDE` or a follow-up). **Ziv's step, `ln` (MATH-M5-CPLX-F128-ZIV-B1-2, #1912):** every `ln` on the complex `_Float128` Ziv path is `mp::ln_atanh` (atanh series, `mp_kernels`, both widths; also inside `ln1p` and `ln10`), whose absolute error is proven below `2^(max(e_ln, 0) + 12 − B)` for a result below `2^e_ln` (`B` = 384 or 768; proof in its documentation, 8 bits proved plus 4 of margin). Chosen over a proof of the Halley `mp::ln` because its bound needs only the operation bounds; the Halley form serves no Ziv step. Proven bounds so far: `clog`/`clog10` real parts (relative `2^(26−B)` near `\|z\| = 1` through `ln1p`, else `2^(14−B)`; `/ln 10` one bit more), `carg10` `2^(15−B)`, `cpow` of a base on an axis (run-time bound); the inverse functions and `csqrt` (B1-3: first-order counting lemma, `ln1p_class`). **Ziv's step, run-time bounds (MATH-M5-CPLX-F128-ZIV-B2):** the regimes whose error grows with an operand (`cexp`, the products of `csinh`/`ccosh`/`csin`/`ccos`, `ctanh`/`ctan` both sides of \|h\| = 24, `cpow` on an axis, a diagonal, in general and the quotients of a negative integer power) carry each intermediate as an `Approx` (value, exponent of a proven absolute error bound) through the `mpw` header's operation bounds: `exp`'s relative `2^(14−B)·(\|k\| + 64)`, `sinh_cosh`'s `2^(17−B)·(\|k\| + 64)`, `sin_cos`'s `(\|x\| + 2)·2^(4−B) + 2^(9−B)` (Payne–Hanek `2^(11−B)` beyond 2^29), the turn reduction of a phase beyond 2^40 (`2^(ex φ + 8 − B)`), and `e^(x + δ)`'s linearisation for `\|δ\| <= 1/8`. Where no bound can be given (a larger argument error, a divisor whose sign is uncertain, the sign of `ctanh`'s δ uncertain) the part is undecided at that width, never guessed. Every general part of the 18 names is now rounded by Ziv's test on a proven bound (no unproven site is left): 384 bits, then 768, then 1536 (`mpx`) and 3072 bits (`mpy`), entered through cold functions (`complex::ladder`); a part undecided at 3072 bits is that value rounded once and counted (`complex::residual()`) (ZIV-C, rulings #1719/#1758: every step proven; the one assumption is that no binary128 input needs more than 3072 bits). Above 768 bits the Newton counts of `recip`/`sqrt` follow `B` (`NEWTON`: 5 at 1536, 6 at 3072), the 2/π table holds 312 words (`reduce_wide` at `e ≤ 16 383` with `RW = LIMBS + 3`), and every bound gains `log2(B/768) + 1` bits (`WIDTH_SLACK`) for the series that take up to `B/768` times as many terms. The loop ends: it has at most these steps, and exact values are recognised before the test (exact roots, exact quotients of 120 bits, axis and diagonal angles, `Part::Exact`/`Dev`/`Near`/`Zero`); the remaining parts of nonzero finite operands are transcendental (Lindemann–Weierstrass), so no exact boundary is ever approached by them. Known limit (#1905): `cpow` with huge \|c\|, \|d\| (E or Φ near 2^1000, cancelling) is not decidable at 768 bits; the ladder decides it at 1536 or 3072 bits (it starts at 384 like every function; choosing the start from the exponents of c and d would only save the narrower evaluations). Trigonometric factors of a tiny operand (ZIV-C Step 0, 2026-11-04): below `2^(−B/2)` the sine is the operand with the relative Taylor bound `2^(2e − 1)` and the cosine 1 within `2^(2e − 1)` (`small_trig`, also for `cpow`'s angle with its own bound); the absolute `2^(10 − B)` bound had left every part with a subnormal or minimum-normal sine argument undecided at both widths (2219 of 84 308 accuracy-suite calls of `cexp`, `csinh`, `ccosh`, `csin`, `ccos`, `ctan`, `ctanh`), and after it none is undecided at 768 bits (105 calls retried at 384, 9-18 per family).
'''
