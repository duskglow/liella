id = "D-22.11"
section = "s22"
spec = "§22.3"
ann = "KERN, HIST"
status = "active"
body = '''
**Cancellation mechanics** (refines D-22.2). A cancellation point checks the descriptor's cancellation word on entry (`Err(Canceled)` if acted on) and makes its blocking system call through a C-layer *window* primitive (`liella_sys_cancellable`: check the word, then `syscall`, between two exported labels). The internal signal's handler, interrupting a thread whose program counter is inside the window (the system call had no effect: the kernel restarts it, or it has not started), rewrites the saved program counter to the primitive's cancelled exit, which returns `-ECANCELED`; the Rust caller turns that into `Err(Canceled)`, which propagates to the export (no Rust frame is skipped). Past the `syscall` instruction (a completed call, or a partial transfer) the request stays pending for the next point (§22.3 guarantees). **Asynchronous cancellation (owner ruling 2026-10-01, interim):** it takes effect only at safe points outside Liella code. The handler acts immediately only when it can prove the interrupted program counter lies outside Liella's text, from text bounds the products' link records. Where no such bounds exist, in a statically linked program until the product build marks them and in test processes, the request stays pending. It is then acted on at the thread's next safe point: a cancellation point, `pthread_testcancel`, or `pthread_setcancelstate`/`setcanceltype` (the only async-cancel-safe calls). **Known deviation from glibc,** which acts immediately at any instruction: a thread that runs only its own code with asynchronous cancellation enabled is not cancelled until it reaches such a point. This is the owner's chosen tradeoff, preferred over guessing the text boundary in a statically linked program. Revisit if coreutils' tests fail because of it. **Acting** runs the C cleanup buffers that `pthread_cleanup_push` registered (`__pthread_register_cancel`: each is a `__sigsetjmp` buffer; `__pthread_unwind_next` continues to the next), then key and `thread_local` destructors, then exits with `PTHREAD_CANCELED`. **Interim until phase 14:** glibc runs the cleanup through `_Unwind_ForcedUnwind` from `libgcc_s` (loaded by `dlopen`), which also runs C++ destructors and `-fexceptions` `__attribute__((cleanup))` handlers. Without `dlopen` (phase 14), Liella runs only the registered C buffers; a cancelled or exiting C++ thread skips its destructors. C programs (the coreutils target) are complete. **Fast points (CANCEL-FAST, 2026-10-11):** `read`, `write`, `pread`/`pread64`, `pwrite`/`pwrite64`, `__read_chk`, `__pread_chk`/`__pread64_chk` and `close`/`__close` act on a due request themselves (`sys::point4`, `sys::close_point`, `cancel::act`) instead of setting `CANCEL_HIT` for `cancel::point`; the order of effects is unchanged: `errno` from the call's result, then acting. The 4-argument calls enter the same window through `liella_machine_syscall_cancel4` (all arguments in registers, no stack arguments; the word's address moves to `%r11` before the window, so the window is still exactly load-test-`syscall` for both entries). No single-threaded special case: the window's first load IS the one-load "nothing to act on" check, in every thread. **Happens-before argument (unchanged by the fast path):** a request is published by `pthread_cancel`'s `fetch_or(REQUESTED)` (AcqRel) BEFORE it signals the thread. (a) If the target's window load comes after that RMW in the word's modification order, it reads REQUESTED and returns -ECANCELED without the system call. (b) If the load came earlier, the signal is sent after the RMW and delivered at the next kernel entry: while the program counter is between the load and the `syscall` instruction (the handler redirects it), during the system call (a restartable call is rewound to the `syscall` instruction, inside the window: redirected; a completed or partial transfer is past `window_end`: the request stays pending for the next point, as the row above says). A self-request (`pthread_cancel(pthread_self())` before the call) is sequenced before the load: case (a). `close` keeps its own order (the descriptor is closed outside the window, then the word is read: a request due then acts). No path skips the load; an interruption with -EINTR re-reads the word, as before. **Kernel ECANCELED (CANCEL-FAST-2, 2026-10-11, coordinator decision):** a point acts on a -ECANCELED (or -EINTR) result ONLY when the word says a request is due (`cancel_due`, `sys::found_due`); otherwise it is an ordinary error result (-1, errno ECANCELED), e.g. a timerfd read after a clock change or a seccomp filter. Sound because the window returns -ECANCELED only for a due request and only the thread itself can make a due request not due. Test: conformance/c/s22_cancel_fast.c part 5 (seccomp ECANCELED, main and created thread). Not changed: the futex waits of `pthread_cond_wait`/`sem_wait`/`pthread_join` (sync.rs `ThreadCtx::wait`) still read a raw -ECANCELED as acted on; futex(2) never returns ECANCELED itself (only a seccomp filter could); follow-up. **Direct points (CANCEL-FAST-2, 2026-10-11):** in the products `read`, `write`, `pread`/`pread64`, `pwrite`/`pwrite64` and `close`/`__close` are assembly entries (csys/src/machine/points.S; plan S2 hot-kernel; Rust twins `export! { asm }` call the same code in the tests). The common case: the descriptor word at `%fs:0xa0` (non-zero), count 1..=isize::MAX and a non-NULL buffer, then `call` into the SAME window (`liella_machine_cancel_window`, word address in `%r11`), then one result test; an error result tail-jumps to `liella_cancel_point_fail` (the rule above, errno, -1). Everything else tail-jumps to the former Rust export (`liella_*_rest`), unchanged. `close` makes its call first (outside any window), then reads the word: due, or an error, goes to `liella_close_point_fail`. The happens-before argument above is unchanged: the window is the same code and the first load is still its first instruction. `close` takes the Rust path (`aio::closing`) once any asynchronous I/O was started: one flag byte `liella_machine_aio_used`, set before the first request is counted (`PENDING`) or an internal descriptor is published (`RING_FD`, `EVENT_FD`), so a close that the old code would have seen as busy (its submission happened-before the close) sees the flag.
'''
