id = "D-12.19"
section = "s12"
spec = "§12.5, C.7"
ann = "PERF"
status = "active"
body = '''
**The front path of byte output** (PJ-24 P5, 2026-10-07; refines D-12.11). `fputc`/`putc`/`putchar` (and their `_unlocked` forms), `fputs` and `fwrite` first try the window store alone, before `with`'s plumbing: a stream already set up (`_lock` and `_codecvt` set; a standard stream's first use goes the general way, which sets it up), its orientation already byte (`_mode` < 0; undecided goes the general way, which decides it, wide the general way, which refuses), its lock taken exactly as `with` decides (not for the `_unlocked` forms, `FSETLOCKING_BYCALLER` or the only thread; else the stream lock, so a `flockfile` holder is waited for), and room in the open write window (`window_put`, unchanged: open only on a fully buffered stream that is writing, so line-buffered and unbuffered streams, reading, a full window and every memory or cookie stream whose window is closed go the general way and keep its flushes). Anything else returns to today's path unchanged, out of line. Answers and side effects are the general path's (`window_put` was already its first step). Tests: `front_corners` in the putc/fputs/fwrite forms (a wide stream with an open window, line-buffered, fully buffered), the open-window precondition of the lock checks, `conformance/c/s12_stdio_front.c` (the single-threaded case). **P5b (2026-10-07, owner-approved scope): cheaper checks and a validated record.** (1) *Window-closed invariant*: `store` publishes an open write window only on a byte-oriented stream that is writing (fully buffered, as before); in every other state (not set up: words 0; undecided or wide orientation; idle, reading, line-buffered, unbuffered, read-only, closed) `_IO_write_ptr == _IO_write_end`. `store` is the only writer of `_IO_write_end`, so every transition (open/`setup`, `freopen`, `fwide`/first wide or byte output, `setvbuf`, repositioning, reading, flush, close) goes through it; the wide layer's bytes use the engine's window (`state.wend`) inside the operations and move both published words together. So the front path's first test `ptr < end` (room for the data) replaces the set-up, orientation, role and buffer-null checks. The general path is `#[cold]` out of line. (2) *Bounds*: `ptr - buf < len` on the record's buffer (one subtract and compare, wrapping, through the slice check) instead of power-of-two buffers: the same cost as a mask test with no alignment padding, so zero memory; decided locally (P5b report). (3) *The record is validated* (owner ruling 2026-10-07). P5 finding: neither path validated `_codecvt` or `_lock`; both trusted the words as the library stored them, so a crafted `FILE` naming a fake record (its own `buf`) steered writes through the front path and the general path alike; P5's slice bound only held for corrupted window words over a genuine record. Now every slot holds a *seal* in the word before its record: the address of the `FILE` the record serves xor the pointer guard (`ThreadBlock::pointer_guard`, read with one `%fs`-relative load), written when the slot is handed out (`new_slot`) or bound to a standard stream (`set_up_standard`). `Env::record` (behind `stdio_compat::parts`, which every operation, `with`, the front path, `flush_all` and `close_every` use) accepts `_codecvt` only if it is 8-aligned and its seal equals `fp ^ guard`; the lock is then the record's slot neighbour, so the `_lock` word is no longer consulted (it keeps its meaning and value). Anything else is not a stream: `EBADF` (EOF), nothing written. **What a corrupted `FILE` can and cannot do**: it cannot make the library write anywhere but the record, lock and buffer of a stream the library opened *for that same `FILE` address* (a fake record, or another stream's genuine record, is refused by both paths and skipped by the flushes at `exit`); with its genuine record, corrupted window words move bytes only inside that stream's own buffer (front: `ptr - buf < len`; general: `load` clamps). It can: crash the process (a wild `_codecvt` is read, never written, before the check); garble its own stream's buffered data or indicators; get bytes through the front path after the program itself writes `_mode` or the window words; and a party that can read the process's memory (the pointer guard, or any seal with its `FILE` address) can forge a seal, the same bound as `setjmp`'s pointer mangling. Header-inline `putc`/`getc` in C code use the window words directly, outside any library check. Cost: one word per stream slot, no per-thread cost. Tests: `window_states` and `front_crafted` (in `front_corners`, all three forms). STDIO-HOT (2026-10-09): `vfprintf` holds the engine's write window for the whole call (`stdio_compat::Window`: the conditions and bounds of `window_put`, checked once at open; the buffer slice bound stays on every piece); `_IO_write_ptr` is published before every general write and at the end, and the window reopens after it (closed after an error). The unbuffered stage is passed by reference (no 128-byte move per call). `putc_c`: the fputc family's slow cases are one tail call (no frame on the front path); `alone()` is tested before the flags word (one thread: the flags are not loaded). Seal check unchanged. **STDIO-2 (2026-10-09): the read front path.** `fgetc`/`getc`/`getchar` and their `_unlocked` forms (not `__uflow`/`__underflow`) first try `stdio::read_front`: published `_IO_read_ptr < _IO_read_end`, then the sealed record (`Env::record`, unchanged owner ruling), then the lock decision as for output (`_unlocked` / `alone()` / `by_caller`, else `getc_locked` re-reads everything under the lock), then `sc::get_front`: `_mode < 0` (byte-oriented; the read window is not kept closed on wide streams, so the orientation is tested here - one load), the byte's offset below the engine's own `state.rend` and inside the buffer slice, then `_IO_read_ptr += 1`. The engine's window holds pushed-back bytes (`ungetc` moves `rpos` back and publishes it), a byte in the window never flushes line-buffered streams (`input_flushes` needs `rpos >= rend`) and changes no indicator, and every general operation re-reads `_IO_read_ptr` (`load`), so the answers stay the engine's. Anything else falls to the unchanged general path (`getc_general`, `#[cold]`); the export's C result comes from a tail-called `getc_slow`. Tests: `read_front`/`read_crafted` in s12_stdio_symbols (every getc form) and `getc_window` (checks 110-117) in conformance/c/s12_stdio_front.c. STDIO-FGETS (2026-10-10): `fgets` takes the line from the read window in pieces (`State::read_line_into`: the vector `memchr` finds the newline, one copy per window, one engine run per window instead of one per byte); a stream that is not fully buffered reads one window per run, so the line-buffered streams are still flushed before every read of the backing. Tests: `fgets_pieces` in s12_stdio_symbols. **GETC-PUTC-FASTPATH (owner ruling 2026-10-24, #1654): validation at the buffer boundaries.** Principle: the library is a helper, not a security boundary; it keeps its own code safe and keeps a program from causing wider harm, and a program shares responsibility for its own memory, so checks that only catch a program corrupting its own `FILE` belong where a buffer is filled or flushed, not on every byte. Now: `getc`/`fgetc`/`getchar`/`putc`/`fputc`/`putchar` (and the `_unlocked` forms) with no lock to take (`_unlocked`, `alone()`, `FSETLOCKING_BYCALLER`) test only `ptr < end` on the published window, then read or store the one byte at `ptr` and advance it, as header-inline `getc`/`putc` do (`tb::window_byte`/`window_set_byte`, category *slice*). The seal, the buffer bounds and the orientation are checked where the window is opened: the refill (`getc_refill`/`refill`, the general path through `with`) and the flush or setup that opens the write window (`store` inside `with`), and for the locked forms at lock time (`getc_lock_c`/`putc_lock_c`, unchanged). `store` now publishes the read window bounded by the buffer (`rpos <= rend <= buf_len`) and closed (`_IO_read_ptr == _IO_read_end`, at `rpos`, which `load` reads back) on any stream not byte-oriented, mirroring the write window, so a wide stream never takes the byte path; the write window is bounded by the buffer likewise. No longer checked per call on those paths: the record's seal, the `_mode` orientation word, and the byte's offset within the buffer and below the engine's `rend`. Consequence: a program that rewrites its own `FILE`'s window words (or passes a copy of a `FILE` with an open window) has bytes read from or written to the memory those words name, exactly as with header-inline `getc`/`putc`; a closed, foreign or crafted `FILE` with an empty or closed window is refused (`EBADF`) at the refill or flush, as before. `fputs`/`fwrite`/`fgets`/`fread` front paths are unchanged (still checked per call). Tests: `read_crafted`/`front_crafted` (trusted forms: the program's window followed; boundary cases refused), the wide and unbuffered read-window checks in `read_front`.
'''
