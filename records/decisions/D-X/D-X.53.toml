body = '''
**Start-up page-fault bounds are the count plus at most 1; every dead hot-text key fails `so` unless allow-listed; start-up state words share `.data1`** (STARTUP-FAULTS-RESTORE, 2026-11-10; owner ruling #4079, 11-07; layout and test policy only, no ABI or behaviour change; extends D-X.22, D-X.47). (1) Bounds: each page-fault bound in `crates/core/tests/hot_text_products.rs` is the count measured after the change plus at most 1 (runs are deterministic under `setarch -R`), and it is lowered whenever a count falls; it is never raised to fit a change (a change that needs a higher bound is a ruling, not an edit). (2) Dead keys: in a fast or release products build, every key of `crates/libc-so/hot-text.list` must match a function section, whatever its tier (D-X.47 guarded only start-up and fork keys). The exceptions are a key whose trace names only the other profile and a line of `crates/libc-so/hot-text.absent` (`<key>\t<profile>\t<reason>`, the reason required); an allow line whose key now matches or is no longer listed also fails. `so` writes `target/product/<profile>/hot-text.matched`, and `tools/hottext/prune.py` drops keys that no profile matches (75 dropped at this change; 27 keys the release build inlines are allow-listed). (3) State: `xtask/src/coldbss.rs::move_startup_state` (the D-X.22 renaming mechanism) renames the sections of the small statics that start-up first-writes (`process::AUXV_WORDS`, `sys::SYSINFO_EHDR`, `cpu::AVX2_ERMS_{FROM,TO}`, `global_locale::{GLOBAL,LOCK}`) to `.data1`, which the linker places after `.data` next to `.bss`, and `scan.S` puts `scan_level` there; each listed static must be found exactly once or `so` fails. A structural check, `init_startup_path_lies_in_the_hot_text_range`, links a test program with a map and requires `_start`, `__libc_start_main`, `start::<false>` (and `apply_irelative`, `liella_rt::start::program` when out of line) inside the `.text.startup*` + `.text.sorted.h*` range. \| Zen 1 host (60 vCPU), kit static `printf '%s %d %x\n' a 1 1`, `setarch -R`, warm-up + 5 runs, every run identical: 62 -> 61 page faults (.data 4 -> 3, .bss 3, .text 9). `hot_text_products.rs` counts: startup 17, setlocale+printf 56, tool 59, fork child 7; bounds 18 / 57 / 60 / 8 (fork lowered from 9 by this rule). Skylake-SP host, same test: the same counts, 17 / 56 / 59 / 7. `validation/wl_count.sh` against main (Skylake-SP host), page faults main -> this change: printf-loop 1258745 -> 1240079, seq 126 -> 123, wc 264 -> 259, md5sum 146 -> 144; instructions:u and gating syscalls within 0.01%, output the same. NEGATIVE: moving further statics (`cpu` COPY_MIN/FILL_MIN/ERMS_LARGE_FROM, `fold.S` cmp_sse, `global_locale::MAPS`) to `.data1` left the count at 61: the freed pages got other first writers, so a hand-kept symbol list does not converge; the next step is a trace-generated placement. Plants in `handoff/STARTUP-FAULTS-RESTORE-plants.txt`. (4) Every profile and gate pass (STARTUP-FAULTS-RESTORE-4): CI's red at count + 1 (setlocale + printf 58, tool 61) came from the gate's second test pass, which interposes Liella's exports on the test process, not from the product profile (the gate builds fast products only). The whole-process modes counted the faults the spawned process took in the spawner's code before exec, so the same products read one more in that pass (Haswell-EP host: 17 / 57 / 60 and 18 / 58 / 61). `page_faults.c` now runs every mode as `relay <mode>`: it vforks and execs itself with raw system calls (no library function the modes do not already link, since linking `vfork`, `execve`, `waitpid` and `getauxval` from libc.a moved the program's layout by +2), at the AT_EXECFN path with the same environment. Both passes now read the same counts, one lower. One bound per mode at the larger profile's count + 1, not per-profile bounds: the gate builds only the fast profile; release reads at most the fast count except float (4 against 2); a second calibrated value per mode would double the upkeep for a profile no gate measures. Counts fast / release, Haswell-EP host, every run identical, interposed or not: startup 16 / 15, setlocale + printf 56 / 56, tool 59 / 59, fork 7 / 6, localtime 19 / 19, float 2 / 4. Bounds TRUE 17, LOCALE 57, TOOL 60, FORK 7, LOCALTIME 20, FLOAT 5 (from 18 / 57 / 60 / 7 / 20 / 6). The same binaries read the same counts on Haswell-EP, Skylake-SP and Zen 1 hosts (measured without the relay: fast 17 / 57 / 60 / 7 / 19 / 2, release 16 / 57 / 60 / 6 / 19 / 4), and the products remap the build path, so the counts follow the tree, not the host. Plants in `handoff/STARTUP-FAULTS-RESTORE-4-plants.txt`. (5) Merged with next (STARTUP-FAULTS-RESTORE-5), relay harness, Skylake-SP host, both gate passes the same, fast / release: startup 17 / 15, setlocale + printf 53 / 54, tool 56 / 57, fork 7 / 6, localtime and localtime + mktime 20 / 19, float 2 / 4; next itself through the same harness: 18 / 16, 54 / 54, 57 / 57, 7 / 6, 19 / 19, 2 / 4. Bounds LOCALE 55, TOOL 58 (from 57 / 60); the other bounds stay, since a bound is never raised. The fast localtime window reads one more than next with the same whole-process count: the `.data` page that start-up first wrote through `sys::SYSINFO_EHDR` (now in `.data1`) is first written by `time::zone::NEXT_ID` inside the window. Two locale keys the merged fast build inlines were dropped with prune.py.
'''
