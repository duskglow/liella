story = "TB-FOREIGN-WORDS-LOW"
date = "2026-11-11"
body = '''
**The errno, dtor, heap-cache and node words at 0x80-0x9b of a thread block are Liella's only in a block the runtime made (as D-X.58 for 0x9c-0x17f); in a process another C library started, the thread's registry words (D-X.58) stand in for them, and the fast paths pay nothing for the test.** `__errno_location` is assembly (machine/tp.S, products with the runtime): a `cmpb` of the hidden byte `liella_machine_owned`, then thread pointer + 0x80; otherwise the thread's registry `errno` word, whose address is stable for the thread's life, so every read and write through it agrees (the per-thread errno address the x86-64 psABI and POSIX require). The heap folds the test into the malloc-debug flags word every C entry already tests: it starts with `FOREIGN` in every build and `thread::init_initial` clears it, so a path reached with the word clear uses `OwnPages` (the plain `%fs:0x90` load) and every other path uses `KernelPages`, which asks `owned()` first and reads the registry's cache word. A thread on the shared spare words (no memory for a registry entry) gets no heap cache (`Pages::cache_slot` is `None`), so two threads never share a cache. `thread_atexit` destructors and the NUMA node hint use `thread::words()`. The tid word (0x84) is unchanged: it is read only through D-X.58's gate or from listed, runtime-made blocks. Coordinator ruling #4835 (under #4779, at most +2 instructions per access, and #4655, keep the real check). Tests: crates/boundary/tests/tb_foreign_low_words.rs (garbage in 0x80-0x9b of the block another library made: errno round-trips, nothing written there, the heap takes the gated path); plants handoff/TB-FOREIGN-WORDS-LOW-plants.txt.
'''
