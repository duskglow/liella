id = "D-4.53"
section = "s04"
spec = "§4.1–4.3"
ann = "PERF"
status = "active"
body = '''
**One entry per CPU class: pre-built read-only pages, one swapped in at start-up, never written** (LOADTIME-ENTRY-DESIGN, -2, CLASSED-SLOT-INFRA; owner rulings #3069 option b and #3138-#3141; design `docs/design/loadtime-entry.md` sections 4-5). Entries with CPU-variant builds live in one page-aligned input section of two 4096-byte pages with the same slot layout (`csys/src/machine/fold.S`, `LIELLA_SLOT_*`; `.org` fails the build when a body outgrows its slot or page): page 0 holds the SSE2 bodies at the exported labels (correct on every x86-64, and what runs before start-up step 4), page 1 the AVX2 bodies, assembled for page 0's address (one GAS macro per body; every out-of-page PC-relative reference biased by +4096, `XREF`). At static step 4, after `cpu::init_with` and before the program's IFUNC resolvers and constructors, on a CPU whose `Features` report AVX2 with the YMM state saved and no `glibc.cpu.hwcaps=-AVX2` (`cpu::avx2_wanted`, read from `cpu::init_with`'s state: the start-up asks for no CPU features a second time), the start-up reads the two pages' `/proc/self/pagemap` entries and, if neither has become an anonymous (modified) page, runs `mremap(page1, 4096, 4096, MREMAP_MAYMOVE\|MREMAP_FIXED, page0)` (`crates/boundary/src/classed.rs`). No `/proc` or an unreadable pagemap keeps page 0 (#3140). Any refusal or failure keeps page 0 (SSE2); a failed `mremap` that leaves page 0 unmapped is retried once, then ends the process with a message. `liella.compat.no_classed_swap=1` (COMPAT-20, #3141) keeps page 0 for debugging. A program started by another `ld.so` keeps page 0. The `classed_id` slot (0 on page 0, 1 on page 1) reads back which page is live. No write to code, no gain of exec permission, no private memory, no per-call CPU test, no code pointer; cost on the AVX2 class about 4 system calls and +2 VMAs per process, none on SSE2 (#3139). First slot: `memset` (story 1), its two bodies today's minus the 129-256 flag test (page 0 SSE2 there, page 1 AVX2). Local detail: the section keeps the name `.text.liella_machine_memset` (not the design's `.text.liella_classed`) so the generated hot-text list still groups it with the start-up code; rename it when `tools/hottext/regen.sh` next runs with a later slot. Chosen over writing a patched private copy (M4: refused under `PR_SET_MDWE`, systemd `MemoryDenyWriteExecute=` and SELinux `execmod`), the D-4.25 flag (two instructions per call), IFUNC + RELRO (+1 instruction per static call), a patched `jmp` and a RELRO pointer. Amends D-4.25's mechanism for the entries moved. Tests: `crates/boundary/tests/classed_slots.rs` (both pages swept in forked children on every AVX2 host, the SSE2 page forced, COMPAT-20, the guard after a `/proc/self/mem` write, the swap under `PR_SET_MDWE`); `classed.rs` unit tests (failure injection, the class rule with forced `Features`). **Amended (CLASSED-SLOT-INFRA-6, coordinator ruling #3434, 2026-11-06): the swap is OFF by default.** #3139's count was met (4 system calls, +2 VMAs) but was necessary, not sufficient; measured cost of the AVX2-class swap in CLASSED-SLOT-INFRA-5 (merge-base -> swap on): Alder Lake-N class (booked, 3 rounds, alternating, medians, ns per start) `exec_true_static` 165,180 -> 188,892 (+14.4%), `exec_true_echo` 234,989 -> 260,970 (+11.1%), `exec_hello_locale` 355,505 -> 377,225 (+6.1%); Broadwell kernel instructions per start 195.5k -> 251.6k (+56k), user +168; `memset` 16/16_mix/64/64_mix/128 unchanged on that CPU (no gain to repay it). The infrastructure lands with the swap code kept and tested both ways: no setting, or `liella.compat.no_classed_swap=1`, keeps page 0 on every class; `=0` turns the swap on (`classed::SWAP_BY_DEFAULT = false`, `classed::swap_disabled`; COMPAT-20 keeps its id, and the default now matches glibc's behaviour). `conformance/c/s04_classed_memset.c` checks the default (SSE2 page), `=0` (AVX2 page on an AVX2 host), `=0` with `-AVX2`, `=1`, and the guard and `PR_SET_MDWE` cases with the swap on. With the swap off (Haswell, `perf stat -r 50` of the static start-up child, 8 rounds, order flipped): kernel instructions per start 199,390 (merge-base) -> 192,560 (-6.8k, every round lower), user +8, 2 fewer minor faults; `no_classed_swap=0` on the same build 282,894 kernel. Caveat: on the AVX2 class with the swap off, `memset` at 129-256 bytes runs page 0's SSE2 class (the merge-base tested the AVX2 flag there); no bench row covers that range yet. CLASSED-SLOT-SWAP-COST splits the swap's cost per system call and cuts it; the default flips on only by a later ruling with start-up timing within noise of no swap. **Amended (CLASSED-SLOT-SWAP-COST, "split the AVX2-class start-up swap's cost per call and cut it until it is free"): the cost split, the floor above the target, the default stays off.** A probe (a static program linked against Liella that runs each step itself on the real layout; kernel 6.8) counts kernel instructions in each call, Broadwell-EP / Zen 1: `openat("/proc/self/pagemap")` 17.8k / 18.2k, `pread` of 16 bytes 3.7k / 3.8k, `close` 1.9k / 2.0k, `mremap` 33.1k / 33.5k; no step takes a fault (both pages are present before the move and the moved entry is reused). Whole process (`perf stat -r 200`, 3 rounds): the guard alone +48k / +50k (half of it after the calls, at exit), the `mremap` alone +58k / +60k, both +96k / +97k; the real start-up, `no_classed_swap=0` against `=1`, +65.5k / +66.6k. Alder Lake-N: inside one start 15.2, 2.7, 1.1 and 15.4 us for the four calls; per `posix_spawn` + `waitpid` of the static program (the shape of `exec_true_static`, 7 alternating rounds, medians) 187.4 -> 216.7 us with the swap on (+29.3 us, +15.6%), the guard alone +16.7 us, the `mremap` alone +21.7 us. Ivy Bridge (SSE2 class): 541.2 against 541.6 us, no cost. Candidates measured: where the pair sits in its file VMA saves nothing (in-call `mremap` 29.6k at the head, 30.7k in the middle, 33.8k at the tail, 35.7k for a lone two-page VMA with no split, Zen 1), so the +2 VMAs are not the cost; pages never faulted in save 2.5k in the call and populating gains nothing (no fault is taken either way); there is no guard mapping to drop. Floor: changing what is mapped at page 0's address takes one VMA-changing call, and the cheapest measured on this kernel are `mprotect` 10.3k / 10.6k (cannot swap), `mmap(MAP_FIXED)` 20.3k / 20.5k (needs a descriptor of the file: one more `openat`), `munmap` 29.3k / 30.0k and `mremap` 30.5k / 30.7k (Broadwell-EP / Zen 1), all above the 5k target, so no page swap reaches it on this kernel. Not made: the guard as a user-space scan of both pages for int3 (`0xcc`) bytes (2.05k user instructions with SSE2, no kernel work; neither page holds such a byte today) would remove about 48k of the 96k but changes the guard ruled in #3140 and still leaves +44-60k (ruling asked in the story's hand-back); a lazy swap needs a per-call check or a signal. The default stays off (`SWAP_BY_DEFAULT = false`).
'''
