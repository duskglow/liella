body = '''
**`float` Bessel functions from 2^19 by a fixed-point phase and an exception table** (LIBM-F32-BESSEL-LARGE, ruling #4953; amends D-10.49's range). `j0f`, `j1f` for 2^19 ≤ \|x\| < 2^128 and `y0f`, `y1f` for 2^19 ≤ x < 2^128 no longer go to the multi-precision path (LIBM-TAIL-PROBE: 21-43% of `float` bit patterns at 1.67e5 to 2.87e5 instructions a call against 269 to 356 in the reference). Method: modulus and phase (DLMF 10.18.17-18, μ = 4n²): J_n = M cos θ, Y_n = M sin θ, M = √(2/(πx))·(1 + (μ - 1)/(16x²)), θ = x - (2n + 1)π/4 + (μ - 1)/(8x) + (μ - 1)(μ - 25)/(384x³); both follow from Hankel's P and Q (DLMF 10.17.3), whose remainders are bounded by the first neglected terms (DLMF 10.17(iii)): from 2^19 the dropped parts are below 2^-76 of M and 2^-90 of θ. The phase in quadrants, φ = x·2/π - (2n + 1)/2 + δ' (- 1 for Y), is formed exactly in fixed point by Payne and Hanek's reduction (Muller, Elementary Functions: Algorithms and Implementation, ch. 11): the 24-bit significand times the 128 bits of 2/π whose products with x are not multiples of 4 (the verified words of `coeffs::tables::TWO_OVER_PI`), a wrapping u128 product in units of 2^-126, with δ' = (2/π)[(μ - 1)/(8x) + (μ - 1)(μ - 25)/(384x³)] added at 2^-84. The top two bits are the quadrant and the rest g ∈ [-1/2, 1/2]; one Taylor polynomial of sin(πg/2)/g (k ≤ 8) or cos(πg/2) (k ≤ 9) in g² and one square root for M follow. Error budget in units of 2^-53 relative: g 1, π/2 0.35, the polynomial sums about 2.3, the coefficients below 1, M 2.28, the product 1, so LG_B = 8 (on the sine branch plus (3e-25 + 5u\|δ'\|)/\|g\| for the absolute error of g); `bessel_large_core_is_within_its_bound` measures at most 0.45 of the bound against 384-bit values. The bound goes into the usual rounding test. The operands it refuses (54 for `j0f`, 47 `j1f`, 44 `y0f`, 57 `y1f`) are answered from a sorted table of (\|x\|, nearest `float` F, side), found by an exhaustive enumeration of the band (`bessel_large_table_is_the_refused_set`, run with the long sweeps): the value is rebuilt as F ± 2^-28·F and rounded as usual, so every rounding mode and the inexact flag follow. No multi-precision path runs on the band (owner, 11-12: in `float` the exhaustive sweep is the proof, with an exception table). The test oracle (`oracle32::bessel_est`) covers the band with the same reduction in double-double and its own bits of 2/π from the 384-bit constant, independent of the fast path's table. The band is out of line (`#[inline(never)]`) and reached only after the fast path refused x, by one out-of-line call (`special::bessel32_rest`: the band, else the accurate path) in place of the accurate path's call, so no other operand tests for it: inlined, its registers widened the frame of every other band, and a test ahead of the fast path or a second call on its refusal path cost the mid and tiny rows 1 to 18 instructions a call (LIBM-F32-BESSEL-LARGE-2 and -3). Its table is one array of plain words with per-function offsets: an array of slices is pointers, which a position-independent build puts in writable `.data.rel.ro`, and that moved the start-up data's pages (`init_data_clusters_hold_at_every_text_phase`). Measured (instructions a call, `validation/percall/libm_bessel.c`, 64 operands geometric over the band): `j0f` 405.5, `j1f` 407, `y0f` 420, `y1f` 423.5, against 1.77e5 to 1.79e5 on next fe4c4893d and 292 to 318 in the reference (1.33 to 1.39 times); the mid and tiny rows equal next's (`j0f` mid 217.6, `y1f` mid 254.9, tiny 94.0, 119.7, 340.9, 313.6). Tests: `bessel_large_core_is_within_its_bound`, `bessel_large_taylor_coefficients`, `bessel_large_table_entries`, the enumeration and the four exhaustive oracle sweeps (`j0f_fast_path_agrees_exhaustively` and its three siblings); plants in handoff/LIBM-F32-BESSEL-LARGE-2-plants.txt.
'''
