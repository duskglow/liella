story = "HOTTEXT-TIME-CLUSTER-STABLE"
date = "2026-11-13"
tests = ["crates/core/tests/hot_text_products.rs::init_first_mktime_after_localtime_r_takes_no_fault", "crates/core/tests/hot_text_products.rs::init_first_localtime_r_and_mktime_stay_within_their_combined_page_fault_bound", "crates/core/tests/hot_text_products.rs::init_zero_fault_calls_hold_at_every_text_phase"]
body = '''
**A function on a 0-fault path that has no hot-text key of its own is `#[inline(always)]` into the keyed function that calls it** (HOTTEXT-TIME-CLUSTER-STABLE, under D-X.63 and the LAYOUT-HOTKEY-INLINE-STABLE pins). First case: `time_compat::select`'s lock-free path (`recheck::TscGate::fresh`, `recheck::tsc_holds`, `time_compat::Entry::zone`, `zone::Glue::entry_at`, `tb::zone_entry_at`). Why: task/libm-cplx-sincos-5 and task/libm-cplx-pow-5, each merged with next and built on one build host, failed the first-mktime fault tests at every pre/cold pad in the fast profile (mktime after localtime_r 0 -> 1, localtime_r + mktime 20 -> 21) with the time cluster byte-identical to next's (10 sections, 17,130 bytes, aligned 32 KiB). The one extra fault (perf page-faults, mktime mode against localtime mode) was an out-of-line copy of `TscGate::fresh` instantiated for `select`'s closure: the fast profile (thin LTO, 16 codegen units) stopped inlining it when unrelated libm code grew, and a copy with no key lands in cold text. The release build of the same trees inlined it and passed. So the cause was not a cluster boundary inlined away (a boundary key that vanishes fails the plain `so` through the dead-key check, D-X.56, and the cluster range comes from list positions, not from the archive) but a function outlined that no key names. `#[inline(always)]` takes that decision away from the compiler at no cost where it already inlined; `#[inline(never)]` with a new key would add a call to every `localtime_r`/`mktime`. Structural fix for the class: LT-1 (trace at build, D-X.84 proposal), which keys whatever the build being grouped executes. Plants: `#[inline(never)]` on `fresh`, `Entry::zone` or `Glue::entry_at` (handoff/HOTTEXT-TIME-CLUSTER-STABLE-plants.txt).
'''
