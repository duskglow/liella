body = '''
**First-zone-load state in the `.data1` cluster, a size-aligned relro section, start-up data keyed by access** (LAYOUT-DATA-CLUSTERS-3, 2026-11-11; extends D-X.64; layout and tooling only, no symbol, ABI or behaviour change). (1) `time::zone::NEXT_ID` (4 bytes, by key suffix) and `__tzname` (16 bytes, by section name `.data.rel.local.__tzname`) join the `.data1` cluster (`xtask/src/coldbss.rs`): both are written by the first zone load; a perf page-fault map of the first localtime_r (fast products, head vs origin/next, same build host) showed text 4 = 4 and heap 14 = 14 faults, and one extra data fault, `__tzname`, which on next was the last `.data` object and shared the cluster's first page, and after the cluster alignment sat alone on a page (20 -> 21). (2) The start object aligns the `.data.rel.ro` output section to the smallest power of two not below the archive's relro bytes (4 KiB..64 KiB, `startup_ro::cluster_aligns`, `LIELLA_RELRO_ALIGN` in entry.S), so the relro objects start-up reads share one 64 KiB fault-around window whatever text and read-only data precede them (release products: a 28 KiB relro across a window boundary cost tool and setlocale a second window). Cost: up to the alignment in zero file bytes before the relro section. (3) `tools/hottext/startup_data.py` also traces a second link of the probe whose `.data`, `.data1`, `.bss` and `.lbss` output sections carry `SUBALIGN(65536)` (GNU ld's default script, `ld --verbose`), so every writable object start-up reads or writes faults at its own address and gets a key, not only the first object on each page (#4602: `__libc_single_threaded`, `_IO_2_1_stdout_`). Objects sharing one input section still count once. Fault bounds unchanged (owner re-derivation, #4348).
'''
