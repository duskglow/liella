body = '''
**`bench --compare --rows` reuses CBENCH_ROWS; `bench --stage --base <ref>` stages the base tree from a temporary worktree** (XTASK-BENCH-ROWS-BASE, 2026-11-06; decided locally, tooling only, no product code). (1) `--compare --rows` items are `row` (applies to every compared bench), `bench/row` or a glob (`*`, `?`); each bench gets one `CBENCH_ROWS` list, set by the one command builder that every build of the comparison uses, so both sides skip the same rows. The row list comes from the bench binary itself, not `bench/budgets.tsv`: many rows have no budget line and macros build row names (`ROW("memchr", ...)` gives `memchr_16`), so neither the table nor the source can list them. The Liella warm-up round proves that every selected row was printed. A missing row is an error that lists the bench's rows from one unfiltered Liella run. That run happens only on this error and for glob expansion, so a filtered compare costs no extra run. Rows printed outside the filter are left out of the table, and xtask names them. (2) `--stage <out> --base <ref>` runs the same command without `--base` in a detached worktree of `<ref>` under `target/bench-base/<pid>`, staging to `<stem>.base.tar`. A drop guard removes the worktree and prunes it on success, error and panic. Each manifest records its own commit, and the output names both. The base is built in its own `target/` from scratch, with no shared cache: cost against isolation, isolation chosen. Tests: `compare_rows_*`, `base_run_forwards_the_command_without_base`, `stage_base_*` (xtask); plants `handoff/XTASK-BENCH-ROWS-BASE-plants.txt`.
'''
