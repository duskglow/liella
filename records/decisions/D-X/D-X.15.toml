status = "active"
body = '''
**Direct internal copies** (owner ruling 2026-10-05). The library's own memory copies and fills (the `memcpy`, `memset` and `memmove` calls rustc emits for slice copies, struct moves and fills, and the C layer's internal ones) bind directly to an internal, non-exported entry that skips the C-contract checks of the exported functions: the callers are library code whose bounds Rust already checked. Measured by PERF-REGRESS (Haswell-EP, 2026-10-05): today each such call is an indirect GOT call (`R_X86_64_GOTPCREL`, which the linker cannot relax) into the exported entry (`__liella_libc_memcpy` in `libc.a`, `memcpy` in `libc.so.6`) and its checks (`conv::move_units`), 12-16% of `snprintf` and `wordexp` time. The exported `memcpy`, `memset`, `memmove` and their checks are unchanged for programs. With D-X.14 the library's references already go to its own renamed functions, so a program's override of these names was never reached from inside the library; this ruling changes which of the library's entries they reach (and in `libc.so.6` makes the binding direct, as phase 14's `-Bsymbolic`-style binding intends). The replaceable allocator is not affected (D-X.14 (3)). **Mechanism (task INTERNAL-COPY, 2026-10-06):** the boundary crate defines the check-free entries `liella_internal_memcpy`, `liella_internal_memmove` and `liella_internal_memset` (`crates/boundary/src/conv.rs`, defined through the `internal_entry!` macro of `export.rs`: the exported bodies after their checks, `conv::move_regions`; overlap stays correct because LLVM may copy a value onto itself). `cargo xtask so` edits the archive rustc built, before both products are made from it (`xtask/src/copies.rs`): in the LTO object, every relocation naming `memcpy`, `memmove` or `memset` on a call, a jump or a load of the call target from the GOT (LLVM hoisting the target out of a loop; the library's source never takes these functions' addresses) gets the internal entry's symbol index; members that only reference the names (the C layer, `compiler_builtins`) get the undefined symbol renamed if all their uses are of those kinds; any other use is left and counted (none today). Those GOT relocations become `R_X86_64_GOTPCRELX`/`R_X86_64_REX_GOTPCRELX` (the same relocation, which stable rustc never emits), so the linker turns them into direct calls and `lea`s: in a static link, and in `libc.so.6`, whose version script keeps every `liella_` name local. **Generalised (task PJ-19, 2026-10-06; decided locally):** step 3 marks every `R_X86_64_GOTPCREL` on a call, jump or GOT load the opcode check recognises, whatever symbol it names (the relocation C compilers emit for those instructions; the linker still goes through the GOT for a name a program may interpose, so no binding changes): in `libc.so.6` the indirect `call/jmp *GOT` fell from 5798 to 47, all to exported names (`bcmp` 34, the allocator, stdio), the 1736 calls to `liella_machine_tp` among those made direct; GOT uses on other instructions (9) are left and counted. The pass refuses an internal entry that calls an internal entry or a replaced name (recursion, D-4.11). No exported symbol, version or behaviour changes; in `libc.a` the entries are renamed like every function (D-X.14). Tested by `conformance/c/x_overrides.c` (the program also defines counting `memcpy`, `memmove` and `memset`: long copies and fills inside the library never reach them, its own calls do) and unit tests of the pass and the entries; relocation counts and timings: `liella-historic:handoff/internal-copy-report.md`. Not covered: `libm.so.6`/`libm.a` (their own copies of library code are built separately). **Short copies (task PJ-20, 2026-10-07; decided locally):** library call sites with a run-time length use `liella::mem::copy`/`fill` (exactly `copy_from_slice`/`fill`): up to 32 bytes (`mem::SMALL`) two overlapping fixed-size pieces chosen by a chain of comparisons, inline, no call; longer ones the internal entries. `InlineVec::extend_from_slice`'s inline case is inlined into its callers with the same short copy; terminator stores are indexed stores (vsnprintf's NUL was `memset(p, 0, p != NULL)`); the float formatter hands digits to its sink in runs of up to 32, not one call per digit (a failing `gcvt` destination may then hold fewer partial bytes; the result is the same). The internal entries are unchanged: the `mem::` short paths may lower to `memcpy`/`memset` calls in an unoptimised build, which under the exports would recurse (D-4.11; seen as a SIGSEGV in the exports-interposed debug tests); inlining `move_regions` into them was tried and dropped (no gain on the rows measured). No unsafe added; tests at every length 0..64/96 with overlaps (`mem`, `bytes`, `conv` unit tests). Numbers: `liella-historic:handoff/smallcopy.md`. Amendment COPY-INTERNAL (2026-10-10, decided locally): the internal copy takes the export's kernel class at every size - 1-128 `hot::move_small`, 129 B-64 KiB `hot::internal_large` (AVX2 move when the kernel flag is set; before the startup decision and without AVX2 the SSE2 move, or `rep movsb` by `fallback_move`), no NULL tests (n > 0 gives valid regions); above 64 KiB `conv::copy_units`, whose non-ERMS fallback is now the AVX2/SSE2 copy instead of the byte loops (Zen 1: 64 KiB + 1 39,129 -> 5,802 instr). Zen 1 instr/call at 144 B: 141 -> 85 (export 96, glibc 41). Safety: small_copy movers + the internal-vs-memcpy sweep (0-300, 4 KiB/64 KiB, all alignments mod 32, each build, ERMS on/off); planted wrong tail red.
'''
