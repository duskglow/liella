body = '''
**`affected` runs the self-tests of a changed `validation/` workload script** (GATE-VALIDATION-SH-TESTS, 2026-11-07; decided locally, tooling only, no product code). `xtask/src/affected.rs` maps each covered script to its self-tests (`VALIDATION_COVERED`: `wl_syscls.sh` -> `wl_run_test.sh`, `wl_stats_test.sh`, `wl_mtmem_test.sh`; `wl_stats.sh` -> the last two; `wl_run.sh` -> `wl_run_test.sh`; `wl_count_run.sh` -> `wl_stats_test.sh`; each self-test -> itself). A change to one of them runs those self-tests (`bash <path>` from the root) in the direct and wide tiers, without escalating to FULL; the FULL tier of `affected` runs all three after `cargo xtask test`. Every other `validation/wl_*.sh` script is listed in `VALIDATION_UNCOVERED` with why it has no gate self-test (lab drivers, host sides that need built kits, `wl_percall_tunables_test.sh` as a lab count job); the unit test `every_validation_wl_script_is_mapped` fails for a script in neither table or a table path that does not exist. Why: a change to the script that decides workload verdicts selected nothing (WL-PIPE-READS-ADVISORY). Cost: 0.05 s, 0.2 s and about 15 s (the real `strace` runs of `wl_mtmem_test.sh`, which skips with a message when `strace` or `sort --parallel` is absent). Tests: `every_validation_wl_script_is_mapped`, `validation_script_changes_select_their_self_tests` (xtask); plants `handoff/GATE-VALIDATION-SH-TESTS-plants.txt`.
'''
