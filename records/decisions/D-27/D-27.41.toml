body = '''
**`dlsym` and `dlvsym` in `ld.so` (phase 14 DL-16b, stories DL-DLSYM and -2; plan/ph14/dl-16-dlopen.md §2 and §8; spec/behaviour/dynlink.md "Symbol binding", probes P-3..P-6; owner ruling #5127; coordinator ruling #5264; implements D-27.32).** (1) **Entry:** libc.so.6 exports `dlsym` and `dlvsym` (`GLIBC_2.34`, with the `GLIBC_2.2.5` compatibility aliases); a frame-free entry passes the caller's return address to the loader's `dlsym` through `StartInfo`. libc.a's entries fail with NULL and the text `dlsym: no symbols can be looked up in a statically linked program` (or `dlvsym: ...`), never a crash (D-27.33, #5264). (2) **Scopes:** `RTLD_DEFAULT` searches the global scope, then, for a caller loaded by `dlopen`, the local scope it was relocated with, objects not already searched (#5127, P-5); `RTLD_NEXT` searches the objects after the caller in the scope it was loaded with (the global scope for a start-time caller, its root's local scope for a `dlopen`ed one); a handle searches its object's local scope (itself, then its dependencies breadth-first); the program's handle (`dlopen(NULL)`) searches the global scope. `RTLD_DEEPBIND` puts an object's local scope before the global scope in its own relocations, each object once. (3) **Answers:** `dlsym` accepts a base or default definition and `dlvsym` exactly the named version (D-27.11 as amended by this story's second record); an `STB_GNU_UNIQUE` definition goes through the namespace's unique table (an entry there, else the start's binding: the first unique definition in the start's global scope), and the answer pins its definer (`nodelete`); an IFUNC answers its resolver's result, the resolver called after the loader's borrow ends; an `STT_TLS` symbol of a start-time object answers the calling thread's address (thread pointer + the object's static TLS offset + the symbol's value). (4) **Handles** are checked by one range test over the object records (D-27.32); anything else is refused with `dlsym: invalid handle` (`dlvsym: invalid handle`) and never dereferenced. (5) **Texts:** `<object>: undefined symbol: <name>[, version <v>]`, the object being the handle's, or the caller's for the special handles (the program by `argv[0]`, a start-time object by its path, a `dlopen`ed one by the path it was opened with); a successful call clears the calling thread's pending text (#5127). (6) **Lock:** the call takes the loader's re-entrant writer lock (a constructor may call `dlsym`; a unique binding records a table entry) until DL-16c gives lookups lock-free readers (plan §4). Measured: no instruction-count row covers `dlsym` yet; no start-up code changed.
'''
