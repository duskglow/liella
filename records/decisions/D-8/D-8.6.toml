id = "D-8.6"
section = "s08"
spec = "§8.6"
ann = "ARB"
status = "active"
body = '''
`abs(INT_MIN)` returns `INT_MIN` (defined wrap), and `div` by zero or `INT_MIN / -1` aborts with a diagnostic (S4; observable, defined instead of UB). Internally, `unsigned_abs` and checked `div` return `Result`.
'''
