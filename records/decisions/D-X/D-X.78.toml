body = '''
**The hot-list regen of both profiles builds only what its traces link, traces in parallel and checks by regrouping (`tools/hottext/regen.sh . --both`).** Its outputs are byte-identical to the one-profile `--build` path's on the same tree, both profiles (handoff/HOTLIST-REGEN-CHEAP.md, handoff/HOTLIST-REGEN-CHEAP-2.md). `cargo xtask so --hottext-regen --libc-only <dir>` builds `libc.a` and `liella-crt1.o` exactly as `so` does (step 1 and the start object) into `target/product/regen/<profile>`, never `target/liella`, and keeps the archive as the grouping received it (`hot-text.pre-group.a`). The traces of one profile run at once (`HOTTEXT_JOBS`, default all CPUs); each keeps its number, so the merge reads them in the fixed probe order and the lists do not depend on which trace ends first. The profiles run fast, then release, as before: build, trace, merge. The release products are built after the fast merge, from the lists it wrote, as the one-profile path builds them (HOTLIST-REGEN-CHEAP-2, ruling #5093). A release build made ahead of that merge is never the one traced: merge.py puts the new trace's first-touch order first, and the fast and release orders differ. So the fast merge reorders the lists even when the regen ends where it started (on 9b2a0c029: 13 hot-text.list lines and 4 startup-text keys reordered, with the same key set and profile columns), and the release build depends on that order. Through `LIELLA_BUILD_TAG`, a content hash of `crates/`, every change of a list's bytes also recompiles the crates that embed the tag. File mtimes play no part. The trace runner is `tools/hottext/runner.sh`, shared by regen.sh and probe_text.sh and tested with a fake tracer that requires the traces of a run to overlap (xtask hottext tests). A list or keys file is rewritten only when its bytes change. The closing check is `cargo xtask hottext-recheck`: the grouping, its cluster check and the dead-key check (enforced) rerun on each profile's saved archive with the rewritten list, in place of a second full `so` (its libc.so.6, libm, ld.so and layout check are the gate's own `so`). Why: one regen cost 19 to 29 min, 79% of it four full product builds (HOTLIST-TRAIN-REGEN).
'''
