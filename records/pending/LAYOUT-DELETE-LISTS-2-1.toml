body = '''
**The committed start-up lists and their machinery are deleted; every build, measurement builds included, groups from a trace of itself** (LAYOUT-DELETE-LISTS, LT-5 of `plan/layout-rethink.md`, rulings #5190-#5194 and #5463; layout and build tooling only, no ABI or behaviour change; amends D-X.92, D-X.56, D-X.53 and retires the list machinery of D-X.82 (train-owned lists), D-X.86 (dead-key warning) and D-X.87, whose tests went with it). (1) Gone from the tree: `crates/libc-so/hot-text.list`, `startup-text.keys`, `probe-text.keys`, `startup-data.keys`, `hot-text.absent`, `hot-text.unpinned`; `tools/hottext/merge.py` and `prune.py`; the dead-key check and its allow-list, the pin check (`check_pinned`), `hottext-repair`, `hottext-recheck`, `cargo xtask hot-lists` and the regen build flags of `so`; and the `LIELLA_LAYOUT_TRACE=0` committed-lists mode (now an error naming LT-5). Kept: `startup-state.list` (D-X.64), `hot-text.clusters` and `hot-text.first-window` (hand-written inputs, until LT-2). (2) The lists exist only under `target/product/<profile>`, written by `tools/hottext/regen.sh --products <dir>` from the trace `cargo xtask so` runs (one trace, ordered by the new `tools/hottext/order.py`; nothing merged with an earlier list, so no function name crosses a build). Readers (the grouping, the start-up read-only group, the layout contracts, `crates/core/tests/hot_text_products.rs`) read the directory this process's build set or the one the products' `.hot-lists` marker names, and fail without one; `layout/contracts.tsv` names its key lists bare (`keys=startup-text.keys`), and the old `crates/libc-so/<list>` path is refused by name. (3) Anti-creep: `cargo xtask static` (`hottext` check) refuses any tracked file named like a retired list, wherever it sits. (4) Ruling #5463: the bench v3 measurement build (`bench --compare --v3`) is traced like every product, so timing measures the layout that ships; only when the build host cannot run x86-64-v3 code (the tracer executes the probes linked against the v3 archive) does it fall back to an ungrouped layout, and then the bench output says `liella_v3 layout: UNGROUPED: ...` in so many words (recorded in `target/liella-v3/layout.txt`). (5) The `#[inline(never)]` pins added only so a list key would survive are no longer required by any check; they stay as they are until a per-row instruction measurement against next shows unpinning makes no start-up row slower and keeps the fault and window bounds (ALWAYS FORWARD); none was removed here. The bounds are unchanged.
'''
