body = '''
**Revised 2026-10-21 (OD-6 revised, CALLBACK-UNWIND).** A C++ exception (or forced unwind) thrown by a callback of `qsort`, `qsort_r`, `bsearch`, `lfind`, `lsearch`, `tsearch`, `tfind`, `tdelete`, `twalk`, `twalk_r`, `tdestroy`, `ftw`/`ftw64`, `nftw`/`nftw64`, `scandir`/`scandir64`/`scandirat`/`scandirat64` or `fts_open`'s comparator reaches the C caller, as in glibc. Mechanism: those callback types are plain `extern "C"` (`abi::callback`; as `"C-unwind"` types a `panic = "abort"` build gives each call a terminate landing pad, and the throw aborts), so the library's Rust frames carry no landing pads and the unwinder passes them by call-frame information alone; this is the same reliance `dl_iterate_phdr`, signal handlers, `fopencookie` and `atexit` handlers already had, checked on every product build by `crates/core/tests/cxx_throw_products.rs`. Where the library holds state across a callback, the work runs in `machine/guard.S`'s frame (`s22_threads::guarded`), whose personality runs an undo routine in the cleanup phase: `qsort` puts the elements a buffered merge holds back into the array and frees its heap buffer; `ftw`/`nftw` close their directories and undo `FTW_CHDIR`; `scandir` closes the directory and frees the entries kept so far. The tree functions compare before they change anything (no undo needed, the tree stays valid). Deliberate differences: glibc 2.39 leaves `qsort`'s buffer and `scandir`'s entries allocated, the walk's directories open and the working directory changed; Liella gives them back. Gaps: a walk's own small heap blocks (path buffer, visited set) and `fts`'s sort buffer leak on a throw; the `glob` callbacks stay `"C-unwind"` (a throw from them aborts, until `glob` has an undo).
'''
