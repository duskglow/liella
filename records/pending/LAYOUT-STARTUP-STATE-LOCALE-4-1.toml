body = '''
**The declared start-up state is linked in the order of `crates/libc-so/startup-state.list`** (LAYOUT-STARTUP-STATE-LOCALE to -4, 2026-11-12; ruling #4923; amends D-X.70, which fixed the members but not their order; layout only, no symbol, no behaviour change). `xtask/src/coldbss.rs` reorders each archive member's section table so that the renamed start-up sections follow the list (list position, then section name for the split parts of one static), and each section's relocation sections move with it (`order_sections`): objcopy and ld read the object through BFD, which takes a relocated section at its relocation section's slot. The rename runs after the copies pass's `ld -r` join (`xtask/src/so.rs`), since that join merges every `.data1` input in codegen-unit order. Why: the library's Rust code is one LTO object whose compiler emitted the same statics in an order that changed with any code change anywhere, so the `.data1` pages held different objects from build to build and the start-up probes' fault counts moved with unrelated changes (tool 54 to 55 at 9 of the pads measured). In list order the cluster's page split depends only on the list and the objects' sizes. Options weighed: (A) leave the order to the compiler and widen the probe bounds, rejected (the counts moved by unrelated code, ALWAYS FORWARD forbids loosening the bounds); (B) a linker script naming each object, rejected (a second link input to keep in step with the list, and the static archive is linked by users' own scripts); (C) reorder the section table in the build, adopted. Measured with the first-call cluster (the companion record), Zen 1 host, both profiles, 21 pads of text, cold, `.data`, `.bss` and `.lbss`: `true` equal to next at every pad, setlocale + printf 1 to 2 faults lower and the coreutils-shaped tool 2 to 3 lower, every other start-up probe equal (sums over the pads, fast: locale 957 to 934, tool 1033 to 991; release: 974 to 951, 1050 to 1008). `init_startup_state_follows_the_declared_order` checks the linked order against the list.
'''
