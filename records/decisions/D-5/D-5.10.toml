story = "WCTYPE-TRIE-FILE"
date = "2026-11-10"
body = '''
**A compiled `LC_CTYPE`'s class-word table is resolved block by block on first use** (WCTYPE-RETHINK proposal 2, coordinator ruling #3876 design A; WCTYPE-TRIE-FILE; extends D-5.9 to file-backed locales). One type, `locale::classes::ClassTable`, serves every locale: stage 1 is 4352 `AtomicU32` (block `c >> 8`; the values fit in 16 bits, but a 16-bit atomic load cost a separate zero extension on every test, WCTYPE-TRIE-FILE-2; 17 KiB per table, the whole BMP and planes 1-3 in its first page): 0 = not resolved, `1..=148` = built-in leaf `v - 1` (the D-5.9 `LEAVES`), `0x8000 + k` = leaf `k` of a process-wide pool of 256 leaves (`.bss`, shared by all compiled locales: a leaf is a pure function of its words), `0xffff` = no leaf (pool full: every test walks the file). The built-in tables are statics built at compile time from the generated `u8` stage 1. A compiled view takes one of 16 `.bss` tables when it is built (no page touched until a wide class test); a view without a slot walks the file every call. A miss computes the block's 256 words from the file's class tables (`w_classes_file`), looks for an equal built-in leaf, else an equal or new pool leaf (written, then its ready flag Release), and publishes the stage-1 value with a Release compare-exchange (a losing racer keeps the winner's value; both are the same words); readers load it Acquire. Locale-defined classes keep the existing path; the Latin-1 cache keeps case maps and widths only. Eager build rejected (160-270 ms per locale, WCTYPE-RETHINK). Measured: en_US.UTF-8 and the system `C.utf8` file resolve all 4352 blocks to built-in leaves. Method: The Unicode Standard 15.1, ch. 5.1 (multistage tables). Proven by `file_class_tables_equal_the_file_walk` (every code point x 12 classes, both locales, shared and pool-only), `class_table_first_touch_race`, `walking_class_tables_equal_the_file_walk` and handoff/wctype-trie-file-plants.txt.
'''
