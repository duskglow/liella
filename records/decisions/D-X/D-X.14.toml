id = "D-X.14"
section = "x"
status = "active"
body = '''
**Overridable static library** (owner ruling 2026-10-05). `libc.a` exports its definitions as weak symbols, so a program's own strong definition wins (as with glibc's one-function objects). The library's other functions keep calling their own implementation, never a program's override, except where glibc documents the override (malloc replacement). Memory handed to the caller is allocated through the replaceable `malloc` family symbols, so a program replacing malloc frees it consistently; the same holds for preloaded allocators in phase 14. Tested by a program that defines its own copies of commonly overridden functions. **Mechanism (ledger thread, 2026-10-05):** `cargo xtask so` post-processes the archive rustc builds (`weaken_archive` in `xtask/src/so.rs`); `libc.so.6` is still linked from the unprocessed archive. (1) Every global function of every member except the replaceable allocator is renamed `__liella_libc_<name>` in its definition and in every reference in every member (`objcopy --redefine-syms`), and a weak alias `<name>` is added at the same place (`objcopy --add-symbol`): a program's strong definition of the name wins without a "multiple definition" error, and the library's own calls keep going to the library's function, because they no longer name `<name>`. (2) Data symbols are made weak in place, so a program that defines one (a documented hook such as `obstack_alloc_failed_handler`, argp's variables) shares it with the library. (3) The replaceable allocator, as the GNU C Library manual's "Replacing malloc" lists it (`malloc`, `free`, `calloc`, `realloc`, `reallocarray`, `aligned_alloc`, `malloc_usable_size`, `memalign`, `posix_memalign`, `pvalloc`, `valloc`, `cfree`), is made weak in place and never renamed: the library hands caller-owned memory out and takes it back through these symbols (`boundary::caller_alloc`), and it calls them through the C layer's one-statement forwarders `liella_caller_malloc`, `_calloc`, `_realloc` and `_free` (`csys/src/adapter/runtime.c`), because in the library's own optimised code a call to `malloc` could be inlined from, or merged with, the library's definition (observed: LLVM merged `free` with the identical `cfree`). `reallocarray` now calls `realloc` through the same path. Internal allocations a caller never frees (locale and iconv objects, the heap's own metadata) stay on Liella's allocator. Measured on the current archive: 2,651 functions renamed with aliases, 97 names weak in place. Tested by `conformance/c/x_overrides.c`: a program defines `malloc` and the rest of the family (a counting allocator over a static arena), `strlen`, `getenv`, `qsort`, `error`, `error_at_line`, `strlcpy`, `strerror` and `obstack_alloc_failed_handler`, links statically, and checks that library functions using those names internally never reach the program's copies, that its own calls do, that every caller-owned result (strdup, strndup, wcsdup, asprintf, vasprintf, getline, getdelim, open_memstream, open_wmemstream, getcwd and realpath with NULL, canonicalize_file_name, get_current_dir_name, scandir and its entries, wordexp, glob, tempnam, backtrace_symbols, reallocarray) comes from the program's allocator, that wordfree and globfree free through the program's free, and that the program's obstack handler is the one called. **Phase 14:** the same contract holds for an allocator preloaded or linked into a dynamic program: the library's caller-owned memory goes through the dynamic symbols `malloc`... (interposable), and its own calls bind to its own definitions (`-Bsymbolic`-style for everything but the allocator); to be implemented with the loader. `cargo xtask symgap` (also run by `test`, report only) lists the ABI names glibc's installed `libc.a` defines and Liella's does not, apart from those phases 14 and 15 own (2026-10-05: 132, among them `uname`, `gethostname`, `sysinfo` and the `_IO_` file internals).
'''
