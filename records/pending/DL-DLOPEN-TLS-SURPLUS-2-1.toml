body = '''
**`dlopen` of objects with `PT_TLS`: blocks in the static surplus (DL-16d `DL-DLOPEN-TLS-SURPLUS`, plan/ph14/dl-16-dlopen.md §5, R14-4).** `dlopen` no longer refuses an object with `PT_TLS`. **Place:** after the version check and before relocation (its `TPOFF`/`DTPMOD`/`TLSDESC` values need it), each new object with TLS gets the next module ID and a place in the 64 KiB surplus below every thread pointer (`liella_ld::tls::Surplus`): first fit nearest the thread pointer, keeping the block's alignment and its `p_vaddr` remainder; an alignment above the thread pointer's, no room, or no module slot left fails with `<path>: cannot allocate memory in static TLS block` (the probed text; dynamic blocks are DL-19's). A failed `dlopen` gives its places back (`unwind`). Places are never freed before DL-17. The start objects' `Obj.tls` is now their initial place, so a `dlopen`ed object's TLS relocation against a start object's symbol resolves. **One lock, the C library's thread-list lock:** `pthread_create` runs the loader's `tls_init` (or the static image copy) inside the same critical section that lists the new thread (the list insert's body is inlined there; `list_insert` stays for the initial thread). Before publishing the new objects, `dlopen` (loader lock held; order loader lock, then thread-list lock) calls the C library's `LIELLA_PRIVATE` export `__liella_thread_walk(cb, ctx)`: under the thread-list lock, `cb(ctx, tp)` for each listed thread (and the caller if unlisted), then `cb(ctx, 0)`. The loader's callback writes each new block (image, then zeros to `p_memsz`) and the thread's dtv slots, count and generation; on 0 it appends the modules to the table later `tls_init` calls read and moves the generation on. A racing creation therefore reads the table either before the walk (and is listed for it) or after it, and gets each new block exactly once; threads created later get every module. The walk is looked up only by the first `dlopen` that loads TLS (no start-up cost); without it the open fails with the same text. **Capacity:** the module table holds 512 entries (`MODULES_MAX`) and every dtv has room for 512 module slots, reserved as address space (only the header and the used slots are written), so a slot never moves. **dtv:** eager for live threads (the walk); `__tls_get_addr`'s slow path, entered when a thread's generation differs from the current one, rewrites every slot from the table, then the count and the generation (a thread whose vector fell behind repairs it; a module the table does not hold aborts, §27.3 Failure). Gain over a lazily allocated block per thread: no allocation and no failure path on first access, the initial-exec and TLS-descriptor accesses use the static return, and no per-access cost for programs that never `dlopen` TLS. `dlsym` of an `STT_TLS` symbol in a `dlopen`ed object (DL-16b) is not on next yet: the table is the place its answer comes from. Tests: `conformance/c/s27_dlopen_tls_surplus.c` (`s27_3_c_0`: GD, LD, IE and TLSDESC in `dlopen`ed objects from threads created before, after and during the `dlopen`, a relocation against the program's TLS, the exhaustion text, 80 failed opens giving their place back), `crates/ld/tests/tls.rs` (`tls_surplus_first_fit_alignment_gap_reuse_and_rollback`). Plants: handoff/DL-DLOPEN-TLS-SURPLUS-plants.txt.
'''
