section = "s02"
spec = "§2.2"
ann = "COMPAT, HIST"
status = "active"
body = '''
**Internal:** `Errno::{name, description}`, plus translation through an explicit `Locale`. **Boundary:** `strerror_r` is two exports (`strerror_r` GNU, `__xpg_strerror_r` XSI). `sys_errlist`/`sys_nerr` are compat data arrays sized per OD-1. Realised in phase 8: the texts are `liella::diag`'s (the reference C-locale texts of `spec/abi/errmsgs.tsv`, observed with `spec/tools/errmsg_probe.py`), NUL-terminated so `strerror` returns them directly; `Unknown error N` goes to the library's buffer; translation waits for the catalogs (phase 13); the compat arrays wait for compat versions (phase 15). `perror` leaves an unoriented `stderr` unoriented, as the spec says (glibc orients it; recorded in `diag_products.rs`). `strerror_r` (both forms) and `perror` (rewritten under §1.4, item 7, in a fresh session from the spec, `spec/behaviour/diagnostics.md` and black-box probes): GNU `strerror_r`/`__strerror_r` returns a known number's static text and leaves the buffer untouched; an unknown number writes `Unknown error N` cut to `n-1` bytes plus a NUL into the buffer (nothing when `n` is 0) and returns the buffer; a NULL buffer with `n > 0` returns `strerror`'s buffer. XSI `__xpg_strerror_r` writes the text cut to fit and returns 0 when a known text fitted, `ERANGE` when it did not, `EINVAL` for an unknown number (the cut text still stored), `EFAULT` for a NULL buffer with `n > 0` (S6), and never changes `errno`. `perror` writes `s: text\n` (or `text\n` for a NULL or empty `s`) as one write through the `stderr` stream, honouring wide orientation and leaving an unoriented stream unoriented (the spec; glibc orients it, recorded in `diag_products.rs`); `errno` is unchanged on success and the write error on failure (glibc sometimes leaves `EINVAL` depending on stream state).
'''
