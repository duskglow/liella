body = '''
Rewritten under the clean-room rules of §1.4 (item 2) in a fresh session, from the spec, `spec/behaviour/getopt.md` and black-box probes. **Internal** (`liella::getopt`): a re-entrant parser over a caller-owned `State` (next element, letter cursor, pending block of skipped operands, ended flag, `optopt`), working through `Args` (count, text, swap) and `Longs` (entry by index) traits and returning an `Event`, so it neither allocates nor prints. Permutation is lazy: skipped operands are rotated (block swaps) behind the options found after them at the next element boundary, and `--` moves in front of them. Nothing latches the end: each call reads from the position (`optind`), as POSIX describes, so after `--` a further call parses the elements behind it, as glibc does (COLD-REWRITE2-W-far-07; `State::ended` only reports the last call). Orders: a leading `-` returns operands in place as code 1; a leading `+`, `POSIXLY_CORRECT` or `__posix_getopt` stops at the first operand; otherwise operands are permuted. A `:` (first, or after `+`/`-`) makes the parser quiet and returns `:` for a missing argument. Long options match an exact name, else a unique prefix; entries equivalent to the first match (same `has_arg`, `flag`, `val`) are not ambiguous for `getopt_long` and `-W`, but are for `getopt_long_only`'s `-`/`--` forms (as observed). `getopt_long_only` tries one-dash elements as long options unless the element is a single letter of the option string, falling back to letters only when nothing matches. `W;` with a table makes `-W name` a long option. **Boundary** (`options.rs`): one process-wide state under a spin lock; each call reads `optind` and `opterr` and writes `optind`, `optarg` and `optopt` (the state's, changed only on errors, as observed); `optind = 0` or the first call starts a new parse and reads `POSIXLY_CORRECT`; any other change to `optind` continues from that element and forgets the cursor and the skipped operands (deliberate). An `argv[optind]` pointer replaced between calls inside a cluster is read as it is now (glibc keeps reading the old string): placeholder compat flag COMPAT-7 in `docs/compat-flags.md` (owner ruling 2026-10-21; not implemented, behaviour unchanged). The GNU permutation is applied to the caller's `argv` words; diagnostics use the observed texts with `argv[0]`, through the `stderr` stream. Behaviours kept from the reference that may be historical (candidates for a later cleanup): `optopt` overwritten from the parser state on every call, the long-only ambiguity of equivalent entries, the letter fallback searching the raw option string.
'''
