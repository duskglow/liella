story = "SCANF-FLOAT-ERANGE"
date = "2026-11-11"
tests = ["crates/core/tests/scanf_engine.rs", "crates/core/tests/scanf_products.rs"]
body = '''
**scanf floating conversions report a range error as `strtod` does** (amends D-12.13). ISO C defines `%a %e %f %g` (and their `l`, `L` forms) through the subject sequence of `strtod`, and `strtod` sets `errno` to `ERANGE` when the result overflows or is tiny and inexact (an exact subnormal is in range). The scan engine now records a range error from the float engine's range result (`FloatRange`, D-8.5) for every floating conversion that completes, suppressed (`%*f`) ones included; the stored value and the return count are unchanged. The boundary sets `errno` to `ERANGE` when a scan saw one, and a read or encoding error found in the same call (`EIO`, `EILSEQ`) is reported instead. A successful scan with no range error leaves `errno` alone.

Black-box probes (SCANF-FLOAT-ERANGE, every conversion size, `sscanf`, `vsscanf`, `fscanf`, `swscanf`): the reference library sets `ERANGE` on exactly the same inputs, with identical values and counts, with one exception: when the floating field ends at the end of input and a later directive (white space, a literal, another conversion) then reaches the end of input, `errno` after the call is the value it had on entry. Liella keeps the range error reported there too, so a caller that checks `errno` after a scan sees a range error whatever the format says after the conversion; differences row "scanf floating range error, then end of input". No compatibility option: a program cannot rely on the range error vanishing only when later directives meet end of input, and restoring it would add a branch to every scan that ends at end of input; recorded in the row (maintainer ruling requested in the story's hand-back).
'''
