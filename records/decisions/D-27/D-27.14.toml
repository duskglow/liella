body = '''
**ld.so loads and enters a dependency-free PIE (phase 14 DL-6, DL-LDSO-RUN; R14-2 (a), R14-8 program entry, R14-18; threat model "Who clears, and when", owner #2661).** `boundary/src/ld.rs` after self-relocation: reads argc/argv/envp and copies the auxiliary vector (at most 128 pairs, else refused: malformed); secure mode = `AT_SECURE` non-zero only (`liella_ld::start::secure`, the libc start's rule); in secure mode removes every `rt::start::UNSECURE` entry (the same list as libc's start, all occurrences) and moves the vector down so it follows the shorter environment, BEFORE the one read of the `LD_*` settings (`start::ld_env`: LD_PRELOAD, LD_LIBRARY_PATH, LD_BIND_NOW, GLIBC_TUNABLES; first occurrence wins); tunables parsed with the secure filter (`Tunables::parse`); CPU features only from `Arch::features(&Auxv, &impl Machine)` (x86_64: CPUID/XGETBV, `AT_HWCAP` not read; a source-scan test pins the seam). A non-empty LD_PRELOAD prints the reference's `ERROR: ld.so: object '…' from LD_PRELOAD cannot be preloaded (<reason>): ignored.` line per name with Liella's reason (loading objects not yet available) and the program runs. Program: started for `PT_INTERP` (`AT_ENTRY` not ld.so's own; `start::program` refuses no/zero `AT_PHDR` or `AT_ENTRY`, `AT_PHENT` ≠ 56, `AT_PHNUM` 0 or ≥ `PN_XNUM`; bias from `PT_PHDR`), or `ld.so PROG ARGS` (open, map the file read-only for `liella_ld::elf`, `map::plan`: ET_DYN only, sorted non-overlapping page-congruent `PT_LOAD`s, no W+X, span ≤ 2^46; one PROT_NONE reservation aligned to the largest `p_align`, segments `MAP_FIXED` inside it, .bss tail zeroed; argv shifted one word, `AT_PHDR/PHNUM/PHENT/ENTRY` rewritten and `AT_BASE` = ld.so). Then: `DT_NEEDED` refused (DL-8), RELATIVE+RELR applied by the DL-4 relocator (anything else refused, DL-10), `PT_GNU_RELRO` protected, and the new primitive `liella_machine_ld_enter(sp, entry)` (entry.S, `%rsp`=sp, `%rdx`=0, `%rbp`=0, jump) enters the program. Every failure: one line on fd 2, status 127. Proof: `crates/ld/tests/ldso_run.rs` (100 starts each way, half `setarch -R`; set-group-ID child with a supplementary group: AT_SECURE=1, all 34 names gone, near-misses kept, no LD_* diagnostic); plants handoff/DL-LDSO-RUN-plants.txt. Gaps: ET_EXEC programs, `AT_PAGESZ` (4096 assumed), file-range checks beyond the ELF reader's are DL-7's. \| DL-6 row; design §1 steps 3–5, §0a
'''
