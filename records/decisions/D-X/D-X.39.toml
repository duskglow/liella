body = '''
**`cargo xtask bench` takes the caller's `GLIBC_TUNABLES`; `affected` maps every mathtools generator input to its checks** (XTASK-BENCH-TUNABLES-AND-MATHTOOLS, 2026-11-07). (1) The bench environment stays fixed (BENCH-FIXED-ENV) except the tunables value: `--tunables V`, else a non-empty caller `GLIBC_TUNABLES` (`bench::resolve_tunables`); the two differing, or a non-UTF-8 caller value, is an error. Before this a `GLIBC_TUNABLES=... cargo xtask bench` was dropped silently and measured the default level on both sides while looking like a forced one. The value reaches every route: the plain run, the name-service benches' private-/dev/shm route (an argument of its `sh -c` script, since `sudo` resets the environment) and the Rust benches (`with_tunables`). (2) `affected::mathtools_feeds`: `remez.rs`, `bin/remez.rs` select `remez --check <every fit>`; `bessel_tables.rs`, `gamma_tables.rs`, `special_tables.rs`, `bin/tables.rs` select `tables --check` and `kernel-index --check`; `lib.rs` and `mp/*.rs` select both; each also keeps its own mapping (liella-mathtools' unit tests); `cmp.rs`, `cplx.rs`, `bin/mathcmp.rs` feed no generated file and select neither; `tables.rs` keeps XTASK-AFFECTED-MATH-2's class. A generator input does not select the math suites: its checks pass only when the generated files are unchanged. Tests: `bench::tests::caller_glibc_tunables_is_honoured_or_refused`, `private_shm_route_carries_the_tunables_value`, `affected::tests::mathtools_generator_inputs_select_their_checks`; plants handoff/XTASK-BENCH-TUNABLES-AND-MATHTOOLS-plants.txt.
'''
