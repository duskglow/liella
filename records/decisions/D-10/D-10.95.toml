story = "LIBM-INVALID-CONVERT-SCAN"
date = "2026-11-11"
body = '''
**Float-to-integer conversions in the math kernels cannot raise invalid** (LIBM-INVALID-CONVERT-SCAN, -2, -3). On x86-64 without AVX-512 an `as u64`/`as i64` of a value at or past 2^63 (or a NaN) is a signed `cvttsd2si` that raises invalid in hardware; under the envelope the flag is then cleared with an MXCSR write, a serialising instruction paid on every call. The `long double` arc kernels (`asinl`, `acosl` on every call; `atan2l`'s quotient seed for a power-of-two divisor) converted values in [2^62, 2^64], and the binary128 `tan` kernel's quotient seed (`tanf128`, `wide_int::quad::div3`) reaches 2^63 when the divisor's top word is below 2^63 + 2^11: `wide_int::big_u64` now reads such a value from the double's bits at all five sites (same result, no conversion instruction). `lgammaf`'s sign (`signgam`) is no longer the parity of an integer conversion: the fast path takes it from the sign of Γ(x) its last branch computes (exact: every factor x + j is exact and nonzero, the fit P > 0; every other branch has x > 0), and the accurate path is unchanged. A clamp before an `as i32` (-2) cost 13 instructions a call on positive operands (per-call count 315.8 to 328.8), reading trunc(x)'s low bit from the float's bits (-3) cost 3; the sign of Γ(x) runs no parity code on the positive path (-4). Every other float-to-integer cast states its operand range in a `RANGE:` comment, and the static check `float-casts` (clippy's cast lints forced on, found by type) fails on a cast in liella-math or `crates/core/src/num/parse.rs` without one or a clamp. Test: `crates/boundary/tests/math_kernel_no_invalid.rs` calls the arc kernels and the binary128 `tan` kernel (operands around 2π/3, where the divisor is sin(π/6) = 1/2) between `feclearexcept` and `fetestexcept`. The strto* converters raise no overflow, underflow or deliberate inexact flag today (probe a7fa43af9749: the reference raises each as IEEE 754 §7 says); that was a separate change (handoff/libm-invalid-convert-scan.md). **Superseded by D-8.12 (STRTO-FENV-FLAGS, #4856) for that sentence:** the strto* converters now raise overflow, underflow and inexact exactly as the rounding implies (an exact result raises nothing); the sentence above is kept as the record of what was true when this decision was made.
'''
