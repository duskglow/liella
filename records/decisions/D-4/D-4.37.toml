body = '''
**strcoll in a rules locale: one pass over the C strings first** (STRCOLL-CTEXT, 2026-10-09; builds on D-4.18/D-4.30/D-4.31; renumbered from D-4.36 by the coordinator: three tasks took D-4.36). The `strcoll`/`strcoll_l`/`__strcoll_l` rules path first runs `collate::compare_stream` over two byte cursors (`strz::coll_stream`: a cursor reads each byte once and, after the NUL, reads a static zero, so it never passes the terminator): bytes equal in both strings are skipped without a lookup (equal one-byte elements give equal units), byte-identical strings are Equal; at the first difference the first-level units come from a per-catalog `unit[256]` table (u32: up to three first-level weight bytes left-aligned + count; IGNORE, END, SLOW), kept in the same pool slot as D-4.30's lane (`AsciiSlot`, 1.5 KiB per slot, 8 slots static; nothing per thread; `Collate` still holds one 8-byte reference). The first differing unit decides, with the separator rule of `first_level` at an end (the other's next unit > 1); a run that is a proper prefix of the other's, equal first levels, a SLOW byte before the difference (contraction start such as en_US `l`, non-ASCII, >3 units, backward/position rule, one-level locale) return None and the call takes the unchanged general path from the start (strlen x2, bcmp, first level, keys). Local decisions: at most 3 units per entry (en_US letters fit); no lookahead for contraction starts (next step). Safety: the table is filled from the same lookups as D-4.30 (SLOW until filled: racing readers see SLOW or the right value). Tests: locale_data `single_pass_orders_every_pair_it_decides_as_the_keys_do` (7 locales, every pair both ways vs the keys; equal first levels must stay undecided; en_US must decide most pairs); planted bugs (tie decided by bytes, non-ASCII taken as a unit, equal first levels reported Equal) each FAIL it. **Amendment (STRCOLL-2, 2026-10-09):** the shared prefix is found first by `liella_machine_strdiff` (csys/src/machine/scan.S, SSE2 only: the first index where the bytes differ or a's is the terminator; 16-byte unaligned loads only while both page offsets are <= 4080, else one byte, as D-4.14); the cursors start there, so identical strings cost one kernel call and never a table lookup. The kernel's index is only a start: the bytes at it are read again by the cursors, and the prefix is checked (for bytes the table leaves to the general path) only once the strings differ - one OR over its bytes when `AsciiSlot::ascii_fast` (no ASCII byte SLOW), else a lookup per byte. Look-ahead: a byte whose list's every entry before its always-matching one needs a first following byte >= 0x80 (en_US `l`, `L`) gets its one-byte units with `UNIT_LOOK` (0x40); where it is read as a unit the next byte is peeked (put back): ASCII keeps the units, otherwise the general path. As an equal byte it needs no peek: a following non-ASCII byte is itself SLOW. Decided locally: SSE2 only (prefixes are short; no CPU-variant dispatch). Racing writers: the prefix check reads a's bytes; b's are taken as the kernel saw them equal (C gives no answer for a string changed during the call; the order still comes from bytes the cursors read). Tests: machine_scanners `strdiff_finds_the_first_difference_at_every_alignment_pair_length_and_position`, `strdiff_never_reads_past_the_pages_holding_the_terminators`; locale_data single pass checked with the prefix whole, half and empty (one answer), corpus with hu_HU `ly`/cs_CZ `ch` contractions, en_US `l` pairs must be decided. Planted bugs that FAIL: block bound 4095 (reads into the unmapped page: SIGSEGV), index + 1, look-ahead accepting a contraction continued by an ASCII byte (locale_data single pass). AMENDMENT (STRCOLL-3, 2026-10-10): after the kernel's index, `collate::decide_first` decides from the two bytes at it before any cursor: byte-identical strings Equal; both entries plain (unit count 1..3, no flag) with different first units and no non-ASCII byte in the shared prefix (ascii_fast; one or two overlapping word loads, `any_high`, also used by the prefix check of the single pass) -> the first units' order; else the single pass as before. Same answer as the single pass's first step by construction (oracle: single-pass corpus test + random-pair test vs the keys, 4 locales, both orders, ties, punctuation, contraction starts, non-ASCII; plants C/D/F/L red). percall strcoll_short Zen 1 instr/call: B41 222 -> see liella-historic:handoff/strcoll3.md. Note: the percall glibc figure (60) is a static glibc binary whose strcoll orders as strcmp under en_US.UTF-8 (strcoll("a","B") > 0 static, < 0 dynamic): not an en_US collation reference. AMENDMENT (STRCOLL-4, STRCOLL-5, 2026-10-10): `liella_machine_strdiff` returns `struct liella_strdiff { index, high }` in rax:rdx (SysV: two INTEGER eightbytes; liella_csys.h and ffi.rs `StrDiff` #[repr(C)] declare the same pair, K5): `high` != 0 iff a byte of a[0..=index] has bit 7 (pmovmskb of a's whole shared blocks, lanes 0..=k of the found block via c ^ (c - 1), bit 7 of each single-byte step); its first block is entered on the sufficient test (a \| b) & 4095 <= 4080, else the exact per-pointer test. `collate::decide_first_flag(c, high, x, y)` decides from `AsciiSlot::rank` (`0x100 \| first unit` of each plain entry, filled only when `ascii_fast`; 0 = no decision; 512 B per pool slot, 0 per thread): None on high, a zero rank or equal ranks. `decide_first(prefix, ..)` = the same with `any_high(prefix)`. `strz::coll` is one call for all three exports. Why the two guards are needed (tests fail without them): a locale with an ASCII byte on the general path has no ranks (cs_CZ: "ch" sorts after "ci"; plain ranks of h/i would answer first and wrongly); a non-ASCII shared byte decides nothing (zh_CN.GBK: an ASCII letter after a lead byte is the trail byte of a two-byte character). Test: locale_data `first_difference_decision_after_every_one_byte_prefix_matches_the_keys` (every one-byte prefix and seven whole characters, x 24 x 24 next bytes, 8 locales, against the keys). Test harness: locale_data reads each catalog once per process (one address = one of the 8 ASCII pool slots) and `rules()` asserts the slot exists, so a full pool fails loudly instead of leaving the fast-path tests vacuous (under one-process `cargo test` the per-test copies filled the pool). Plants red: C3 (high ignored), C4 (ranks without ascii_fast), K5 (first-block test 4095), and STRCOLL-4's K1-K4, C1, C2, C5. percall strcoll_short Zen 1 instr/call 125 -> 82 (liella-historic:handoff/strcoll4.md). AMENDMENT (STRCOLL-START, 2026-10-10): the pool slot is CLAIMED at load (`Collate::parse`: the address CAS only) and its tables (lane, unit, ascii_fast, rank) are FILLED at the first comparison that reads them: `Collate::warm` (one Acquire load of the slot's new `ready` flag) at the entry of `first_level`, i.e. on the general path only; `decide_first_flag` and `compare_stream` stay check-free and decide nothing until filled (rank 0, every unit SLOW), so the first strcoll of a differing pair takes the general path, which fills; later calls take the fast paths. (A first version also warmed in `compare_stream`: sort-enUS +0.54% instr:u, so the check left the hot path.) Why: the eager fill ran in every `setlocale(LC_ALL, "")` of a rules locale (~9.8k instr of `Collate::parse`, en_US.UTF-8; +1.99k per process from STRCOLL-4's ranks: coreutils printf-loop +0.73% instr:u) although most programs never collate. Correctness while unfilled is the existing rule: every entry is the general path or the right value. Test: tests/collate_lazy.rs (own binary, so no other test has filled the slot): neither fast path decides before the first general-path comparison, which answers as the keys and fills; the single pass and the first-difference decision answer after it.
'''
