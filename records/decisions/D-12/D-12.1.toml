id = "D-12.1"
section = "s12"
spec = "§12.1"
ann = "HIST"
status = "active"
body = '''
**Internal:** the buffering engine (`liella::stream`) works over a `Backing` (a descriptor, a fixed memory buffer, a growing buffer, caller callbacks) and one buffer whose role switches automatically between reading and writing, so there is no "flush between input and output" restriction internally (phase 8 refinement: one buffer, as the ABI's single window exposes, instead of two). The first `RESERVE` bytes of the buffer are pushback room, so `ungetc`'d bytes stay inside the read window header-inline `getc` reads. Errors are reported, not retried (`EINTR` included); a failed write drops the unwritten bytes, as the reference library does. Input that flushes the line-buffered streams (ISO C) holds its own stream's lock, so it never waits for another stream's: a line-buffered stream in use by another thread is skipped, and so is the whole flush while another thread runs `fflush(NULL)` or `_flushlbf` (which may be waiting for the caller's stream); an `fopen` or `fclose` in progress is waited for. `__fbufsize` reports a caller buffer's size as given (the reserve is inside it). **Reads with an indicator already set** (STDIO-STICKY-ERROR-ERRNO, 2026-11-06; coordinator ruling: "Liella follows glibc here, and does so with ONE rule for every stdio read entry"; black-box probe of the reference, every entry with `errno` preset): no read entry sets `errno` on account of an indicator; `errno` changes only when the call's own read of the backing fails. With the end-of-file indicator set, every entry (`fgetc`/`getc`/`getchar` and `_unlocked` forms, `fgets`, `fread`, `getline`/`getdelim`, the `scanf` family, `fgetwc`/`getwc`/`fgetws`/`fwscanf`) answers end of file without reading. With the error indicator set, `getline`/`getdelim` answer -1 without reading; the other entries read on (a successful read returns data, the indicator stays set). `ungetc` works with either indicator. All entries match the reference (before this change `getdelim`/`getline` set `EIO` here). Tests: `s12_5_c_5_sticky_indicators_leave_errno`, oracle `stdio_diff.c` `sticky_indicators`.
'''
