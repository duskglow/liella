body = '''
**`sincos`, `sincosf`, `sincosl`: one argument reduction for both results** (LIBM-SINCOS-SHARED). Method: sine and cosine of `x = k·(π/2)/2^t + r` come from the same reduced `r` and the same table entries, the cosine by the quadrant shift `k + 2^t` (J.-M. Muller, *Elementary Functions: Algorithms and Implementation*, 3rd ed., 2016, ch. 11, range reduction shared between sin and cos; Cody–Waite and Payne–Hanek reductions as in D-10.52 and D-10.67). Each result is computed by exactly the operations its single function performs on the same values, so `sincos*` returns the bits and flags of `sin*`/`cos*`: correctly rounded in every rounding mode (the bound of the single functions: the rounding tests of Ziv's strategy, with the accurate fallbacks), so at most 0.5 ulp. A result that differs from another library by 1 ulp is within this bound. `float`: the export takes an in-place fast entry, `mret::sincos_fast` with `hot::sincosf_nearest` → `fast32::sincos_nearest_widen` (one `trig_core_with` call, D-10.67/D-10.79, both results rounded by the same test as `sinf`/`cosf`; either refusal sends the call to the cold fallback); before, it went through the full `mret::sincos` envelope on every call. `double`: the in-place tier already shared one reduction (`sincos_tiered`); the envelope path's `trig::sincos` now takes `fast::sincos` (one `kernel::reduce`, one `kernel::poly`, two `assemble`s) and one double-double `sin_cos` for whichever results the fast tier leaves. x87 `long double`: `wide::sincos` takes `wide_int::sin_cos_pair`, which runs steps 1–2 of the integer tier once (`reduced`) and evaluates the sine and cosine series once each, `place` assembling either result exactly as `kernel` does (`kernel` is now `reduced` + `place`), and one 384-bit `sin_cos_of` for whichever results the tier refuses. NaN, ±∞, ±0 and the tiny operands take each single function's own short path. `_Float128` keeps two `quad::sin_cos` calls (no change). Tests: `s10_3_c_r4` (sincos against sin and cos, every mode, both formats, every path), `math_float_sincos_fast_entry_matches_the_envelope_in_every_mode`, the exhaustive `sinf_fast_path_agrees_exhaustively` (sincosf against sinf/cosf, every operand and mode) and the `elem_ld_products` sincosl rows.
'''
