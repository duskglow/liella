body = '''
**Lazy existence DFA for regexec without subexpressions** (RX-T2-1, 2026-10-09). `regexec` with REG_NOSUB or nmatch 0 calls `exists_with`: `pattern/regex/dfa.rs` builds states = (kernel of nodes after a consumed byte, canonical context of that byte: BOT/BOT_NOTBOL/NL/WORD/OTHER, merged when the program has no `^`/`\`` or word assertions) lazily over the D-14.12 byte classes; the closure is taken when a transition is built, so look-ahead assertions see the next byte's class; the start node joins every closure (window to the end of the subject); a closure reaching Match answers yes. Store: the per-thread 32 KiB `REGEX_DFA` block of D-14.12 (RULING 1 recommendation: per thread, behind `ScratchSource`), 2 LRU entries keyed by (serial, newline_anchor); NOTEOL answers cached per state, NOTBOL only picks the start state. Falls back to the NFA, exact, for back-references, > 1024 nodes (D-14.8 stacks: asserted by a test), non-UTF-8 multibyte, partial/backward windows, a UTF-8 byte >= 0x80 (LEAVE), kernel > 256, and blow-up (entry full -> flush; 3rd flush, or 2nd after < 4 bytes per state, -> fallback): at most one transition built per byte (tested), so attempt + fallback <= ~2x NFA + O(len). Local decisions: node cap 1024 (not the plan's 4096; RX-T2-1b: the closure scratch lives in the 8192-word store, bitmap + worklist + kernel sized by the cap = 1320 words at 1024, about 5,280 at 4096, which would leave 2,900 words and not even one 3,436-word entry; the D-14.8 stacks exceed both caps, and no benched row pattern needs more than 1024 nodes: not measured beyond the bench rows); fallback restarts the NFA (the plan's kernel hand-off not built); entries 3436 words, 256-slot hash, <= 192 states. Tests: dfa.rs differential vs the matcher (BRE/ERE x ICASE x NEWLINE x flipped newline_anchor x NOTBOL/NOTEOL x first 0..2 x C/UTF-8 x full/tiny store), blow-up, stacked repetitions; boundary regex_dfa.rs (8 threads on one regex_t; thrash). Planted bugs NOTBOL / EOT match / LEAVE / busy word each fail.
'''
