body = '''
**x87 `sinl`/`cosl` integer tier: method and measurements** (LIBM-LD-TRIG-INT, LIBM-LD-TRIG-INT-2; D-10.52's first kernel; contract D-10.19 unchanged: correctly rounded in every mode). `crates/math/src/wide_int.rs`, called by `wide::sin`/`wide::cos` after the tiny-argument shortcut (`sincosl` calls both). (1) Reduction: Payne & Hanek (SIGNUM Newsletter 18(1), 1983) for every \|x\| >= 2^-34, one path: a 256-bit window of the generated `TWO_OVER_PI` table (it already covers x87 and binary128: no new table), three 64x64->128 products and one low product, truncation below 2^-190, the quadrant and the fraction f in [-1/2, 1/2). No Cody-Waite branch for moderate \|x\|: the window costs four products at every exponent (near 1e300 counts within 1% of [-10, 10]) and one path keeps one proof. (2) Tang's table method (Tang, ARITH 10, 1991): j = round(128\|f\|), 64 rows of sin and cos of jπ/256 in 128-bit fixed point (2 KiB), d = \|f\| − j/128 normalised (relative precision when j = 0). (3) Polynomials in u = d² with π/2 folded into the coefficients (no f·π/2 product): sine 5 terms, cosine 6, the inner Horner steps in 64-bit words, the last two in 128 bits (Brent & Zimmermann, Modern Computer Arithmetic, 2010, ch. 4). (4) Proved relative bound 2^-94 (the module documentation); the rounding test assumes 2^-92 (2^36 + 4 units of the 128-bit significand) and rounds in the four modes by integer tests, packing the x87 bits directly. Refusals take the 384-bit route: \|d\| < 2^-92 (never reached: the continued-fraction search of the x87 operands nearest the multiples of π/2, Muller, Elementary Functions, 3rd ed. 2016, ch. 11, finds \|f\| >= 2^-75) and what the test cannot decide (near a multiple of π/2 one of sin, cos is within 2^-92 of ±1 by design; the other is decided). Plain `mul` only: no `mulx`/`adcx`/`adox` variant written. Measured (saturation register section 25): 10^7 seeded operands in four exponent bands, 8x10^7 calls in four modes, 0 undecided, every result equal to the 384-bit route, worst error 2^-95.68; sinl 582 and cosl 583 instructions per call (glibc 1127; before this row 82 228), sincosl 1081 (glibc 1228); cycles per call on the Ivy Bridge timing host sinl 265 (glibc 548, 0.48x), sincosl 467 (glibc 630, 0.74x); the N100 figures are in the story report (handoff/reports/LIBM-LD-TRIG-INT-2.json). Open toward the brief's 300 instructions: sincosl's second reduction, the shared x87 entry (189 of 560 instructions), the kernel's variable 128-bit shifts.
'''
