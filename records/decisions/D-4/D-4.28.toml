body = '''
**Pair-scan kernel for substring search: `memmem` and the regex literal prefilter** (FIND-SEQ-AVX2, 2026-10-09; HOT KERNELS, CPU-VARIANT KERNELS; stacked on opt/rx-t2-0). `liella_machine_pairscan(h, count, off, b0, b1)` (scan.S; AVX2 32 positions per step when count >= 32, else SSE2 16; the scan level is the existing `liella_machine_scan_level`) returns the first index i < count with h[i] == b0 and h[i+off] == b1, or count. Contract: count >= 16 and [h, h+count+off) readable; every load lies inside (whole blocks, then one last block ending exactly at count, overlapping the previous). `conv::find_slice` (Rust) owns policy: empty needle -> 0, needle longer than the haystack -> none, one byte -> `find_byte`; the pair is (first, last) byte, and after the FIRST false candidate the two rarest bytes by a text-frequency rank (`rare_pair`); every candidate is verified by comparing the whole needle (a scanner answer too small cannot give a wrong match; one too large aborts via `scanner_fault`); fewer than 16 positions left use the bounded `memchr` kernel for the first byte plus a compare; the work spent on failed candidates is counted and past 4*progress+256 bytes the rest goes to `bytes::find_seq` (two-way), so the worst case stays linear. `regex::prefilter` takes the finder as a parameter (core cannot call the boundary kernels); `memmem` uses `find_slice`; `strstr`/`strcasestr`/`wcsstr` and the engine paths keep `bytes::find_seq`. Observable results unchanged (match offsets, REG_NOTBOL/NOTEOL, REG_STARTEND: the prefilter only decides the window's first occurrence). Evidence: `tests/find_seq_scan.rs` (needle 1..=64 x haystack 0..=300 x 6 alignments x match at every block edge or none, with first-byte, last-byte and both-byte decoys; page-end placement with an unmapped next page; many failed candidates, both paths); planted scanner bugs (skip a candidate, read past the end, wrong offset) and planted Rust bugs (rare-pair base ignored, tail drops the last position) each FAIL; instruction counts in liella-historic:handoff/find-seq.md.
'''
