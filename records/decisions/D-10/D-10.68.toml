status = "active"
body = '''
**No libm export's hot path merges into an `xmm` register it has not written; `cargo xtask partial-write` checks it on the built `libm.so.6`** (LIBM-PARTIAL-WRITE-CHECK; follows D-10.67). Rule, from the Intel SDM vol. 2 instruction pages and the Intel Optimization Reference Manual (partial-register writes, dependency-breaking idioms), not from any library: the legacy-SSE forms whose low element is computed from the sources alone but which keep the rest of the destination (`cvtss2sd`, `cvtsd2ss`, `cvtsi2sd`/`cvtsi2ss` in every operand form, `cvtpi2ps`, `sqrtss`/`sqrtsd`, `rcpss`, `rsqrtss`, `roundss`/`roundsd`, register-to-register `movss`/`movsd`, `movlps`/`movlpd`/`movhps`/`movhpd` loads, `movhlps`, `movlhps`, `pinsrb`/`w`/`d`/`q`, `insertps`) carry a false dependency on the destination's previous writer; on a libm entry that writer is the previous call, so back-to-back calls become one latency chain (D-10.67 measured expf at 3.11x -> 1.66x the reference's time on the N100 class). Such an instruction passes when its destination is owned on that path: written earlier (any full write, including the `xorps`/`pxor` zero idioms the renamer resolves without waiting, `movq` from a GPR, memory-source `movss`/`movsd`), an argument register of the export (from its Rust signature; unknown types count all eight as arguments, which can hide but never invent a finding), or also a source of the instruction. The VEX forms merge from their first source (VEX.vvvv) instead and are checked on it. Scope: every path from each export's entry, both outcomes of every branch (so the FMA and SSE2 builds of one export), up to the first call, return or indirect jump, with joins intersected; a merge after a call is not reported. Wiring: `cargo xtask so` fails on a finding the allow-list does not name (after publishing, so the product can be read), `cargo xtask static` runs it when `target/liella/libm.so.6` exists and prints why it skipped otherwise. Findings on origin/next when it landed: 12 (`exp10f`, `logf`, `log2f`, `log10f` (a `cvtss2sd` and a `cvtsi2sd` each in the log family), `sinf`, `cosf`, `tanf`, `acoshf`, `asinhf`), allow-listed in `xtask/src/partial_write.rs` as a ratchet for LIBM-F32-ONEPASS-REST, which fixes and times them; a new finding fails the build.
'''
