id = "D-13.15"
section = "s13"
spec = "§13.13"
ann = "HIST, ARB"
status = "active"
body = '''
**Mount tables and fstab (phase 12); decisions.** *Format:* fields split at runs of space/tab; a first non-blank `#` is a comment; missing strings are empty and missing numbers 0; fields after the sixth are ignored (fstab(5)). *Escapes:* `\040 \011 \012 \134` and `\\` are decoded, every other backslash kept (§13.13 corrected 2026-10-03); `addmntent` writes the four octal forms. *Numbers:* `freq` and `passno` each from their own field (optional sign, decimal prefix, 0 without digits); a value outside `int` makes the line not an entry (glibc wraps it, and zeroes `passno` when `freq` is malformed). *A line containing NUL* is not an entry and the next line is kept (glibc loses it). *No line-length limit* (P-lift; glibc keeps 4095 bytes silently). *`getmntent_r`:* the buffer holds only the four strings; too small (0 and 1 included) is `ERANGE` with nothing written and the stream back at the line's start (glibc truncates silently, and hangs with 1 byte); a negative size `EINVAL`, NULL arguments `EFAULT`/`EINVAL`. *End of table:* NULL with `errno` untouched (X3). *Result storage:* `getmntent` and the fsent functions return the calling thread's result block (kinds `MNT`, `FS`). *`setmntent`:* `fopen` with close-on-exec added. *`endmntent`:* 1 always (getmntent(3)); NULL a no-op. *`addmntent`:* seeks to the end before each write, writes and flushes one line; `EINVAL` (1, nothing written) for a NULL entry or field, an empty string, or a source starting with `#` (entries that would not read back). *`hasmntopt`:* a query without `=` matches an option by name (`name` or `name=…`), one with `=` matches exactly, a comma in the query matches nothing; NULL arguments give NULL with `EINVAL` (glibc crashes). *`fs_type`:* the last of rw/rq/ro/sw/xx by option name (a later option overrides an earlier one, mount(8)), `??` if none. *fsent:* a process-wide cursor opened on first use (getfsent(3)); `setfsent` rewinds, and gives 0 with `EISDIR` for a directory; `getfsspec`/`getfsfile` search from the start through their own descriptor and leave the enumeration where it was (glibc moves it). Thread-block result slots grew for the two kinds (`SLOTS` 17, `RECORDS_AREA` 224 bytes; D-16.7).
'''
