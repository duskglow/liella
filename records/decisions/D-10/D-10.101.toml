body = '''
**`sqrt` and `sqrtf` read no MXCSR on entry: `sqrtsd`/`sqrtss` run on the caller's own word under every environment** (LIBM-ENV-CHECK-COST, #4872; amends D-10.71 and the unmasked-trap clause of D-10.22). Cost of the entry check (`stmxcsr`, load, mask, compare, branch), TSC ticks per iteration, best of 7, measured with a loop probe: Zen 1 (EPYC, 60 vCPU) 23.8 for the check alone against 3.1 for the empty loop, so about 21 ticks of reciprocal throughput; `sqrtsd` alone 8.2, with the check 24.5; `sqrtss` 5.1, with the check 24.3. Broadwell-EP 1.2 and Skylake-SP 0.0 for the check (`sqrtss` +0.9 on both, `sqrtsd` +0). In a dependent chain (latency-bound) the check costs nothing on any of the three. On Zen 1 the check is therefore the throughput floor of every short entry that has it (the reference's `sqrt` 11.3, `expf` 12.2, `logf` 12.4, `tanhf` 14.6, `exp` 21.0 ticks per call there); on the Intel classes it is noise. Options weighed: (a) a per-thread "environment is default" byte kept by every fenv path and thread start, letting the default case skip `stmxcsr`: rejected, because MXCSR is ordinary user state that code outside the library writes (inline `ldmxcsr`, `setcontext` and a signal frame's saved word restored by `sigreturn`, a handler's `fesetround(FE_TONEAREST)` landing between an interrupted `fesetround`'s flag store and its `ldmxcsr`), and a stale byte returns round-to-nearest results in another mode, or runs arithmetic under an unmasked trap; no protocol keeps a cache of a register that any instruction may write exact. (c) Detecting the mode with arithmetic (one `addpd` whose two lanes round differently in each direction, a subnormal lane for FTZ/DAZ) costs about three pipelined instructions but cannot see the exception masks and raises inexact in the caller's word: rejected. (b) Read MXCSR only where the fast path's result depends on it: adopted where the hardware operation is itself the specified result in every environment. `sqrtsd`/`sqrtss` are correctly rounded in the current direction (IEEE 754 squareRoot, Intel SDM), read a subnormal operand as a zero of its sign under DAZ, are never affected by FTZ (a non-zero root is normal), and raise exactly the operation's flags, so in place they honour any word however it was set: fenv, a direct `ldmxcsr`, a new thread (which starts with its creator's word), a signal handler's word. An unmasked exception traps in the instruction, before the EDOM store, which is what the reference's `sqrt`/`sqrtf` do (black-box probe, glibc 2.39: invalid for -1 and -inf, inexact for 2, denormal-operand for a subnormal, each trapping with errno untouched; with invalid unmasked and DAZ on, `sqrt(-subnormal)` = -0 and no trap). The previous software fallback under an unmasked exception differed from the reference in four of those cases (no denormal trap and no denormal-operand flag; an invalid trap for `sqrt(-subnormal)` under DAZ); it is gone. Every other fast entry (`elem_fast`, `elem32_fast`, `sincos_fast`) keeps its read: its round-to-nearest result depends on the mode. The `float` functions can drop the read the way D-10.63's one-pass entries do (an evaluation in `double` that is right in every direction and refuses before any operation that could raise more than inexact); that is per-function error analysis, left to follow-up stories. Tests: `math_sqrt_runs_in_place_under_every_mask` (masks a square root never raises, every direction, subnormal operands), `conformance/c/s10_sqrt_env.c` (fesetround, inline `ldmxcsr` with FTZ/DAZ, a new thread per direction, a signal handler changing direction, unmasked traps and their errno). Plants: `handoff/LIBM-ENV-CHECK-COST-plants.txt`.
'''
