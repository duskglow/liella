body = '''
**`sin`, `cos`, `tan`, `sincos` quick phase: one `π/64` reduction, today's table** (LIBM-F64-TRIG-QUICK, -2; under D-10.51; wired as tier 1 of the four entries, today's in-place tier is tier 2, the accurate path tier 3). `trig::quick`, SSE2 and FMA builds (D-10.50): `2^-26 <= \|x\| < 2^20` by Cody-Waite in three parts (Cody & Waite 1980) with `k` from the `1.5·2^52` shift (no conversion instruction); `\|x\| >= 2^20` by Payne-Hanek in integers (Payne & Hanek, SIGNUM Newsl. 18(1) 1983): three 64×64-bit products against a 192-bit window of `2/π`, declining when the fraction is below `2^-60`, nothing cached across calls (reentrancy); evaluation on today's 128-point `sin(jπ/64)` table (Tang, ACM TOMS 15(2) 1989), Taylor `sin r − r` to `r^9` and `cos r − 1` to `r^8` by Estrin's scheme (Estrin 1960), only `C·r` exact, Fast2Sum assembly; `tan = sin/cos` with one division and its exact residual; Ziv's test (Ziv 1991; de Dinechin, Lauter & Muller 2007). Bound proved in the module doc and recomputed by its test: `RHO = 0.875·2^-61` (largest seen 2^-63.163), multiplier `1 + 2^-7 + 2^-12`; `tan` `2^-60` with today's `C_TAN`. **Why one `π/64` step, not `π/2` then `j/64`** (the brief's first method; coordinator accepted 11-07): the two-step reduction shrinks `\|r\|` to `2^-7` (one Taylor term less per series) but adds a second shift-and-subtract, an index, a quadrant select on the critical path and a second table; one step reuses today's table (no new cache lines) and has no quadrant logic (`cos` is index `n + 32`). Fallback on uniform [-10, 10]: SSE2 sin/cos 0.4-1.2%, tan 0.8-2.5%; FMA sin 0.83%, cos 0.81%, tan 1.62%. Tests: `trig/quick/tests.rs` (SSE2), `crates/boundary/tests/trig_quick.rs` (FMA, builds agree, ignored 10^8 accuracy job). Counts (cbench_libm instr/op, Skylake-SP, before -> after, glibc): FMA build sin 158.6 -> 131.7 (100.2), cos 156.4 -> 123.7 (104.7), tan 176.1 -> 157.9 (107.6), sin_huge 1345.1 -> 239.6 (365.8); SSE2 build after: sin 173.1 (122.3), cos 169.0 (126.1), tan 239.3 (124.2), sin_huge 291.7 (379.3); no other row moved by more than noise. Target sin <= 110 (FMA) not reached. Timing (cbench_libm time ratio vs glibc, before -> after, same host, interleaved): Ivy Bridge (SSE2 build) sin 2.22 -> 1.71, cos 2.13 -> 1.60, tan 2.83 -> 2.33, sin_huge 4.56 -> 0.71; N100 (FMA build) sin 2.13 -> 1.67, cos 1.83 -> 1.53, tan 2.64 -> 2.01, sin_huge 5.95 -> 0.87; no other row's instruction or cycle ratio moved.
'''
