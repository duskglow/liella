# Fuzz harnesses for Liella's parsers of untrusted input (implementation-plan.md §6, "Fuzzing
# infrastructure"). A workspace of its own, outside the product build: the library crates and
# the products keep zero external dependencies and the pinned stable toolchain; only this crate
# depends on `libfuzzer-sys` and builds with the nightly named in `rust-toolchain.toml`.
#
# Run through `cargo xtask fuzz <target> --time <minutes>` (corpus outside the repository,
# seeds in `seeds/<target>`); `cargo xtask fuzz --list` names the targets.

[package]
name = "liella-fuzz"
version = "0.0.0"
edition = "2024"
license = "LGPL-2.1-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[lib]
name = "liella_fuzz"
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = "0.4"
liella = { path = "../crates/core" }
liella-legacy = { path = "../crates/legacy" }
liella-abi = { path = "../crates/abi" }
liella-boundary = { path = "../crates/boundary" }

[profile.release]
debug = 1
panic = "abort"

[[bin]]
name = "nsswitch"
path = "fuzz_targets/nsswitch.rs"
test = false
doc = false
bench = false

