story = "DL-IMAGE-READER"
date = "2026-11-10"
body = '''
**The program is read from its memory image, never from its file (ruling #4229, coordinator ruling #4323; amends D-27.17).** `link` (`boundary/src/ld.rs`) no longer opens `/proc/self/exe` (nor the program's path for `ld.so PROGRAM`): it fails without `/proc` and can read a file other than the one executed. The reader has an image mode, `Elf::from_image(phdrs, spans)`: `spans` map link-time ranges to bytes, and every address must lie in the file-backed part of one `PT_LOAD` and wholly in one span, as for a file. Aliasing rule (a shared slice alive across the relocator's raw stores would be undefined behaviour): `Elf::image_span_kind` slices a `PT_LOAD` in place (`Live`) only when its bytes cannot change during loading: readable, not `PF_W`, the object not text-relocated, and overlapping no segment the relocator may store into (the relocator stores only into `PF_W` segments of such an object: `inside()` stays). Anything read from a range that can change is COPIED (not read through raw-pointer reads) into anonymous mappings before the first relocation store: the program header table and `PT_DYNAMIC` always (one small mapping each), and the whole file-backed part of a changing `PT_LOAD` that holds a table named by `DT_STRTAB`, `DT_SYMTAB`, `DT_HASH`, `DT_GNU_HASH`, `DT_VERSYM`, `DT_VERDEF`, `DT_VERNEED`, `DT_RELA`, `DT_JMPREL` or `DT_RELR` (in practice only a text-relocated program, whose read-only segments are made writable for relocation). Why copies: the reader keeps its slice API (raw reads would touch every table walker and the file path too), a copy cannot alias by construction, and the cost falls only on the rare layouts (one copy of `PT_DYNAMIC` otherwise). Text-relocated programs are run, not refused (#4323): RW for relocation, RX again before any code of theirs runs (L14-6). The image header is synthesized (`ET_DYN`, the table's `e_phnum`); the file-offset overlap checks do not apply. More than `LOADS_MAX` (64) `PT_LOAD`s in the program is refused as for a library. The program has no (dev, ino) identity any more: a dependency naming the program's own file is loaded as a separate object. Tests: `reloc_image_reader_slices_only_unchanging_segments`, `reloc_ldso_kernel_started_without_proc` (chroot without `/proc` through `unshare -r`), `reloc_ldso_textrel_program_text_rx_before_it_runs`; plants handoff/DL-IMAGE-READER-plants.txt. Miri was not run (the access pattern crosses the process image and raw syscalls); the targeted test checks the invariant Miri would.
'''
