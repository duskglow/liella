body = '''
**Elementary functions of `float` and `double`** (milestone 2). Evaluated in double-double arithmetic (`math::dd`: error-free sum and Dekker product, no FMA) and rounded once from the exact sum of the two parts (`dd::round`, with the sign of the neglected remainder deciding ties and directed modes), so every result is correctly rounded in every mode; the binary32 forms run the same code on widened operands. The computation needs round-to-nearest: the translation (`mathret::elem`) switches MXCSR to its default for the call, restores it and raises the result's flags. Algorithms: table-driven `exp` (k·ln2/64), `log` (12-bit reciprocal table and an `atanh` series), `pow` as `exp(y·log \|x\|)` with exact powers detected, Payne–Hanek reduction for trigonometric arguments of 1500 and above (Cody–Waite below), `atan` by an `atan(j/64)` table, the hyperbolic functions from `expm1`/`exp`/`log1p` arranged without cancellation, `hypot` exactly in 256 bits in every format. Tables and series coefficients come from the oracle (`cargo xtask tables`, `crates/mathtools/src/tables.rs`, 400-bit evaluation; `--check` in the gate); no Remez fit was needed at this precision. Arguments where the second-order term is far below the double-double error (below 2^-30) or the function has saturated are rounded by the side of the deviation (`elem::near`). The `double` fast paths' result assembly (MATH-M6-F64-GAP-ASSEMBLY, register 13.5 #1 and #6) uses Fast2Sum where the magnitudes are ordered: `exp_kernel` forms `t + t·p` from one exact product and two Fast2Sums; the logarithms add `e·ln2` (a 42-bit `LN2H`, so `e·LN2H` is exact for `\|e\| < 2^11`, plus `e·LN2L`), `−ln c` and `log1p r` by Fast2Sum/2Sum and one low-part sum (`fast64::log_assemble`, below `2^-95·\|e\| + 2^-103` beside the series tail); `log_pow` takes `rh³/3` from the exact `rh²·rh` times the `double` 1/3 with one correction (`< 2^-115·\|rh\|`) and charges `2^-94·\|e\| + 2^-100` for the assembly. The bounds are restated term by term in `fast64.rs` and checked against the multi-precision oracle by its `bounds` unit tests. Measured (MATH-M6-F64-GAP-ASSEMBLY-2, on an AVX2-capable x86-64 build host, instructions:u per call, default and without AVX2 alike): exp and exp2 -24, log, log2 and log10 -60, pow -122; no row slower. The fast paths' argument reduction (MATH-M6-F64-GAP-EXP-REDUCE, register 13.5 #2): `exp` and `pow` subtract `k·ln2/64` with a three-part Cody–Waite constant of 36-, 35- and 34-bit parts (`fast64::reduce_ln2`; every `k·Ci` exact for `\|k\| < 2^17`), `x − k·C0` exact by Sterbenz, one Fast2Sum for `−k·C1`, the low part from `k·C2`, a renormalizing Fast2Sum, and no trailing `x.lo` add for `exp` (`pow` adds its `z.lo` there); both Fast2Sums are exact by the exponent condition, so tiny `r` next to multiples of ln2/64 is covered. `exp2` forms `r·ln2` by Dekker with `ln2` pre-split (`LN2A`/`LN2B`, `fast64::ln2_times`). Bounds, restated term by term in `fast64.rs`: `exp` r within 2^-106.5, `pow` within 2^-96.9, `exp2` within 2^-104·\|r\|, all inside the kernel's 2^-90; checked against the oracle by `fast64::bounds::exp_reduction_stays_within_its_bound` and `exp2_product_stays_within_its_bound`, each bound planted one bit loose and caught. `exp10` and the accurate path keep `exp_log::reduce`. `log2`/`log10` (MATH-M6-F64-GAP-LOG-TABLES, register 13.5 #7) assemble from `LOG2_L`/`LOG10_L` (-log_b c_i, double-double within 2^-104, generated by `cargo xtask tables`) and `LOG10_2_E` (log10 2 as 42 bits plus the rest, within 2^-97): `e·log_b 2 + (-log_b c)` exact by Fast2Sum, only `log1p r` scaled by one exact product `lh·(1/ln b)` instead of a final `Dd::mul`; bound `2^-49·\|T\|·scale + 2^-70·\|y\|` (`scale` the least double >= 1/ln b), restated term by term at `fast64::logb_assemble`; the near test keeps `RHO_LOG = 2^-69` where `\|y.hi\|` >= the least double >= 0.34·scale. Checked by `fast64::bounds::log_tables_cover_their_bounds` and the kernel oracle test; each constant and a table entry planted one ulp off and caught.
'''
