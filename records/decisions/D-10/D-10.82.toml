body = '''
**`asinf`, `acosf`, `atanf` and `atan2f` on the one-pass `float` path** (LIBM-F32-REST; extends D-10.63 under D-10.67 and D-10.72). Each entry tests its fast range on the bits (asinf and atanf 2^-26 ≤ \|x\| < 1 or < ∞, acosf normal \|x\| < 1, atan2f both operands normal and finite), builds the `double` operands from the bits (exponent rebased by 896, fraction moved up 29 places: no `cvtss2sd`), evaluates once in `double` in the caller's MXCSR without reading it, applies the sign before the conversion, refuses when the result's low 28 significand bits lie within 64 of a rounding boundary (one add, mask and compare, the same in every direction), and converts once with `cvtsd2ss` in the caller's direction (`mathret::elem32_onepass`, and `elem32_onepass2` for atan2f). The square root of asinf and acosf is the boundary's `sqrtsd` (correctly rounded in the caller's direction). The shared reduction `fast32::atan_red_any` is the table method of the existing kernel (atan s = atan(i/32) + atan((s - c)/(1 + s·c)), odd degree-7 fit; Muller, Elementary Functions, 3rd ed. 2016, ch. 6, table-based reduction) with an index that does not depend on the direction: s·32 is rounded to the 2^-7 grid by adding 1.5·2^45 and the nearest integer is taken on the bits, so \|s - c\| ≤ 1/64 + 2^-12 in every direction (a round-to-nearest `s·32 + 1.5·2^52` gives the floor or the ceiling under a directed mode, outside the fit's interval), and c = i/32 is rebuilt from i through the 1.5·2^52 shift (no `cvtsi2sd`). Bound in every direction ≤ 21u (u = 2^-53; the proof is the doc comment of `atan_red_any` and its callers), margin 64 ≥ 1.5·24 + 1. Every result in the fast range is irrational (Niven; Lambert: tan and sin of a nonzero rational are irrational), so the conversion raises inexact and nothing else; atan2f refuses results below 2^-126 so it never underflows. Proof by exhaustion for the one-argument functions (all 2^32 operands × 4 directions against the envelope, 0 mismatches each); atan2f by the bound and a 10^9-pair job (4 directions) against the envelope. Counts and timing in handoff/LIBM-F32-REST.md.
'''
