body = '''
**TSC gate for the gettext recheck clock** (task GETTEXT-6; owner ruling 2026-10-09, GETTEXT-5 RULING NEEDED 2: APPROVED; the route is a coordinator decision under decide-or-ask, existing S4 category). `D-7.12`'s one-second recheck stays; what changes is how a lookup learns that no recheck is due. A resolution slot keeps the time-stamp counter read just before the clock read its memo was last confirmed at (`memo_tsc`) and the ticks the memo then had left (`memo_allow` = the interval left of its oldest check, at 274/1024 ticks per ns, which is below 2^28 ticks per second, capped at 2^28). While `tsc >= stamp && tsc - stamp < allow` (`recheck::tsc_holds`) the memo is used without reading the clock; a counter that went backwards or wrapped, a jump of `allow` or more, a slot never confirmed, or no counter (0) reads the clock exactly as before, so a replaced catalog is still seen within the second (assuming a counter above 268 MHz; a slower one would delay a recheck by at most the interval again). A lookup that reads the clock for any reason restarts the gate from its own counter value (read before the clock). Not touched: the explicit resets (generation checks come first), `LANGUAGE` handling, the plan. The same rule and threshold gate the time zone's once-a-second file check (D-23.6, COLDSTART-SECOND-LATENCY-3: `recheck::TscGate`), so there is one rule for both. **Mechanism:** csys `liella_machine_rdtsc` (`csys/src/machine/rdtsc.S`: `rdtsc; shl; or; ret`), declared `safe` in `ffi.rs` (S4, category *extern*, no new unsafe category), `Sys::tsc()` (boundary: x86_64 only; elsewhere and in doubles 0, which keeps the clock read). The gate logic is safe Rust. **Disabled counter** (coordinator decision, before merge): `Sys::tsc` reads `prctl(PR_GET_TSC)` once per process, lazily at the first gate use, and caches unknown/ok/disabled in one atomic byte (`TSC_STATE`, boundary `sys.rs`); disabled or a failed query means `rdtsc` is never executed and the clock read stays (cost on the hot path: one relaxed byte load and compare). fork inherits both the kernel setting and the cache, so no re-check after fork; exec starts a new image. Test: `s7_7_c_0` child `tsc_off` sets `PR_TSC_SIGSEGV` before its first lookup, then looks up and sees a replaced file after a second (a planted bug that skips the query crashes the child). **Residual:** a program that disables the counter itself AFTER its first gettext call (cache says ok) takes a SIGSEGV at the next lookup that reaches the gate; not handled (a re-query per call would cost a syscall). A virtual machine with a non-monotonic TSC only falls back to the clock. Tests: `recheck::tests::tsc_gate_cases` and `intl::tests::memo_tsc_gate` (injected counters: backwards, wrapped, huge jump, none, edge of the allowance; planted bug "gate never expires" fails both and `s07_locale_clauses` `plan_file`); `s7_7_c_0` (a replaced file seen after a second) unchanged. Numbers: `liella-historic:handoff/gettext6.md`.
'''
