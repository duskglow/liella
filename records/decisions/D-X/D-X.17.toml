body = '''
**Per-thread cache words** (TB-SLOTS, 2026-10-07; inside the D-X.16 ruling: own block, fixed compile-time-checked offset, Relaxed load). `ThreadBlock::cache` is one cache line (8 `AtomicUsize` words, 0x140-0x180, inside glibc's reserved 0x80-0x280, so a block glibc's `ld.so` made has them zero) for the library's per-thread caches; owners claim words by constant in `liella_rt::tls` (`CACHE_TZ_PERIOD` = words 0-2, P7's `localtime` period, which moved out of result slot 11). Reads: `tb::read` through `field!` markers, extended with an array form `Marker = cache[i]` (index checked at compile time); writes: `tb::current()` + Relaxed store. No new unsafe or asm site (tb-field stays 1), block size unchanged (0x300), +0 bytes per thread. Rules for an owner: a cache word is never an answer by itself (each owner validates what it reads: the period by its never-reused zone number), zero means empty, a value a forked child or a re-used glibc thread descriptor inherits must stay valid or fail validation, and a multi-word entry is written key word first to 0, then the payload, then the key (compiler fences), so a signal handler that interrupts the stores sees nothing or a whole entry. Byte-wise result slots (`result_slots::Buf`) stay for buffers handed to C callers. Evidence: liella-historic:handoff/tb-slots.md.
'''
