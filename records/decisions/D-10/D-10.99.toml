tests = ["crates/math/src/complex_fast_tests.rs::cexp_middle_tier_bound_covers_the_error", "crates/math/src/complex_fast_tests.rs::cexp_middle_tier_decides_the_bench_hard_case", "crates/math/src/complex_fast_tests.rs::cexp_middle_tier_declines_next_to_a_boundary"]
body = '''
**`cexp` gets a middle tier between its quick tier and the 384-bit route** (LIBM-CEXP-ROUTE, under D-10.53 and D-10.55). When the quick tier's rounding test cannot decide a part of `cexp` (`double`), that part alone is evaluated again with a proved bound near `2^-99` and rounded by the same interval test (`fast64::settle`) in every mode; only a part still undecided reaches the route, unchanged. Why: the quick tier's bound (about `2^-66` relative) leaves about one part in a thousand undecided, and each costed about 115k instructions in the route; the one such operand of cbench_libm's 256 (`(-1.609657171678382, -1.9221928333335072)`, real part `2^-70.3` relative from a midpoint) added about 450 instructions to the row's per-call average. It is not a hard case for correct rounding, only for the quick bound. Method: `e^x` from the double-double kernel of the wide formats (`wide_dd::exp_dd`, `2^-100` relative); `sin y` or `cos y` from a Cody–Waite reduction by `π/2` in three `double`s (exact `two_prod`s, double-double additions) and Taylor series in double-double by Horner's rule, within `2^-100` absolute; the double-double product. Error bounds of the double-double operations: Joldes, Muller and Popescu, ACM TOMS 44(2), 2017; argument-reduction worst case: J.-M. Muller, "Elementary Functions", 3rd ed., 2016. The proof is the comment above `sin_or_cos` in `crates/math/src/complex_fast.rs`. Both builds of the quick tier (baseline, FMA) call the same out-of-line baseline code, so they stay bit-identical. `cexpf` is unchanged.
'''
