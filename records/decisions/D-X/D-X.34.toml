body = '''
**The classed pages' XREF bias is checked statically, not by result** (CLASSED-SLOT-XREF-CHECK, 2026-11-06; tooling only, extends D-4.53). `xtask/src/classed.rs` pairs the n-th out-of-page reference of page 1 with the n-th of page 0 (both pages expand one macro, so the order is the same) and requires the same instruction and symbol and page 1's target = page 0's + 4096; an unpaired reference, a reference outside the two pages, or a section with nothing to check is an error, never a skip. Objects and archives are read by their relocations (`readelf`: page 1's addend = page 0's + 4096; the assembler's PLT32 for `jz sym` and PC32 for `jz sym+4096` compare as one kind), linked objects by their instructions (`objdump -d`: page 1's address = page 0's + 4096). It runs in `cargo xtask static` (assembling `csys/src/machine/fold.S`, no product needed), at the end of `cargo xtask so` on `libc.a` and `libc.so.6`, and as `cargo xtask classed-xref [<file>...]`. Why: the slot tests check results, and a page 1 read that loses the bias reads the word 4096 bytes below the intended one, which gave the right bytes in the link of the time (the biasless fold-limit and `liella_machine_set_mid` plants survived by result) and could pick a wrong path in another layout. Tests: `classed::tests` (a synthetic two-page object, as an object and linked: a correct pair, a biasless load, a biasless jump, an unpaired reference; the readers' parsing).
'''
