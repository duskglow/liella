story = "LAYOUT-TRACE-DEFAULT"
date = "2026-11-13"
body = '''
**Trace-at-build is the default of every product build** (LAYOUT-TRACE-DEFAULT, the default-switch step of `plan/layout-rethink.md`, rulings #5190-#5194; amends D-X.88). `cargo xtask so` with `LIELLA_LAYOUT_TRACE` unset, empty or `1` traces its own build and groups from that trace, in both profiles, so CI trains, the gate, agents' roles, plants copies, `cargo xtask bench`'s product build and the release check all build traced. `LIELLA_LAYOUT_TRACE=ungrouped` stays the explicit opt-out; without a usable gdb the build fails and names it (ruling #5190: no snapshot fallback). `LIELLA_LAYOUT_TRACE=0` selects the committed lists explicitly and is kept for the list tooling only (regen, repair, comparisons) until LT-5 deletes those lists: `tools/hottext/regen.sh --build` sets it for its check of the rewritten list (a unit test requires every product build in regen.sh to be a regen build or name `=0`). A regen build (`--hottext-regen`) reads the committed lists when the switch is unset and refuses an explicit `1` or `ungrouped`; `LIELLA_HOT_LISTS` with the default trace fails and names `=0`. `hot_text_products` checks that the products under test carry `target/liella/.hot-lists` and that each list it names is the one the build grouped from. Tracer availability (gdb 15.1 with Python, checked as the build checks it): present on every build host class (Skylake-SP, Zen 1, Haswell-EP, Broadwell-EP); the timing hosts have no gdb and build nothing. Measurements of both profiles on the Skylake-SP and Zen 1 hosts: see the story's handoff.
'''
